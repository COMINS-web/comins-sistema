// useStored: usa localStorage para persistencia real entre recargas.
function useStored(key, seed) {
  const [val, setVal] = useState(() => {
    try {
      const stored = localStorage.getItem(key);
      if (stored !== null) return JSON.parse(stored);
    } catch(e){}
    return seed;
  });
  const [ready] = useState(true);

  // Ref para acceder al valor actual sin stale closure
  const valRef = useRef(val);
  useEffect(() => { valRef.current = val; }, [val]);

  const save = useCallback((updater) => {
    setVal(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      // Persistir inmediatamente en localStorage
      try { localStorage.setItem(key, JSON.stringify(next)); } catch(e){}
      return next;
    });
  }, [key]);

  return [val, save, ready];
}

  return <span style={{background:bg,color,borderRadius:8,padding:"3px 10px",fontSize:11,fontWeight:600,display:"inline-flex",alignItems:"center",gap:4,letterSpacing:.1}}>{icon}{label}</span>;
}
function SVCBdg({status}) { const c=SVC_STATUS[status]; return c ? <Bdg {...c}/> : null; }
function PrioBdg({priority}) { if(!priority||priority==="normal") return null; const c=PRIORITY[priority]; return <Bdg label={c.label} color={c.color} bg={c.color+"15"}/>; }
function QBdg({status}) { const c=QUOTE_ST[status]; return c ? <Bdg {...c}/> : null; }
function LeadBdg({status}) { const c=LEAD_ST[status]; return c ? <Bdg label={c.label} color={c.color} bg={c.bg}/> : null; }

function Card({children, style={}, onClick}) {
  return (
    <div onClick={onClick} style={{
      background:C.surface,
      border:`1px solid ${C.border}`,
      borderRadius:16,
      padding:"18px 20px",
      boxShadow:C.shadow,
      transition:"box-shadow .15s",
      cursor:onClick?"pointer":"default",
      ...style
    }}>{children}</div>
  );
}

function Lbl({t}) {
  return <div style={{color:C.muted,fontSize:11,fontWeight:600,letterSpacing:.6,textTransform:"uppercase",marginBottom:6}}>{t}</div>;
}

function Inp({label,xStyle={},...p}) {
  return (
    <div style={{marginBottom:12}}>
      {label&&<Lbl t={label}/>}
      <input {...p} style={{
        width:"100%",
        background:C.surfaceAlt,
        border:`1.5px solid ${C.border}`,
        borderRadius:10,
        padding:"9px 13px",
        color:C.text,
        fontSize:14,
        fontFamily:"inherit",
        boxSizing:"border-box",
        outline:"none",
        transition:"border-color .15s",
        ...xStyle
      }}/>
    </div>
  );
}

function Sel({label,opts,...p}) {
  return (
    <div style={{marginBottom:12}}>
      {label&&<Lbl t={label}/>}
      <select {...p} style={{
        width:"100%",
        background:C.surfaceAlt,
        border:`1.5px solid ${C.border}`,
        borderRadius:10,
        padding:"9px 13px",
        color:C.text,
        fontSize:14,
        fontFamily:"inherit",
        boxSizing:"border-box"
      }}>
        {opts.map(o=><option key={o.v!=null?o.v:o} value={o.v!=null?o.v:o}>{o.l!=null?o.l:o}</option>)}
      </select>
    </div>
  );
}

function Txta({label,xStyle={},...p}) {
  return (
    <div style={{marginBottom:12}}>
      {label&&<Lbl t={label}/>}
      <textarea {...p} style={{
        width:"100%",
        background:C.surfaceAlt,
        border:`1.5px solid ${C.border}`,
        borderRadius:10,
        padding:"9px 13px",
        color:C.text,
        fontSize:14,
        fontFamily:"inherit",
        boxSizing:"border-box",
        resize:"vertical",
        minHeight:72,
        ...xStyle
      }}/>
    </div>
  );
}

function Row({label,value,color}) {
  return (
    <div style={{display:"flex",justifyContent:"space-between",padding:"9px 0",borderBottom:`1px solid ${C.border}`}}>
      <span style={{color:C.muted,fontSize:13}}>{label}</span>
      <span style={{fontWeight:600,color:color||C.text,fontSize:13}}>{value}</span>
    </div>
  );
}

function Btn({ch, v="primary", onClick, style={}, sm, disabled}) {
  const V = {
    primary: {background:C.accent,     color:"#fff",    border:"none",                        shadow:"0 1px 4px rgba(10,132,255,.3)"},
    green:   {background:C.green,      color:"#fff",    border:"none",                        shadow:"0 1px 4px rgba(52,199,89,.3)"},
    ghost:   {background:"transparent",color:C.sub,     border:`1.5px solid ${C.border}`,     shadow:"none"},
    danger:  {background:C.redBg,      color:C.red,     border:`1px solid ${C.red}30`,        shadow:"none"},
    soft:    {background:C.accentBg,   color:C.accentD, border:`1px solid ${C.accent}30`,     shadow:"none"},
    orange:  {background:C.orangeBg,   color:C.orange,  border:`1px solid ${C.orange}30`,     shadow:"none"},
    purple:  {background:C.purpleBg,   color:C.purple,  border:`1px solid ${C.purple}30`,     shadow:"none"},
  };
  const s = V[v]||V.primary;
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      style={{
        background:s.background,
        color:s.color,
        border:s.border,
        borderRadius:10,
        padding:sm?"5px 13px":"9px 18px",
        fontSize:sm?12:14,
        fontWeight:600,
        cursor:disabled?"default":"pointer",
        fontFamily:"inherit",
        boxShadow:s.shadow,
        opacity:disabled?0.5:1,
        transition:"opacity .15s, filter .15s",
        letterSpacing:.1,
        ...style
      }}
    >{ch}</button>
  );
}

function Modal({title, onClose, children, wide}) {
  return (
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.4)",backdropFilter:"blur(4px)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:C.surface,borderRadius:20,padding:28,width:"100%",maxWidth:wide?700:520,maxHeight:"92vh",overflowY:"auto",boxShadow:C.shadowLg}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
          <div style={{fontWeight:700,fontSize:17,color:C.text,letterSpacing:-.2}}>{title}</div>
          <button onClick={onClose} style={{background:C.surfaceAlt,border:"none",color:C.muted,width:30,height:30,borderRadius:"50%",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function ConfirmModal({msg, onOk, onCancel}) {
  return (
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.4)",backdropFilter:"blur(4px)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:C.surface,borderRadius:20,padding:28,maxWidth:360,width:"100%",boxShadow:C.shadowLg,textAlign:"center"}}>
        <div style={{width:52,height:52,borderRadius:16,background:C.redBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,margin:"0 auto 16px"}}>🗑</div>
        <div style={{fontWeight:700,fontSize:16,color:C.text,marginBottom:8,lineHeight:1.4}}>{msg}</div>
        <div style={{color:C.muted,fontSize:13,marginBottom:24}}>Esta acción no se puede deshacer.</div>
        <div style={{display:"flex",gap:10,justifyContent:"center"}}>
          <Btn ch="Cancelar" v="ghost" onClick={onCancel}/>
          <Btn ch="Eliminar" v="danger" onClick={onOk}/>
        </div>
      </div>
    </div>
  );
}

function Toast({msg, onDone}) {
  useEffect(()=>{const t=setTimeout(onDone,2800);return()=>clearTimeout(t);},[]);
  return (
    <div style={{
      position:"fixed",
      bottom:28,
      left:"50%",
      transform:"translateX(-50%)",
      background:"#1C1C1E",
      color:"#fff",
      borderRadius:12,
      padding:"11px 22px",
      fontSize:13,
      fontWeight:500,
      zIndex:3000,
      boxShadow:"0 8px 24px rgba(0,0,0,0.25)",
      whiteSpace:"nowrap",
      display:"flex",
      alignItems:"center",
      gap:8,
      letterSpacing:.1,
    }}>
      {msg}
    </div>
  );
}

function StatCard({label,value,sub,color,icon,onClick}) {
  return (
    <div onClick={onClick} style={{
      background:C.surface,
      border:`1px solid ${C.border}`,
      borderRadius:16,
      padding:"18px 20px",
      flex:1,
      minWidth:110,
      cursor:onClick?"pointer":"default",
      boxShadow:C.shadow,
      position:"relative",
      overflow:"hidden",
      transition:"box-shadow .15s",
    }}>
      <div style={{position:"absolute",top:12,right:14,fontSize:22,opacity:.08}}>{icon}</div>
      <Lbl t={label}/>
      <div style={{color:color||C.text,fontSize:24,fontWeight:700,lineHeight:1,letterSpacing:-.5}}>{value}</div>
      {sub&&<div style={{color:C.muted,fontSize:11,marginTop:5,fontWeight:500}}>{sub}</div>}
    </div>

}

function BarChart({data,height=120}) {
  // Legacy simple chart - kept for dashboard
  const max = Math.max(...data.map(d=>Math.max(d.ing||0,d.eg||0)),1);
  return (
    <div style={{display:"flex",alignItems:"flex-end",gap:4,height}}>
      {data.map((d,i) => (
        <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <div style={{width:"100%",display:"flex",gap:1,alignItems:"flex-end",height:height-20}}>
            <div style={{flex:1,background:C.green,borderRadius:"3px 3px 0 0",height:`${(d.ing/max)*100}%`,minHeight:d.ing>0?2:0}}/>
            <div style={{flex:1,background:C.red,borderRadius:"3px 3px 0 0",height:`${(d.eg/max)*100}%`,minHeight:d.eg>0?2:0}}/>
          </div>
          <div style={{fontSize:9,color:C.muted,textAlign:"center"}}>{d.label}</div>
        </div>
      ))}
    </div>
  );
}

function SemanasChart({data}) {
  const maxVal = Math.max(...data.map(d=>Math.max(d.ing||0,d.eg||0)),1);
  const BAR_H = 140;
  const [hov, setHov] = useState(null);

  return (
    <div>
      {/* Barras */}
      <div style={{display:"flex",alignItems:"flex-end",gap:6,height:BAR_H,marginBottom:8}}>
        {data.map((d,i)=>{
          const util = d.ing-d.eg;
          const ingH = Math.round((d.ing/maxVal)*(BAR_H-4));
          const egH  = Math.round((d.eg/maxVal)*(BAR_H-4));
          const isHov = hov===i;
          return (
            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer",position:"relative"}}
              onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}>
              {/* Tooltip */}
              {isHov&&(
                <div style={{position:"absolute",bottom:"100%",left:"50%",transform:"translateX(-50%)",background:"#1A202C",color:"#fff",borderRadius:8,padding:"8px 12px",fontSize:11,whiteSpace:"nowrap",zIndex:10,marginBottom:4,boxShadow:"0 4px 12px #00000033"}}>
                  <div style={{fontWeight:700,marginBottom:4,color:"#A0AEC0"}}>{d.label}</div>
                  <div style={{color:"#68D391"}}>💚 Ingresos: {cur(d.ing)}</div>
                  <div style={{color:"#FC8181"}}>🔴 Egresos: {cur(d.eg)}</div>
                  <div style={{borderTop:"1px solid #2D3748",marginTop:4,paddingTop:4,color:util>=0?"#68D391":"#FC8181",fontWeight:700}}>
                    {util>=0?"✅":"⚠"} Utilidad: {cur(util)}
                  </div>
                </div>
              )}
              {/* Barras stacked */}
              <div style={{width:"100%",display:"flex",gap:2,alignItems:"flex-end",height:BAR_H-4}}>
                <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
                  <div style={{background:isHov?"#0EA5E9":C.green,borderRadius:"4px 4px 0 0",height:ingH,minHeight:d.ing>0?3:0,transition:"height .3s, background .15s",position:"relative"}}>
                    {ingH>20&&<div style={{position:"absolute",top:4,left:0,right:0,textAlign:"center",fontSize:8,color:"#fff",fontWeight:700}}>{cur(d.ing)}</div>}
                  </div>
                </div>
                <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
                  <div style={{background:isHov?"#F87171":C.red,borderRadius:"4px 4px 0 0",height:egH,minHeight:d.eg>0?3:0,transition:"height .3s, background .15s",position:"relative"}}>
                    {egH>20&&<div style={{position:"absolute",top:4,left:0,right:0,textAlign:"center",fontSize:8,color:"#fff",fontWeight:700}}>{cur(d.eg)}</div>}
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Labels y utilidad por semana */}
      <div style={{display:"flex",gap:6}}>
        {data.map((d,i)=>{
          const util = d.ing-d.eg;
          return (
            <div key={i} style={{flex:1,textAlign:"center"}}>
              <div style={{fontSize:9,color:C.muted,fontWeight:700}}>{d.label}</div>
              {(d.ing>0||d.eg>0)&&(
                <div style={{fontSize:8,fontWeight:700,color:util>=0?C.green:C.red,marginTop:1}}>
                  {util>=0?"+":""}{cur(util)}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Totales */}
      <div style={{display:"flex",justifyContent:"space-between",marginTop:10,padding:"8px 12px",background:C.surfaceAlt,borderRadius:8,fontSize:11}}>
        <span style={{color:C.green,fontWeight:700}}>💚 Total ing: {cur(data.reduce((s,d)=>s+d.ing,0))}</span>
        <span style={{color:C.red,fontWeight:700}}>🔴 Total eg: {cur(data.reduce((s,d)=>s+d.eg,0))}</span>
        <span style={{color:(data.reduce((s,d)=>s+d.ing-d.eg,0))>=0?C.green:C.red,fontWeight:700}}>
          💰 Utilidad: {cur(data.reduce((s,d)=>s+d.ing-d.eg,0))}
        </span>
      </div>
    </div>
  );
}

function makeCalLink(s) {
  const d = (s.date||today).replace(/-/g,"");
  const t = (s.time||"09:00").replace(":","").padEnd(6,"0");
  const title = `CX. ${s.client||""} ${s.phone?"+52 "+s.phone:""} - ${s.type||""} ${s.quotePrice?cur(s.quotePrice):""}`.trim();
  const body  = `Folio: ${s.folio||""}\nTel: ${s.phone||""}\nDirección: ${s.address||""}\nTécnico: ${s.tech||""}${s.helper?" / Ayudante: "+s.helper:""}\n${s.notes||""}\n\nMULTISERVICIOS SJR`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${d}T${t}/${d}T${t}&details=${encodeURIComponent(body)}&location=${encodeURIComponent(s.address||"")}`;
}

// printQuote now sets a global state via event — actual modal rendered in App
function firePrintQuote(q) {
  window.__printQuote = q;
  window.dispatchEvent(new Event("showprintquote"));
}

function PrintQuoteModal({q, onClose}) {
  const dateStr = new Date().toLocaleDateString("es-MX",{day:"2-digit",month:"long",year:"numeric"});
  const ivaLabel = q.ivaRate===0?"Sin IVA":q.ivaRate===8?"IVA 8%":"IVA 16%";

  const buildHTML = function() {
    // Generar filas con numeración de partidas y grupos
    var grupoNum = 0;
    var concNum = 0;
    var concIdx = 0; // para color alternado solo en conceptos
    var rowsHTML = (q.items||[]).map(function(it){
      if(it.type==="grupo") {
        grupoNum++;
        concNum=0;
        return "<tr><td colspan='6' style='background:#E8EDF2;color:#374151;padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:.3px;border-left:3px solid #8B1A1A'>"+grupoNum+". "+(it.titulo||"")+"</td></tr>";
      }
      if(!it.desc) return "";
      concNum++;
      concIdx++;
      var partida = grupoNum>0?(grupoNum+"."+concNum):String(concNum);
      var bg = concIdx%2===1?"#FFFFFF":"#F8FAFC";
      var total = (+it.price||0)*(+it.qty||1);
      return "<tr style='background:"+bg+"'>"
        + "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:10px;color:#94A3B8;width:36px;text-align:center'>"+partida+"</td>"
        + "<td style='padding:6px 10px;border-bottom:1px solid #E2E8F0;font-size:11px'>"+(it.desc||"")+"</td>"
        + "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:11px;text-align:center;width:50px'>"+(it.unidad||"")+"</td>"
        + "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:11px;text-align:center;width:45px'>"+(it.qty||1)+"</td>"
        + "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:11px;text-align:right;width:80px'>"+cur(it.price)+"</td>"
        + "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:11px;text-align:right;font-weight:700;width:90px'>"+cur(total)+"</td>"
        + "</tr>";
    }).join("");
    // Clausulas — usa clausulasSelec (nuevo) o clausulas (legacy)
    var clausSrc = (q.clausulasSelec&&q.clausulasSelec.length>0) ? q.clausulasSelec : (q.clausulas||[]);
    var clausHTML = clausSrc.length>0
      ? "<div style='margin-top:14px;border-top:2px solid #E2E8F0;padding-top:12px'>"
        + "<div style='font-size:11px;font-weight:800;color:#1E293B;margin-bottom:10px;text-transform:uppercase;letter-spacing:.8px'>Cláusulas y Condiciones</div>"

            return "<div class='clausula-bloque'>"

              + "<div class='clausula-texto'>"+(c.texto||"")+"</div>"
              + "</div>";

        + "</div>" : "";
    var sBg = q.status==="autorizada"?"#D1FAE5":q.status==="rechazada"?"#FEE2E2":"#FEF3C7";
    var sColor = q.status==="autorizada"?"#065F46":q.status==="rechazada"?"#991B1B":"#92400E";
    var sLabel = q.status==="autorizada"?"Autorizada":q.status==="rechazada"?"Rechazada":"Pendiente";
    var totHTML = q.showTotales!==false
      ? "<div style='text-align:right;margin-bottom:12px'><div style='font-size:11px;color:#64748B'>Subtotal: "+cur(q.subtotal)+"</div><div style='font-size:11px;color:#64748B'>"+ivaLabel+": "+cur(q.iva)+"</div><div style='font-size:20px;font-weight:900;color:#8B1A1A'>TOTAL: "+cur(q.total)+"</div></div>"
      : "";

    var notHTML = notasSrc ? "<div class='notas-bloque' style='margin-bottom:12px'><div style='font-size:11px;font-weight:800;color:#1E293B;margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px'>Notas adicionales</div><div style='background:#FFFBEB;border-left:4px solid #F59E0B;padding:10px 14px;font-size:11px;color:#78350F;line-height:1.6;white-space:pre-wrap'>"+(notasSrc)+"</div></div>" : "";

      + "<table><thead><tr><th style='width:36px;text-align:center'>No.</th><th>Descripción</th><th style='width:50px;text-align:center'>Unidad</th><th style='width:45px;text-align:center'>Cant.</th><th style='width:80px;text-align:right'>P/U</th><th style='width:90px;text-align:right'>Total</th></tr></thead><tbody>"+rowsHTML+"</tbody></table>"
      + totHTML + notHTML + clausHTML
      + "<div class='firma-wrap'><div class='firma'><div class='firma-line'>Autorizado por cliente<br/><strong>"+(q.client||"")+"</strong></div></div><div class='firma'><div class='firma-line'>Elaborado por<br/><strong>COMINS</strong></div></div></div>"
      + "<div class='footer'>Garantia mano de obra: 30 dias | Refacciones sujetas a garantia del fabricante<br/>COMINS — Cd. Madero, Tam., Tamaulipas</div>"
      + "</div><div class='nop'><button onclick='window.print()' style='background:#8B1A1A;color:#fff;border:none;border-radius:8px;padding:12px 32px;font-size:15px;font-weight:700;cursor:pointer'>Imprimir / Guardar PDF</button></div></body></html>";
  };

  const abrirParaImprimir = function() {
    var html = buildHTML();
    try {
      var blob = new Blob([html], {type:"text/html;charset=utf-8"});
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement("a");
      a.href   = url;
      a.download = q.folio+"_"+(q.client||"Cliente").replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s]/g,"").replace(/\s+/g,"_").slice(0,30)+".html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);}, 30000);
      fireToast("Descargado — abre el archivo y Ctrl+P para PDF");
    } catch(e) {
      fireToast("Error al generar — intenta de nuevo");
    }

  var phone = q.phone ? q.phone.replace(/\D/g,"") : "";
  var rows = (q.items||[]).filter(function(i){ return i.desc && i.type!=="grupo"; });

  var waUrl = phone ? "https://wa.me/52"+phone+"?text="+encodeURIComponent(waText) : "https://wa.me/?text="+encodeURIComponent(waText);

  return (
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"#00000066",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:680,maxHeight:"92vh",overflowY:"auto",boxShadow:"0 20px 60px #00000033"}}>
        <div style={{padding:"24px 32px 0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
            <div style={{fontWeight:800,fontSize:16}}>Cotizacion {q.folio} — {q.client}</div>
            <button onClick={onClose} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"#94A3B8"}}>x</button>
          </div>
          <div style={{background:"#F8FAFC",borderRadius:12,padding:20,marginBottom:4,border:"1px solid #E2E8F0"}}>
            <div style={{display:"flex",justifyContent:"space-between",paddingBottom:12,borderBottom:"2px solid #8B1A1A",marginBottom:14}}>
              <div>
                <div style={{fontWeight:900,color:"#8B1A1A",fontSize:16}}>COMINS</div>
                <div style={{fontSize:10,color:"#64748B",marginTop:3,lineHeight:1.6}}>Comercial Industrial y de Servicios</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontWeight:800,fontSize:13}}>COTIZACION</div>
                <div style={{color:"#8B1A1A",fontWeight:900,fontSize:13}}>{q.folio}</div>
                <div style={{fontSize:10,color:"#64748B"}}>{dateStr}</div>

            </div>
            <div style={{background:"#F9F0F0",borderLeft:"3px solid #8B1A1A",padding:"8px 12px",borderRadius:"0 6px 6px 0",marginBottom:12}}>
              <div style={{fontWeight:700,fontSize:13}}>{q.client}</div>
              {q.phone&&<div style={{fontSize:11,color:"#64748B"}}>{q.phone}</div>}
            </div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,marginBottom:12}}>
              <thead><tr style={{background:"#8B1A1A",color:"#fff"}}>
                <th style={{padding:"5px 6px",textAlign:"center",width:30,fontWeight:800}}>No.</th>
                <th style={{padding:"5px 8px",textAlign:"left",fontWeight:800}}>Descripción</th>

              </tr></thead>
              <tbody>{(()=>{
                var gn=0; var cn=0;
                return (q.items||[]).map(function(it,i){
                  if(it.type==="grupo"){gn++;cn=0;return(<tr key={i}><td colSpan={6} style={{background:"#E8EDF2",color:"#374151",padding:"6px 8px",fontSize:10,fontWeight:700,borderLeft:"3px solid #8B1A1A"}}>{gn}. {it.titulo}</td></tr>);}

}

function CotizarTab({svc, quotes, onVincular, onDesvincular, onNuevaCotizacion, onAddTxn, onSave, onClose}) {
  const cotVinculada = svc.cotizacionId ? quotes.find(q=>q.id===svc.cotizacionId) : null;
  const [montoDiag, setMontoDiag] = useState("");
  const [metodoDiag, setMetodoDiag] = useState("efectivo");
  const [showDiag, setShowDiag] = useState(false);
  const [busqueda, setBusqueda] = useState("");

  const cotsFiltradas = quotes.filter(q=>{
    if(q.id===svc.cotizacionId) return false; // ya vinculada
    if(!busqueda) return q.client===svc.client||(svc.phone&&q.phone&&q.phone.replace(/\D/g,"")===svc.phone.replace(/\D/g,""));
    return q.client.toLowerCase().includes(busqueda.toLowerCase())||q.folio.toLowerCase().includes(busqueda.toLowerCase());
  });

  const cobrarDiagnostico = () => {
    const monto = parseFloat(montoDiag);
    if(!monto||monto<=0) return fireToast("⚠ Ingresa el monto del diagnóstico");
    onAddTxn({
      date: today,
      concept: (svc.folio||"")+" — Diagnóstico "+svc.client,
      category: "Servicio A/C",
      classification: "Variable",
      type: "ingreso",
      amount: monto,
      method: metodoDiag,
      status: "realizado",
      auto: false,
    });
    fireToast("✅ Diagnóstico cobrado: "+cur(monto)+" — registrado en Finanzas");
    setShowDiag(false);
    setMontoDiag("");
  };

  return (
    <div>
      {/* Si ya tiene cotización vinculada */}
      {cotVinculada ? (
        <div>
          <div style={{background:"#F0FDF4",border:"1.5px solid #10B98144",borderRadius:12,padding:"14px 16px",marginBottom:14}}>
            <div style={{fontSize:11,color:C.green,fontWeight:700,marginBottom:6}}>🔗 COTIZACIÓN VINCULADA</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
              <div>
                <div style={{fontWeight:800,fontSize:16}}>{cotVinculada.folio} — {cotVinculada.client}</div>
                <div style={{fontSize:13,color:C.muted,marginTop:2}}>{fmtD(cotVinculada.date)} · {cur(cotVinculada.total)}</div>
                <div style={{marginTop:6,display:"flex",gap:6,flexWrap:"wrap"}}>
                  {(cotVinculada.items||[]).filter(i=>i.desc).slice(0,3).map((it,i)=>(
                    <span key={i} style={{background:C.accentBg,color:C.accentD,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:600}}>{it.desc}</span>
                  ))}
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end"}}>
                <span style={{background:(QUOTE_ST[cotVinculada.status]&&QUOTE_ST[cotVinculada.status].bg)||C.surfaceAlt,color:(QUOTE_ST[cotVinculada.status]&&QUOTE_ST[cotVinculada.status].color)||C.muted,borderRadius:8,padding:"4px 12px",fontSize:12,fontWeight:700}}>{(QUOTE_ST[cotVinculada.status]&&QUOTE_ST[cotVinculada.status].icon)||""} {(QUOTE_ST[cotVinculada.status]&&QUOTE_ST[cotVinculada.status].label)||""}</span>
                <button onClick={onDesvincular} style={{background:C.redBg,color:C.red,border:"none",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>✕ Desvincular</button>
              </div>
            </div>
          </div>

          {/* Acciones según estado de la cotización */}
          {cotVinculada.status==="autorizada"&&(
            <div style={{background:C.greenBg,border:`1px solid ${C.green}33`,borderRadius:12,padding:"12px 14px",marginBottom:14}}>
              <div style={{fontWeight:700,color:C.green,marginBottom:8}}>✅ Cotización autorizada — ¿qué sigue?</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <button onClick={()=>{ onSave({...svc,status:"en_taller"}); fireToast("🏪 Servicio movido a Taller"); onClose(); }} style={{background:"#CCFBF1",color:"#0D9488",border:"1px solid #0D948844",borderRadius:8,padding:"8px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>🏪 Pasar a Taller</button>
                <button onClick={()=>{ onSave({...svc,status:"en_servicio"}); fireToast("🔧 Servicio en ejecución"); onClose(); }} style={{background:C.purpleBg,color:C.purple,border:`1px solid ${C.purple}44`,borderRadius:8,padding:"8px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>🔧 Ejecutar servicio</button>
              </div>
            </div>
          )}
          {cotVinculada.status==="seguimiento"&&(
            <div style={{background:C.orangeBg,border:`1px solid ${C.orange}33`,borderRadius:12,padding:"12px 14px",marginBottom:14,fontSize:13,color:C.orange}}>
              ⏳ En espera de autorización del cliente. Puedes enviarle seguimiento desde la cotización.
            </div>
          )}
        </div>
      ) : (
        <div>
          <div style={{background:C.accentBg,borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:13,color:C.accentD,lineHeight:1.6}}>
            💡 Desde aquí puedes crear una cotización nueva para este servicio o vincular una existente. Todo quedará relacionado automáticamente.
          </div>

          {/* Botón crear nueva cotización */}
          <button onClick={()=>onNuevaCotizacion&&onNuevaCotizacion(svc)} style={{width:"100%",background:C.accent,color:"#fff",border:"none",borderRadius:12,padding:"14px",fontSize:14,fontWeight:800,cursor:"pointer",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            📋 Crear nueva cotización para este servicio
          </button>

          {/* Vincular existente */}
          <div style={{marginBottom:10}}>
            <div style={{fontWeight:700,fontSize:13,color:C.sub,marginBottom:8}}>O vincular cotización existente:</div>
            <input value={busqueda} onChange={e=>setBusqueda(e.target.value)} placeholder="Buscar por cliente o folio..." style={{width:"100%",background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"8px 12px",fontSize:13,fontFamily:"inherit",boxSizing:"border-box",marginBottom:8}}/>
            {cotsFiltradas.length===0&&<div style={{fontSize:12,color:C.muted,textAlign:"center",padding:"10px 0"}}>No hay cotizaciones {busqueda?"con esa búsqueda":"del mismo cliente"}</div>}
            {cotsFiltradas.slice(0,5).map(q=>(
              <div key={q.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",marginBottom:6}}>
                <div>
                  <div style={{fontWeight:700,fontSize:13}}>{q.folio} · {q.client}</div>
                  <div style={{fontSize:11,color:C.muted}}>{fmtD(q.date)} · {cur(q.total)} · {(QUOTE_ST[q.status]&&QUOTE_ST[q.status].label)||q.status}</div>
                </div>
                <button onClick={()=>onVincular(q)} style={{background:C.greenBg,color:C.green,border:"none",borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>🔗 Vincular</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Cobrar diagnóstico — siempre disponible */}
      <div style={{borderTop:`1px solid ${C.border}`,paddingTop:14,marginTop:4}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:showDiag?10:0}}>
          <div style={{fontWeight:700,fontSize:13}}>💵 Cobrar diagnóstico por separado</div>
          <button onClick={()=>setShowDiag(p=>!p)} style={{background:showDiag?C.redBg:C.accentBg,color:showDiag?C.red:C.accentD,border:"none",borderRadius:8,padding:"5px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>{showDiag?"✕ Cancelar":"+ Registrar"}</button>
        </div>
        {showDiag&&(
          <div style={{background:C.surfaceAlt,borderRadius:10,padding:"12px 14px",marginTop:8}}>
            <div style={{fontSize:12,color:C.muted,marginBottom:10}}>Se registrará en Finanzas como ingreso independiente del servicio principal.</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
              <Inp label="Monto diagnóstico $" type="number" value={montoDiag} onChange={e=>setMontoDiag(e.target.value)} placeholder="0.00"/>
              <Sel label="Forma de pago" opts={[{v:"efectivo",l:"💵 Efectivo"},{v:"transferencia",l:"🏦 SPEI"},{v:"tdd",l:"🏦 TDD"},{v:"tarjeta",l:"💳 Terminal"}]} value={metodoDiag} onChange={e=>setMetodoDiag(e.target.value)}/>
            </div>
            <Btn ch="✅ Registrar cobro de diagnóstico" v="green" onClick={cobrarDiagnostico} style={{width:"100%"}}/>
          </div>
        )}
      </div>
    </div>
  );
}

function SvcModal({svc, onClose, onSave, onDelete, onAddTxn, inv=[], setInv, txns=[], svcsAll=[], quotes=[], onSaveQuote, onNuevaCotizacion, gcalConnected=false, onSyncGcal, empleados=[]}) {
  const editing = !!svc;
  const [f, setF] = useState(svc || {client:"",phone:"",address:"",type:"Mantenimiento",date:today,time:"09:00",timeFin:"13:00",priority:"normal",notes:"",tech:"Carlos",helper:"",quotePrice:"",checks:DEF_CHECKS,checked:{},tallerStatus:"",tallerIngreso:"",tallerEquipo:"",tallerDiag:"",tallerFechaEntrega:"",tallerHoraEntrega:"09:00",source:""});
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const [tab, setTab] = useState("info");
  const [newChk, setNewChk] = useState("");
  const [amount, setAmount] = useState((svc&&svc.amount)||"");
  const [method, setMethod] = useState((svc&&svc.payMethod)||"efectivo");
  const [fechaCobro, setFechaCobro] = useState(today);
  const [showFechaCobro, setShowFechaCobro] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const [modalCancel, setModalCancel] = useState(false);
  // Materiales usados en el servicio
  const [matsInv,   setMatsInv]   = useState([]); // [{item, qty, cobrar, precio}]
  const [matsComp,  setMatsComp]  = useState([]); // [{desc, costo}] compras nuevas
  const checks = f.checks || DEF_CHECKS;
  const checked = f.checked || {};
  const done = checks.filter(k=>checked[k]).length;
  const calLink = makeCalLink({...f, folio: (svc&&svc.folio)||""});
  const save = () => {
    if(!f.client) return fireToast("⚠ Ingresa el nombre del cliente");
    const prev = svc;
    // Usar el monto del estado f.amount o del campo amount del tab cobro
    const montoFinal = parseFloat(f.amount||amount||0);
    const metodoPago = f.payMethod||method||"efectivo";
    // Si cambia a completado y tiene monto, registrar en Finanzas automático
    if(f.status==="completado" && montoFinal>0 && (prev&&prev.status)!=="completado") {
      // Verificar que no exista ya una txn para este folio
      const yaExiste = f.folio && txns.some(t=>t.auto && t.type==="ingreso" && t.concept.includes(f.folio));
      const fConMonto = {...f, amount:montoFinal, payMethod:metodoPago};
      onSave(fConMonto);
      if(!yaExiste) onAddTxn({
        date: today,
        concept: `${f.folio||""} - ${f.type} ${f.client}`,
        category: f.type==="Instalación"?"Instalación":"Servicio A/C",
        classification: "Variable",
        type: "ingreso",
        amount: montoFinal,
        method: metodoPago,
        status: "realizado",
        auto: true,
      });
      fireToast(yaExiste ? "✅ Guardado (ya estaba en Finanzas)" : "✅ Guardado y registrado en Finanzas: " + cur(montoFinal));
    } else if(f.status==="completado" && montoFinal===0) {
      onSave(f);
      fireToast("⚠ Guardado sin monto — ve al tab 💰 Cobrar para registrar el pago");
    } else {
      onSave(f);
    }
    onClose();
  };
  const complete = () => {
    if(!amount) return fireToast("⚠ Ingresa el monto cobrado");
    const amtNum = parseFloat(amount);
    // Construir registro de materiales para guardar en el servicio
    const matsRegistro = [
      ...matsInv.filter(m=>m.item).map(m=>({tipo:"inventario",nombre:m.item.name,qty:m.qty,unit:m.item.unit,costo:m.item.costUnit||0,precio:m.cobrar?m.precio:0,cobrado:m.cobrar,fecha:today})),
      ...matsComp.filter(m=>m.desc).map(m=>({tipo:"compra",nombre:m.desc,qty:1,unit:"pza",costo:parseFloat(m.costo)||0,precio:0,cobrado:false,fecha:today}))
    ];
    const updated = {...f, status:"completado", amount:amtNum, payMethod:method, fechaCobro:fechaCobro||today, materiales:matsRegistro};
    onSave(updated);
    // Ingreso principal del servicio
    onAddTxn({date:fechaCobro||today,concept:`${f.folio||""} - ${f.type} ${f.client}`,category:f.type==="Instalación"?"Instalación":"Servicio A/C",classification:"Variable",type:"ingreso",amount:amtNum,method,status:"realizado",auto:true});
    // Materiales del inventario — descontar stock
    matsInv.forEach(({item,qty,cobrar,precio})=>{
      const newStock = Math.max(0,(item.stock||0)-qty);
      const mov = {fecha:today,tipo:"salida",qty,concepto:`Servicio ${f.folio||f.client}`,precio:cobrar?precio:0};
      if(setInv) setInv(p=>p.map(x=>x.id===item.id?{...x,stock:newStock,movs:[mov,...(x.movs||[])]}:x));
    });
    // Compras nuevas — registrar como egreso en finanzas
    matsComp.forEach(({desc,costo})=>{

                      <div style={{fontSize:12,color:C.muted}}>Precio cotizado: {cur(f.quotePrice||0)}</div>
                    </div>
                    <button onClick={()=>{
                      // Limpiar en cotización también
                      const cotAnterior = quotes.find(q=>q.id===f.cotizacionId);
                      if(cotAnterior&&onSaveQuote) onSaveQuote({...cotAnterior,servicioId:null,servicioFolio:""});
                      set("cotizacionId","");
                      set("cotizacionFolio","");
                    }} style={{background:C.redBg,color:C.red,border:"none",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>✕ Desvincular</button>
                  </div>
                </div>
              ) : (
                <div style={{background:C.surfaceAlt,border:`1.5px dashed ${C.border}`,borderRadius:12,padding:"12px 14px",marginBottom:4}}>
                  <div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:8}}>🔗 VINCULAR COTIZACIÓN</div>

                    if(!e.target.value) return;
                    const q = quotes.find(qq=>String(qq.id)===e.target.value);
                    if(q) {
                      set("cotizacionId",q.id);
                      set("cotizacionFolio",q.folio);
                      set("quotePrice",q.total);
                      // Actualizar cotización con folio del servicio (bidireccional)
                      if(onSaveQuote && svc && svc.folio) {
                        onSaveQuote({...q, servicioId:svc.id, servicioFolio:svc.folio});

                      }
                    }
                  }} defaultValue="" style={{width:"100%",background:"#fff",border:`1.5px solid ${C.border}`,borderRadius:8,padding:"8px 12px",fontSize:13,fontFamily:"inherit",boxSizing:"border-box"}}>
                    <option value="">— Seleccionar cotización del cliente —</option>
                    {quotes.filter(q=>!q.servicioId||q.servicioId===f.id).filter(q=>!f.phone||!q.phone||(q.phone.replace(/\D/g,""))===f.phone.replace(/\D/g,"")).map(q=>(
                      <option key={q.id} value={q.id}>{q.folio} · {q.client} · {cur(q.total)} · {q.status}</option>
                    ))}
                    {quotes.filter(q=>!q.servicioId||q.servicioId===f.id).filter(q=>f.phone&&q.phone&&(q.phone.replace(/\D/g,""))!==f.phone.replace(/\D/g,"")).length>0&&<option disabled>── Otras cotizaciones ──</option>}
                    {quotes.filter(q=>!q.servicioId||q.servicioId===f.id).filter(q=>f.phone&&q.phone&&(q.phone.replace(/\D/g,""))!==f.phone.replace(/\D/g,"")).map(q=>(
                      <option key={q.id+"_x"} value={q.id}>{q.folio} · {q.client} · {cur(q.total)}</option>
                    ))}
                  </select>

                  </div>

                    <th style={{padding:"7px 12px",textAlign:"right",width:90}}>Venta</th>

                  </div>

              })()}
            </div>
          </div>

            </div>

          <div style={{display:"flex",gap:8,marginTop:12}}>
            <input value={newChk} onChange={e=>setNewChk(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&newChk.trim()){set("checks",[...checks,newChk.trim()]);setNewChk("");}}} placeholder="+ Agregar elemento..." style={{flex:1,background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"8px 12px",color:C.text,fontSize:13,fontFamily:"inherit"}}/>

                  <div style={{flex:2,minWidth:120}}>
                    <Lbl t="Producto"/>
                    <select value={(m.item&&m.item.id)||""} onChange={e=>{const it=inv.find(x=>x.id===parseInt(e.target.value));setMatsInv(p=>p.map((x,j)=>j===i?{...x,item:it,precio:(it&&it.salePrice)||0}:x));}} style={{width:"100%",background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"8px 10px",fontSize:13,fontFamily:"inherit"}}>

                  <div>

              onSave(updated);
              onClose();
              fireToast("💸 Servicio marcado como Por cobrar");

            </div>
            {matsInv.length===0&&<div style={{fontSize:12,color:C.muted,textAlign:"center",padding:"6px 0"}}>Sin materiales del inventario</div>}

                      <option value="">Seleccionar...</option>

                  <div style={{width:90}}><Inp label="Precio venta $" type="number" value={m.precio} onChange={e=>setMatsInv(p=>p.map((x,j)=>j===i?{...x,precio:parseFloat(e.target.value)||0}:x))}/></div>

                  <input type="checkbox" checked={m.cobrar} onChange={e=>setMatsInv(p=>p.map((x,j)=>j===i?{...x,cobrar:e.target.checked}:x))} style={{accentColor:C.green,width:14,height:14}}/>
                  <span style={{fontSize:12,color:C.sub}}>Generar ingreso en Finanzas {m.cobrar&&m.precio>0?<strong style={{color:C.green}}>→ +{cur(m.precio*m.qty)}</strong>:""}</span>
                </div>
              </div>
            ))}
          </div>

              // Construir nuevos registros de materiales
              const nuevosMats = [
                ...matsInv.filter(m=>m.item).map(m=>({tipo:"inventario",nombre:m.item.name,qty:m.qty,unit:m.item.unit,costo:m.item.costUnit||0,precio:m.cobrar?m.precio:0,cobrado:m.cobrar,fecha:today})),
                ...matsComp.filter(m=>m.desc).map(m=>({tipo:"compra",nombre:m.desc,qty:1,unit:"pza",costo:parseFloat(m.costo)||0,precio:0,cobrado:false,fecha:today}))
              ];
              // Guardar en el servicio acumulando los anteriores
              const svcActualizado = {...f, materiales:[...(f.materiales||[]),...nuevosMats]};
              onSave(svcActualizado);
              // Descontar inventario
              matsInv.forEach(({item,qty,cobrar,precio})=>{
                if(!item) return;
                const newStock = Math.max(0,(item.stock||0)-qty);
                const mov = {fecha:today,tipo:"salida",qty,concepto:`Servicio ${f.folio||f.client} (post-cobro)`,precio:cobrar?precio:0};
                if(setInv) setInv(p=>p.map(x=>x.id===item.id?{...x,stock:newStock,movs:[mov,...(x.movs||[])]}:x));
                if(cobrar&&precio>0) onAddTxn({date:today,concept:`Venta ${item.name} — ${f.folio||f.client}`,category:"Servicio A/C",classification:"Variable",type:"ingreso",amount:precio*qty,method:f.payMethod||"efectivo",status:"realizado",auto:true});
              });
              matsComp.forEach(({desc,costo})=>{
                if(costo>0) onAddTxn({date:today,concept:desc||`Materiales ${f.folio||f.client}`,category:"Materiales",classification:"Variable",type:"egreso",amount:parseFloat(costo),method:"efectivo",status:"realizado",auto:false});
              });
              setMatsInv([]);
              setMatsComp([]);
              fireToast("✅ Materiales registrados y guardados en el servicio");
              onClose();
            }}/>
          )}
        </div>

      )}

            set("cotizacionFolio",q.folio);
            set("quotePrice",q.total);
            // Actualizar cotización con el folio del servicio (bidireccional)
            if(onSaveQuote && svc && svc.folio) {
              onSaveQuote({...q, servicioId:svc.id, servicioFolio:svc.folio});
            }
            fireToast("🔗 "+q.folio+" vinculada a "+(svc&&svc.folio||"este servicio"));
          }}
          onDesvincular={()=>{
            // Limpiar en cotización también
            const cotAnterior = quotes.find(q=>q.id===f.cotizacionId);
            if(cotAnterior&&onSaveQuote) onSaveQuote({...cotAnterior,servicioId:null,servicioFolio:""});
            set("cotizacionId","");
            set("cotizacionFolio","");
          }}

          onAddTxn={onAddTxn}
          onSave={onSave}
          onClose={onClose}
        />

          f.gcalEventId ? (
            <button onClick={()=>onSyncGcal&&onSyncGcal(f)} style={{background:"#E8F0FE",color:"#1A73E8",border:"1px solid #1A73E844",borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
              📅 Actualizar GCal
            </button>
          ) : (
            <button onClick={()=>onSyncGcal&&onSyncGcal(f)} style={{background:"#E8F0FE",color:"#1A73E8",border:"1px solid #1A73E844",borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
              📅 Añadir a GCal
            </button>
          )
        )}
        {!gcalConnected && <Btn ch="📅 Agendar en Calendar" v="soft" sm onClick={()=>window.open(calLink,"_blank")}/>}
        <Btn ch={editing?"💾 Guardar cambios":"✅ Crear servicio"} v="primary" onClick={save}/>
      </div>
    </Modal>
    {confirmDel&&<ConfirmModal msg={`¿Eliminar servicio de ${f.client}?`} onOk={()=>{onDelete(f.id);onClose();}} onCancel={()=>setConfirmDel(false)}/>}
    {modalCancel&&<CancelModal svc={f} onClose={()=>setModalCancel(false)} onCancelar={(motivo,tipo)=>{
      set("status","cancelado");
      set("cancelMotivo",motivo);
      set("cancelTipo",tipo);
      setModalCancel(false);
      fireToast(tipo==="reagenda"?"📅 Marcado como reagenda — crea el nuevo servicio":"❌ Servicio cancelado");
    }} onReagendar={(motivo,fecha,tieneF)=>{
      // 1. Guardar servicio cancelado
      const updated={...f,status:"cancelado",cancelMotivo:motivo,cancelTipo:"reagenda"};
      onSave(updated);
      // 2. Crear nuevo servicio — IMPORTANTE: quitar id, folio y campos del servicio anterior
      const nuevoSvc={
        client:f.client, phone:f.phone, address:f.address,
        type:f.type, priority:f.priority, source:f.source,
        tech:f.tech, helper:f.helper,
        notes:(!tieneF&&motivo)?(f.notes||"")+"\n[Reagenda: "+motivo+"]":(f.notes||""),
        quotePrice:f.quotePrice,
        checks:f.checks, checked:{},
        date:tieneF&&fecha?fecha:"",
        time:f.time||"09:00", timeFin:f.timeFin||"",
        id:undefined, folio:undefined,
        status:"pendiente", amount:0, payMethod:"", cancelMotivo:"", cancelTipo:"", gcalEventId:""
      };
      if(onNuevaCotizacion) onNuevaCotizacion(nuevoSvc);
      onClose();
      if(tieneF&&fecha) {
        fireToast("📆 Reagendado para el "+new Date(fecha+"T12:00:00").toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"}));
      } else {
        fireToast("🕐 Pendiente sin fecha — aparece en el panel");
      }
    }}/>}
    </>
  );
}

function TxnModal({existing, onClose, onSave, incCats, expCats}) {
  const iCats = incCats||S_INC_CATS;
  const eCatsBase = expCats||S_EXP_CATS;
  // Garantizar que categorías especiales siempre estén presentes
  const eCats = eCatsBase.includes("Retiro de socio / Utilidades")
    ? eCatsBase
    : [...eCatsBase, "Retiro de socio / Utilidades"];
  const [f, setF] = useState(existing || {date:today,concept:"",category:"Materiales",classification:"Variable",type:"egreso",amount:"",method:"efectivo",status:"realizado"});
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const submit = () => {
    if(!f.concept||!f.amount) return fireToast("⚠ Completa concepto y monto");
    onSave({...f, amount:parseFloat(f.amount), id:existing?existing.id:_tid++, auto:false});
    onClose();
  };
  return (
    <Modal title={existing?"✏ Editar Movimiento":"➕ Nuevo Movimiento"} onClose={onClose}>
      <div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
          <Sel label="Tipo" opts={[{v:"ingreso",l:"💚 Ingreso"},{v:"egreso",l:"🔴 Egreso"}]} value={f.type} onChange={e=>{set("type",e.target.value);set("category",e.target.value==="ingreso"?iCats[0]||"Servicio A/C":eCats[0]||"Materiales");}}/>
          <Inp label="Fecha" type="date" value={f.date} onChange={e=>set("date",e.target.value)}/>
          <div style={{gridColumn:"1/-1"}}><Inp label="Concepto *" value={f.concept} onChange={e=>set("concept",e.target.value)} placeholder="Descripción del movimiento"/></div>
          <Sel label="Categoría" opts={f.type==="ingreso"?iCats:eCats} value={f.category} onChange={e=>set("category",e.target.value)}/>
          <Sel label="Clasificación" opts={CLASSIFY} value={f.classification||"Variable"} onChange={e=>set("classification",e.target.value)}/>
          <Inp label="Monto $" type="number" value={f.amount} onChange={e=>set("amount",e.target.value)} placeholder="0.00"/>
          <Sel label="Método" opts={[{v:"efectivo",l:"💵 Efectivo"},{v:"transferencia",l:"🏦 SPEI / Depósito"},{v:"tdd",l:"🏦 TDD Banamex"},{v:"cargo_auto",l:"🏦 Cargo automático"},{v:"tarjeta",l:"💳 Terminal"},{v:"tdc",l:"💳 TDC Negocio"}]} value={f.method} onChange={e=>set("method",e.target.value)}/>
          <div style={{gridColumn:"1/-1"}}><Sel label="Estado" opts={[{v:"realizado",l:"✅ Realizado"},{v:"pendiente",l:"⏳ Pendiente"}]} value={f.status} onChange={e=>set("status",e.target.value)}/></div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:8}}>
          <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
          <Btn ch={existing?"💾 Actualizar":"💾 Guardar"} v="primary" onClick={submit}/>
        </div>
      </div>
    </Modal>
  );
}

                  <input id="matCompraPrice" type="number" placeholder="$0.00" style={{width:80,background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"7px 8px",fontSize:12,fontFamily:"inherit",color:C.text,textAlign:"right"}}/>

        {(()=>{

                      newItems.splice(insertAt, 0, {desc:"",qty:1,price:""});

                      {it.notaInterna&&<div style={{background:"#FEF3C7",border:"1px solid #F59E0B33",borderRadius:6,padding:"4px 10px",fontSize:11,color:"#92400E",marginTop:4,fontWeight:600}}>🔒 Nota interna: {it.notaInterna}</div>}

                <div key={selKey}>

                      />

                        <Btn ch="💾 Guardar" v="primary" sm onClick={()=>{
                          if(!editClausulaData.titulo||!editClausulaData.texto) return fireToast("⚠ Completa título y texto");
                          // Actualizar catálogo
                          setClausulas(p=>p.map((c,i)=>i===idx?{...c,titulo:editClausulaData.titulo,texto:editClausulaData.texto}:c));
                          // Actualizar si estaba seleccionada
                          setClausulasSelec(p=>p.map(c=>c._selKey===selKey?{...c,titulo:editClausulaData.titulo,texto:editClausulaData.texto}:c));
                          setEditingClausula(null);
                          fireToast("✅ Cláusula actualizada");

                        <Btn ch="Cancelar" v="ghost" sm onClick={()=>setEditingClausula(null)}/>

                    <div style={{background:yaSelec?C.accentBg:C.surface,border:`1.5px solid ${yaSelec?C.accent:C.border}`,borderRadius:8,padding:"10px 12px",display:"flex",alignItems:"flex-start",gap:10,transition:"all .15s"}}>

                        if(yaSelec) {
                          setClausulasSelec(p=>p.filter(c=>c._selKey!==selKey));

                      }} style={{width:18,height:18,borderRadius:4,border:`2px solid ${yaSelec?C.accent:C.muted}`,background:yaSelec?C.accent:"transparent",flexShrink:0,marginTop:1,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                        {yaSelec&&<span style={{color:"#fff",fontSize:11,fontWeight:900}}>✓</span>}
                      </div>
                      {/* Content — clickable for select */}
                      <div style={{flex:1,cursor:"pointer"}} onClick={()=>{
                        if(yaSelec) setClausulasSelec(p=>p.filter(c=>c._selKey!==selKey));
                        else setClausulasSelec(p=>[...p,{id:cl.id,_selKey:selKey,titulo:cl.titulo,texto:cl.texto}]);
                      }}>
                        <div style={{fontWeight:700,fontSize:12,color:yaSelec?C.accentD:C.text}}>{cl.titulo}</div>

                      </div>
                      {/* Edit/Delete buttons */}
                      <div style={{display:"flex",gap:4,flexShrink:0}}>
                        <button onClick={e=>{e.stopPropagation();setEditingClausula(selKey);setEditClausulaData({titulo:cl.titulo,texto:cl.texto});}} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:6,padding:"3px 8px",fontSize:11,cursor:"pointer",color:C.muted,fontFamily:"inherit"}}>✏</button>
                        <button onClick={e=>{e.stopPropagation();setClausulas(p=>p.filter((_,i)=>i!==idx));setClausulasSelec(p=>p.filter(c=>c._selKey!==selKey));fireToast("Cláusula eliminada");}} style={{background:"none",border:`1px solid ${C.redBg}`,borderRadius:6,padding:"3px 8px",fontSize:11,cursor:"pointer",color:C.red,fontFamily:"inherit"}}>✕</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
            {/* Agregar nueva cláusula al catálogo */}
            <div style={{borderTop:`1px solid ${C.border}`,paddingTop:10,marginTop:4}}>
              <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6}}>+ Agregar nueva cláusula al catálogo:</div>
              <div style={{display:"flex",gap:8,marginBottom:6}}>
                <input value={newClausula.titulo} onChange={e=>setNewClausula(p=>({...p,titulo:e.target.value}))} placeholder="Título de la cláusula..." style={{flex:1,background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"7px 10px",fontSize:12,fontFamily:"inherit",color:C.text}}/>
              </div>
              <textarea value={newClausula.texto} onChange={e=>setNewClausula(p=>({...p,texto:e.target.value}))} placeholder="Texto completo de la cláusula..." rows={2} style={{width:"100%",background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"7px 10px",fontSize:12,fontFamily:"inherit",color:C.text,resize:"vertical",boxSizing:"border-box",marginBottom:6}}/>
              <Btn ch="💾 Guardar en catálogo" v="soft" sm onClick={()=>{
                if(!newClausula.titulo||!newClausula.texto) return fireToast("⚠ Completa título y texto");
                setClausulas(p=>[...p,{id:Date.now()+"_"+Math.random().toString(36).slice(2,7),titulo:newClausula.titulo,texto:newClausula.texto}]);
                setNewClausula({titulo:"",texto:""});
                fireToast("✅ Cláusula guardada en catálogo");
              }}/>
            </div>
          </div>
        </div>

        {/* ── BLOQUE 2: NOTAS ADICIONALES ── */}
        <div style={{border:`1.5px solid ${C.border}`,borderRadius:12,marginBottom:14,overflow:"hidden"}}>

          </div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:8}}>

          <Btn ch={saving?"⏳ Guardando...":"💾 Guardar y ver cotización"} v="primary" onClick={saveOnce} disabled={saving}/>
        </div>
      </div>
    </Modal>
  );
}

// Infiere tipo de servicio desde los conceptos de la cotización
function inferirTipoServicio(items) {
  const textos = (items||[]).map(i=>(i.desc||"").toLowerCase()).join(" ");
  if(textos.includes("instalac")) return "Instalación";
  if(textos.includes("manten")) return "Mantenimiento";
  if(textos.includes("repar") || textos.includes("cambio") || textos.includes("capacitor")) return "Reparación";
  if(textos.includes("revision") || textos.includes("diagn")) return "Revisión";
  if(textos.includes("garantia")) return "Garantía";
  return "Instalación";
}

}

function LeadParser({onClose, onCreateService, onCreateLead}) {
  const [text,setText]=useState("");
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [edit,setEdit]=useState(null);
  const [error,setError]=useState("");
  const parse=async()=>{
    if(!text.trim())return;
    setLoading(true);setError("");setResult(null);
    try {
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:`Extrae datos de este lead de WhatsApp para negocio de A/C. SOLO JSON sin backticks:\n{"name":"","phone":"","address":"","serviceType":"Mantenimiento","notes":"","priority":"normal","preferredDate":"","interest":"resumen"}\nTipos: Mantenimiento,Instalación,Reparación,Revisión,Garantía. Priority: normal,alta,urgente.\n\nConversación:\n${text}`}]})});
      const data=await res.json();
      const raw=(data.content||[]).map(function(b){return b.text||"";}).join("");
      const parsed=JSON.parse(raw.split("```json").join("").split("```").join("").trim());
      setResult(parsed);setEdit({...parsed});
    } catch(e) { setError("No pude procesar. Intenta de nuevo."); }
    setLoading(false);
  };
  const r=edit||result;
  const se=(k,v)=>setEdit(p=>({...p,[k]:v}));
  return(
    <Modal title="🤖 Procesar Lead de WhatsApp" onClose={onClose} wide>
      {!result?(
        <div>
          <div style={{background:C.accentBg,borderRadius:10,padding:"12px 16px",marginBottom:16,fontSize:13,color:C.accentD}}>💡 Pega la conversación de WhatsApp — la IA extrae todos los datos.</div>
          <Txta label="Conversación" value={text} onChange={e=>setText(e.target.value)} placeholder="Cliente: Hola buenas tardes...\nYo: Claro, con gusto..." xStyle={{minHeight:180}}/>
          {error&&<div style={{color:C.red,fontSize:13,marginBottom:12}}>⚠ {error}</div>}
          <div style={{display:"flex",gap:10}}>
            <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
            <Btn ch={loading?"⏳ Procesando...":"✨ Extraer con IA"} v="primary" onClick={parse} style={{opacity:loading?0.7:1}}/>
          </div>
        </div>
      ):(
        <div>
          <div style={{background:C.greenBg,borderRadius:10,padding:"10px 16px",marginBottom:16,fontSize:13,color:C.green,fontWeight:600}}>✅ Datos extraídos — revisa y confirma</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 16px"}}>
            <Inp label="Nombre" value={(r&&r.name)||""} onChange={e=>se("name",e.target.value)}/>
            <Inp label="Teléfono" value={(r&&r.phone)||""} onChange={e=>se("phone",e.target.value)}/>
          </div>
          <Inp label="Dirección" value={(r&&r.address)||""} onChange={e=>se("address",e.target.value)}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 16px"}}>
            <Sel label="Tipo" opts={SVC_TYPES} value={(r&&r.serviceType)||"Mantenimiento"} onChange={e=>se("serviceType",e.target.value)}/>
            <Sel label="Prioridad" opts={[{v:"normal",l:"Normal"},{v:"alta",l:"Alta"},{v:"urgente",l:"Urgente"}]} value={(r&&r.priority)||"normal"} onChange={e=>se("priority",e.target.value)}/>
          </div>
          <Txta label="Notas" value={(r&&r.notes)||""} onChange={e=>se("notes",e.target.value)}/>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <Btn ch="← Volver" v="ghost" onClick={()=>{setResult(null);setEdit(null);}}/>
            <Btn ch="💾 Guardar como Lead" v="orange" onClick={()=>{onCreateLead(r);onClose();}}/>
            <Btn ch="🚀 Crear Servicio" v="green" onClick={()=>{onCreateService(r);onClose();}}/>
          </div>
        </div>
      )}
    </Modal>
  );
}

// ── CATEGORÍAS DE INVENTARIO ──────────────────────────────────────
const INV_CATS = ["Gas Refrigerante","Refacción","Equipo Completo","Herramienta","Consumible","Otro"];
const INV_UNITS = ["pieza","kg","libra","litro","metro","caja","juego"];
let _iid = 1;

function InvTab({inv, setInv, addTxn, tod2, provs=[], setProvs, ocs=[], setOcs}) {
  const [modal,      setModal]     = useState(null);
  const [sel,        setSel]       = useState(null);
  const [catF,       setCatF]      = useState("todos");
  const [search,     setSearch]    = useState("");
  const [vista,      setVista]     = useState("lista"); // "lista" | "utilidad" | "proveedores"
  const [confirmDel, setConfirmDel]= useState(false);

  useEffect(()=>{
    if(inv.length>0) _iid = Math.max(_iid,...inv.map(i=>i.id||0))+1;
  },[]);

  const filtered = inv
    .filter(i=>catF==="todos"||i.cat===catF)
    .filter(i=>!search||i.name.toLowerCase().includes(search.toLowerCase()))
    .sort((a,b)=>a.name.localeCompare(b.name));

  // ── Cálculos globales ──
  const totalInvertido    = inv.reduce((s,i)=>s+(i.stock*(i.costUnit||0)),0);
  const totalVentaPotencial = inv.filter(i=>i.salePrice>0).reduce((s,i)=>s+(i.stock*(i.salePrice||0)),0);
  const totalUtilidadPot  = totalVentaPotencial - totalInvertido;
  const bajoStock         = inv.filter(i=>i.stock<=i.minStock&&i.minStock>0);

  const saveItem = (item) => {
    if(item.id && inv.find(x=>x.id===item.id)) setInv(p=>p.map(x=>x.id===item.id?item:x));
    else setInv(p=>[{...item,id:_iid++,created:tod2,movs:[]},...p]);
    setModal(null); setSel(null);
  };
  const deleteItem = (id) => { setInv(p=>p.filter(x=>x.id!==id)); setModal(null); setSel(null); setConfirmDel(false); };

  const usarItem = (item, qty, cobrar, precioVenta, concepto) => {
    const newStock = Math.max(0,(item.stock||0)-qty);
    const mov = {fecha:tod2,tipo:"salida",qty,concepto:concepto||(cobrar?"Venta":"Uso interno"),precio:cobrar?precioVenta:0};
    setInv(p=>p.map(x=>x.id===item.id?{...x,stock:newStock,movs:[mov,...(x.movs||[])]}:x));
    if(cobrar&&precioVenta>0)
      addTxn({date:tod2,concept:concepto||`Venta ${item.name}`,category:"Servicio A/C",classification:"Variable",type:"ingreso",amount:precioVenta*qty,method:"efectivo",status:"realizado",auto:true});
    setModal(null); setSel(null);
    fireToast(`✅ ${qty} ${item.unit} de ${item.name} usados. Stock: ${newStock}`);
  };

  const recibirCompra = (item, qty, costo, registrarGasto) => {
    const newStock = (item.stock||0)+qty;
    const mov = {fecha:tod2,tipo:"entrada",qty,concepto:"Compra / reabasto",precio:costo};
    setInv(p=>p.map(x=>x.id===item.id?{...x,stock:newStock,costUnit:costo||x.costUnit,movs:[mov,...(x.movs||[])]}:x));
    if(registrarGasto&&costo>0)
      addTxn({date:tod2,concept:`Compra ${item.name} (${qty} ${item.unit})`,category:"Materiales",classification:"Variable",type:"egreso",amount:costo*qty,method:"efectivo",status:"realizado",auto:false});
    setModal(null); setSel(null);
    fireToast(`✅ +${qty} ${item.unit} recibidos. Stock: ${newStock}`);
  };

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,gap:10,flexWrap:"wrap"}}>
        <div style={{fontWeight:900,fontSize:20}}>📦 Inventario</div>
        <div style={{display:"flex",gap:8}}>
          <Btn ch="+ Agregar" v="primary" sm onClick={()=>{setSel(null);setModal("add");}}/>
        </div>
      </div>

      {/* Stats globales */}
      <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        <StatCard label="Productos" value={inv.length} icon="📦" color={C.accent}/>
        <StatCard label="Invertido en stock" value={cur(totalInvertido)} icon="💸" color={C.orange} sub="a precio de costo"/>
        <StatCard label="Venta potencial" value={cur(totalVentaPotencial)} icon="📈" color={C.accent} sub="si vendes todo"/>
        <StatCard label="Utilidad potencial" value={cur(totalUtilidadPot)} icon="💰" color={totalUtilidadPot>=0?C.green:C.red} sub={totalVentaPotencial>0?`${Math.round((totalUtilidadPot/totalVentaPotencial)*100)}% margen`:"sin precios de venta"}/>
        <StatCard label="Stock bajo" value={bajoStock.length} icon="⚠" color={bajoStock.length>0?C.red:C.green} sub={bajoStock.length>0?"Requiere reabasto":"Todo OK"}/>
      </div>

      {/* Toggle vista */}
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[{v:"lista",l:"📦 Lista"},{v:"utilidad",l:"📊 Análisis de utilidad"},{v:"proveedores",l:"🏢 Proveedores"},{v:"ocs",l:"📋 Órdenes de compra"}].map(t=>(
          <button key={t.v} onClick={()=>setVista(t.v)} style={{background:vista===t.v?C.accentBg:"transparent",border:`1.5px solid ${vista===t.v?C.accent:C.border}`,color:vista===t.v?C.accentD:C.sub,borderRadius:8,padding:"7px 18px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{t.l}</button>
        ))}
      </div>

      {/* VISTA UTILIDAD */}
      {vista==="utilidad"&&(
        <div>
          <Card style={{marginBottom:16,background:"linear-gradient(135deg,#0EA5E920,#8B5CF610)"}}>
            <div style={{fontWeight:800,fontSize:15,marginBottom:14}}>💡 ¿Cómo leer esto?</div>
            <div style={{fontSize:13,color:C.sub,lineHeight:1.8}}>
              <strong>Invertido</strong> = lo que pagaste para tener ese producto en bodega.<br/>
              <strong>Venta potencial</strong> = lo que recibirías si vendes todo el stock al precio de venta.<br/>
              <strong>Utilidad potencial</strong> = la ganancia que tendrías si vendes todo.<br/>
              <strong>Margen %</strong> = qué porcentaje de cada venta es ganancia pura.
            </div>
          </Card>
          {inv.filter(i=>i.salePrice>0||i.costUnit>0).sort((a,b)=>{
            const ua = (a.salePrice-a.costUnit)*a.stock;
            const ub = (b.salePrice-b.costUnit)*b.stock;
            return ub-ua;
          }).map(item=>{
            const invertido  = (item.costUnit||0)*item.stock;
            const ventaPot   = (item.salePrice||0)*item.stock;
            const utilPot    = ventaPot - invertido;
            const margen     = ventaPot>0 ? Math.round((utilPot/ventaPot)*100) : 0;
            const utilUnit   = (item.salePrice||0)-(item.costUnit||0);
            return (
              <Card key={item.id} style={{marginBottom:10,borderLeft:`3px solid ${utilPot>0?C.green:utilPot<0?C.red:C.muted}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:800,fontSize:15,marginBottom:6}}>{item.name}</div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:8}}>
                      <div style={{background:C.surfaceAlt,borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
                        <div style={{fontSize:10,color:C.muted,fontWeight:700,textTransform:"uppercase"}}>Stock</div>
                        <div style={{fontWeight:800,fontSize:14}}>{item.stock} {item.unit}</div>
                      </div>
                      <div style={{background:C.orangeBg,borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
                        <div style={{fontSize:10,color:C.orange,fontWeight:700,textTransform:"uppercase"}}>Invertido</div>
                        <div style={{fontWeight:800,fontSize:14,color:C.orange}}>{cur(invertido)}</div>
                        <div style={{fontSize:10,color:C.muted}}>{cur(item.costUnit)}/u</div>
                      </div>
                      <div style={{background:C.accentBg,borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
                        <div style={{fontSize:10,color:C.accentD,fontWeight:700,textTransform:"uppercase"}}>Venta potencial</div>
                        <div style={{fontWeight:800,fontSize:14,color:C.accentD}}>{cur(ventaPot)}</div>
                        <div style={{fontSize:10,color:C.muted}}>{cur(item.salePrice)}/u</div>
                      </div>
                      <div style={{background:utilPot>=0?C.greenBg:C.redBg,borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
                        <div style={{fontSize:10,color:utilPot>=0?C.green:C.red,fontWeight:700,textTransform:"uppercase"}}>Utilidad potencial</div>
                        <div style={{fontWeight:800,fontSize:16,color:utilPot>=0?C.green:C.red}}>{cur(utilPot)}</div>
                        <div style={{fontSize:10,color:C.muted}}>{cur(utilUnit)}/u · {margen}% margen</div>
                      </div>
                    </div>
                    {/* Barra de margen */}
                    {ventaPot>0&&<div style={{marginTop:10}}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.muted,marginBottom:3}}>
                        <span>Costo {100-margen}%</span><span>Ganancia {margen}%</span>
                      </div>
                      <div style={{height:8,background:C.orangeBg,borderRadius:4,overflow:"hidden"}}>
                        <div style={{height:8,background:C.green,borderRadius:4,width:`${Math.max(0,margen)}%`,transition:"width .4s"}}/>
                      </div>
                    </div>}
                  </div>
                </div>
              </Card>
            );
          })}
          {inv.filter(i=>!i.salePrice&&!i.costUnit).length>0&&(
            <div style={{color:C.muted,fontSize:13,textAlign:"center",padding:16}}>
              {inv.filter(i=>!i.salePrice&&!i.costUnit).length} producto(s) sin precios — edítalos para verlos aquí
            </div>
          )}
        </div>
      )}

      {/* VISTA LISTA */}
      {vista==="lista"&&(<>
        {bajoStock.length>0&&(
          <div style={{background:C.redBg,border:`1px solid ${C.red}33`,borderRadius:12,padding:"14px 18px",marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:8}}>
              <div style={{fontWeight:700,color:C.red}}>⚠ Stock bajo ({bajoStock.length})</div>
              <Btn ch="📋 Generar OC" v="danger" sm onClick={()=>{
                const folio = `OC-${String((ocs.length||0)+1).padStart(3,"0")}`;
                const items = bajoStock.map(i=>({
                  invId:i.id, name:i.name, unit:i.unit,
                  stockActual:i.stock, minStock:i.minStock,
                  cantSugerida:Math.max(1,(i.minStock*2)-i.stock),
                  provId:i.provId||"", provName:(provs.find(p=>p.id===i.provId)||{name:"Sin proveedor"}).name
                }));
                const oc = {id:_ocid++,folio,fecha:tod2,status:"pendiente",items};
                setOcs(p=>[oc,...p]);
                setVista("ocs");
                fireToast(`✅ ${folio} generada con ${items.length} productos`);
              }}/>
            </div>
            {bajoStock.map(i=>{
              const prov = provs.find(p=>p.id===i.provId);
              return (
                <div key={i.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:`1px solid ${C.red}22`,fontSize:13,flexWrap:"wrap",gap:6}}>
                  <div>
                    <strong>{i.name}</strong>
                    <span style={{color:C.red,marginLeft:8}}>{i.stock} {i.unit} (mín. {i.minStock})</span>
                    {prov&&<span style={{color:C.muted,marginLeft:8,fontSize:12}}>🏢 {prov.name}</span>}
                  </div>
                  <Btn ch="+ Recibir" v="danger" sm onClick={()=>{setSel(i);setModal("recibir");}}/>

        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar producto..." style={{width:"100%",background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:10,padding:"10px 16px",color:C.text,fontSize:14,fontFamily:"inherit",marginBottom:10,boxSizing:"border-box"}}/>

          {["todos",...INV_CATS].map(c=>(
