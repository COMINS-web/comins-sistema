function CalSemana({svcs, allSvcs, weekStart, onPrev, onNext, onSvcClick, tod2}) {
  const DIAS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const HORA_INI=7, HORA_FIN=20, TOTAL_HORAS=HORA_FIN-HORA_INI;
  const PX_POR_HORA=64;
  const TOTAL_PX=TOTAL_HORAS*PX_POR_HORA;

  const fechas=DIAS.map((_,i)=>{ const d=new Date(weekStart); d.setDate(weekStart.getDate()+i); return d; });
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const hoy=today;
  const horas=Array.from({length:TOTAL_HORAS+1},(_,i)=>i+HORA_INI);

  // Parsea hora en formato "HH:MM" o "H:MM a. m./p. m." → minutos desde medianoche
  const parseTimeToMins=(t)=>{
    if(!t) return 9*60; // default 9am
    const tl=t.toLowerCase().replace(/\s/g,"");
    const isPm=tl.includes("p.m.")||tl.includes("pm");
    const isAm=tl.includes("a.m.")||tl.includes("am");
    const clean=tl.replace(/[apm\. ]/g,"");
    const parts=clean.split(":");
    let h=parseInt(parts[0])||0;
    const m=parseInt(parts[1])||0;
    if(isPm&&h!==12) h+=12;
    if(isAm&&h===12) h=0;
    return h*60+m;
  };
  const timeToPx=(t)=>{
    if(!t) return 0;
    const mins=parseTimeToMins(t);
    const h=Math.floor(mins/60);
    const m=mins%60;
    // Clamp al rango visible: si está fuera coloca al inicio o al final
    const clampedH=Math.max(HORA_INI,Math.min(h,HORA_FIN-1));
    return ((clampedH-HORA_INI)*60+m)/60*PX_POR_HORA;
  };
  const durationPx=(t1,t2)=>{
    if(!t1) return PX_POR_HORA*2;
    const startMins=parseTimeToMins(t1);
    const startH=Math.floor(startMins/60);
    const clampedStart=Math.max(HORA_INI,Math.min(startH,HORA_FIN-1));
    const topPx=((clampedStart-HORA_INI)*60+(startMins%60))/60*PX_POR_HORA;
    let endPx;
    if(t2) {
      const endMins=parseTimeToMins(t2);
      const endH=Math.floor(endMins/60);
      if(endMins<=startMins) {
        endPx=topPx+PX_POR_HORA;
      } else {
        const clampedEnd=Math.min(endH,HORA_FIN);
        endPx=((clampedEnd-HORA_INI)*60+(endMins%60))/60*PX_POR_HORA;
      }
    } else {
      endPx=topPx+PX_POR_HORA*2;
    }
    return Math.max(24, Math.min(endPx,TOTAL_HORAS*PX_POR_HORA)-topPx);
  };

  // Calcular solapamientos — algoritmo correcto: comparar contra TODOS los eventos de cada columna
  const calcLayout=(events)=>{
    const timed=events.filter(e=>e.time);
    // Ordenar por hora de inicio
    const sorted=[...timed].sort((a,b)=>timeToPx(a.time)-timeToPx(b.time));
    const cols=[]; // cols[i] = array de {top, bot}
    const layout={};
    sorted.forEach(e=>{
      const top=timeToPx(e.time);
      const bot=top+durationPx(e.time,e.timeFin);
      // Buscar la primera columna donde NO haya solapamiento con ningún evento
      let placed=false;
      for(let ci=0;ci<cols.length;ci++){
        const overlap=cols[ci].some(seg=>top<seg.bot&&bot>seg.top);
        if(!overlap){ cols[ci].push({top,bot,key:e.id+"_"+e._role}); placed=true; layout[e.id+"_"+e._role]={ci}; break; }
      }
      if(!placed){ cols.push([{top,bot,key:e.id+"_"+e._role}]); layout[e.id+"_"+e._role]={ci:cols.length-1}; }
    });
    const total=cols.length;
    // Asignar total a cada evento
    sorted.forEach(e=>{ if(layout[e.id+"_"+e._role]) layout[e.id+"_"+e._role].total=total; });
    return layout;
  };

  // Hora actual
  const now2=new Date();
  const nowPx=((now2.getHours()-HORA_INI)*60+now2.getMinutes())/60*PX_POR_HORA;
  const showNowLine=now2.getHours()>=HORA_INI&&now2.getHours()<HORA_FIN;

  return (
    <div style={{background:"#fff",borderRadius:16,border:`1px solid ${C.border}`,fontFamily:"inherit",position:"relative"}}>
      {/* ── Toolbar ── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 16px",borderBottom:`1px solid ${C.border}`,background:"#fff",borderRadius:"16px 16px 0 0"}}>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <button onClick={onPrev} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:6,width:30,height:30,cursor:"pointer",fontSize:16,color:C.sub,display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
          <button onClick={onNext} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:6,width:30,height:30,cursor:"pointer",fontSize:16,color:C.sub,display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
          <span style={{fontWeight:700,fontSize:15,color:C.text,marginLeft:6}}>
            {fechas[0].toLocaleDateString("es-MX",{day:"numeric",month:"long"})} – {fechas[6].toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}
          </span>
        </div>
        <div style={{fontSize:12,color:C.muted}}>{svcs.filter(s=>fechas.some(f=>fmt(f)===s.date||fmt(f)===(s.tallerIngreso||""))).length} eventos esta semana</div>
      </div>

      {/* ── Header días ── */}
      <div style={{display:"grid",gridTemplateColumns:"52px repeat(7,1fr)",borderBottom:`1px solid ${C.border}`,background:"#fff",position:"sticky",top:0,zIndex:10}}>
        <div style={{borderRight:`1px solid ${C.border}`}}/>
        {fechas.map((d,i)=>{
          const fd=fmt(d);
          const isHoy=fd===hoy;
          const count=getEventosParaFecha(svcs,fd,tod2).length;
          return (
            <div key={i} style={{textAlign:"center",padding:"8px 4px",borderRight:`1px solid ${C.border}`}}>
              <div style={{fontSize:11,fontWeight:600,color:isHoy?C.accent:C.muted,textTransform:"uppercase",letterSpacing:.5}}>{DIAS[i]}</div>
              <div style={{width:34,height:34,borderRadius:"50%",background:isHoy?C.accent:"transparent",color:isHoy?"#fff":C.text,fontWeight:800,fontSize:20,display:"flex",alignItems:"center",justifyContent:"center",margin:"2px auto 0",transition:"background .15s"}}>
                {d.getDate()}
              </div>
              {count>0&&<div style={{fontSize:9,color:isHoy?C.accent:C.muted,marginTop:2,fontWeight:600}}>{count} evento{count>1?"s":""}</div>}
            </div>
          );
        })}
      </div>

      {/* ── Eventos all-day (seguimientos) ── */}
      {(()=>{
        const hayAlldDay=fechas.some(d=>getEventosParaFecha(svcs,fmt(d),tod2).some(e=>e._role==="seguimiento"||e._role==="reagenda"||(!e.time&&e._role!=="seguimiento")));
        if(!hayAlldDay) return null;
        return (
          <div style={{display:"grid",gridTemplateColumns:"52px repeat(7,1fr)",borderBottom:`1px solid ${C.border}`,background:"#FAFAFA",minHeight:28}}>
            <div style={{borderRight:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:6}}>
              <span style={{fontSize:9,color:C.muted,fontWeight:600}}>TODO EL DÍA</span>
            </div>
            {fechas.map((d,i)=>{
              const fd=fmt(d);
              const allDay=getEventosParaFecha(svcs,fd,tod2).filter(e=>e._role==="seguimiento"||e._role==="reagenda"||!e.time);
              // Deduplicar: si un cliente tiene múltiples seguimientos vencidos,
              // mostrar solo uno (el más antiguo pendiente)
              const seen={};
              const deduped=allDay.filter(e=>{
                if(e._role!=="seguimiento") return true;
                const key=e.phone||e.client;
                if(seen[key]) return false;
                seen[key]=true;
                return true;
              });
              return (
                <div key={i} style={{borderRight:`1px solid ${C.border}`,padding:"2px 3px",minHeight:28}}>
                  {deduped.map((e,ei)=>(
                    <ChipEvento key={e.id+"_"+e._role+"_"+ei} svc={e} onClick={onSvcClick}/>
                  ))}
                </div>
              );
            })}
          </div>
        );
      })()}

      {/* ── Grid de horas ── */}
      <div style={{overflowY:"auto",maxHeight:560}}>
        <div style={{display:"grid",gridTemplateColumns:"52px repeat(7,1fr)",position:"relative",minHeight:TOTAL_PX}}>
          {/* Líneas de hora */}
          <div style={{position:"relative"}}>
            {horas.map(h=>(
              <div key={h} style={{height:PX_POR_HORA,display:"flex",alignItems:"flex-start",justifyContent:"flex-end",paddingRight:8,paddingTop:2,boxSizing:"border-box",borderRight:`1px solid ${C.border}`}}>
                {h<HORA_FIN&&<span style={{fontSize:10,color:C.muted,fontWeight:500,whiteSpace:"nowrap"}}>{h}:00</span>}
              </div>
            ))}
          </div>

          {/* Columnas de días */}
          {fechas.map((d,di)=>{
            const fd=fmt(d);
            const isHoy=fd===hoy;
            const eventos=getEventosParaFecha(svcs,fd,tod2).filter(e=>e._role!=="seguimiento"&&e._role!=="reagenda").map(e=>{
              // Normalizar hora a formato HH:MM 24h para cálculos
              const mins=parseTimeToMins(e.time||"09:00");
              const h=String(Math.floor(mins/60)).padStart(2,"0");
              const m=String(mins%60).padStart(2,"0");
              const timeNorm=h+":"+m;
              let timeFinNorm="";
              if(e.timeFin) {
                const mf=parseTimeToMins(e.timeFin);
                timeFinNorm=String(Math.floor(mf/60)).padStart(2,"0")+":"+String(mf%60).padStart(2,"0");
              }
              return {...e, time:timeNorm, timeFin:timeFinNorm};
            });
            const layout=calcLayout(eventos);
            return (
              <div key={di} style={{position:"relative",borderRight:`1px solid ${C.border}`,background:isHoy?"#F8FBFF":"transparent"}}>
                {/* Líneas horizontales */}
                {horas.map(h=>(
                  <div key={h} style={{height:PX_POR_HORA,borderBottom:`1px solid ${C.border}22`,boxSizing:"border-box",position:"relative"}}>
                    <div style={{position:"absolute",top:"50%",left:0,right:0,height:1,background:`${C.border}44`}}/>
                  </div>
                ))}

                {/* Línea hora actual */}
                {isHoy&&showNowLine&&nowPx>=0&&nowPx<=TOTAL_PX&&(
                  <div style={{position:"absolute",top:nowPx,left:0,right:0,zIndex:5,pointerEvents:"none"}}>
                    <div style={{display:"flex",alignItems:"center"}}>
                      <div style={{width:10,height:10,borderRadius:"50%",background:C.red,flexShrink:0,marginLeft:-5}}/>
                      <div style={{flex:1,height:2,background:C.red}}/>
                    </div>
                  </div>
                )}

                {/* Eventos con horario */}
                {eventos.map(e=>{
                  const key=e.id+"_"+e._role;
                  const top=timeToPx(e.time);
                  const h=Math.max(24,durationPx(e.time,e.timeFin));
                  const lyt=layout[key]||{ci:0,total:1};
                  const total=lyt.total||1;
                  const ci=lyt.ci||0;
                  // Estilo Google Calendar: cada evento ocupa casi el ancho completo
                  // pero se desplaza en cascada — no dividen el ancho igual
                  const OFFSET=12; // px de desplazamiento por nivel
                  const w=total===1?"calc(100% - 6px)":`calc(100% - ${ci*OFFSET+8}px)`;
                  const l=total===1?"3px":(ci*OFFSET+2)+"px";
                  const zIdx=4+ci; // los de encima tienen más z-index
                  return (
                    <div key={key} style={{position:"absolute",top:top+"px",left:l,width:w,height:h+"px",zIndex:zIdx}}>
                      <BloqueEvento svc={e} onClick={onSvcClick} style={{height:h+"px"}}/>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function CalMes({svcs, allSvcs, month, year, onPrev, onNext, onSvcClick, tod2}) {
  const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const DIAS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];

  const firstDay=new Date(year,month,1);
  const lastDay=new Date(year,month+1,0);
  const startDow=firstDay.getDay()===0?6:firstDay.getDay()-1;
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=lastDay.getDate();d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  const fmt=(d)=>`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

  return (
    <div style={{background:"#fff",borderRadius:16,border:`1px solid ${C.border}`,fontFamily:"inherit",position:"relative"}}>
      {/* ── Toolbar ── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 18px",borderBottom:`1px solid ${C.border}`}}>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <button onClick={onPrev} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:6,width:30,height:30,cursor:"pointer",fontSize:16,color:C.sub,display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
          <button onClick={onNext} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:6,width:30,height:30,cursor:"pointer",fontSize:16,color:C.sub,display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
          <span style={{fontWeight:800,fontSize:18,color:C.text,marginLeft:6}}>{MESES[month]} {year}</span>
        </div>
        <div style={{fontSize:12,color:C.muted}}>{svcs.filter(s=>{const d=s.date||"";return d.startsWith(year+"-"+String(month+1).padStart(2,"0"));}).length} servicios este mes</div>
      </div>

      {/* ── Header días ── */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",background:"#FAFAFA",borderBottom:`1px solid ${C.border}`}}>
        {DIAS.map((d,i)=>(
          <div key={d} style={{textAlign:"center",padding:"8px 0",fontSize:11,fontWeight:700,color:i>=5?C.accent:C.muted,textTransform:"uppercase",letterSpacing:.5}}>{d}</div>
        ))}
      </div>

      {/* ── Celdas ── */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)"}}>
        {cells.map((d,i)=>{
          if(!d) return (
            <div key={i} style={{minHeight:100,background:"#FAFAFA",borderBottom:`1px solid ${C.border}`,borderRight:`1px solid ${C.border}`}}/>
          );
          const fd=fmt(d);
          const isHoy=fd===today;
          const eventos=getEventosParaFecha(svcs,fd,tod2).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
          const MAX_VISIBLE=3;
          const visible=eventos.slice(0,MAX_VISIBLE);
          const resto=eventos.length-MAX_VISIBLE;
          const isSat=i%7===6;
          const isSun=i%7===5;
          return (
            <div key={i} style={{minHeight:100,borderBottom:`1px solid ${C.border}`,borderRight:`1px solid ${C.border}`,padding:"4px 3px",background:isHoy?"#EFF6FF":"transparent",position:"relative"}}>
              {/* Número de día */}
              <div style={{display:"flex",justifyContent:"flex-end",marginBottom:2}}>
                <div style={{
                  width:26,height:26,borderRadius:"50%",
                  background:isHoy?C.accent:"transparent",
                  color:isHoy?"#fff":isSat||isSun?"#3B82F6":C.text,
                  fontWeight:isHoy?800:600,fontSize:13,
                  display:"flex",alignItems:"center",justifyContent:"center",
                }}>{d}</div>
              </div>
              {/* Eventos */}
              {visible.map((e,ei)=>(
                <ChipEvento key={e.id+"_"+e._role+"_"+ei} svc={e} onClick={onSvcClick}/>
              ))}
              {resto>0&&(
                <div style={{fontSize:10,color:C.accent,fontWeight:700,padding:"1px 4px",cursor:"pointer",borderRadius:4,background:C.accentBg}}>
                  +{resto} más
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}


function CatManager({incCats, expCats, txns, onSaveInc, onSaveExp, onClose, onRename}) {
  const [tipo, setTipo] = useState("egreso");
  const cats = tipo==="ingreso" ? incCats : expCats;
  const saveCats = tipo==="ingreso" ? onSaveInc : onSaveExp;

  const [nueva, setNueva] = useState("");
  const [editIdx, setEditIdx] = useState(null);
  const [editVal, setEditVal] = useState("");
  const [confirmDel, setConfirmDel] = useState(null);
  const [confirmRen, setConfirmRen] = useState(null);
  const [destino, setDestino] = useState("");

  // Conteo robusto: trim + comparación directa
  const countTxns = (cat) => {
    const c = cat.trim();
    return txns.filter(t=>(t.category||"").trim()===c).length;
  };

  const mover = (i, dir) => {
    const j = i+dir;
    if(j<0||j>=cats.length) return;
    const arr=[...cats];
    const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    saveCats(arr);
  };

  const agregar = () => {
    const v = nueva.trim();
    if(!v) return fireToast("⚠ Escribe el nombre");
    if(cats.map(c=>c.trim().toLowerCase()).includes(v.toLowerCase())) return fireToast("⚠ Ya existe esa categoría");
    saveCats([...cats, v]);
    setNueva("");
    fireToast("✅ Categoría agregada");
  };

  const iniciarEdicion = (i) => { setEditIdx(i); setEditVal(cats[i]); };

  const guardarEdicion = (i) => {
    const newName = editVal.trim();
    if(!newName) { setEditIdx(null); return fireToast("⚠ El nombre no puede estar vacío"); }
    if(newName===cats[i]) { setEditIdx(null); return; }
    if(cats.filter((_,j)=>j!==i).map(c=>c.trim().toLowerCase()).includes(newName.toLowerCase())) {
      setEditIdx(null); return fireToast("⚠ Ya existe esa categoría");
    }
    const n = countTxns(cats[i]);
    setEditIdx(null);
    if(n>0) {
      setConfirmRen({idx:i, oldName:cats[i], newName, count:n});
    } else {
      aplicarRename(i, cats[i], newName, 0);
    }
  };

  const aplicarRename = (idx, oldName, newName, count) => {
    const newCats = cats.map((c,i)=>i===idx?newName:c);
    saveCats(newCats);
    onRename(oldName, newName);
    fireToast("✅ \""+oldName+"\" → \""+newName+"\""+(count>0?" · "+count+" movimientos actualizados":""));
    setConfirmRen(null);
  };

  const iniciarEliminar = (i) => {
    const protegidas = ["Capital / Apertura de caja","Otros","Retiro de socio / Utilidades"];
    if(protegidas.includes(cats[i])) return fireToast("⚠ Categoría protegida — no se puede eliminar");
    const n = countTxns(cats[i]);
    setDestino("");
    setConfirmDel({idx:i, cat:cats[i], count:n});
  };

  const aplicarEliminar = () => {
    const {idx, cat, count} = confirmDel;
    if(count>0) {
      if(!destino) return fireToast("⚠ Selecciona la categoría destino");
      onRename(cat, destino);
    }
    saveCats(cats.filter((_,i)=>i!==idx));
    setConfirmDel(null);
    fireToast("✅ Categoría eliminada"+(count>0?" · "+count+" movimientos movidos a \""+destino+"\"":""));
  };

  return (
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"#00000055",zIndex:1100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:"#fff",borderRadius:18,padding:28,width:"100%",maxWidth:500,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 20px 60px #00000022"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div style={{fontWeight:800,fontSize:17}}>⚙ Categorías de Finanzas</div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#94A3B8",fontSize:24,cursor:"pointer",lineHeight:1}}>×</button>
        </div>

        {/* Toggle tipo */}
        <div style={{display:"flex",gap:8,marginBottom:20}}>
          {[{v:"egreso",l:"🔴 Egresos"},{v:"ingreso",l:"💚 Ingresos"}].map(t=>(
            <button key={t.v} onClick={()=>{setTipo(t.v);setEditIdx(null);setConfirmDel(null);setConfirmRen(null);}} style={{flex:1,background:tipo===t.v?(t.v==="ingreso"?C.greenBg:C.redBg):"transparent",border:`2px solid ${tipo===t.v?(t.v==="ingreso"?C.green:C.red):C.border}`,color:tipo===t.v?(t.v==="ingreso"?C.green:C.red):C.sub,borderRadius:10,padding:"10px",fontSize:13,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>
              {t.l}
            </button>
          ))}
        </div>

        <div style={{fontSize:11,color:C.muted,marginBottom:10}}>
          Usa ↑↓ para reordenar · ✏ para renombrar · 🗑 para eliminar
        </div>

        {/* Lista */}
        <div style={{marginBottom:16}}>
          {cats.map((cat,i)=>{
            const n = countTxns(cat);
            const protegida = ["Capital / Apertura de caja","Otros","Retiro de socio / Utilidades"].includes(cat);
            const editando = editIdx===i;
            return (
              <div key={cat+i} style={{display:"flex",alignItems:"center",gap:6,padding:"9px 10px",borderRadius:10,background:editando?C.accentBg:i%2===0?C.surfaceAlt:"#fff",marginBottom:4,border:editando?`1.5px solid ${C.accent}`:"1.5px solid transparent",transition:"background .1s"}}>
                {/* Botones reordenar */}
                {!editando&&(
                  <div style={{display:"flex",flexDirection:"column",gap:1,flexShrink:0}}>
                    <button onClick={()=>mover(i,-1)} disabled={i===0} style={{background:"none",border:"none",color:i===0?C.border:C.muted,cursor:i===0?"default":"pointer",fontSize:11,lineHeight:1,padding:"1px 3px"}}>▲</button>
                    <button onClick={()=>mover(i,1)} disabled={i===cats.length-1} style={{background:"none",border:"none",color:i===cats.length-1?C.border:C.muted,cursor:i===cats.length-1?"default":"pointer",fontSize:11,lineHeight:1,padding:"1px 3px"}}>▼</button>
                  </div>
                )}
                {editando ? (
                  <>
                    <input value={editVal} onChange={e=>setEditVal(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter")guardarEdicion(i);if(e.key==="Escape")setEditIdx(null);}}
                      autoFocus style={{flex:1,border:`1.5px solid ${C.accent}`,borderRadius:8,padding:"6px 10px",fontSize:13,fontFamily:"inherit",background:"#fff"}}/>
                    <button onClick={()=>guardarEdicion(i)} style={{background:C.accent,color:"#fff",border:"none",borderRadius:7,padding:"5px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>✓ Guardar</button>
                    <button onClick={()=>setEditIdx(null)} style={{background:C.surfaceAlt,color:C.muted,border:"none",borderRadius:7,padding:"5px 10px",fontSize:12,cursor:"pointer"}}>✕</button>
                  </>
                ) : (
                  <>
                    <span style={{flex:1,fontSize:13,fontWeight:600,color:C.text}}>{cat}</span>
                    {protegida&&<span style={{fontSize:9,color:C.muted,background:C.surfaceAlt,borderRadius:4,padding:"1px 5px",flexShrink:0}}>protegida</span>}
                    <span style={{fontSize:11,color:n>0?C.accentD:C.border,background:n>0?C.accentBg:C.surfaceAlt,borderRadius:6,padding:"2px 7px",fontWeight:700,minWidth:28,textAlign:"center",flexShrink:0}}>{n}</span>
                    <button onClick={()=>iniciarEdicion(i)} title="Renombrar" style={{background:C.accentBg,color:C.accentD,border:"none",borderRadius:7,padding:"5px 9px",fontSize:12,cursor:"pointer",flexShrink:0}}>✏</button>
                    {!protegida&&<button onClick={()=>iniciarEliminar(i)} title="Eliminar" style={{background:C.redBg,color:C.red,border:"none",borderRadius:7,padding:"5px 9px",fontSize:12,cursor:"pointer",flexShrink:0}}>🗑</button>}
                  </>
                )}
              </div>
            );
          })}
        </div>

        {/* Nueva categoría */}
        <div style={{background:C.surfaceAlt,borderRadius:12,padding:"12px 14px",border:`1.5px dashed ${C.border}`}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:8}}>+ NUEVA CATEGORÍA</div>
          <div style={{display:"flex",gap:8}}>
            <input value={nueva} onChange={e=>setNueva(e.target.value)} onKeyDown={e=>e.key==="Enter"&&agregar()}
              placeholder="Ej: Viáticos, Comisiones..."
              style={{flex:1,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"8px 12px",fontSize:13,fontFamily:"inherit",background:"#fff",color:C.text}}/>
            <button onClick={agregar} style={{background:C.accent,color:"#fff",border:"none",borderRadius:8,padding:"8px 18px",fontSize:13,fontWeight:700,cursor:"pointer"}}>Agregar</button>
          </div>
        </div>

        {/* ── Confirm eliminar ── */}
        {confirmDel&&(
          <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"#00000066",zIndex:1200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
            <div style={{background:"#fff",borderRadius:16,padding:28,maxWidth:420,width:"100%",boxShadow:"0 20px 60px #00000033"}}>
              <div style={{fontSize:28,textAlign:"center",marginBottom:10}}>🗑</div>
              <div style={{fontWeight:700,fontSize:15,color:C.text,marginBottom:12,textAlign:"center"}}>Eliminar "{confirmDel.cat}"</div>
              {confirmDel.count>0 ? (
                <>
                  <div style={{background:C.orangeBg,borderRadius:10,padding:"12px 14px",marginBottom:14,fontSize:13,color:C.orange,lineHeight:1.6}}>
                    ⚠ Tiene <strong>{confirmDel.count} movimiento(s)</strong> registrados.<br/>Elige a dónde moverlos antes de eliminar:
                  </div>
                  <Lbl t="Mover movimientos a:"/>
                  <select value={destino} onChange={e=>setDestino(e.target.value)}
                    style={{width:"100%",background:C.surfaceAlt,border:`1.5px solid ${destino?C.accent:C.border}`,borderRadius:8,padding:"9px 13px",fontSize:13,fontFamily:"inherit",marginBottom:16,boxSizing:"border-box"}}>
                    <option value="">— Seleccionar categoría destino —</option>
                    {cats.filter(c=>c!==confirmDel.cat).map(c=><option key={c} value={c}>{c} ({countTxns(c)} mov.)</option>)}
                  </select>
                  <div style={{display:"flex",gap:10}}>
                    <button onClick={()=>setConfirmDel(null)} style={{flex:1,background:C.surfaceAlt,border:"none",borderRadius:8,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer",color:C.sub}}>Cancelar</button>
                    <button onClick={aplicarEliminar} style={{flex:1,background:C.red,border:"none",borderRadius:8,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer",color:"#fff"}}>Mover y eliminar</button>
                  </div>
                </>
              ) : (
                <>
                  <div style={{fontSize:13,color:C.muted,textAlign:"center",marginBottom:20}}>Sin movimientos. Se eliminará sin afectar registros.</div>
                  <div style={{display:"flex",gap:10}}>
                    <button onClick={()=>setConfirmDel(null)} style={{flex:1,background:C.surfaceAlt,border:"none",borderRadius:8,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer",color:C.sub}}>Cancelar</button>
                    <button onClick={aplicarEliminar} style={{flex:1,background:C.red,border:"none",borderRadius:8,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer",color:"#fff"}}>Eliminar</button>
                  </div>
                </>
              )}
            </div>
          </div>
        )}

        {/* ── Confirm renombrar ── */}
        {confirmRen&&(
          <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"#00000066",zIndex:1200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
            <div style={{background:"#fff",borderRadius:16,padding:28,maxWidth:420,width:"100%",boxShadow:"0 20px 60px #00000033"}}>
              <div style={{fontSize:28,textAlign:"center",marginBottom:10}}>✏</div>
              <div style={{fontWeight:700,fontSize:15,color:C.text,marginBottom:12,textAlign:"center"}}>Confirmar renombre</div>
              <div style={{background:C.accentBg,borderRadius:10,padding:"14px 16px",marginBottom:16,fontSize:13,color:C.accentD,lineHeight:1.8}}>
                <div><strong>Antes:</strong> {confirmRen.oldName}</div>
                <div><strong>Después:</strong> {confirmRen.newName}</div>
                <div style={{marginTop:6,fontWeight:700}}>Se actualizarán {confirmRen.count} movimiento(s) existentes.</div>
              </div>
              <div style={{display:"flex",gap:10}}>
                <button onClick={()=>setConfirmRen(null)} style={{flex:1,background:C.surfaceAlt,border:"none",borderRadius:8,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer",color:C.sub}}>Cancelar</button>
                <button onClick={()=>aplicarRename(confirmRen.idx,confirmRen.oldName,confirmRen.newName,confirmRen.count)} style={{flex:1,background:C.accent,border:"none",borderRadius:8,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer",color:"#fff"}}>✓ Confirmar</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── GOOGLE CALENDAR INTEGRATION ─────────────────────────────────
const GCAL_CLIENT_ID = "618138954278-d9oa2ski7ql6csumemaarhcjk0k7q0ld.apps.googleusercontent.com";
const GCAL_SCOPE     = "https://www.googleapis.com/auth/calendar.events";
const GCAL_STORE_KEY = "comins:gcal_token";

function loadGisScript() {
  return new Promise((resolve) => {
    if(window.google && window.google.accounts) { resolve(); return; }
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = resolve;
    document.head.appendChild(s);
  });
}

function useGoogleCal() {
  const [token,    setToken]    = useState(()=>{ try{ return JSON.parse(localStorage.getItem(GCAL_STORE_KEY)||"null"); }catch(e){ return null; } });
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState("");

  const isConnected = !!(token && token.access_token && token.expires_at > Date.now());

  const connect = async () => {
    setLoading(true); setError("");
    try {
      await loadGisScript();
      await new Promise((resolve, reject) => {
        const client = window.google.accounts.oauth2.initTokenClient({
          client_id: GCAL_CLIENT_ID,
          scope: GCAL_SCOPE,
          callback: (resp) => {
            if(resp.error) { reject(resp.error); return; }
            const t = {
              access_token: resp.access_token,
              expires_at:   Date.now() + (parseInt(resp.expires_in||3600)-60)*1000,
            };
            setToken(t);
            try{ localStorage.setItem(GCAL_STORE_KEY, JSON.stringify(t)); }catch(e){}
            resolve();
          },
        });
        client.requestAccessToken();
      });
    } catch(e) {
      setError("Error al conectar: "+(e.message||e));
    }
    setLoading(false);
  };

  const disconnect = () => {
    setToken(null);
    try{ localStorage.removeItem(GCAL_STORE_KEY); }catch(e){}
    if(window.google && window.google.accounts && window.google.accounts.oauth2) {
      try{ window.google.accounts.oauth2.revoke(token.access_token, ()=>{}); }catch(e){}
    }
  };

  // Asegurar que el token sigue válido antes de cada llamada
  const getToken = async () => {
    if(!token || !token.access_token) return null;
    if(token.expires_at < Date.now()) {
      // Token expirado — pedir nuevo silenciosamente
      await connect();
      return null; // el estado se actualiza async, siguiente llamada lo tendrá
    }
    return token.access_token;
  };

  // Construye el evento de Google Calendar desde un servicio SJR
  const svcToGcalEvent = (svc) => {
    const parseM = (t) => {
      if(!t) return {h:9,m:0};
      const tl=t.toLowerCase().replace(/\s/g,"");
      const isPm=tl.includes("p.m.")||tl.includes("pm");
      const isAm=tl.includes("a.m.")||tl.includes("am");
      const clean=tl.replace(/[apm\. ]/g,"");
      const parts=clean.split(":");
      let h=parseInt(parts[0])||0;
      const mn=parseInt(parts[1])||0;
      if(isPm&&h!==12) h+=12;
      if(isAm&&h===12) h=0;
      return {h,m:mn};
    };
    const date = svc.date || today;
    const s = parseM(svc.time);
    const e = svc.timeFin ? parseM(svc.timeFin) : {h:s.h+2, m:s.m};
    const pad = n => String(n).padStart(2,"0");
    const startDt = date+"T"+pad(s.h)+":"+pad(s.m)+":00";
    const endDt   = date+"T"+pad(e.h)+":"+pad(e.m)+":00";
    const status  = SVC_STATUS[svc.status] ? SVC_STATUS[svc.status].label : svc.status;
    const desc = [
      "Folio: "+(svc.folio||""),
      "Técnico: "+(svc.tech||"")+(svc.helper?" / "+svc.helper:""),
      "Tel: "+(svc.phone||""),
      "Estado: "+status,
      svc.quotePrice>0?"Cotizado: $"+svc.quotePrice:"",
      svc.notes?"Notas: "+svc.notes:"",
      "",
      "MULTISERVICIOS SJR",
    ].filter(Boolean).join("\n");
    return {
      summary: (svc.folio||"SV")+" — "+svc.client+" ("+svc.type+")",
      location: svc.address||"",
      description: desc,
      start: {dateTime: startDt, timeZone:"America/Monterrey"},
      end:   {dateTime: endDt,   timeZone:"America/Monterrey"},
      colorId: svc.status==="completado"?"2":svc.status==="cancelado"?"4":svc.status==="en_taller"?"7":svc.status==="urgente"?"11":"1",
    };
  };

  // Crear o actualizar evento
  const syncEvent = async (svc) => {
    const tk = await getToken();
    if(!tk) return null;
    try {
      const event = svcToGcalEvent(svc);
      // Si ya tiene gcalEventId → actualizar (PATCH), si no → crear (POST)
      const existing = svc.gcalEventId;
      const url = existing
        ? "https://www.googleapis.com/calendar/v3/calendars/primary/events/"+existing
        : "https://www.googleapis.com/calendar/v3/calendars/primary/events";
      const method = existing ? "PATCH" : "POST";
      const res = await fetch(url, {
        method,
        headers: {"Authorization":"Bearer "+tk, "Content-Type":"application/json"},
        body: JSON.stringify(event),
      });
      if(!res.ok) {
        const err = await res.json();
        // Si 404 (evento borrado en GCal) → crear nuevo
        if(res.status===404) {
          const res2 = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events",{
            method:"POST",
            headers:{"Authorization":"Bearer "+tk,"Content-Type":"application/json"},
            body:JSON.stringify(event),
          });
          if(!res2.ok) return null;
          const data2 = await res2.json();
          return data2.id;
        }
        console.error("GCal error:", err);
        return null;
      }
      const data = await res.json();
      return data.id;
    } catch(e) {
      console.error("GCal sync error:", e);
      return null;
    }
  };

  // Eliminar evento
  const deleteEvent = async (gcalEventId) => {
    const tk = await getToken();
    if(!tk || !gcalEventId) return;
    try {
      await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+gcalEventId, {
        method:"DELETE",
        headers:{"Authorization":"Bearer "+tk},
      });
    } catch(e) {}
  };

  return {isConnected, loading, error, connect, disconnect, syncEvent, deleteEvent, token};
}

// ── NÓMINA ────────────────────────────────────────────────────────
const DIAS_SEMANA = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const DIAS_KEY    = ["lun","mar","mie","jue","vie","sab","dom"];
const PUESTOS     = ["Técnico","Técnico Senior","Ayudante","Administrativo","Ventas","Supervisor"];
const MODALIDADES = ["Sueldo fijo semanal","Por día trabajado","Por servicio","Mixto"];
let _empId = 1;
let _nomId = 1;

function calcNomina(emp, registro) {
  // registro: {diasTrabajados:{lun:true,...}, horasExtra:{lun:2,...}, anticipos:[]}
  const diasConfig = emp.diasLaborales||{lun:true,mar:true,mie:true,jue:true,vie:true,sab:true,dom:false};
  const diasEsperados = DIAS_KEY.filter(d=>diasConfig[d]).length;
  if(diasEsperados===0) return {bruto:0,descFaltas:0,descImss:0,descIsr:0,anticipos:0,neto:0,diasTrabajados:0,horasExtra:0,costoHE:0};

  const sueldoBase = parseFloat(emp.sueldoSemanal)||0;
  const costoDia   = diasEsperados>0 ? sueldoBase/diasEsperados : 0;
  const costoHora  = costoDia/8; // jornada de 8h
  const tasaHE     = 2; // 2x
  const tasaDE     = parseFloat(emp.tasaDiaExtra)||2; // día extra, default 2x, editable por empleado

  // Días trabajados
  const diasTrabajados = DIAS_KEY.filter(d=>diasConfig[d]&&(registro.diasTrabajados||{})[d]).length;
  const faltas         = diasEsperados - diasTrabajados;
  const descFaltas     = faltas * costoDia;

  // Horas extra
  let totalHE = 0;
  DIAS_KEY.forEach(d=>{ totalHE += parseFloat((registro.horasExtra||{})[d]||0); });
  const costoHE = totalHE * costoHora * tasaHE;

  // Bonos activos esta semana — solo los que SÍ cuestan al negocio
  const bonosActivos = (registro.bonosActivos||{});
  const totalBonos = (emp.bonos||[]).reduce((s,b,i)=>{
    if(b.intangible) return s; // bonos intangibles no afectan el neto del negocio
    return s + (bonosActivos[i]!==false ? parseFloat(b.monto||0) : 0);
  },0);
  const totalBonosIntangibles = (emp.bonos||[]).reduce((s,b,i)=>{
    if(!b.intangible) return s;
    return s + (bonosActivos[i]!==false ? parseFloat(b.monto||0) : 0);
  },0);

  // Días extra: días trabajados fuera de los días laborales configurados
  const diasExtra = DIAS_KEY.filter(d=>!diasConfig[d]&&(registro.diasTrabajados||{})[d]).length;
  const costoDE   = diasExtra * costoDia * tasaDE;

  // Deducciones legales (si aplica)
  const brutoAntesDeducciones = sueldoBase - descFaltas + costoHE + totalBonos + costoDE;
  const descImss = emp.imss ? brutoAntesDeducciones * 0.0275 : 0;
  const descIsr  = emp.isr  ? Math.max(0, brutoAntesDeducciones * 0.02) : 0;

  // Anticipos de esa semana
  const anticipos = (registro.anticipos||[]).reduce((s,a)=>s+parseFloat(a.monto||0),0);

  const neto = brutoAntesDeducciones - descImss - descIsr - anticipos;

  return {
    bruto: brutoAntesDeducciones,
    sueldoBase,
    descFaltas,
    costoHE,
    totalHE,
    totalBonos,
    totalBonosIntangibles,
    diasExtra,
    costoDE,
    descImss,
    descIsr,
    anticipos,
    neto: Math.max(0, neto),
    diasTrabajados,
    diasEsperados,
    faltas,
  };
}

function getISOWeek(date) {
  const d = new Date(date+"T12:00:00");
  const day = d.getDay()===0?7:d.getDay(); // 1=Lun, 7=Dom
  d.setDate(d.getDate()-day+1); // Lunes de esa semana
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function getLunesSemana(weekStr) {
  return new Date(weekStr+"T12:00:00");
}

function semanaLabel(weekStr) {
  if(!weekStr) return "";
  const lun = new Date(weekStr+"T12:00:00");
  const dom = new Date(lun); dom.setDate(lun.getDate()+6);
  return lun.toLocaleDateString("es-MX",{day:"numeric",month:"short"})+" – "+dom.toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"});
}

                    {DIAS_KEY.map((dk,i)=>{
                      const activo = diasConfig[dk];
                      const trabajo = !!(reg.diasTrabajados||{})[dk];
                      const esExtra = !activo && trabajo; // día no configurado pero trabajado
                      const he = parseFloat((reg.horasExtra||{})[dk]||0);
                      return (
                        <div key={dk} style={{textAlign:"center",opacity:activo||esExtra?1:0.35}}>
                          <div style={{fontSize:10,fontWeight:700,color:esExtra?C.orange:activo?C.muted:"#CBD5E0",marginBottom:4}}>{DIAS_SEMANA[i]}{esExtra&&<span style={{fontSize:8,color:C.orange}}> +</span>}</div>
                          <button
                            disabled={reg.pagado}
                            onClick={()=>{
                              const newDias={...(reg.diasTrabajados||{}),[dk]:!trabajo};
                              saveRegistro({...reg,diasTrabajados:newDias});
                            }}
                            style={{
                              width:"100%",height:36,borderRadius:8,border:esExtra?`2px solid ${C.orange}`:"none",
                              cursor:!reg.pagado?"pointer":"default",
                              background:esExtra?C.orangeBg:!activo?"#F0F4F8":trabajo?C.green:"#F0F4F8",
                              color:esExtra?C.orange:trabajo?"#fff":C.muted,
                              fontWeight:700,fontSize:12,transition:"all .15s",
                            }}
                          >
                            {trabajo?(esExtra?"★":"✓"):"—"}
                          </button>
                          {trabajo&&!reg.pagado&&(
                            <input type="number" min="0" max="8" step="0.5" value={he||""} onChange={e=>{
                              const newHE={...(reg.horasExtra||{}),[dk]:e.target.value};
                              saveRegistro({...reg,horasExtra:newHE});
                            }} placeholder="HE" style={{width:"100%",marginTop:4,padding:"4px 4px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:10,textAlign:"center",fontFamily:"inherit",background:he>0?C.orangeBg:"#fff",color:he>0?C.orange:C.text}}/>
                          )}
                          {reg.pagado&&he>0&&<div style={{fontSize:9,color:C.orange,marginTop:4}}>{he}h</div>}
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Bonos */}
                {(emp.bonos||[]).length>0&&(
                  <div style={{background:"#F5F3FF",border:`1px solid ${C.purple}22`,borderRadius:10,padding:"10px 14px",marginBottom:12}}>
                    <div style={{fontSize:11,fontWeight:700,color:C.purple,marginBottom:8}}>🎁 Bonos configurados</div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      {(emp.bonos||[]).map((b,bi)=>{
                        const activo = (reg.bonosActivos||{})[bi]!==false;
                        return (
                          <button key={bi} disabled={reg.pagado} onClick={()=>{
                            const ba={...(reg.bonosActivos||{}),[bi]:!activo};
                            saveRegistro({...reg,bonosActivos:ba});
                          }} style={{
                            background:activo?C.purpleBg:"#F0F4F8",
                            color:activo?C.purple:C.muted,
                            border:`1.5px solid ${activo?C.purple:C.border}`,
                            borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,
                            cursor:reg.pagado?"default":"pointer",fontFamily:"inherit",
                            display:"flex",alignItems:"center",gap:6,
                          }}>
                            {activo?"✓":"○"} {b.concepto} · {cur(b.monto)}
                          </button>
                        );
                      })}
                    </div>
                    {(emp.bonos||[]).some((_,bi)=>(reg.bonosActivos||{})[bi]!==false)&&(
                      <div style={{fontSize:11,color:C.purple,marginTop:6,fontWeight:700}}>
                        Total bonos: +{cur((emp.bonos||[]).reduce((s,b,bi)=>s+((reg.bonosActivos||{})[bi]!==false?parseFloat(b.monto||0):0),0))}
                      </div>
                    )}
                  </div>
                )}

                {/* Anticipos */}
                {(reg.anticipos||[]).length>0&&(
                  <div style={{background:C.orangeBg,borderRadius:8,padding:"8px 12px",marginBottom:10}}>
                    <div style={{fontSize:11,fontWeight:700,color:C.orange,marginBottom:4}}>💸 Anticipos esta semana</div>
                    {(reg.anticipos||[]).map((a,i)=>(
                      <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.orange}}>
                        <span>{fmtD(a.fecha)} — {a.concepto||"Anticipo"}</span>
                        <strong>{cur(a.monto)}</strong>
                      </div>
                    ))}
                  </div>
                )}

                {/* Resumen */}
                <div style={{background:"#1A202C",borderRadius:10,padding:"12px 16px",display:"flex",gap:16,flexWrap:"wrap",justifyContent:"space-between"}}>
                  {[
                    {l:"Sueldo base",v:cur(calc.sueldoBase),c:"#A0AEC0"},
                    {l:"Faltas ("+calc.faltas+"d)",v:calc.descFaltas>0?"-"+cur(calc.descFaltas):"—",c:"#FC8181"},
                    {l:"HE ("+calc.totalHE+"h)",v:calc.costoHE>0?"+"+cur(calc.costoHE):"—",c:"#68D391"},
                    {l:"Días extra ("+calc.diasExtra+"d × "+((emp&&emp.tasaDiaExtra)||2)+"x)",v:calc.costoDE>0?"+"+cur(calc.costoDE):"—",c:"#F6AD55"},
                    {l:"Bonos",v:calc.totalBonos>0?"+"+cur(calc.totalBonos):"—",c:"#B794F4"},
                    {l:"IMSS",v:calc.descImss>0?"-"+cur(calc.descImss):"—",c:"#FC8181"},
                    {l:"Anticipos",v:calc.anticipos>0?"-"+cur(calc.anticipos):"—",c:"#FBD38D"},
                    {l:"NETO",v:cur(calc.neto),c:"#fff",big:true},
                  ].map((it,i)=>(
                    <div key={i} style={{textAlign:"center"}}>
                      <div style={{fontSize:10,color:"#718096",fontWeight:600}}>{it.l}</div>
                      <div style={{fontSize:it.big?18:13,fontWeight:it.big?900:700,color:it.c,marginTop:2}}>{it.v}</div>
                    </div>
                  ))}
                </div>
                {calc.totalBonosIntangibles>0&&(
                  <div style={{background:"#F5F3FF",borderRadius:8,padding:"6px 12px",marginTop:6,fontSize:11,color:C.purple,fontWeight:600}}>
                    🎁 Bonos intangibles activos esta semana: {cur(calc.totalBonosIntangibles)} — no afectan el pago en efectivo
                  </div>
                )}
              </Card>
            );
          })}

          {empActivos.length>0&&(
            <div style={{background:C.accentBg,borderRadius:12,padding:"12px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontWeight:700,color:C.accentD}}>💰 Total a pagar esta semana</div>
              <div style={{fontWeight:900,fontSize:20,color:C.accentD}}>{cur(totalSemana)}</div>
            </div>
          )}
        </div>
      )}

      {/* ── VISTA EMPLEADOS ── */}
      {vista==="empleados"&&(
        <div>
          {empleados.length===0&&(
            <div style={{textAlign:"center",padding:40,color:C.muted}}>
              <div style={{fontSize:40,marginBottom:8}}>👥</div>
              <div style={{fontWeight:700,marginBottom:8}}>Sin empleados registrados</div>
              <Btn ch="+ Agregar empleado" v="primary" onClick={()=>setModalEmp("nuevo")}/>
            </div>
          )}
          {empleados.map(emp=>(
            <Card key={emp.id} style={{marginBottom:10,borderLeft:`4px solid ${emp.activo!==false?C.green:C.muted}`,cursor:"pointer"}} onClick={()=>setModalEmp(emp)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                <div>
                  <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                    <span style={{background:C.surfaceAlt,color:C.sub,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>{emp.numero}</span>
                    <span style={{fontWeight:800,fontSize:16}}>{emp.nombre}</span>
                    {emp.activo===false&&<span style={{background:C.redBg,color:C.red,borderRadius:6,padding:"1px 7px",fontSize:10,fontWeight:700}}>BAJA</span>}
                  </div>
                  <div style={{fontSize:12,color:C.muted,marginTop:2}}>{emp.puesto} · {emp.modalidad} · {cur(emp.sueldoSemanal)}/semana</div>
                  <div style={{fontSize:11,color:C.muted,marginTop:1}}>
                    Días: {DIAS_KEY.filter(d=>(emp.diasLaborales||{})[d]).map((_,i)=>DIAS_SEMANA[DIAS_KEY.indexOf(_)]).join(", ")||"Sin configurar"}
                  </div>
                </div>
                <div style={{display:"flex",gap:6}}>
                  <Btn ch="✏ Editar" v="ghost" sm onClick={e=>{e.stopPropagation();setModalEmp(emp);}}/>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}

      {/* ── VISTA HISTORIAL ── */}
      {vista==="historial"&&(
        <div>
          <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>📋 Historial de pagos de nómina</div>
          {nominas.filter(n=>n.pagado).length===0&&<div style={{color:C.muted,textAlign:"center",padding:30}}>Sin pagos registrados aún</div>}
          {[...nominas].filter(n=>n.pagado).sort((a,b)=>b.semana.localeCompare(a.semana)).map(n=>{
            const emp = empleados.find(e=>e.id===n.empId);
            if(!emp) return null;
            return (
              <Card key={n.id||n.empId+n.semana} style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:14}}>{emp.nombre} <span style={{color:C.muted,fontSize:11}}>({emp.numero})</span></div>
                    <div style={{fontSize:12,color:C.muted}}>{semanaLabel(n.semana)} · Pagado: {fmtD(n.fechaPago)}</div>
                  </div>
                  <div style={{fontWeight:900,fontSize:16,color:C.green}}>{cur(n.netoPagado)}</div>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {/* Modales */}
      {modalEmp&&<EmpModal emp={modalEmp==="nuevo"?null:modalEmp} onClose={()=>setModalEmp(null)} onSave={emp=>{
        if(emp.id&&empleados.find(e=>e.id===emp.id)) {
          setEmpleados(p=>p.map(e=>e.id===emp.id?emp:e));
          fireToast("✅ Empleado actualizado");
        } else {
          const id=_empId++;
          const num="EMP-"+String(id).padStart(3,"0");
          setEmpleados(p=>[...p,{...emp,id,numero:num,activo:true}]);
          fireToast("✅ Empleado "+num+" registrado");
        }
        setModalEmp(null);
      }} onBaja={id=>{setEmpleados(p=>p.map(e=>e.id===id?{...e,activo:false}:e));setModalEmp(null);fireToast("Empleado dado de baja");}} onAlta={id=>{setEmpleados(p=>p.map(e=>e.id===id?{...e,activo:true}:e));setModalEmp(null);fireToast("Empleado reactivado");}}/>}

      {modalAntic&&<AnticipModal emp={modalAntic.emp} registro={modalAntic.registro} onClose={()=>setModalAntic(null)} onSave={(antic)=>{
        const reg={...modalAntic.registro,anticipos:[...(modalAntic.registro.anticipos||[]),antic]};
        saveRegistro(reg);
        addTxn({date:antic.fecha,concept:"Anticipo "+modalAntic.emp.nombre,category:"Nómina/Técnico",classification:"Variable",type:"egreso",amount:parseFloat(antic.monto),method:"efectivo",status:"realizado",auto:false});
        fireToast("💸 Anticipo de "+cur(antic.monto)+" registrado en Finanzas");
        setModalAntic(null);
      }}/>}

      {confirmPago&&<ConfirmPagoModal emp={confirmPago.emp} calc={confirmPago.calc} semana={semana} onClose={()=>setConfirmPago(null)} onConfirm={(fecha,metodo)=>pagarNomina(confirmPago.emp,confirmPago.registro,confirmPago.calc,fecha,metodo)}/>}
    </div>
  );
}

// ── Modal empleado ──
function EmpModal({emp, onClose, onSave, onBaja, onAlta}) {
  const isEdit = !!emp;
  const defDias = {lun:true,mar:true,mie:true,jue:true,vie:true,sab:true,dom:false};
  const [f,setF] = useState(emp||{nombre:"",puesto:"Técnico",modalidad:"Sueldo fijo semanal",sueldoSemanal:"",diasLaborales:defDias,metodoPago:"efectivo",banco:"",clabe:"",imss:false,isr:false,infonavit:false,notas:""});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  return (
    <Modal title={isEdit?`✏ ${emp.nombre}`:"➕ Nuevo Empleado"} onClose={onClose} wide>
      <div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
          <div style={{gridColumn:"1/-1"}}><Inp label="Nombre completo *" value={f.nombre} onChange={e=>set("nombre",e.target.value)} placeholder="Ej: Carlos López Martínez"/></div>
          <Sel label="Puesto" opts={PUESTOS} value={f.puesto} onChange={e=>set("puesto",e.target.value)}/>
          <Sel label="Modalidad de pago" opts={MODALIDADES} value={f.modalidad} onChange={e=>set("modalidad",e.target.value)}/>
          <Inp label="Sueldo semanal $" type="number" value={f.sueldoSemanal} onChange={e=>set("sueldoSemanal",e.target.value)} placeholder="Ej: 1500"/>
          <div>
            <Inp label="Tasa día extra (x)" type="number" value={f.tasaDiaExtra||"2"} onChange={e=>set("tasaDiaExtra",e.target.value)} placeholder="2"/>
            <div style={{fontSize:10,color:C.muted,marginTop:-8,marginBottom:8}}>Multiplicador del costo diario. Ej: 2 = doble, 1.5 = día y medio</div>
          </div>
          <Sel label="Método de pago" opts={[{v:"efectivo",l:"💵 Efectivo"},{v:"transferencia",l:"🏦 SPEI / Transferencia"},{v:"tdd",l:"🏦 Depósito a cuenta"}]} value={f.metodoPago||"efectivo"} onChange={e=>set("metodoPago",e.target.value)}/>
          {f.metodoPago!=="efectivo"&&<div style={{gridColumn:"1/-1"}}><Inp label="CLABE / Cuenta" value={f.clabe||""} onChange={e=>set("clabe",e.target.value)} placeholder="18 dígitos CLABE"/></div>}
          {f.metodoPago!=="efectivo"&&<Inp label="Banco" value={f.banco||""} onChange={e=>set("banco",e.target.value)} placeholder="Ej: Banamex"/>}
        </div>

        {/* Días laborales */}
        <div style={{marginBottom:14}}>
          <Lbl t="Días laborales"/>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {DIAS_KEY.map((dk,i)=>(
              <button key={dk} onClick={()=>set("diasLaborales",{...(f.diasLaborales||defDias),[dk]:!(f.diasLaborales||defDias)[dk]})} style={{background:(f.diasLaborales||defDias)[dk]?C.accent:"transparent",color:(f.diasLaborales||defDias)[dk]?"#fff":C.muted,border:`1.5px solid ${(f.diasLaborales||defDias)[dk]?C.accent:C.border}`,borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                {DIAS_SEMANA[i]}
              </button>
            ))}
          </div>
          <div style={{fontSize:11,color:C.muted,marginTop:6}}>
            {DIAS_KEY.filter(d=>(f.diasLaborales||defDias)[d]).length} días · Sueldo diario: {cur((parseFloat(f.sueldoSemanal)||0)/Math.max(1,DIAS_KEY.filter(d=>(f.diasLaborales||defDias)[d]).length))}
          </div>
        </div>

        {/* Deducciones legales */}
        <div style={{background:C.surfaceAlt,borderRadius:12,padding:"12px 14px",marginBottom:14}}>
          <Lbl t="Deducciones legales (para cuando migres a formal)"/>
          <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
            {[{k:"imss",l:"IMSS (~2.75%)"},{k:"isr",l:"ISR (~2%)"},{k:"infonavit",l:"Infonavit (5%)"}].map(it=>(
              <label key={it.k} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:C.sub}}>
                <input type="checkbox" checked={!!(f[it.k])} onChange={e=>set(it.k,e.target.checked)} style={{accentColor:C.accent,width:15,height:15}}/>
                {it.l}
              </label>
            ))}
          </div>
        </div>

        {/* Bonos predefinidos */}
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <Lbl t="🎁 Bonos predefinidos"/>
            <button onClick={()=>set("bonos",[...(f.bonos||[]),{concepto:"",monto:""}])} style={{background:C.purpleBg,color:C.purple,border:"none",borderRadius:7,padding:"4px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ Agregar bono</button>
          </div>
          {(f.bonos||[]).length===0&&<div style={{fontSize:12,color:C.muted,fontStyle:"italic"}}>Sin bonos configurados — agrégalos para activarlos/desactivarlos en cada semana con un click</div>}
          {(f.bonos||[]).map((b,i)=>(
            <div key={i} style={{display:"flex",gap:8,alignItems:"flex-end",marginBottom:6,flexWrap:"wrap"}}>
              <div style={{flex:2,minWidth:140}}><Inp label={i===0?"Concepto del bono":""} value={b.concepto} onChange={e=>{const nb=[...(f.bonos||[])];nb[i]={...nb[i],concepto:e.target.value};set("bonos",nb);}} placeholder="Ej: Bono puntualidad..."/></div>
              <div style={{width:90}}><Inp label={i===0?"Monto $":""} type="number" value={b.monto} onChange={e=>{const nb=[...(f.bonos||[])];nb[i]={...nb[i],monto:e.target.value};set("bonos",nb);}} placeholder="0.00"/></div>
              <label style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:C.purple,fontWeight:700,cursor:"pointer",marginBottom:12,flexShrink:0}}>
                <input type="checkbox" checked={!!b.intangible} onChange={e=>{const nb=[...(f.bonos||[])];nb[i]={...nb[i],intangible:e.target.checked};set("bonos",nb);}} style={{accentColor:C.purple}}/>
                Intangible
              </label>
              <button onClick={()=>set("bonos",(f.bonos||[]).filter((_,j)=>j!==i))} style={{background:C.redBg,color:C.red,border:"none",borderRadius:7,padding:"7px 10px",cursor:"pointer",marginBottom:12,fontSize:14,flexShrink:0}}>×</button>
            </div>
          ))}
          {(f.bonos||[]).length>0&&<div style={{fontSize:11,color:C.muted}}>Total bonos si todos activos: {cur((f.bonos||[]).reduce((s,b)=>s+parseFloat(b.monto||0),0))}/semana</div>}
        </div>

        <Txta label="Notas internas" value={f.notas||""} onChange={e=>set("notas",e.target.value)} placeholder="Observaciones, acuerdos especiales..." xStyle={{minHeight:50}}/>

        <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
          <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
          {isEdit&&emp.activo!==false&&<Btn ch="🚫 Dar de baja" v="danger" onClick={()=>onBaja(emp.id)}/>}
          {isEdit&&emp.activo===false&&<Btn ch="✅ Reactivar" v="green" onClick={()=>onAlta(emp.id)}/>}
          <Btn ch={isEdit?"💾 Guardar cambios":"✅ Registrar empleado"} v="primary" onClick={()=>{
            if(!f.nombre) return fireToast("⚠ Ingresa el nombre");
            if(!f.sueldoSemanal) return fireToast("⚠ Ingresa el sueldo");
            onSave(f);
          }} style={{flex:1}}/>
        </div>
      </div>
    </Modal>
  );
}

// ── Modal anticipo ──
function AnticipModal({emp, registro, onClose, onSave}) {
  const [monto,    setMonto]    = useState("");
  const [concepto, setConcepto] = useState("Anticipo de nómina");
  const [fecha,    setFecha]    = useState(today);
  return (
    <Modal title={"💸 Anticipo — "+emp.nombre} onClose={onClose}>
      <div>
        <div style={{background:C.orangeBg,borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:13,color:C.orange,lineHeight:1.6}}>
          El anticipo se descontará automáticamente del pago de esta semana y se registrará en Finanzas.
        </div>
        <Inp label="Monto $" type="number" value={monto} onChange={e=>setMonto(e.target.value)} placeholder="0.00"/>
        <Inp label="Concepto" value={concepto} onChange={e=>setConcepto(e.target.value)}/>
        <Inp label="Fecha" type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/>
        <div style={{display:"flex",gap:10,marginTop:8}}>
          <Btn ch="Cancelar" v="ghost" onClick={onClose}/>

            if(!monto||parseFloat(monto)<=0) return fireToast("⚠ Ingresa el monto");
            onSave({monto:parseFloat(monto),concepto,fecha});
          }} style={{flex:1}}/>
        </div>
      </div>
    </Modal>
  );
}

// ── Modal confirmación pago ──
function ConfirmPagoModal({emp, calc, semana, onClose, onConfirm}) {
  const [fecha,  setFecha]  = useState(today);
  const [metodo, setMetodo] = useState(emp.metodoPago||"efectivo");

  const METODOS = [
    {v:"efectivo",     l:"💵 Efectivo"},
    {v:"transferencia",l:"🏦 SPEI / Transferencia"},
    {v:"tdd",          l:"🏦 TDD Banamex"},
    {v:"tarjeta",      l:"💳 Terminal"},
  ];

  return (
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"#00000066",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"#fff",borderRadius:16,padding:28,maxWidth:440,width:"100%",boxShadow:"0 20px 60px #00000033"}}>
        <div style={{fontSize:28,textAlign:"center",marginBottom:12}}>💰</div>
        <div style={{fontWeight:800,fontSize:16,textAlign:"center",marginBottom:16}}>Confirmar pago de nómina</div>
        <div style={{background:C.surfaceAlt,borderRadius:10,padding:"14px 16px",marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:8}}>{emp.nombre} <span style={{color:C.muted,fontSize:12}}>({emp.numero})</span></div>
          <div style={{fontSize:13,color:C.sub}}>{semanaLabel(semana)}</div>
          <div style={{borderTop:`1px solid ${C.border}`,marginTop:10,paddingTop:10}}>
            {[
              {l:"Sueldo base",v:cur(calc.sueldoBase)},
              calc.descFaltas>0&&{l:"Descuento faltas ("+calc.faltas+"d)",v:"-"+cur(calc.descFaltas),c:C.red},
              calc.costoHE>0&&{l:"Horas extra ("+calc.totalHE+"h × 2x)",v:"+"+cur(calc.costoHE),c:C.green},

function App() {
  const [svcs,   setSvcs,   svcR]    = useStored("comins:svcs",   S_SVC);
  const [txns,   setTxns,   txnR]    = useStored("comins:txns",   S_TXN);
  const [leads,  setLeads,  leadR]   = useStored("comins:leads",  S_LEADS);
  const [quotes, setQuotes, quoteR]  = useStored("comins:quotes", S_QUOTES);
  const [cat,      setCat,    catR]    = useStored("comins:cat",    S_CAT);
  const [clausulas, setClausulas]       = useStored("comins:clausulas", [
    {titulo:"Garantía estándar", texto:"Los trabajos realizados cuentan con garantía de 30 días en mano de obra. Las refacciones y equipos se sujetan a la garantía del fabricante."},
    {titulo:"Condiciones de pago", texto:"50% de anticipo al confirmar el servicio, 50% restante al término. Precios sujetos a cambio sin previo aviso."},
    {titulo:"Política de cancelación", texto:"Cancelaciones con menos de 24 hrs de anticipación generan cargo del 20% del servicio cotizado."},
    {titulo:"Vigencia de cotización", texto:"Esta cotización tiene una vigencia de 15 días a partir de la fecha de emisión."},
  ]);
  const [inv,    setInv,    invR]    = useStored("comins:inv",    []);
  const [provs,  setProvs,  provR]   = useStored("comins:provs",  []);
  const [ocs,    setOcs,    ocR]     = useStored("comins:ocs",    []);
  const [tdc,    setTdc,    tdcR]    = useStored("comins:tdc",    {limite:0,pagoDia:0,pagos:[]});
  const [incCats, setIncCats] = useStored("comins:incCats", S_INC_CATS);
  const [expCats, setExpCats] = useStored("comins:expCats", S_EXP_CATS);
  const [empleados, setEmpleados] = useStored("comins:empleados", []);
  const [nominas,   setNominas]   = useStored("comins:nominas",   []);
  const allReady = svcR && txnR && leadR && quoteR && catR && invR && provR && ocR && tdcR;

  useEffect(()=>{
    if(!allReady) return;
    _sid = Math.max(_sid, ...svcs.map(s=>s.id||0))+1;
    _tid = Math.max(_tid, ...txns.map(t=>t.id||0))+1;
    _lid = Math.max(_lid, ...leads.map(l=>l.id||0))+1;
    _qid = Math.max(_qid, ...quotes.map(q=>q.id||0))+1;
    markInitialized();

    // Limpiar vínculos huérfanos: cotizaciones que apuntan a servicios borrados
    const svcIds = new Set(svcs.map(s=>s.id));
    const orphans = quotes.filter(q=>q.servicioId&&!svcIds.has(q.servicioId));
    if(orphans.length>0) {
      setQuotes(p=>p.map(q=>orphans.find(o=>o.id===q.id)?{...q,servicioId:null,servicioFolio:""}:q));
    }

    // Reparar vínculos de un solo lado: servicio tiene cotizacionId pero cotización no tiene servicioId
    const fixedQuotes = {};
    svcs.forEach(s=>{
      if(s.cotizacionId && s.folio) {
        const q = quotes.find(qq=>qq.id===s.cotizacionId);
        if(q && (!q.servicioId || q.servicioId!==s.id)) {
          fixedQuotes[q.id] = {...q, servicioId:s.id, servicioFolio:s.folio};
        }
      }
    });
    if(Object.keys(fixedQuotes).length>0) {
      setQuotes(p=>p.map(q=>fixedQuotes[q.id]?fixedQuotes[q.id]:q));
    }

    // Migración: corregir movimientos con método inválido
    // El bug de paréntesis en useState guardó métodos como undefined/object
    const metodosValidos = ["efectivo","transferencia","tdd","cargo_auto","tarjeta","tdc"];
    const txnsMalos = txns.filter(t=>!metodosValidos.includes(t.method));
    if(txnsMalos.length>0) {
      setTxns(p=>p.map(t=>{
        if(metodosValidos.includes(t.method)) return t;
        // Inferir método correcto: si el servicio vinculado tiene payMethod, usarlo
        var inferido = "efectivo"; // default seguro
        if(t.auto && t.type==="ingreso") {
          // Buscar el servicio por folio en el concepto
          var folioMatch = (t.concept||"").match(/SV-(\d+)/);
          if(folioMatch) {
            var svcRef = svcs.find(s=>s.folio==="SV-"+folioMatch[1]);
            if(svcRef && svcRef.payMethod && metodosValidos.includes(svcRef.payMethod)) {
              inferido = svcRef.payMethod;
            }
          }
        }
        return {...t, method:inferido};
      }));
      fireToast("✅ "+txnsMalos.length+" movimiento(s) con método corregido");
    }
  },[allReady]);

  const [tab,        setTab]        = useState("dashboard");
  const [modal,      setModal]      = useState(null);
  const [selSvc,     setSelSvc]     = useState(null);

  const [calWeekStart, setCalWeekStart] = useState(()=>{
    const d=new Date(); const dow=d.getDay()===0?6:d.getDay()-1;

  const [calMonth, setCalMonth] = useState(()=>({y:new Date().getFullYear(),m:new Date().getMonth()}));
  const [svcSearch,  setSvcSearch]  = useState("");

  const followUpQ    = quotes.filter(q=>q.status==="seguimiento");
  const followUpQHoy = quotes.filter(q=>q.status==="seguimiento"&&q.followUp&&q.followUp<=tod2);

  // Fase 3 — Seguimiento post-servicio
  const postSeguimientoSvcs = svcs.filter(s=>{
    if(s.status!=="completado") return false;
    if(!s.seguimientoDias || s.seguimientoDias===0) return false;
    if(s.seguimientoHecho) return false;
    // Calcular fecha de seguimiento desde la fecha de cobro o date del servicio
    const base = s.fechaCobro || s.date;
    if(!base) return false;
    const d = new Date(base+"T12:00:00");
    d.setDate(d.getDate() + parseInt(s.seguimientoDias));
    const seguDate = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    return seguDate <= tod2;
  });

  const inPeriod = (d, p, from, to) => {
    const dt = new Date(d+"T12:00:00");
    if(p==="custom") {
      const a = from ? new Date(from+"T00:00:00") : new Date("2000-01-01");
      const b = to   ? new Date(to+"T23:59:59")   : new Date("2099-12-31");
      return dt>=a && dt<=b;
    }
    if(p==="dia")    return d===tod2;
    if(p==="semana") { const s=new Date(now2);s.setDate(now2.getDate()-7);return dt>=s; }
    if(p==="mes")    return dt.getMonth()===finMes&&dt.getFullYear()===finAnio;
    return dt.getFullYear()===finAnio;
  };

  const periodTxns     = txns.filter(t=>inPeriod(t.date,finPeriod,finFrom,finTo));
  const totalIngresos  = periodTxns.filter(t=>t.type==="ingreso"&&t.status==="realizado"&&t.category!=="Capital / Apertura de caja").reduce((s,t)=>s+t.amount,0);
  const totalCapital   = periodTxns.filter(t=>t.category==="Capital / Apertura de caja"&&t.status==="realizado").reduce((s,t)=>s+t.amount,0);
  const totalEgresos   = periodTxns.filter(t=>t.type==="egreso"&&t.status==="realizado").reduce((s,t)=>s+t.amount,0);
  const utilidad       = totalIngresos-totalEgresos;
  const efectivo       = periodTxns.filter(t=>t.method==="efectivo"&&t.status==="realizado").reduce((s,t)=>s+(t.type==="ingreso"?t.amount:-t.amount),0);
  const transferencia  = periodTxns.filter(t=>["transferencia","tdd","cargo_auto"].includes(t.method)&&t.status==="realizado").reduce((s,t)=>s+(t.type==="ingreso"?t.amount:-t.amount),0);
  const gastoFijo      = periodTxns.filter(t=>t.type==="egreso"&&t.classification==="Fijo").reduce((s,t)=>s+t.amount,0);
  const gastoVar       = periodTxns.filter(t=>t.type==="egreso"&&t.classification==="Variable").reduce((s,t)=>s+t.amount,0);
  const gastoExt       = periodTxns.filter(t=>t.type==="egreso"&&t.classification==="Extraordinario").reduce((s,t)=>s+t.amount,0);

  // Dashboard usa siempre el mes actual, independiente del filtro de Finanzas
  const mesActual = now2.getMonth();
  const anioActual = now2.getFullYear();
  const dashTxns      = txns.filter(t=>{ const dt=new Date(t.date+"T12:00:00"); return dt.getMonth()===mesActual&&dt.getFullYear()===anioActual&&t.status==="realizado"; });
  const dashIngresos  = dashTxns.filter(t=>t.type==="ingreso"&&t.category!=="Capital / Apertura de caja").reduce((s,t)=>s+t.amount,0);
  const dashRetiro    = dashTxns.filter(t=>t.type==="egreso"&&t.category==="Retiro de socio / Utilidades").reduce((s,t)=>s+t.amount,0);
  const dashEgresos   = dashTxns.filter(t=>t.type==="egreso"&&t.category!=="Retiro de socio / Utilidades").reduce((s,t)=>s+t.amount,0);
  const dashUtilidad  = dashIngresos - dashEgresos;

  const chartData = useMemo(()=>{
    const weeks=[];
    for(let i=5;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i*7);
      const ws=new Date(d);ws.setDate(d.getDate()-d.getDay());
      const we=new Date(ws);we.setDate(ws.getDate()+6);
      const wt=txns.filter(t=>{const td=new Date(t.date+"T12:00:00");return td>=ws&&td<=we&&t.status==="realizado";});
      weeks.push({label:`S${6-i}`,ing:wt.filter(t=>t.type==="ingreso").reduce((s,t)=>s+t.amount,0),eg:wt.filter(t=>t.type==="egreso").reduce((s,t)=>s+t.amount,0)});
    }
    return weeks;
  },[txns]);

  const sortedTxns = useMemo(()=>[...txns].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),[txns]);
  const filteredTxns = sortedTxns.filter(t=>txnFilter==="todos"||t.type===txnFilter).filter(t=>txnCls==="todos"||t.classification===txnCls).filter(t=>!txnSearch||t.concept.toLowerCase().includes(txnSearch.toLowerCase())||t.category.toLowerCase().includes(txnSearch.toLowerCase()));
  const filteredSvcs = [...svcs].filter(s=>inPeriod(s.date,svcPeriod,svcFrom,svcTo)).filter(s=>svcFilter==="todos"||s.status===svcFilter).filter(s=>!svcSearch||s.client.toLowerCase().includes(svcSearch.toLowerCase())||s.folio.toLowerCase().includes(svcSearch.toLowerCase())||(s.phone&&s.phone.includes(svcSearch))).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const filteredLeads = [...leads].filter(l=>leadFilter==="todos"||l.status===leadFilter).sort((a,b)=>b.date.localeCompare(a.date));
  const filteredQuotes = [...quotes].filter(q=>{
    if(qPeriod==="mes") { const d=new Date(q.date+"T12:00:00"); return d.getMonth()===new Date().getMonth()&&d.getFullYear()===qAnio; }
    if(qPeriod==="anio") { const d=new Date(q.date+"T12:00:00"); return d.getFullYear()===qAnio; }
    return true; // "todas"
  }).filter(q=>qFilter==="todos"||q.status===qFilter).sort((a,b)=>b.id-a.id);
  const svcInP = svcs.filter(s=>inPeriod(s.date,svcPeriod,svcFrom,svcTo));
  const svcCounts = Object.fromEntries(Object.keys(SVC_STATUS).map(k=>[k,svcInP.filter(s=>s.status===k).length]));

  const saveSvc = (data) => {
    if(data.id && svcs.find(s=>s.id===data.id)) {
      const prev = svcs.find(s=>s.id===data.id);
      setSvcs(p=>p.map(s=>s.id===data.id?data:s));
      // Sincronizar txn en Finanzas si el servicio está completado y tiene folio
      if(data.status==="completado" && data.folio) {
        const newAmount = parseFloat(data.amount)||0;
        const newMethod = data.payMethod||"efectivo";
        let found = false;
        setTxns(p=>p.map(t=>{
          if(t.type==="ingreso" &&
            (t.concept.includes(data.folio) ||
             (t.auto && t.concept.includes(data.client)))) {
            found = true;
            return {...t, amount:newAmount, method:newMethod};
          }
          return t;
        }));
        fireToast("✅ Servicio y Finanzas sincronizados");
      }
      // Sync Google Calendar si está conectado y el servicio tiene fecha
      if(gcal.isConnected && data.date && data.status!=="cancelado") {
        gcal.syncEvent(data).then(eventId=>{
          if(eventId && eventId!==data.gcalEventId) {
            setSvcs(p=>p.map(s=>s.id===data.id?{...s,gcalEventId:eventId}:s));
          }
          if(eventId) fireToast("📅 Google Calendar actualizado");
        });
      }
      // Si se cancela y tenía evento en GCal → eliminarlo
      if(gcal.isConnected && data.status==="cancelado" && data.gcalEventId) {
        gcal.deleteEvent(data.gcalEventId).then(()=>{
          setSvcs(p=>p.map(s=>s.id===data.id?{...s,gcalEventId:""}:s));
          fireToast("🗑 Evento eliminado de Google Calendar");
        });
      }
    } else {
      const id=_sid++;
      const newSvc={...data,id,folio:`SV-${String(id).padStart(3,"0")}`,status:"pendiente",amount:0,payMethod:"",created:tod2};
      setSvcs(p=>[newSvc,...p]);
      // Crear en Google Calendar si está conectado
      if(gcal.isConnected && newSvc.date) {
        gcal.syncEvent(newSvc).then(eventId=>{
          if(eventId) {
            setSvcs(p=>p.map(s=>s.id===id?{...s,gcalEventId:eventId}:s));
            fireToast("📅 Agregado a Google Calendar");
          }
        });
      }
    }
  };
  const deleteSvc = id => {
    const svc = svcs.find(s=>s.id===id);
    if(svc&&svc.cotizacionId) {
      setQuotes(p=>p.map(q=>q.id===svc.cotizacionId?{...q,servicioId:null,servicioFolio:""}:q));
    }
    // Eliminar de Google Calendar si existe
    if(gcal.isConnected && svc && svc.gcalEventId) {
      gcal.deleteEvent(svc.gcalEventId);
    }
    setSvcs(p=>p.filter(s=>s.id!==id));
  };
  const addTxn = (t) => {
    const newTxn = {...t, id:_tid++};
    setTxns(p=>[newTxn,...p]);
    fireToast(`💾 Registrado en Finanzas: ${t.type==="ingreso"?"+":"-"}${cur(t.amount)}`);
  };
  const saveTxn = (t) => {
    if(t.id && txns.find(x=>x.id===t.id)) {
      setTxns(p=>p.map(x=>x.id===t.id?t:x));
      // Si es txn AUTO de ingreso → sincronizar el servicio vinculado por folio
      if(t.auto && t.type==="ingreso") {
        const folioMatch = t.concept.match(/^(SV-[0-9]+)/);
        if(folioMatch) {
          const folio = folioMatch[1];
          setSvcs(p=>p.map(s=>s.folio===folio && s.status==="completado"
            ? {...s, amount:parseFloat(t.amount)||0, payMethod:t.method}
            : s

          fireToast("✅ Finanzas y servicio actualizados");
        }
      }
    } else {
      addTxn(t);

  const deleteTxn   = id => setPendingDelTxn(id);
  const saveQuote = q => { setQuotes(p=>p.map(x=>x.id===q.id?q:x)); setSelQuote(prev=>prev&&prev.id===q.id?q:prev); };
