    if(ex) setLeads(p=>p.map(l=>l.phone===r.phone?{...l,status:"cotizado"}:l));
    else   setLeads(p=>[{id:_lid++,name:r.name,phone:r.phone,source:"WhatsApp",interest:r.interest||r.serviceType,status:"cotizado",date:tod2,notes:r.notes||"",followUp:""},...p]);
  };
  const addLeadFromParser = r => setLeads(p=>[{id:_lid++,name:r.name,phone:r.phone,source:"WhatsApp",interest:r.interest||r.serviceType,status:"nuevo",date:tod2,notes:r.notes||"",followUp:""},...p]);
  const exportCSV = () => {
    const rows=periodTxns.sort((a,b)=>b.date.localeCompare(a.date));
    const csv=["Fecha,Concepto,Categoría,Clasificación,Tipo,Monto,Método,Estado",...rows.map(t=>`${t.date},"${t.concept}",${t.category},${t.classification||"Variable"},${t.type},${t.amount},${t.method},${t.status}`)].join("\n");
    const b64c = btoa(unescape(encodeURIComponent(csv)));
    const a=document.createElement("a");
    a.href="data:text/csv;charset=utf-8;base64,"+b64c;
    a.download=`SJR_Finanzas_${tod2}.csv`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  };

  const exportBackup = () => setModal("backup");


  const NAV = [
    {id:"dashboard",  icon:"⊞", label:"Panel"},
    {id:"servicios",  icon:"🔧", label:"Servicios",    badge:(urgentCount+postSeguimientoSvcs.length)>0?(urgentCount+postSeguimientoSvcs.length):null, badgeColor:postSeguimientoSvcs.length>0?C.purple:C.orange},
    {id:"cotizaciones",icon:"📋", label:"Cotizaciones", badge:followUpQ.length>0?followUpQ.length:null, badgeColor:C.orange},
    {id:"finanzas",   icon:"💰", label:"Finanzas"},
    {id:"leads",      icon:"📣", label:"Leads",         badge:followUpLeads.length>0?followUpLeads.length:null, badgeColor:C.red},
    {id:"inventario", icon:"📦", label:"Inventario",    badge:inv.filter(i=>i.stock<=i.minStock).length>0?inv.filter(i=>i.stock<=i.minStock).length:null, badgeColor:C.red},
    {id:"nomina",     icon:"👷", label:"Nómina"},
  ];

  if(!allReady) return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
      <div style={{fontSize:40}}>❄</div>
      <div style={{fontWeight:800,fontSize:18,color:C.text}}>COMINS</div>
      <div style={{color:C.muted,fontSize:14}}>Cargando tus datos...</div>
      <div style={{width:180,height:4,background:C.border,borderRadius:4,overflow:"hidden"}}>
        <div style={{height:4,background:C.accent,borderRadius:4,animation:"ld 1s infinite"}}/>
      </div>
      <style>{`@keyframes ld{0%{width:0%}100%{width:100%}}`}</style>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"-apple-system,'SF Pro Display','Segoe UI',sans-serif"}}>
      {/* ── Navbar ── */}
      <div style={{background:"rgba(255,255,255,0.85)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderBottom:`1px solid ${C.border}`,padding:"0 20px",display:"flex",alignItems:"stretch",position:"sticky",top:0,zIndex:200,flexWrap:"wrap"}}>
        {/* Logo */}
        <div style={{display:"flex",alignItems:"center",gap:10,paddingRight:20,borderRight:`1px solid ${C.border}`,marginRight:4,minHeight:52}}>
          <div style={{width:30,height:30,background:"linear-gradient(135deg,#0A84FF,#0066CC)",borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,boxShadow:"0 2px 8px rgba(10,132,255,.3)"}}>❄</div>
          <div>
            <div style={{fontWeight:700,fontSize:13,letterSpacing:-.2,color:C.text}}>COMINS</div>
            <div style={{fontSize:9,color:C.muted,fontWeight:500,letterSpacing:.4,textTransform:"uppercase"}}>Sistema Operativo</div>
          </div>
        </div>
        {/* Tabs */}
        {NAV.map(n=>(
          <button key={n.id} onClick={()=>setTab(n.id)} style={{
            background:"none",
            border:"none",
            borderBottom:`2px solid ${tab===n.id?C.accent:"transparent"}`,
            color:tab===n.id?C.accent:C.muted,
            padding:"0 12px",
            fontSize:12,
            fontWeight:tab===n.id?600:500,
            cursor:"pointer",
            fontFamily:"inherit",
            display:"flex",
            alignItems:"center",
            gap:4,
            position:"relative",
            transition:"color .15s",
            letterSpacing:.1,
          }}>
            <span style={{fontSize:13}}>{n.icon}</span>
            <span>{n.label}</span>
            {n.badge&&<span style={{background:n.badgeColor,color:"#fff",borderRadius:10,fontSize:9,fontWeight:700,padding:"1px 5px",minWidth:14,textAlign:"center"}}>{n.badge}</span>}
          </button>
        ))}
        {/* Actions */}
        <div style={{marginLeft:"auto",display:"flex",gap:6,alignItems:"center",padding:"8px 0"}}>
          <Btn ch="Respaldo" v="ghost" sm onClick={exportBackup}/>
          <Btn ch="Restaurar" v="ghost" sm onClick={()=>setModal("backup")}/>
          <Btn ch="Cotizar" v="soft" sm onClick={()=>setModal("quote")}/>
          <Btn ch="✦ Lead IA" v="primary" sm onClick={()=>setModal("aiLead")}/>
          {gcal.isConnected ? (
            <button onClick={gcal.disconnect} style={{background:C.greenBg,color:C.green,border:`1px solid ${C.green}30`,borderRadius:10,padding:"5px 12px",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:5}}>
              <span style={{width:6,height:6,borderRadius:"50%",background:C.green,display:"inline-block"}}/>
              GCal
            </button>
          ) : (
            <button onClick={gcal.connect} disabled={gcal.loading} style={{background:"#fff",color:"#0A84FF",border:`1px solid ${C.border}`,borderRadius:10,padding:"5px 12px",fontSize:12,fontWeight:600,cursor:gcal.loading?"default":"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:5,opacity:gcal.loading?0.6:1}}>
              📅 {gcal.loading?"...":"GCal"}

          <button onClick={()=>{setSelSvc(null);setModal("svc");}} style={{background:"linear-gradient(135deg,#34C759,#30A84E)",color:"#fff",border:"none",borderRadius:10,padding:"6px 14px",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 2px 8px rgba(52,199,89,.3)"}}>+ Servicio</button>

      <div style={{padding:"24px 20px",maxWidth:960,margin:"0 auto"}}>

        {tab==="dashboard"&&(<>
          <div style={{marginBottom:20}}>

            <div style={{fontSize:24,fontWeight:900,letterSpacing:-0.5}}>Buenos días 👋</div>
          </div>
          {(urgentCount>0||followUpLeads.length>0||followUpQ.length>0||tallerSvcs.length>0||porCobrarSvcs.length>0)&&(
            <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
              {urgentCount>0&&<div style={{background:C.redBg,border:`1px solid ${C.red}33`,borderRadius:10,padding:"10px 16px",fontSize:13,color:C.red,fontWeight:700,flex:1,minWidth:160}}>🚨 {urgentCount} servicio{urgentCount>1?"s":""} urgente{urgentCount>1?"s":""}</div>}
              {followUpLeads.length>0&&<div onClick={()=>setTab("leads")} style={{background:C.orangeBg,border:`1px solid ${C.orange}33`,borderRadius:10,padding:"10px 16px",fontSize:13,color:C.orange,fontWeight:700,flex:1,minWidth:160,cursor:"pointer"}}>📞 {followUpLeads.length} lead{followUpLeads.length>1?"s":""} para seguimiento hoy</div>}
              {followUpQ.length>0&&<div onClick={()=>setTab("cotizaciones")} style={{background:followUpQHoy.length>0?C.orangeBg:C.accentBg,border:`1px solid ${followUpQHoy.length>0?C.orange:C.accent}33`,borderRadius:10,padding:"10px 16px",fontSize:13,color:followUpQHoy.length>0?C.orange:C.accentD,fontWeight:700,flex:1,minWidth:160,cursor:"pointer"}}>📋 {followUpQ.length} cotización{followUpQ.length>1?"es":""} en seguimiento{followUpQHoy.length>0?` · 🔔 ${followUpQHoy.length} hoy`:""}</div>}
              {porCobrarSvcs.length>0&&<div onClick={()=>{setTab("servicios");setSvcFilter("por_cobrar");}} style={{background:"#FEF3C7",border:"1px solid #D9770633",borderRadius:10,padding:"10px 16px",fontSize:13,color:"#D97706",fontWeight:700,flex:1,minWidth:160,cursor:"pointer"}}>💸 {porCobrarSvcs.length} por cobrar · {cur(porCobrarTotal)}</div>}
              {tallerSvcs.length>0&&<div onClick={()=>{setTab("servicios");setSvcFilter("en_taller");}} style={{background:"#CCFBF1",border:"1px solid #0D948833",borderRadius:10,padding:"10px 16px",fontSize:13,color:"#0D9488",fontWeight:700,flex:1,minWidth:160,cursor:"pointer"}}>🏪 {tallerSvcs.length} equipo{tallerSvcs.length>1?"s":""} en taller{tallerRetrasados.length>0?` · 🚨 ${tallerRetrasados.length} retrasado${tallerRetrasados.length>1?"s":""}`:tallerAlerta.length>0?` · ⚠ ${tallerAlerta.length} sin mov.`:""}</div>}
              {postSeguimientoSvcs.length>0&&<div onClick={()=>{const el=document.getElementById("widget-seguimiento");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}} style={{background:C.purpleBg,border:"1px solid #8B5CF633",borderRadius:10,padding:"10px 16px",fontSize:13,color:C.purple,fontWeight:700,flex:1,minWidth:160,cursor:"pointer"}}>📲 {postSeguimientoSvcs.length} seguimiento{postSeguimientoSvcs.length>1?"s":""} post-servicio — ver abajo ↓</div>}
              {sinFechaSvcs.length>0&&<div onClick={()=>{const el=document.getElementById("widget-sinfecha");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}} style={{background:"#FFF8EC",border:"1px solid #FF9F0A33",borderRadius:10,padding:"10px 16px",fontSize:13,color:C.orange,fontWeight:700,flex:1,minWidth:160,cursor:"pointer"}}>🕐 {sinFechaSvcs.length} pendiente{sinFechaSvcs.length>1?"s":""} sin fecha — ver abajo ↓</div>}

          </div>
          {tallerSvcs.length>0&&(
            <div style={{background:"#F0FDFA",border:"1.5px solid #0D948844",borderRadius:14,padding:"16px 20px",marginBottom:20}}>

                <div style={{fontWeight:900,fontSize:15,color:"#0D9488"}}>🏪 Taller — {tallerSvcs.length} equipo{tallerSvcs.length>1?"s":""}</div>

                  {tallerRetrasados.length>0&&<span style={{background:C.redBg,color:C.red,borderRadius:8,padding:"3px 10px",fontSize:11,fontWeight:700}}>🚨 {tallerRetrasados.length} retrasado{tallerRetrasados.length>1?"s":""}</span>}

          </div>
          {filteredLeads.map(l=>(
            <Card key={l.id} style={{marginBottom:10,borderLeft:`3px solid ${(LEAD_ST[l.status]&&LEAD_ST[l.status].color)||C.muted}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4,flexWrap:"wrap"}}><LeadBdg status={l.status}/><span style={{color:C.muted,fontSize:12}}>📣 {l.source} · {fmtD(l.date)}</span></div>
                  <div style={{fontWeight:800,fontSize:16}}>{l.name}</div>
                  {l.interest&&<div style={{color:C.sub,fontSize:13,marginTop:2}}>💬 {l.interest}</div>}
                  {l.notes&&<div style={{color:C.muted,fontSize:12,marginTop:4,fontStyle:"italic"}}>"{l.notes}"</div>}
                  {l.followUp&&<div style={{color:l.followUp<=tod2?C.red:C.orange,fontSize:12,marginTop:4,fontWeight:600}}>📅 Seguimiento: {fmtD(l.followUp)}</div>}
                </div>
                <div style={{display:"flex",gap:6,alignItems:"center",flexShrink:0,flexWrap:"wrap"}}>
                  <select value={l.status} onChange={e=>setLeads(p=>p.map(ld=>ld.id===l.id?{...ld,status:e.target.value}:ld))} style={{background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"6px 10px",color:C.text,fontSize:12,fontFamily:"inherit"}}>
                    {Object.entries(LEAD_ST).map(([v,c])=><option key={v} value={v}>{c.label}</option>)}
                  </select>
                  <Btn ch="✏" v="ghost" sm onClick={()=>setSelLead(l)}/>
                  {l.phone&&<Btn ch="📲" v="ghost" sm onClick={()=>window.open(`https://wa.me/52${l.phone.replace(/\D/g,"")}`,"_blank")}/>}
                  {l.status!=="cerrado"&&<Btn ch="→ Servicio" v="green" sm onClick={()=>{addSvcFromLead({name:l.name,phone:l.phone,serviceType:l.interest,notes:l.notes||""});setLeads(p=>p.map(ld=>ld.id===l.id?{...ld,status:"cerrado"}:ld));fireToast(`✅ Servicio creado para ${l.name}`);}}/>}
                </div>
              </div>
            </Card>
          ))}
        </>)}

        {tab==="inventario"&&(<>
          <InvTab inv={inv} setInv={setInv} addTxn={addTxn} tod2={tod2} provs={provs} setProvs={setProvs} ocs={ocs} setOcs={setOcs}/>
        </>)}

        {tab==="nomina"&&(<>
          <NominaTab empleados={empleados} setEmpleados={setEmpleados} nominas={nominas} setNominas={setNominas} svcs={svcs} setSvcs={setSvcs} addTxn={addTxn} tod2={tod2}/>
        </>)}
      </div>

      {modal==="svc"&&<SvcModal key={selSvc?selSvc.id:"nuevo"} svc={selSvc} onClose={()=>{setModal(null);setSelSvc(null);}} onSave={saveSvc} onDelete={deleteSvc} onAddTxn={addTxn} inv={inv} setInv={setInv} txns={txns} svcsAll={svcs} quotes={quotes} onSaveQuote={saveQuote} gcalConnected={gcal.isConnected} empleados={empleados} onSyncGcal={(svc)=>{
        gcal.syncEvent(svc).then(eventId=>{
          if(eventId) {
            saveSvc({...svc,gcalEventId:eventId});
            fireToast("📅 Sincronizado con Google Calendar");
          } else {
            fireToast("⚠ No se pudo sincronizar — revisa la conexión");
          }
        });
      }} onNuevaCotizacion={(svc)=>{
        // Si viene sin id es reagenda
        if(!svc.id) {
          // Construir objeto limpio sin id ni folio para forzar creación nueva
          const base={client:svc.client,phone:svc.phone,address:svc.address,type:svc.type,
            priority:svc.priority,source:svc.source,tech:svc.tech,helper:svc.helper,
            notes:svc.notes,quotePrice:svc.quotePrice,checks:svc.checks,checked:{},
            time:svc.time,timeFin:svc.timeFin,status:"pendiente",amount:0,payMethod:"",
            cancelMotivo:"",cancelTipo:"",gcalEventId:""};
          if(svc.date) {
            saveSvc({...base, date:svc.date});
            fireToast("📆 Reagendado para el "+new Date(svc.date+"T12:00:00").toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"}));
          } else {
            saveSvc({...base, date:""});
          }
          return;
        }
        // Normal: guardar servicio actual y abrir QuoteModal pre-llenado
        saveSvc(svc);
        setModal(null);
        setSelSvcParaCot(svc);
        setModal("quoteDesdeSvc");
      }}/>}
      {modal==="txn"&&<TxnModal existing={editTxn} onClose={()=>{setModal(null);setEditTxn(null);}} onSave={saveTxn} incCats={incCats} expCats={expCats}/>}
      {modal==="quote"&&<QuoteModal onClose={()=>setModal(null)} quotes={quotes} setQuotes={setQuotes} catalog={cat} setCatalog={setCat} inv={inv} tod2={tod2} clausulas={clausulas} setClausulas={setClausulas}/>}
      {modal==="quoteDesdeSvc"&&selSvcParaCot&&<QuoteModal onClose={()=>{setModal(null);setSelSvcParaCot(null);}} quotes={quotes} setQuotes={setQuotes} catalog={cat} setCatalog={setCat} inv={inv} tod2={tod2} clausulas={clausulas} setClausulas={setClausulas} svcOrigen={selSvcParaCot} onQuoteCreada={(q)=>{
        // Vincular cotización al servicio
        saveSvc({...selSvcParaCot, cotizacionId:q.id, cotizacionFolio:q.folio, quotePrice:q.total});
        setSelSvcParaCot(null);
        fireToast("🔗 Cotización "+q.folio+" creada y vinculada a "+selSvcParaCot.folio);
      }}/>}
      {modal==="wa"&&<WAModal service={waTarget} onClose={()=>setModal(null)}/>}
      {modal==="aiLead"&&<LeadParser onClose={()=>setModal(null)} onCreateService={addSvcFromLead} onCreateLead={addLeadFromParser}/>}
      {modal==="addLead"&&<AddLeadModal onClose={()=>setModal(null)} onAdd={l=>setLeads(p=>[l,...p])}/>}
      {modal==="movRapido"&&<MovRapidoModal onClose={()=>setModal(null)} onSave={saveTxn} tod2={tod2}/>}
      {modal==="backup"&&<BackupModal data={{svcs,txns,leads,quotes,cat,inv,tdc}} onClose={()=>setModal(null)} onImport={d=>{if(d.svcs)setSvcs(d.svcs);if(d.txns)setTxns(d.txns);if(d.leads)setLeads(d.leads);if(d.quotes)setQuotes(d.quotes);if(d.cat)setCat(d.cat);if(d.inv)setInv(d.inv);if(d.provs)setProvs(d.provs);if(d.ocs)setOcs(d.ocs);if(d.tdc)setTdc(d.tdc);}}/>}
      {selQuote&&<QuoteDetailModal key={selQuote.id} quote={selQuote} onClose={()=>setSelQuote(null)} onSave={saveQuote} onDelete={deleteQuote} onEdit={q=>{setSelQuote(null);setEditQuote(q);}} clausulas={clausulas} setClausulas={setClausulas} svcs={svcs} empleados={empleados} onCrearServicio={(svcData, q)=>{
        const id=_sid++;
        const folio="SV-"+String(id).padStart(3,"0");
        setSvcs(p=>[{...svcData,id,folio,created:tod2,amount:0,payMethod:""},...p]);
        setQuotes(p=>p.map(x=>x.id===q.id?{...x,servicioId:id,servicioFolio:folio}:x));
        fireToast("✅ Servicio "+folio+" creado y vinculado a "+q.folio);
      }}/>}
      {pendingAgendarCot&&<AgendarDesdeCotModal
        quote={pendingAgendarCot}
        empleados={empleados}
        onClose={()=>setPendingAgendarCot(null)}
        onCrear={(svcData)=>{
          const id=_sid++;
          const folio="SV-"+String(id).padStart(3,"0");
          setSvcs(p=>[{...svcData,id,folio,created:tod2,amount:0,payMethod:""},...p]);
          setQuotes(p=>p.map(x=>x.id===pendingAgendarCot.id?{...x,servicioId:id,servicioFolio:folio}:x));
          fireToast("✅ Servicio "+folio+" agendado y vinculado a "+pendingAgendarCot.folio);
          setPendingAgendarCot(null);
        }}
      />}
      {editQuote&&<QuoteModal key={editQuote.id} onClose={()=>setEditQuote(null)} quotes={quotes} setQuotes={setQuotes} catalog={cat} setCatalog={setCat} inv={inv} tod2={tod2} clausulas={clausulas} setClausulas={setClausulas} editQuote={editQuote}/>}
      {pendingDelTxn&&<ConfirmModal msg="¿Eliminar este movimiento?" onOk={()=>{setTxns(p=>p.filter(t=>t.id!==pendingDelTxn));setPendingDelTxn(null);}} onCancel={()=>setPendingDelTxn(null)}/>}
      {cobrarTarget&&<CobrarModal svc={cobrarTarget} onClose={()=>setCobrarTarget(null)} onCobrar={(monto,method,fechaCobro)=>{
        const updated={...cobrarTarget,status:"completado",amount:monto,payMethod:method,fechaCobro:fechaCobro};
        saveSvc(updated);
        addTxn({
          date:fechaCobro,
          concept:(cobrarTarget.folio||cobrarTarget.client)+" — "+(cobrarTarget.type||"Servicio"),
          category:"Servicio A/C",
          classification:"Variable",
          type:"ingreso",
          amount:monto,
          method:method,
          status:"realizado",
          auto:true,
        });
        setCobrarTarget(null);
        fireToast("✅ Cobro registrado — "+cur(monto)+" en Finanzas");
      }}/>}
      {selLead&&<EditLeadModal lead={selLead} onClose={()=>setSelLead(null)} onSave={l=>setLeads(p=>p.map(x=>x.id===l.id?l:x))} onDelete={id=>{setLeads(p=>p.filter(x=>x.id!==id));setSelLead(null);}}/>}
      {printQuote&&<PrintQuoteModal q={printQuote} onClose={()=>setPrintQuote(null)}/>}
      {showCatManager&&<CatManager incCats={incCats} expCats={expCats} txns={txns} onSaveInc={setIncCats} onSaveExp={setExpCats} onClose={()=>setShowCatManager(false)} onRename={renameCategory}/>}
      {selSeguimiento&&<SeguimientoModal svc={selSeguimiento} onClose={()=>setSelSeguimiento(null)} onHecho={s=>{
        // Si viene con seguimientoHecho:false significa que quiere reagendar
        if(s.seguimientoHecho===false) {
          saveSvc({...s, seguimientoHecho:false, seguimientoDias:s.seguimientoDias});
          fireToast("📅 Nuevo seguimiento programado en "+s.seguimientoDias+" días");
        } else {
          saveSvc({...s, seguimientoHecho:true});
        }
      }} onAbrirServicio={s=>{setSelSvc(s);setModal("svc");}}/>}
      {toastMsg&&<Toast msg={toastMsg} onDone={()=>setToastMsg(null)}/>}
      {calTip.svc&&<CalTooltip svc={calTip.svc} x={calTip.x} y={calTip.y}/>}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
  <script>
    if('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(()=>{});
      });
    }
  </script>
</body>
</html>
