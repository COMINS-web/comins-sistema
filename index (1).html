              {c==="todos"?"Todos":c}
            </button>
          ))}
        </div>
        {filtered.length===0&&<div style={{color:C.muted,textAlign:"center",padding:40}}>No hay productos. Agrega tu primer artículo.</div>}
        {filtered.map(item=>{
          const bajo    = item.minStock>0&&item.stock<=item.minStock;
          const utilUnit= (item.salePrice||0)-(item.costUnit||0);
          const margen  = item.salePrice>0?Math.round((utilUnit/item.salePrice)*100):null;
          return (
            <Card key={item.id} style={{marginBottom:10,borderLeft:`3px solid ${bajo?C.red:item.stock===0?C.muted:C.green}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4,flexWrap:"wrap"}}>
                    <span style={{background:C.accentBg,color:C.accentD,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>{item.cat}</span>
                    {bajo&&<span style={{background:C.redBg,color:C.red,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>⚠ Stock bajo</span>}
                    {item.stock===0&&<span style={{background:"#f1f5f9",color:C.muted,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>Sin stock</span>}
                    {margen!==null&&<span style={{background:margen>=30?C.greenBg:margen>=10?C.orangeBg:C.redBg,color:margen>=30?C.green:margen>=10?C.orange:C.red,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>{margen}% margen</span>}
                  </div>
                  <div style={{fontWeight:800,fontSize:16}}>{item.name}</div>
                  <div style={{display:"flex",gap:16,marginTop:4,flexWrap:"wrap"}}>
                    <span style={{fontSize:13,color:C.sub}}>📦 <strong style={{color:bajo?C.red:C.green}}>{item.stock} {item.unit}</strong></span>
                    {item.costUnit>0&&<span style={{fontSize:13,color:C.muted}}>Costo: {cur(item.costUnit)}</span>}
                    {item.salePrice>0&&<span style={{fontSize:13,color:C.purple}}>Venta: {cur(item.salePrice)}</span>}
                    {item.costUnit>0&&item.salePrice>0&&<span style={{fontSize:13,color:C.green}}>Ganancia/u: {cur(utilUnit)}</span>}
                  </div>
                  {item.notes&&<div style={{fontSize:12,color:C.muted,marginTop:4,fontStyle:"italic"}}>{item.notes}</div>}
                  {/* Mini historial */}
                  {(item.movs||[]).length>0&&(
                    <div style={{marginTop:8,borderTop:`1px solid ${C.border}`,paddingTop:8}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                        <span style={{fontSize:11,color:C.muted,fontWeight:700}}>ÚLTIMOS MOVIMIENTOS</span>
                        <span style={{fontSize:10,color:C.muted}}>{(item.movs||[]).length} total</span>
                      </div>
                      {(item.movs||[]).slice(0,5).map((m,i)=>(
                        <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:12,color:C.sub,marginBottom:4,gap:6}}>
                          <span style={{flex:1}}>{m.tipo==="entrada"?"📥":"📤"} {m.concepto} — {m.qty} {item.unit}</span>
                          <span style={{color:C.muted,flexShrink:0}}>{fmtD(m.fecha)}</span>
                          <button onClick={e=>{e.stopPropagation();if(window._confirmDelete){window._confirmDelete(()=>setInv(p=>p.map(x=>x.id===item.id?{...x,movs:(x.movs||[]).filter((_,j)=>j!==i)}:x)));}else{setInv(p=>p.map(x=>x.id===item.id?{...x,movs:(x.movs||[]).filter((_,j)=>j!==i)}:x));}}} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:14,padding:"0 2px",flexShrink:0}}>🗑</button>
                        </div>
                      ))}
                      {(item.movs||[]).length>5&&<div style={{fontSize:11,color:C.muted,textAlign:"center",marginTop:4}}>+{(item.movs||[]).length-5} más — edita el producto para ver todos</div>}
                    </div>
                  )}
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",flexShrink:0}}>
                  <Btn ch="🔧 Usar" v="soft" sm onClick={()=>{setSel(item);setModal("usar");}}/>
                  <Btn ch="📥 Recibir" v="green" sm onClick={()=>{setSel(item);setModal("recibir");}}/>
                  <Btn ch="✏" v="ghost" sm onClick={()=>{setSel(item);setModal("add");}}/>
                </div>
              </div>
            </Card>
          );
        })}
      </>)}

      {vista==="proveedores"&&<ProveedoresView provs={provs} setProvs={setProvs}/>}
      {vista==="ocs"&&<OCsView ocs={ocs} setOcs={setOcs} inv={inv} setInv={setInv} provs={provs} tod2={tod2}/>}
      {(modal==="add"||modal==="edit")&&<InvFormModal item={sel} onClose={()=>{setModal(null);setSel(null);}} onSave={saveItem} onDelete={()=>setConfirmDel(true)} provs={provs}/>}
      {modal==="usar"&&sel&&<UsarItemModal item={sel} onClose={()=>{setModal(null);setSel(null);}} onConfirm={usarItem}/>}
      {modal==="recibir"&&sel&&<RecibirModal item={sel} onClose={()=>{setModal(null);setSel(null);}} onConfirm={recibirCompra}/>}
      {confirmDel&&sel&&<ConfirmModal msg={`¿Eliminar ${sel.name} del inventario?`} onOk={()=>deleteItem(sel.id)} onCancel={()=>setConfirmDel(false)}/>}
    </div>
  );
}

const OC_STATUS = {
  pendiente:  {label:"Pendiente",  color:C.orange, bg:C.orangeBg},
  enviada:    {label:"Enviada",    color:C.accent, bg:C.accentBg},
  recibida:   {label:"Recibida",   color:C.green,  bg:C.greenBg},
  cancelada:  {label:"Cancelada",  color:C.red,    bg:C.redBg},
};

function OCsView({ocs, setOcs, inv, setInv, provs, tod2}) {
  const [selOC,      setSelOC]     = useState(null);
  const [confirmDel, setConfirmDel]= useState(false);

  const updateStatus = (oc, status) => {
    setOcs(p=>p.map(x=>x.id===oc.id?{...x,status}:x));
    if(status==="recibida") {
      // Auto-recibir stock para cada item
      oc.items.forEach(it=>{
        setInv(p=>p.map(x=>x.id===it.invId?{...x,
          stock:(x.stock||0)+it.cantSugerida,
          movs:[{fecha:tod2,tipo:"entrada",qty:it.cantSugerida,concepto:`OC ${oc.folio}`},...(x.movs||[])]
        }:x));
      });
      fireToast(`✅ Stock actualizado desde ${oc.folio}`);
    }
  };

  const copyOC = (oc) => {
    const porsProveedor = {};
    oc.items.forEach(it=>{
      const key = it.provName||"Sin proveedor";
      if(!porsProveedor[key]) porsProveedor[key]=[];
      porsProveedor[key].push(it);
    });
    let txt = `*ORDEN DE COMPRA ${oc.folio}*\nFecha: ${oc.fecha}\n\n`;
    Object.entries(porsProveedor).forEach(([prov,items])=>{
      txt += `*Proveedor: ${prov}*\n`;
      items.forEach(i=>{ txt += `• ${i.name}: ${i.cantSugerida} ${i.unit}\n`; });
      txt += "\n";
    });
    txt += "_Generada desde MULTISERVICIOS SJR_";
    navigator.clipboard.writeText(txt).then(()=>fireToast("✅ OC copiada al portapapeles"));
  };

  if(ocs.length===0) return (
    <div style={{textAlign:"center",padding:40,color:C.muted}}>
      <div style={{fontSize:40,marginBottom:12}}>📋</div>
      <div style={{fontWeight:700,marginBottom:8}}>Sin órdenes de compra</div>
      <div style={{fontSize:13}}>Cuando haya stock bajo, usa el botón "📋 Generar OC" en las alertas</div>
    </div>
  );

  return (
    <div>
      <div style={{fontWeight:800,fontSize:16,marginBottom:16}}>📋 Órdenes de Compra</div>
      {ocs.map(oc=>{
        const st = OC_STATUS[oc.status]||OC_STATUS.pendiente;
        // Agrupar por proveedor
        const porProv = {};
        oc.items.forEach(it=>{
          const k = it.provName||"Sin proveedor";
          if(!porProv[k]) porProv[k]=[];
          porProv[k].push(it);
        });
        return (
          <Card key={oc.id} style={{marginBottom:12,borderLeft:`3px solid ${st.color}`}}>
            {/* Header OC */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap",marginBottom:12}}>
              <div>
                <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4}}>
                  <span style={{fontWeight:900,fontSize:16}}>{oc.folio}</span>
                  <span style={{background:st.bg,color:st.color,borderRadius:6,padding:"2px 10px",fontSize:11,fontWeight:700}}>{st.label}</span>
                </div>
                <div style={{fontSize:12,color:C.muted}}>📅 {oc.fecha} · {oc.items.length} productos · {Object.keys(porProv).length} proveedor(es)</div>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {oc.status==="pendiente"&&<Btn ch="📲 Copiar WA" v="soft" sm onClick={()=>copyOC(oc)}/>}
                {oc.status!=="recibida"&&oc.status!=="cancelada"&&(
                  <select value={oc.status} onChange={e=>updateStatus(oc,e.target.value)}
                    style={{background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"5px 10px",fontSize:12,fontFamily:"inherit",color:C.text}}>
                    {Object.entries(OC_STATUS).map(([v,c])=><option key={v} value={v}>{c.label}</option>)}
                  </select>
                )}
                <Btn ch="🗑" v="danger" sm onClick={()=>{setSelOC(oc);setConfirmDel(true);}}/>
              </div>
            </div>

            {/* Tabla por proveedor */}
            {Object.entries(porProv).map(([prov,items])=>{
              const provData = provs.find(p=>p.name===prov);
              return (
                <div key={prov} style={{marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.surfaceAlt,borderRadius:8,padding:"6px 12px",marginBottom:6}}>
                    <span style={{fontWeight:700,fontSize:13}}>🏢 {prov}</span>
                    {(provData&&provData.phone)&&(
                      <Btn ch={`📲 ${provData.phone}`} v="ghost" sm onClick={()=>window.open(`https://wa.me/52${provData.phone.replace(/[^0-9]/g,"")}`, "_blank")}/>
                    )}
                  </div>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                    <thead>
                      <tr style={{background:C.accent,color:"#fff"}}>
                        <th style={{padding:"7px 10px",textAlign:"left"}}>Producto</th>
                        <th style={{padding:"7px 10px",textAlign:"center",width:80}}>Stock actual</th>
                        <th style={{padding:"7px 10px",textAlign:"center",width:80}}>Mínimo</th>
                        <th style={{padding:"7px 10px",textAlign:"center",width:100}}>Cant. sugerida</th>
                      </tr>
                    </thead>
                    <tbody>
                      {items.map((it,i)=>(
                        <tr key={i} style={{borderBottom:`1px solid ${C.border}`,background:i%2===1?C.surfaceAlt:"#fff"}}>
                          <td style={{padding:"7px 10px"}}>{it.name}</td>
                          <td style={{padding:"7px 10px",textAlign:"center",color:C.red,fontWeight:700}}>{it.stockActual} {it.unit}</td>
                          <td style={{padding:"7px 10px",textAlign:"center",color:C.muted}}>{it.minStock} {it.unit}</td>
                          <td style={{padding:"7px 10px",textAlign:"center"}}>
                            <input type="number" defaultValue={it.cantSugerida} min="1"
                              onChange={e=>setOcs(p=>p.map(o=>o.id===oc.id?{...o,items:o.items.map((x,j)=>j===i&&items===porProv[prov]?{...x,cantSugerida:parseFloat(e.target.value)||1}:x)}:o))}
                              style={{width:60,background:C.accentBg,border:`1.5px solid ${C.accent}`,borderRadius:6,padding:"4px 6px",textAlign:"center",fontSize:13,fontFamily:"inherit",color:C.accentD,fontWeight:700}}/>
                            <span style={{marginLeft:4,fontSize:11,color:C.muted}}>{it.unit}</span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              );
            })}
          </Card>
        );
      })}
      {confirmDel&&selOC&&<ConfirmModal msg={`¿Eliminar ${selOC.folio}?`} onOk={()=>{setOcs(p=>p.filter(x=>x.id!==selOC.id));setConfirmDel(false);setSelOC(null);}} onCancel={()=>{setConfirmDel(false);setSelOC(null);}}/>}
    </div>
  );
}

let _pid = 1;
let _ocid = 1;

function ProveedoresView({provs, setProvs}) {
  const [modal,      setModal]     = useState(null); // "add"|"edit"
  const [sel,        setSel]       = useState(null);
  const [search,     setSearch]    = useState("");
  const [confirmDel, setConfirmDel]= useState(false);

  useEffect(()=>{
    if(provs.length>0) _pid = Math.max(_pid,...provs.map(p=>p.id||0))+1;
  },[]);

  const filtered = provs
    .filter(p=>!search||p.name.toLowerCase().includes(search.toLowerCase())||
               (p.contact||"").toLowerCase().includes(search.toLowerCase()))
    .sort((a,b)=>a.name.localeCompare(b.name));

  const saveProv = (prov) => {
    if(prov.id && provs.find(x=>x.id===prov.id)) setProvs(p=>p.map(x=>x.id===prov.id?prov:x));
    else setProvs(p=>[{...prov,id:_pid++},...p]);
    setModal(null); setSel(null);
  };
  const deleteProv = (id) => { setProvs(p=>p.filter(x=>x.id!==id)); setModal(null); setSel(null); setConfirmDel(false); };

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,gap:10}}>
        <div style={{fontWeight:800,fontSize:16,color:C.text}}>🏢 Directorio de Proveedores</div>
        <Btn ch="+ Nuevo proveedor" v="primary" sm onClick={()=>{setSel(null);setModal("add");}}/>
      </div>

      {provs.length===0&&(
        <div style={{background:C.accentBg,borderRadius:12,padding:24,textAlign:"center",marginBottom:16}}>
          <div style={{fontSize:32,marginBottom:8}}>🏢</div>
          <div style={{fontWeight:700,color:C.accentD,marginBottom:4}}>Sin proveedores registrados</div>
          <div style={{fontSize:13,color:C.muted}}>Agrega tus proveedores para asignarlos a tus productos</div>
        </div>
      )}

      {provs.length>0&&(
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar proveedor..." style={{width:"100%",background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:10,padding:"10px 16px",color:C.text,fontSize:14,fontFamily:"inherit",marginBottom:14,boxSizing:"border-box"}}/>
      )}

      {filtered.map(prov=>(
        <Card key={prov.id} style={{marginBottom:10,borderLeft:`3px solid ${C.accent}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:800,fontSize:16,marginBottom:4}}>{prov.name}</div>
              <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
                {prov.contact&&<span style={{fontSize:13,color:C.sub}}>👤 {prov.contact}</span>}
                {prov.phone&&<span style={{fontSize:13,color:C.sub}}>📞 {prov.phone}</span>}
                {prov.email&&<span style={{fontSize:13,color:C.sub}}>✉ {prov.email}</span>}
              </div>
              {prov.address&&<div style={{fontSize:12,color:C.muted,marginTop:4}}>📍 {prov.address}</div>}
              {prov.notes&&<div style={{fontSize:12,color:C.muted,marginTop:4,fontStyle:"italic"}}>{prov.notes}</div>}
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0}}>
              {prov.phone&&(
                <Btn ch="📲 WA" v="soft" sm onClick={()=>window.open(`https://wa.me/52${prov.phone.replace(/[^0-9]/g,"")}`, "_blank")}/>
              )}
              <Btn ch="✏" v="ghost" sm onClick={()=>{setSel(prov);setModal("edit");}}/>
            </div>
          </div>
        </Card>
      ))}

      {modal&&(
        <ProvFormModal
          prov={sel}
          onClose={()=>{setModal(null);setSel(null);}}
          onSave={saveProv}
          onDelete={()=>setConfirmDel(true)}
        />
      )}
      {confirmDel&&sel&&<ConfirmModal msg={`¿Eliminar proveedor ${sel.name}?`} onOk={()=>deleteProv(sel.id)} onCancel={()=>setConfirmDel(false)}/>}
    </div>
  );
}

function ProvFormModal({prov, onClose, onSave, onDelete}) {
  const editing = !!prov;
  const [f,setF] = useState(prov||{name:"",contact:"",phone:"",email:"",address:"",notes:""});
  const set = (k,v)=>setF(p=>({...p,[k]:v}));
  const [confirmDel,setConfirmDel] = useState(false);
  return (
    <>
    <Modal title={editing?"✏ Editar proveedor":"➕ Nuevo proveedor"} onClose={onClose}>
      <div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
          <div style={{gridColumn:"1/-1"}}><Inp label="Nombre del negocio *" value={f.name} onChange={e=>set("name",e.target.value)} placeholder="Ej: Refricentro, Climatización del Norte..."/></div>
          <Inp label="Contacto / Vendedor" value={f.contact||""} onChange={e=>set("contact",e.target.value)} placeholder="Nombre de la persona"/>
          <Inp label="Teléfono / WhatsApp" value={f.phone||""} onChange={e=>set("phone",e.target.value)} placeholder="5551234567"/>
          <Inp label="Email" value={f.email||""} onChange={e=>set("email",e.target.value)} placeholder="ventas@proveedor.com"/>
          <Inp label="Ciudad / Dirección" value={f.address||""} onChange={e=>set("address",e.target.value)} placeholder="Ciudad, Estado"/>
          <div style={{gridColumn:"1/-1"}}><Txta label="Notas" value={f.notes||""} onChange={e=>set("notes",e.target.value)} placeholder="Días de entrega, condiciones de pago, productos que maneja..."/></div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:8,flexWrap:"wrap"}}>
          <Btn ch="Cancelar" v="ghost" onClick={onClose}/>

    {confirmDel&&<ConfirmModal msg={`¿Eliminar a ${f.name}?`} onOk={()=>{onDelete(f.id);onClose();}} onCancel={()=>setConfirmDel(false)}/>}
    </>
  );
}

                  <button onClick={()=>setF(p=>({...p,movs:(p.movs||[]).filter((_,j)=>j!==i)}))} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:14,padding:0,flexShrink:0}}>🗑</button>
                </div>
              ))}
            </div>
          </div>
        )}
        <div style={{display:"flex",gap:10,marginTop:12,flexWrap:"wrap"}}>
          <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
          {editing&&<Btn ch="🗑 Eliminar producto" v="danger" onClick={()=>setConfirmDel(true)}/>}
          <Btn ch="💾 Guardar" v="primary" onClick={()=>{if(!f.name)return fireToast("⚠ Ingresa el nombre");onSave(f);}}/>
        </div>
      </div>
    </Modal>
    {confirmDel&&<ConfirmModal msg={`¿Eliminar ${f.name}?`} onOk={()=>{onDelete(f.id);onClose();}} onCancel={()=>setConfirmDel(false)}/>}
    </>
  );
}

function CajaView({txns, tod2, inPeriod, finPeriod, finFrom, finTo, medio, onSave}) {
  const MEDIOS_INFO = {
    efectivo:     {icon:"💵", label:"Efectivo",     color:"#10B981", bg:"#D1FAE5", sub:"Caja física", saldo:"debería haber en caja"},
    transferencia:{icon:"🏦", label:"Banco / SPEI", color:"#0EA5E9", bg:"#E0F2FE", sub:"Banamex",     saldo:"saldo en banco — incluye depósitos de terminal"},
  };
  const m = MEDIOS_INFO[medio]||MEDIOS_INFO.efectivo;

  // Banco agrupa: transferencia + tdd + cargo_auto
  const bancMetodos = ["transferencia","tdd","cargo_auto"];
  const medioTxns = txns
    .filter(t=>{
      const match = medio==="transferencia"
        ? bancMetodos.includes(t.method)
        : t.method===medio;
      return match && t.status==="realizado" && inPeriod(t.date,finPeriod,finFrom,finTo);
    })
    .sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);

  const porDia = {};
  medioTxns.forEach(t=>{
    if(!porDia[t.date]) porDia[t.date]=[];
    porDia[t.date].push(t);
  });

  const totalEnt = medioTxns.filter(t=>t.type==="ingreso").reduce((s,t)=>s+t.amount,0);
  const totalSal = medioTxns.filter(t=>t.type==="egreso").reduce((s,t)=>s+t.amount,0);
  const saldo    = totalEnt - totalSal;

  // Quick entry sin preguntar medio
  const [qTipo,    setQTipo]    = useState("ingreso");
  const [qMonto,   setQMonto]   = useState("");
  const [qConcepto,setQConcepto]= useState("");

  const qGuardar = () => {
    if(!qMonto||parseFloat(qMonto)<=0) return fireToast("⚠ Ingresa el monto");
    if(!qConcepto.trim()) return fireToast("⚠ Ingresa el concepto");
    onSave({date:tod2, concept:qConcepto.trim(), category:qTipo==="ingreso"?"Servicio A/C":"Otros",
      classification:"Variable", type:qTipo, amount:parseFloat(qMonto),
      method:medio, status:"realizado", auto:false});
    setQMonto(""); setQConcepto("");
    fireToast(`✅ ${qTipo==="ingreso"?"+":"−"}$${qMonto} · ${m.label}`);
  };

  return (
    <div>
      {/* Header con color del medio */}
      <div style={{background:m.bg,borderRadius:12,padding:"14px 18px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={{fontWeight:900,fontSize:16,color:m.color}}>{m.icon} Corte — {m.label}</div>
        <div style={{fontSize:12,color:"#64748b"}}>{m.sub}</div>
      </div>

      {/* Quick entry — registrar movimiento sin salir */}
      <div style={{background:C.surface,border:`1.5px solid ${m.color}44`,borderRadius:12,padding:14,marginBottom:16}}>
        <Lbl t={m.id==="transferencia" ? "+ Agregar movimiento de Banco / Terminal" : "+ Agregar movimiento de Efectivo"}/>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
          <div style={{display:"flex",gap:4}}>
            <button onClick={()=>setQTipo("ingreso")} style={{background:qTipo==="ingreso"?C.greenBg:"transparent",border:`1.5px solid ${qTipo==="ingreso"?C.green:C.border}`,color:qTipo==="ingreso"?C.green:C.muted,borderRadius:8,padding:"8px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>💚 Entrada</button>
            <button onClick={()=>setQTipo("egreso")}  style={{background:qTipo==="egreso"?C.redBg:"transparent",border:`1.5px solid ${qTipo==="egreso"?C.red:C.border}`,color:qTipo==="egreso"?C.red:C.muted,borderRadius:8,padding:"8px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>🔴 Salida</button>
          </div>
          <input value={qConcepto} onChange={e=>setQConcepto(e.target.value)} placeholder="Concepto..." style={{flex:2,minWidth:120,background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"8px 12px",fontSize:13,fontFamily:"inherit",color:C.text}}/>
          <input type="number" value={qMonto} onChange={e=>setQMonto(e.target.value)} onKeyDown={e=>e.key==="Enter"&&qGuardar()} placeholder="$0.00" style={{width:100,background:C.surfaceAlt,border:`1.5px solid ${m.color}`,borderRadius:8,padding:"8px 12px",fontSize:14,fontFamily:"inherit",color:m.color,fontWeight:700,textAlign:"right"}}/>
          <button onClick={qGuardar} style={{background:m.color,color:"#fff",border:"none",borderRadius:8,padding:"8px 18px",fontSize:13,fontWeight:700,cursor:"pointer"}}>✅ Agregar</button>
        </div>
      </div>

      {/* Resumen */}
      <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        <StatCard label="Total entradas" value={cur(totalEnt)} icon="💚" color={C.green} sub={m.sub}/>
        <StatCard label="Total salidas"  value={cur(totalSal)} icon="🔴" color={C.red}   sub={m.sub}/>
        <StatCard label={medio==="efectivo"?"Saldo en caja":"Saldo neto"} value={cur(saldo)} icon={m.icon} color={saldo>=0?m.color:C.red} sub={m.saldo}/>
      </div>

      {/* Por día */}
      {Object.keys(porDia).sort((a,b)=>b.localeCompare(a)).map(fecha=>{
        const movs = porDia[fecha];
        const entDia = movs.filter(t=>t.type==="ingreso").reduce((s,t)=>s+t.amount,0);
        const salDia = movs.filter(t=>t.type==="egreso").reduce((s,t)=>s+t.amount,0);
        const saldoDia = entDia - salDia;
        return (
          <div key={fecha} style={{marginBottom:16}}>
            {/* Header día */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#1A202C",borderRadius:"10px 10px 0 0",padding:"10px 16px"}}>
              <div style={{fontWeight:800,fontSize:14,color:"#fff"}}>
                📅 {new Date(fecha+"T12:00:00").toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"})}
              </div>
              <div style={{display:"flex",gap:16,fontSize:12}}>
                <span style={{color:"#68D391"}}>+{cur(entDia)}</span>
                <span style={{color:"#FC8181"}}>−{cur(salDia)}</span>
                <span style={{color:saldoDia>=0?"#68D391":"#FC8181",fontWeight:900}}> = {cur(saldoDia)}</span>
              </div>
            </div>
            {/* Movimientos del día */}
            <div style={{border:`1px solid ${C.border}`,borderTop:"none",borderRadius:"0 0 10px 10px",overflow:"hidden"}}>
              {movs.map((t,i)=>(
                <div key={t.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 16px",borderBottom:i<movs.length-1?`1px solid ${C.border}`:"none",background:i%2===1?C.surfaceAlt:"#fff"}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,color:C.text}}>{t.concept}</div>
                    <div style={{fontSize:11,color:C.muted,marginTop:2,display:"flex",gap:8}}>
                      <span>{t.category}</span>
                      {t.auto&&<span style={{background:C.accentBg,color:C.accentD,borderRadius:4,padding:"0 5px",fontSize:10,fontWeight:700}}>AUTO</span>}
                    </div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{textAlign:"right",minWidth:80}}>
                      {t.category==="Capital / Apertura de caja"&&<div style={{fontSize:9,fontWeight:700,color:"#6366F1",background:"#EEF2FF",borderRadius:4,padding:"1px 5px",marginBottom:2}}>🏦 Capital</div>}
                      {t.category==="Retiro de socio / Utilidades"&&<div style={{fontSize:9,fontWeight:700,color:"#6366F1",background:"#EEF2FF",borderRadius:4,padding:"1px 5px",marginBottom:2}}>👤 Retiro de socio</div>}
                      <div style={{fontWeight:800,fontSize:15,color:t.category==="Capital / Apertura de caja"?"#6366F1":t.type==="ingreso"?C.green:C.red}}>
                        {t.type==="ingreso"?"+":"−"}{cur(t.amount)}
                      </div>
                    </div>
                    <button onClick={()=>onSave({...t,cotejado:!t.cotejado})} title={t.cotejado?"Quitar verificación":"Marcar como cotejado"} style={{background:t.cotejado?"#D1FAE5":"transparent",border:`1.5px solid ${t.cotejado?"#10B981":C.border}`,borderRadius:8,padding:"4px 8px",cursor:"pointer",fontSize:13,flexShrink:0,color:t.cotejado?"#10B981":C.muted}}>
                      {t.cotejado?"✓":"○"}
                    </button>
                  </div>
                </div>
              ))}
              {/* Subtotal día */}
              <div style={{display:"flex",justifyContent:"flex-end",padding:"8px 16px",background:C.surfaceAlt,borderTop:`1px solid ${C.border}`}}>
                <span style={{fontSize:12,color:C.muted,marginRight:16}}>Neto del día:</span>
                <span style={{fontWeight:900,fontSize:14,color:saldoDia>=0?C.green:C.red}}>{cur(saldoDia)}</span>
              </div>
            </div>
          </div>
        );
      })}

      {medioTxns.length===0&&(
        <div style={{textAlign:"center",padding:40,color:C.muted}}>
          <div style={{fontSize:32,marginBottom:8}}>💵</div>
          <div>Sin movimientos de efectivo en este período</div>
        </div>
      )}
    </div>
  );
}

  const getRango = () => {
    const hoy = new Date(tod2+"T12:00:00");
    const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if(periodo==="dia")    return {f:tod2, t:tod2};
    if(periodo==="semana") {
      const dow = hoy.getDay()===0?6:hoy.getDay()-1;
      const lun = new Date(hoy); lun.setDate(hoy.getDate()-dow);
      const dom = new Date(lun); dom.setDate(lun.getDate()+6);
      return {f:fmt(lun), t:fmt(dom), lun};
    }
    if(periodo==="mes")  { const m=String(mesSelec+1).padStart(2,"0"); return {f:`${anioSelec}-${m}-01`,t:`${anioSelec}-${m}-31`}; }
    if(periodo==="anio") return {f:`${anioSelec}-01-01`, t:`${anioSelec}-12-31`};
    if(periodo==="rango") return {f:desde||tod2, t:hasta||tod2};
    return {f:tod2, t:tod2};
  };

  const rango = getRango();
  const {f:fechaD, t:fechaH} = rango;
  const enRango = t => t.date>=fechaD && t.date<=fechaH && t.status==="realizado";
  const periodTxns = txns.filter(enRango);
  const ingresos   = periodTxns.filter(t=>t.type==="ingreso"&&t.category!=="Capital / Apertura de caja").reduce((s,t)=>s+t.amount,0);
  const capital    = periodTxns.filter(t=>t.category==="Capital / Apertura de caja").reduce((s,t)=>s+t.amount,0);
  const retiroSocio = periodTxns.filter(t=>t.type==="egreso"&&t.category==="Retiro de socio / Utilidades").reduce((s,t)=>s+t.amount,0);
  const egresos    = periodTxns.filter(t=>t.type==="egreso"&&t.category!=="Retiro de socio / Utilidades").reduce((s,t)=>s+t.amount,0);
  const utilidad   = ingresos-egresos;
  const rentabilidad = ingresos>0?Math.round((utilidad/ingresos)*100):0;

  // Título dinámico
  const getTitulo = () => {
    if(periodo==="dia") return `${new Date(tod2+"T12:00:00").toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"})}`;
    if(periodo==="semana") { const d=new Date(fechaD+"T12:00:00"),h=new Date(fechaH+"T12:00:00"); return `${d.getDate()} — ${h.getDate()} de ${MESES[h.getMonth()]} ${h.getFullYear()}`; }
    if(periodo==="mes") return `${MESES[mesSelec]} ${anioSelec}`;
    if(periodo==="anio") return `Año ${anioSelec}`;
    if(periodo==="rango"&&desde&&hasta) return `${fmtD(desde)} — ${fmtD(hasta)}`;
    return "Período seleccionado";
  };
  const titulo = getTitulo();

  // Categorías
  const getCats = (tipo, excludeCap=false) => {
    const map = {};
    periodTxns.filter(t=>t.type===tipo&&(!excludeCap||t.category!=="Capital / Apertura de caja")).forEach(t=>{ map[t.category]=(map[t.category]||0)+t.amount; });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  };
  const ingCats = getCats("ingreso", true);
  const egCats  = getCats("egreso");

  // Barras por período
  const getBarData = () => {
    if(periodo==="dia") {
      return [
        {l:"Mañana 6-12h", ing:periodTxns.filter(t=>t.type==="ingreso").reduce((s,t)=>s+t.amount,0)*0.4, eg:0},
        {l:"Tarde 12-18h", ing:periodTxns.filter(t=>t.type==="ingreso").reduce((s,t)=>s+t.amount,0)*0.6, eg:0},
      ].map(d=>({...d,ing:0,eg:0})).concat([{l:"Total",ing:ingresos,eg:egresos}]);
    }
    if(periodo==="semana") {
      const dias=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
      const lun=new Date(fechaD+"T12:00:00");
      return dias.map((l,i)=>{
        const d=new Date(lun); d.setDate(lun.getDate()+i);
        const fd=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
        return {l,fd,ing:txns.filter(t=>t.date===fd&&t.type==="ingreso"&&t.status==="realizado").reduce((s,t)=>s+t.amount,0),eg:txns.filter(t=>t.date===fd&&t.type==="egreso"&&t.status==="realizado").reduce((s,t)=>s+t.amount,0)};
      });
    }
    if(periodo==="mes") {
      return [1,2,3,4,5].map(s=>({
        l:`Sem ${s}`,
        ing:periodTxns.filter(t=>t.type==="ingreso"&&Math.ceil(parseInt(t.date.slice(8))/7)===s).reduce((s,t)=>s+t.amount,0),
        eg:periodTxns.filter(t=>t.type==="egreso"&&Math.ceil(parseInt(t.date.slice(8))/7)===s).reduce((s,t)=>s+t.amount,0),
      }));
    }
    if(periodo==="anio") {
      return MESES_CORTO.map((l,i)=>{
        const m=String(i+1).padStart(2,"0");
        return {l,ing:txns.filter(t=>t.date.startsWith(`${anioSelec}-${m}`)&&t.type==="ingreso"&&t.status==="realizado").reduce((s,t)=>s+t.amount,0),eg:txns.filter(t=>t.date.startsWith(`${anioSelec}-${m}`)&&t.type==="egreso"&&t.status==="realizado").reduce((s,t)=>s+t.amount,0)};
      });
    }
    return [{l:"Total",ing:ingresos,eg:egresos}];
  };
  const barData = getBarData();
  const barMax  = Math.max(...barData.map(d=>Math.max(d.ing||0,d.eg||0)),1);
  const BAR_H   = 180;

  // ── Donut SVG ──
  const DONUT_COLORS = ["#3B82F6","#10B981","#F59E0B","#EF4444","#8B5CF6","#06B6D4","#F472B6","#84CC16","#FB923C"];
  const Donut = ({items, total, colorBase, icon, label}) => {
    const [hovI, setHovI] = useState(null);
    if(!total||!items.length) return (
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px 0",gap:8}}>
        <div style={{width:100,height:100,borderRadius:"50%",border:`3px dashed ${C.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28}}>📭</div>
        <div style={{fontSize:12,color:C.muted}}>Sin datos</div>
      </div>
    );
    const R=52,CX=64,CY=64,SW=16,circ=2*Math.PI*R;
    let off=0;
    const slices=items.map((it,i)=>{const pct=it[1]/total;const dash=pct*circ;const s={cat:it[0],val:it[1],pct,dash,gap:circ-dash,offset:off,color:DONUT_COLORS[i%DONUT_COLORS.length]};off+=dash;return s;});
    return (
      <div style={{display:"flex",gap:16,alignItems:"center"}}>
        <div style={{position:"relative",flexShrink:0}} onMouseLeave={()=>setHovI(null)}>
          <svg width="128" height="128" viewBox="0 0 128 128">
            <circle cx={CX} cy={CY} r={R} fill="none" stroke={C.surfaceAlt} strokeWidth={SW}/>
            {slices.map((s,i)=>(
              <circle key={i} cx={CX} cy={CY} r={R} fill="none"
                stroke={s.color} strokeWidth={hovI===i?SW+4:SW}
                strokeDasharray={`${s.dash} ${s.gap}`}
                strokeDashoffset={circ/4-s.offset}
                style={{transition:"stroke-width .15s",cursor:"pointer"}}
                onMouseEnter={()=>setHovI(i)}/>
            ))}
            <text x={CX} y={CY-8} textAnchor="middle" style={{fontSize:10,fill:C.muted,fontFamily:"inherit"}}>Total</text>
            <text x={CX} y={CY+8} textAnchor="middle" style={{fontSize:11,fontWeight:700,fill:colorBase,fontFamily:"inherit"}}>{hovI!==null?`${Math.round(slices[hovI].pct*100)}%`:cur(total)}</text>
          </svg>
        </div>
        <div style={{flex:1,minWidth:0}}>
          {slices.map((s,i)=>(
            <div key={i} onMouseEnter={()=>setHovI(i)} onMouseLeave={()=>setHovI(null)}
              style={{display:"flex",alignItems:"center",gap:8,padding:"4px 8px",borderRadius:8,background:hovI===i?`${s.color}18`:"transparent",cursor:"default",transition:"background .15s",marginBottom:2}}>
              <div style={{width:10,height:10,borderRadius:3,background:s.color,flexShrink:0}}/>
              <div style={{flex:1,fontSize:11,color:C.text,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.cat}</div>
              <div style={{fontSize:11,fontWeight:800,color:s.color,flexShrink:0}}>{cur(s.val)}</div>
              <div style={{fontSize:10,color:C.muted,flexShrink:0}}>{Math.round(s.pct*100)}%</div>
            </div>
          ))}
        </div>
      </div>
    );
  };

  const PERIODOS = [{v:"dia",l:"Hoy"},{v:"semana",l:"Esta semana"},{v:"mes",l:"Este mes"},{v:"anio",l:"Este año"},{v:"rango",l:"📅 Rango"}];
  const rentColor = rentabilidad>=40?"#10B981":rentabilidad>=20?C.orange:C.red;

  return (
    <div style={{width:"100%"}}>
      {/* ── Selector período ── */}
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
        {PERIODOS.map(p=>(
          <button key={p.v} onClick={()=>setPeriodo(p.v)} style={{background:periodo===p.v?"#1A202C":"transparent",border:`1.5px solid ${periodo===p.v?"#1A202C":C.border}`,color:periodo===p.v?"#fff":C.sub,borderRadius:20,padding:"6px 18px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",transition:"all .15s"}}>{p.l}</button>
        ))}
      </div>
      {periodo==="rango"&&(
        <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:12,flexWrap:"wrap",background:C.surfaceAlt,borderRadius:10,padding:"10px 14px"}}>
          <span style={{fontSize:12,color:C.sub,fontWeight:700}}>Desde:</span>
          <input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{border:`1.5px solid ${C.accent}`,borderRadius:8,padding:"6px 10px",fontSize:12,fontFamily:"inherit",color:C.text,background:"#fff"}}/>
          <span style={{fontSize:12,color:C.sub,fontWeight:700}}>Hasta:</span>
          <input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{border:`1.5px solid ${C.accent}`,borderRadius:8,padding:"6px 10px",fontSize:12,fontFamily:"inherit",color:C.text,background:"#fff"}}/>
          {(desde||hasta)&&<button onClick={()=>{setDesde("");setHasta("");}} style={{background:C.redBg,border:"none",borderRadius:8,padding:"6px 10px",fontSize:11,fontWeight:700,cursor:"pointer",color:C.red}}>✕</button>}
        </div>
      )}

      {/* Título dinámico + selector de mes */}
      <div style={{marginBottom:16,position:"relative"}}>
        <div style={{fontSize:13,color:C.muted,fontWeight:600,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
          📅 Mostrando:
          {periodo==="mes" ? (
            <button onClick={()=>setShowMeses(p=>!p)} style={{background:"#1A202C",color:"#fff",border:"none",borderRadius:8,padding:"4px 12px",fontSize:13,fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
              {titulo} <span style={{fontSize:10,opacity:.7}}>{showMeses?"▲":"▼"}</span>
            </button>
          ) : (
            <span style={{color:C.text,fontWeight:800}}>{titulo}</span>
          )}
          {/* Selector de año siempre visible en mes/año */}
          {(periodo==="mes"||periodo==="anio")&&(
            <div style={{display:"flex",alignItems:"center",gap:4,marginLeft:4}}>
              <button onClick={()=>setAnioSelec(p=>p-1)} style={{background:C.surfaceAlt,border:`1px solid ${C.border}`,borderRadius:6,padding:"2px 8px",cursor:"pointer",fontSize:13}}>‹</button>
              <span style={{fontWeight:700,fontSize:13,color:C.text,minWidth:36,textAlign:"center"}}>{anioSelec}</span>
              <button onClick={()=>setAnioSelec(p=>p+1)} style={{background:C.surfaceAlt,border:`1px solid ${C.border}`,borderRadius:6,padding:"2px 8px",cursor:"pointer",fontSize:13}}>›</button>
            </div>
          )}
        </div>
        {/* Dropdown de 12 meses */}
        {showMeses&&periodo==="mes"&&(
          <div style={{position:"absolute",top:"100%",left:0,zIndex:100,background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:12,padding:10,boxShadow:"0 8px 24px #00000018",marginTop:4,minWidth:280}}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>
              {MESES.map((m,i)=>(
                <button key={i} onClick={()=>{setMesSelec(i);setShowMeses(false);}} style={{
                  background:mesSelec===i?"#1A202C":C.surfaceAlt,
                  color:mesSelec===i?"#fff":C.text,
                  border:`1.5px solid ${mesSelec===i?"#1A202C":C.border}`,
                  borderRadius:8,padding:"8px 4px",fontSize:12,fontWeight:700,
                  cursor:"pointer",textAlign:"center",textTransform:"capitalize",
                  transition:"all .15s"
                }}>{MESES_CORTO[i]}</button>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* ── 4 tarjetas ── */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
        {[
          {label:"Ingresos",   val:cur(ingresos),   icon:"💹", color:"#10B981", bg:"linear-gradient(135deg,#D1FAE5,#A7F3D0)", sub:periodo==="dia"?"del día":periodo==="semana"?"de la semana":periodo==="mes"?"del mes":periodo==="anio"?"del año":"del período"},
          {label:"Egresos operativos", val:cur(egresos), icon:"📉", color:"#EF4444", bg:"linear-gradient(135deg,#FEE2E2,#FECACA)", sub:"gastos y costos"},
          {label:"Utilidad",   val:cur(utilidad),   icon:"💰", color:utilidad>=0?"#10B981":"#EF4444", bg:utilidad>=0?"linear-gradient(135deg,#D1FAE5,#A7F3D0)":"linear-gradient(135deg,#FEE2E2,#FECACA)", sub:utilidad>=0?"✓ Positiva":"⚠ Negativa"},
          ...(retiroSocio>0?[{label:"Retiro de socio", val:cur(retiroSocio), icon:"👤", color:"#6366F1", bg:"linear-gradient(135deg,#EEF2FF,#E0E7FF)", sub:"No afecta utilidad"}]:[]),
          {label:"Rentabilidad",val:`${rentabilidad}%`,icon:"🎯",color:rentColor,bg:`linear-gradient(135deg,${rentabilidad>=40?"#D1FAE5,#A7F3D0":rentabilidad>=20?"#FEF3C7,#FDE68A":"#FEE2E2,#FECACA"})`,sub:"sobre ingresos",noFmt:true},
        ].map((c,i)=>(
          <div key={i} style={{background:c.bg,borderRadius:16,padding:"18px 20px",boxShadow:"0 2px 12px #00000010"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div style={{fontSize:11,color:c.color,fontWeight:700,textTransform:"uppercase",letterSpacing:.8,opacity:.8}}>{c.label}</div>
              <div style={{fontSize:22}}>{c.icon}</div>
            </div>
            <div style={{fontSize:24,fontWeight:900,color:c.color,lineHeight:1,marginBottom:4}}>{c.val}</div>
            <div style={{fontSize:11,color:c.color,opacity:.7}}>{c.sub}</div>
          </div>
        ))}
      </div>

      {/* ── Donuts ── */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
        <div style={{background:C.surface,borderRadius:16,padding:20,boxShadow:"0 2px 12px #00000008",border:`1px solid ${C.border}`}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
            <div style={{width:32,height:32,borderRadius:10,background:"#D1FAE5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>💹</div>
            <div>
              <div style={{fontWeight:800,fontSize:14}}>Ingresos por tipo</div>
              <div style={{fontSize:11,color:C.muted}}>{titulo}</div>
            </div>
          </div>
          <Donut items={ingCats} total={ingresos} colorBase="#10B981" icon="💹" label="ingresos"/>
        </div>
        <div style={{background:C.surface,borderRadius:16,padding:20,boxShadow:"0 2px 12px #00000008",border:`1px solid ${C.border}`}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
            <div style={{width:32,height:32,borderRadius:10,background:"#FEE2E2",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>📉</div>
            <div>
              <div style={{fontWeight:800,fontSize:14}}>Egresos por categoría</div>
              <div style={{fontSize:11,color:C.muted}}>{titulo}</div>
            </div>
          </div>
          <Donut items={egCats} total={egresos} colorBase="#EF4444" icon="📉" label="egresos"/>
        </div>
      </div>

      {/* ── Gráfica de barras ── */}
      <div style={{background:C.surface,borderRadius:16,padding:20,boxShadow:"0 2px 12px #00000008",border:`1px solid ${C.border}`,marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
          <div>
            <div style={{fontWeight:800,fontSize:15}}>
              📊 {periodo==="dia"?"Por día":periodo==="semana"?"Por día de la semana":periodo==="mes"?"Por semana del mes":periodo==="anio"?"Por mes del año":"Por período"}
            </div>
            <div style={{fontSize:12,color:C.muted,marginTop:2}}>{titulo}</div>
          </div>
          <div style={{display:"flex",gap:16,fontSize:12}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}><div style={{width:12,height:12,borderRadius:3,background:"#3B82F6"}}/><span style={{color:C.sub}}>Ingresos</span></div>
            <div style={{display:"flex",alignItems:"center",gap:6}}><div style={{width:12,height:12,borderRadius:3,background:"#EF4444"}}/><span style={{color:C.sub}}>Egresos</span></div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"flex-end",gap:barData.length>7?2:6,height:BAR_H,marginBottom:8}}>
          {barData.map((d,i)=>{
            const util=d.ing-d.eg;
            const ingH=barMax>0?Math.max(Math.round((d.ing/barMax)*(BAR_H-40)),d.ing>0?4:0):0;
            const egH =barMax>0?Math.max(Math.round((d.eg/barMax)*(BAR_H-40)),d.eg>0?4:0):0;
            const hasData=d.ing>0||d.eg>0;
            return (
              <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,minWidth:0}}>
                <div style={{width:"100%",display:"flex",gap:1,alignItems:"flex-end",height:BAR_H-40}}>
                  <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"flex-end",alignItems:"center",gap:2}}>
                    {ingH>25&&<div style={{fontSize:7,color:"#3B82F6",fontWeight:700,textAlign:"center",lineHeight:1}}>{cur(d.ing)}</div>}
                    <div style={{width:"100%",background:"linear-gradient(180deg,#60A5FA,#3B82F6)",borderRadius:"4px 4px 0 0",height:ingH,transition:"height .3s"}}/>
                  </div>
                  <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"flex-end",alignItems:"center",gap:2}}>
                    {egH>25&&<div style={{fontSize:7,color:"#EF4444",fontWeight:700,textAlign:"center",lineHeight:1}}>{cur(d.eg)}</div>}
                    <div style={{width:"100%",background:"linear-gradient(180deg,#F87171,#EF4444)",borderRadius:"4px 4px 0 0",height:egH,transition:"height .3s"}}/>
                  </div>
                </div>
                <div style={{fontSize:barData.length>7?8:10,color:C.muted,fontWeight:600,textAlign:"center"}}>{d.l}</div>
                {hasData&&<div style={{fontSize:8,fontWeight:700,color:util>=0?"#10B981":"#EF4444"}}>{util>=0?"+":""}{cur(util)}</div>}
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",justifyContent:"space-between",padding:"10px 14px",background:"#1A202C",borderRadius:10}}>
          <span style={{fontSize:12,color:"#68D391",fontWeight:700}}>💹 Ingresos: {cur(ingresos)}</span>
          <span style={{fontSize:12,color:"#FC8181",fontWeight:700}}>📉 Egresos: {cur(egresos)}</span>
          <span style={{fontSize:12,fontWeight:800,color:utilidad>=0?"#68D391":"#FC8181"}}>💰 Utilidad: {cur(utilidad)}</span>
        </div>
      </div>

      {/* ── Tablas desglose ── */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        {[
          {title:"💹 Ingresos",cats:ingCats,total:ingresos,color:"#10B981",bg:"#D1FAE5"},
          {title:"📉 Egresos", cats:egCats, total:egresos, color:"#EF4444",bg:"#FEE2E2"},
        ].map((side,si)=>(
          <div key={si} style={{background:C.surface,borderRadius:16,padding:20,boxShadow:"0 2px 12px #00000008",border:`1px solid ${C.border}`}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
              <div style={{width:32,height:32,borderRadius:10,background:side.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{side.title.split(" ")[0]}</div>
              <div>
                <div style={{fontWeight:800,fontSize:14}}>{side.title.split(" ").slice(1).join(" ")}</div>
                <div style={{fontSize:11,color:C.muted}}>{titulo}</div>
              </div>
            </div>
            {side.cats.length===0&&<div style={{color:C.muted,fontSize:12,textAlign:"center",padding:"20px 0"}}>Sin datos en el período</div>}
            {side.cats.map(([cat,val],i)=>(
              <div key={i} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:13,fontWeight:600,color:C.text}}>{cat}</span>
                  <span style={{fontSize:13,fontWeight:800,color:side.color}}>{cur(val)}</span>
                </div>
                <div style={{height:6,background:C.surfaceAlt,borderRadius:4,overflow:"hidden"}}>
                  <div style={{height:6,background:side.color,borderRadius:4,width:`${Math.round(val/side.total*100)}%`,opacity:.7,transition:"width .4s"}}/>
                </div>
                <div style={{fontSize:10,color:C.muted,marginTop:2}}>{Math.round(val/side.total*100)}% del total</div>
              </div>
            ))}
            {side.cats.length>0&&(
              <div style={{display:"flex",justifyContent:"space-between",padding:"12px 0 0",borderTop:`2px solid ${C.border}`,marginTop:8}}>
                <span style={{fontWeight:900,fontSize:13}}>TOTAL</span>
                <span style={{fontWeight:900,fontSize:15,color:side.color}}>{cur(side.total)}</span>
              </div>
            )}
            {si===1&&side.cats.length>0&&(
              <div style={{display:"flex",justifyContent:"space-between",padding:"8px 14px",background:utilidad>=0?"#D1FAE5":"#FEE2E2",borderRadius:10,marginTop:10}}>
                <span style={{fontWeight:800,fontSize:13,color:utilidad>=0?"#10B981":"#EF4444"}}>💰 UTILIDAD NETA</span>
                <span style={{fontWeight:900,fontSize:15,color:utilidad>=0?"#10B981":"#EF4444"}}>{cur(utilidad)}</span>
              </div>
            )}
          </div>
        ))}
      </div>

      {/* ── ESTADO DE RESULTADOS ANUAL ── */}
      <div style={{marginTop:24,background:C.surface,borderRadius:16,padding:"16px 8px",boxShadow:"0 2px 12px #00000008",border:`1px solid ${C.border}`,overflowX:"auto"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <div style={{width:36,height:36,borderRadius:12,background:"#1A202C",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>📊</div>
          <div>
            <div style={{fontWeight:900,fontSize:16}}>Estado de Resultados {anioSelec}</div>
            <div style={{fontSize:12,color:C.muted}}>Desglose mensual · datos del sistema</div>
          </div>
        </div>
        {(()=>{
          const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
          // Datos por mes
          const porMes = meses.map((_,mi)=>{
            const m = String(mi+1).padStart(2,"0");
            const mtxns = txns.filter(t=>t.date.startsWith(`${anioSelec}-${m}`)&&t.status==="realizado");
            const ingOp  = mtxns.filter(t=>t.type==="ingreso"&&t.category!=="Otros"&&t.category!=="Capital / Apertura de caja").reduce((s,t)=>s+t.amount,0);
            const ingOtr = mtxns.filter(t=>t.type==="ingreso"&&t.category==="Otros").reduce((s,t)=>s+t.amount,0);
            const capital= mtxns.filter(t=>t.category==="Capital / Apertura de caja").reduce((s,t)=>s+t.amount,0);
            const costos = mtxns.filter(t=>t.type==="egreso"&&["Materiales","Servicio A/C","Instalación"].includes(t.category)).reduce((s,t)=>s+t.amount,0);
            const gastos = mtxns.filter(t=>t.type==="egreso"&&!["Materiales","Servicio A/C","Instalación"].includes(t.category)).reduce((s,t)=>s+t.amount,0);
            const totalIng = ingOp+ingOtr;
            const totalEg  = costos+gastos;
            const utilBruta= totalIng-costos;
            const utilNeta = totalIng-totalEg;
            const rent     = totalIng>0?Math.round((utilNeta/totalIng)*100):0;
            return {ingOp,ingOtr,totalIng,costos,utilBruta,gastos,totalEg,utilNeta,rent,capital};
          });
          // Totales anuales
          const tot = porMes.reduce((acc,m)=>({
            ingOp:acc.ingOp+m.ingOp, ingOtr:acc.ingOtr+m.ingOtr, totalIng:acc.totalIng+m.totalIng,
            costos:acc.costos+m.costos, utilBruta:acc.utilBruta+m.utilBruta,
            gastos:acc.gastos+m.gastos, totalEg:acc.totalEg+m.totalEg, utilNeta:acc.utilNeta+m.utilNeta, capital:acc.capital+m.capital,
          }),{ingOp:0,ingOtr:0,totalIng:0,costos:0,utilBruta:0,gastos:0,totalEg:0,utilNeta:0,capital:0});
          tot.rent = tot.totalIng>0?Math.round((tot.utilNeta/tot.totalIng)*100):0;

          const Cell = ({v,bold,color,bg,pct}) => (
            <td style={{padding:"5px 6px",textAlign:"right",fontWeight:bold?"800":"400",color:color||C.text,background:bg||"transparent",fontSize:10,whiteSpace:"nowrap"}}>
              {v===0?"—":pct?`${v}%`:cur(v)}
            </td>
          );
          const HeaderRow = ({label,dark}) => (
            <tr style={{background:dark?"#1A202C":"#2D3748"}}>
              <td colSpan={14} style={{padding:"6px 10px",fontWeight:800,fontSize:10,color:"#fff",textTransform:"uppercase",letterSpacing:.8}}>{label}</td>
            </tr>
          );
          const DataRow = ({label,vals,tot,color,bold,bg,pct}) => (
            <tr style={{borderBottom:`1px solid ${C.border}`,background:bg||"transparent"}}>
              <td style={{padding:"6px 10px",fontSize:10,fontWeight:bold?"700":"400",color:color||C.text,whiteSpace:"nowrap",minWidth:140}}>{label}</td>
              {vals.map((v,i)=><Cell key={i} v={v} bold={bold} color={v<0?C.red:color} pct={pct}/>)}
              <Cell v={tot} bold color={tot<0?C.red:color||"#3B82F6"} pct={pct}/>
            </tr>
          );

          return (
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:900}}>
              <thead>
                <tr style={{background:"#1A202C"}}>
                  <th style={{padding:"6px 10px",textAlign:"left",color:"#A0AEC0",fontSize:10,fontWeight:700,minWidth:140}}>CONCEPTO</th>
                  {meses.map(m=><th key={m} style={{padding:"5px 4px",textAlign:"right",color:"#A0AEC0",fontSize:10,fontWeight:700,minWidth:55}}>{m}</th>)}
                  <th style={{padding:"5px 8px",textAlign:"right",color:"#68D391",fontSize:10,fontWeight:800,minWidth:65}}>TOTAL</th>
                </tr>
              </thead>
              <tbody>
                <HeaderRow label="💹 Ingresos"/>
                <DataRow label="Ingresos operacionales" vals={porMes.map(m=>m.ingOp)} tot={tot.ingOp} color={C.green}/>
                <DataRow label="Otros ingresos"         vals={porMes.map(m=>m.ingOtr)} tot={tot.ingOtr} color={C.green}/>
                <DataRow label="▶ TOTAL INGRESOS" vals={porMes.map(m=>m.totalIng)} tot={tot.totalIng} color="#fff" bold bg="#1A202C"/>

                <HeaderRow label="📉 Egresos"/>
                <DataRow label="Costos (materiales/servicio)" vals={porMes.map(m=>m.costos)} tot={tot.costos} color={C.red}/>
                <DataRow label="▶ UTILIDAD BRUTA" vals={porMes.map(m=>m.utilBruta)} tot={tot.utilBruta} bold color={tot.utilBruta>=0?C.green:C.red} bg={C.surfaceAlt}/>
                <DataRow label="Gastos operativos"     vals={porMes.map(m=>m.gastos)} tot={tot.gastos} color={C.red}/>
                <DataRow label="Gastos financieros"    vals={porMes.map(_=>0)} tot={0} color={C.muted}/>
                <DataRow label="▶ TOTAL EGRESOS" vals={porMes.map(m=>m.totalEg)} tot={tot.totalEg} color="#fff" bold bg="#1A202C"/>

                <tr style={{background:tot.utilNeta>=0?"#064E3B":"#7F1D1D"}}>
                  <td style={{padding:"7px 10px",fontWeight:900,fontSize:11,color:"#fff"}}>💰 UTILIDAD NETA</td>
                  {porMes.map((m,i)=>(
                    <td key={i} style={{padding:"7px 4px",textAlign:"right",fontWeight:800,fontSize:10,color:m.utilNeta>=0?"#6EE7B7":"#FCA5A5",whiteSpace:"nowrap"}}>
                      {m.utilNeta===0?"—":cur(m.utilNeta)}
                    </td>
                  ))}
                  <td style={{padding:"7px 8px",textAlign:"right",fontWeight:900,fontSize:12,color:tot.utilNeta>=0?"#6EE7B7":"#FCA5A5"}}>{cur(tot.utilNeta)}</td>
                </tr>
                <tr style={{background:C.surfaceAlt,borderBottom:`2px solid ${C.border}`}}>
                  <td style={{padding:"5px 10px",fontWeight:700,fontSize:10,color:C.sub}}>Rentabilidad</td>
                  {porMes.map((m,i)=>(
                    <td key={i} style={{padding:"5px 4px",textAlign:"right",fontSize:10,fontWeight:700,color:m.rent>=30?C.green:m.rent>=0?C.orange:C.red}}>
                      {m.totalIng===0?"—":`${m.rent}%`}
                    </td>
                  ))}
                  <td style={{padding:"5px 8px",textAlign:"right",fontSize:10,fontWeight:900,color:tot.rent>=30?C.green:tot.rent>=0?C.orange:C.red}}>{tot.totalIng===0?"—":`${tot.rent}%`}</td>
                </tr>
              </tbody>
            </table>
          );
        })()}
      </div>
    </div>
  );
}

function TDCTab({tdc, setTdc, txns, addTxn, tod2, inPeriod, finPeriod, finFrom, finTo}) {
  const [modal,    setModal]    = useState(null); // "config"|"pago"
  const [showAll,  setShowAll]  = useState(false);

  // Gastos TDC en el período
  const tdcTxns = txns
    .filter(t=>t.method==="tdc" && t.status==="realizado" && inPeriod(t.date,finPeriod,finFrom,finTo))
    .sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);

  // Saldo: suma de todos los gastos TDC - suma de todos los pagos
  const totalGastado = txns.filter(t=>t.method==="tdc"&&t.type==="egreso"&&t.status==="realizado").reduce((s,t)=>s+t.amount,0);
  const totalPagado  = (tdc.pagos||[]).reduce((s,p)=>s+p.monto,0);
  const saldoActual  = totalGastado - totalPagado;
  const limite       = parseFloat(tdc.limite||0);
  const disponible   = limite>0 ? limite-saldoActual : null;
  const pctUsado     = limite>0 ? Math.min(100,Math.round((saldoActual/limite)*100)) : 0;
  const alerta       = limite>0 && pctUsado>=80;

  // Gastos del período
  const gastosPeriodo = tdcTxns.filter(t=>t.type==="egreso").reduce((s,t)=>s+t.amount,0);

  return (
    <div>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,gap:10,flexWrap:"wrap"}}>
        <div style={{fontWeight:900,fontSize:20}}>💳 TDC Negocio</div>
        <div style={{display:"flex",gap:8}}>
          <Btn ch="⚙ Configurar" v="ghost" sm onClick={()=>setModal("config")}/>
          <Btn ch="💰 Registrar pago" v="primary" sm onClick={()=>setModal("pago")}/>
        </div>
      </div>

      {/* Config prompt si no está configurada */}
      {!tdc.limite&&(
        <div style={{background:C.accentBg,borderRadius:12,padding:16,marginBottom:16,textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:8}}>💳</div>
          <div style={{fontWeight:700,color:C.accentD,marginBottom:4}}>TDC aún no configurada</div>
          <div style={{fontSize:13,color:C.muted,marginBottom:12}}>Agrega el límite de crédito y fecha de pago para activar el seguimiento</div>
          <Btn ch="⚙ Configurar TDC" v="primary" onClick={()=>setModal("config")}/>
        </div>
      )}

      {/* Stats */}
      {tdc.limite>0&&(
        <>
          {/* Barra de uso */}
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,padding:"18px 20px",marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12,flexWrap:"wrap",gap:8}}>
              <div>
                <div style={{fontSize:12,color:C.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.8}}>Saldo actual</div>
                <div style={{fontSize:32,fontWeight:900,color:alerta?C.red:C.text,lineHeight:1}}>{cur(saldoActual)}</div>
                <div style={{fontSize:12,color:C.muted,marginTop:4}}>de {cur(limite)} límite</div>
              </div>
              <div style={{textAlign:"right"}}>
                {disponible!==null&&<div><div style={{fontSize:12,color:C.muted,fontWeight:700}}>DISPONIBLE</div><div style={{fontSize:22,fontWeight:800,color:C.green}}>{cur(disponible)}</div></div>}
              </div>
            </div>
            {/* Barra */}
            <div style={{height:10,background:C.surfaceAlt,borderRadius:6,overflow:"hidden",marginBottom:6}}>
              <div style={{height:10,borderRadius:6,width:`${pctUsado}%`,background:pctUsado>=90?C.red:pctUsado>=70?C.orange:C.green,transition:"width .4s"}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.muted}}>
              <span>{pctUsado}% utilizado</span>
              {alerta&&<span style={{color:C.red,fontWeight:700}}>⚠ Crédito al {pctUsado}%</span>}
              {tdc.pagoDia>0&&<span>📅 Pago el día {tdc.pagoDia} de cada mes</span>}
            </div>
          </div>

          <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
            <StatCard label="Gastado (período)" value={cur(gastosPeriodo)} icon="💳" color={C.red}/>
            <StatCard label="Total pagado" value={cur(totalPagado)} icon="✅" color={C.green}/>
            <StatCard label="Saldo pendiente" value={cur(saldoActual)} icon="⏳" color={saldoActual>0?C.orange:C.green} sub={saldoActual>0?"Por liquidar":"Sin deuda"}/>
          </div>
        </>
      )}

      {/* Historial de pagos a la TDC */}
      {(tdc.pagos||[]).length>0&&(
        <Card style={{marginBottom:16}}>
          <div style={{fontWeight:800,marginBottom:12}}>💰 Pagos realizados a la TDC</div>
          {(tdc.pagos||[]).slice().reverse().map((p,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
              <div>
                <div style={{fontWeight:700}}>{p.tipo==="total"?"✅ Pago total":p.tipo==="minimo"?"🟡 Pago mínimo":"💰 Pago parcial"}</div>
                {p.nota&&<div style={{fontSize:11,color:C.muted}}>{p.nota}</div>}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{textAlign:"right"}}>
                  <div style={{fontWeight:800,color:C.green}}>+{cur(p.monto)}</div>
                  <div style={{fontSize:11,color:C.muted}}>{fmtD(p.fecha)}</div>
                </div>
                <button onClick={()=>setTdc(prev=>({...prev,pagos:(prev.pagos||[]).filter((_,j)=>j!==(tdc.pagos.length-1-i))}))} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:16}}>🗑</button>
              </div>
            </div>
          ))}
        </Card>
      )}

      {/* Movimientos TDC del período */}
      <div style={{fontWeight:800,fontSize:15,marginBottom:10}}>📋 Gastos con TDC</div>
      {tdcTxns.length===0&&<div style={{color:C.muted,textAlign:"center",padding:30,fontSize:13}}>Sin gastos con TDC en este período</div>}
      {tdcTxns.map(t=>(
        <Card key={t.id} style={{marginBottom:8,borderLeft:`3px solid ${t.type==="ingreso"?C.green:C.red}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:13}}>{t.concept}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:2}}>{fmtD(t.date)} · {t.category}</div>
            </div>
            <div style={{fontWeight:800,fontSize:15,color:t.type==="ingreso"?C.green:C.red}}>
              {t.type==="ingreso"?"+":"-"}{cur(t.amount)}
            </div>
          </div>
        </Card>
      ))}

      {/* Modales */}
      {modal==="config"&&<TDCConfigModal tdc={tdc} onClose={()=>setModal(null)} onSave={cfg=>setTdc(p=>({...p,...cfg}))}/>}
      {modal==="pago"&&<TDCPagoModal onClose={()=>setModal(null)} saldo={saldoActual} onSave={(pago)=>{
        setTdc(p=>({...p,pagos:[...(p.pagos||[]),pago]}));
        // Registrar en Finanzas como egreso (salida de banco para pagar TDC)
        addTxn({date:pago.fecha,concept:`Pago TDC — ${pago.tipo==="total"?"Total":pago.tipo==="minimo"?"Mínimo":"Parcial"}${pago.nota?" ("+pago.nota+")":""}`,category:"Otros",classification:"Fijo",type:"egreso",amount:pago.monto,method:"transferencia",status:"realizado",auto:false});
        fireToast(`✅ Pago de ${cur(pago.monto)} registrado`);
        setModal(null);
      }}/>}
    </div>
  );
}

function TDCConfigModal({tdc, onClose, onSave}) {
  const [limite,   setLimite]   = useState(tdc.limite||"");
  const [pagoDia,  setPagoDia]  = useState(tdc.pagoDia||"");
  const [banco,    setBanco]    = useState(tdc.banco||"");
  return (
    <Modal title="⚙ Configurar TDC" onClose={onClose}>
      <div>
        <Inp label="Límite de crédito $" type="number" value={limite} onChange={e=>setLimite(e.target.value)} placeholder="Ej: 20000"/>

        <div style={{display:"flex",gap:10,marginTop:8}}>

            fireToast("✅ TDC configurada");
            onClose();
          }}/>
        </div>

    </Modal>
  );
}

function BackupModal({data, onClose, onImport}) {
  const [mode, setMode]   = useState("export"); // export | import
  const [text, setText]   = useState("");
  const [copied, setCopied] = useState(false);

  const json = JSON.stringify({
    version:"1.0",
    fecha: new Date().toISOString(),
    negocio:"MULTISERVICIOS SJR",
    datos: data
  }, null, 2);

  const copy = () => {
    navigator.clipboard.writeText(json).then(()=>{
      setCopied(true);
      setTimeout(()=>setCopied(false), 2500);
    }).catch(()=>{
      // fallback: select the textarea
      const el = document.getElementById("backup-textarea");
      if(el){ el.select(); document.execCommand("copy"); setCopied(true); setTimeout(()=>setCopied(false),2500); }
    });
  };

  const restore = () => {
    try {
      const parsed = JSON.parse(text);
      if(!parsed.datos) { fireToast("❌ Formato inválido"); return; }
      onImport(parsed.datos);
      onClose();
      fireToast("✅ Datos restaurados correctamente");
    } catch(e){ fireToast("❌ JSON inválido, revisa el texto"); }
  };

  return (
    <Modal title="💾 Respaldo de datos" onClose={onClose} wide>
      <div>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          <button onClick={()=>setMode("export")} style={{background:mode==="export"?"#0EA5E9":"#F0F4F8",color:mode==="export"?"#fff":"#4A5568",border:"none",borderRadius:8,padding:"8px 20px",fontWeight:700,cursor:"pointer",fontSize:13}}>⬆ Exportar</button>
          <button onClick={()=>setMode("import")} style={{background:mode==="import"?"#0EA5E9":"#F0F4F8",color:mode==="import"?"#fff":"#4A5568",border:"none",borderRadius:8,padding:"8px 20px",fontWeight:700,cursor:"pointer",fontSize:13}}>⬇ Restaurar</button>
        </div>

        {mode==="export" && <>
          <div style={{background:"#F0F9FF",borderRadius:10,padding:"12px 16px",marginBottom:12,fontSize:13,color:"#0284C7",lineHeight:1.6}}>
            <strong>Instrucciones:</strong><br/>
            1. Copia todo el texto de abajo<br/>
            2. Abre el Bloc de Notas (o cualquier editor)<br/>

// Calcula fecha de seguimiento para un servicio
function getSeguFd(s, todayFd, allSvcs) {
  if(s.status!=="completado"||!s.seguimientoDias||s.seguimientoDias<=0||s.seguimientoHecho) return null;
  const base=s.fechaCobro||s.date;
  if(!base) return null;
  const d=new Date(base+"T12:00:00");
  d.setDate(d.getDate()+parseInt(s.seguimientoDias));
  const fd=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const hoy=todayFd||today;
  const fechaFinal=fd<hoy?hoy:fd;
  // Si hay otros servicios del mismo cliente con seguimiento más temprano, no mostrar este
  if(allSvcs) {
    const key=s.phone||s.client;
    const hayMasTemprano=allSvcs.some(function(other){
      if(other.id===s.id) return false;
      if(other.status!=="completado"||!other.seguimientoDias||other.seguimientoDias<=0||other.seguimientoHecho) return false;
      const ob=other.fechaCobro||other.date;
      if(!ob) return false;
      const otherKey=other.phone||other.client;
      if(otherKey!==key) return false;
      const od=new Date(ob+"T12:00:00");
      od.setDate(od.getDate()+parseInt(other.seguimientoDias));
      const ofd=od.getFullYear()+"-"+String(od.getMonth()+1).padStart(2,"0")+"-"+String(od.getDate()).padStart(2,"0");
      const oFinal=ofd<hoy?hoy:ofd;
      return oFinal<fechaFinal || (oFinal===fechaFinal && other.id<s.id);
    });
    if(hayMasTemprano) return null;
  }
  return fechaFinal;
}

// Construye lista de eventos para una fecha dada
function getEventosParaFecha(svcs, fd, todayFd) {
  const evs=[];
  svcs.forEach(s=>{
    // Cancelados normales no aparecen, pero reagendados sí (en su fecha original)
    if(s.status==="cancelado") {
      if(s.cancelTipo==="reagenda" && s.date===fd) {
        evs.push({...s,_role:"reagenda"});
      }
      return;
    }
    if(s.status==="en_taller") {
      const ing=s.tallerIngreso||s.date;
      if(ing===fd) evs.push({...s,_role:"ingreso"});
      if(s.tallerFechaEntrega&&s.tallerFechaEntrega===fd&&s.tallerFechaEntrega!==ing)
        evs.push({...s,_role:"entrega",time:s.tallerHoraEntrega||"09:00",timeFin:""});
    } else {
      if(s.date===fd) evs.push({...s,_role:"normal",_esDiaTerm:false});
      // Día de término — solo si es diferente al de inicio
      if(s.dateFin&&s.dateFin!==s.date&&s.dateFin===fd) evs.push({...s,_role:"normal",_esDiaTerm:true});
    }
    // Seguimientos — solo aparecen en su fecha exacta (o en hoy si vencidos)
    const sf=getSeguFd(s, todayFd, svcs);
    if(sf===fd) evs.push({...s,_role:"seguimiento",time:"",timeFin:""});
  });
  return evs;
}
