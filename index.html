// ── GOOGLE CALENDAR INTEGRATION ─────────────────────────────────
const GCAL_CLIENT_ID = "618138954278-d9oa2ski7ql6csumemaarhcjk0k7q0ld.apps.googleusercontent.com";
const GCAL_SCOPE     = "https://www.googleapis.com/auth/calendar.events";
const GCAL_STORE_KEY = "comins:gcal_token";

function loadGisScript() {
  return new Promise((resolve) => {
    if(window.google && window.google.accounts) { resolve(); return; }
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = resolve;
    document.head.appendChild(s);
  });
}

function useGoogleCal() {
  const [token,    setToken]    = useState(()=>{ try{ return JSON.parse(localStorage.getItem(GCAL_STORE_KEY)||"null"); }catch(e){ return null; } });
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState("");

  const isConnected = !!(token && token.access_token && token.expires_at > Date.now());

  const connect = async () => {
    setLoading(true); setError("");
    try {
      await loadGisScript();
      await new Promise((resolve, reject) => {
        const client = window.google.accounts.oauth2.initTokenClient({
          client_id: GCAL_CLIENT_ID,
          scope: GCAL_SCOPE,
          callback: (resp) => {
            if(resp.error) { reject(resp.error); return; }
            const t = {
              access_token: resp.access_token,
              expires_at:   Date.now() + (parseInt(resp.expires_in||3600)-60)*1000,
            };
            setToken(t);
            try{ localStorage.setItem(GCAL_STORE_KEY, JSON.stringify(t)); }catch(e){}
            resolve();
          },
        });
        client.requestAccessToken();
      });
    } catch(e) {
      setError("Error al conectar: "+(e.message||e));
    }
    setLoading(false);
  };

  const disconnect = () => {
    setToken(null);
    try{ localStorage.removeItem(GCAL_STORE_KEY); }catch(e){}
    if(window.google && window.google.accounts && window.google.accounts.oauth2) {
      try{ window.google.accounts.oauth2.revoke(token.access_token, ()=>{}); }catch(e){}
    }
  };

  // Asegurar que el token sigue válido antes de cada llamada
  const getToken = async () => {
    if(!token || !token.access_token) return null;
    if(token.expires_at < Date.now()) {
      // Token expirado — pedir nuevo silenciosamente
      await connect();
      return null; // el estado se actualiza async, siguiente llamada lo tendrá
    }
    return token.access_token;
  };

  // Construye el evento de Google Calendar desde un servicio SJR
  const svcToGcalEvent = (svc) => {
    const parseM = (t) => {
      if(!t) return {h:9,m:0};
      const tl=t.toLowerCase().replace(/\s/g,"");
      const isPm=tl.includes("p.m.")||tl.includes("pm");
      const isAm=tl.includes("a.m.")||tl.includes("am");
      const clean=tl.replace(/[apm\. ]/g,"");
      const parts=clean.split(":");
      let h=parseInt(parts[0])||0;
      const mn=parseInt(parts[1])||0;
      if(isPm&&h!==12) h+=12;
      if(isAm&&h===12) h=0;
      return {h,m:mn};
    };
    const date = svc.date || today;
    const s = parseM(svc.time);
    const e = svc.timeFin ? parseM(svc.timeFin) : {h:s.h+2, m:s.m};
    const pad = n => String(n).padStart(2,"0");
    const startDt = date+"T"+pad(s.h)+":"+pad(s.m)+":00";
    const endDt   = date+"T"+pad(e.h)+":"+pad(e.m)+":00";
    const status  = SVC_STATUS[svc.status] ? SVC_STATUS[svc.status].label : svc.status;
    const desc = [
      "Folio: "+(svc.folio||""),
      "Técnico: "+(svc.tech||"")+(svc.helper?" / "+svc.helper:""),
      "Tel: "+(svc.phone||""),
      "Estado: "+status,
      svc.quotePrice>0?"Cotizado: $"+svc.quotePrice:"",
      svc.notes?"Notas: "+svc.notes:"",
      "",
      "MULTISERVICIOS SJR",
    ].filter(Boolean).join("\n");
    return {
      summary: (svc.folio||"SV")+" — "+svc.client+" ("+svc.type+")",
      location: svc.address||"",
      description: desc,
      start: {dateTime: startDt, timeZone:"America/Monterrey"},
      end:   {dateTime: endDt,   timeZone:"America/Monterrey"},
      colorId: svc.status==="completado"?"2":svc.status==="cancelado"?"4":svc.status==="en_taller"?"7":svc.status==="urgente"?"11":"1",
    };
  };

  // Crear o actualizar evento
  const syncEvent = async (svc) => {
    const tk = await getToken();
    if(!tk) return null;
    try {
      const event = svcToGcalEvent(svc);
      // Si ya tiene gcalEventId → actualizar (PATCH), si no → crear (POST)
      const existing = svc.gcalEventId;
      const url = existing
        ? "https://www.googleapis.com/calendar/v3/calendars/primary/events/"+existing
        : "https://www.googleapis.com/calendar/v3/calendars/primary/events";
      const method = existing ? "PATCH" : "POST";
      const res = await fetch(url, {
        method,
        headers: {"Authorization":"Bearer "+tk, "Content-Type":"application/json"},
        body: JSON.stringify(event),
      });
      if(!res.ok) {
        const err = await res.json();
        // Si 404 (evento borrado en GCal) → crear nuevo
        if(res.status===404) {
          const res2 = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events",{
            method:"POST",
            headers:{"Authorization":"Bearer "+tk,"Content-Type":"application/json"},
            body:JSON.stringify(event),
          });
          if(!res2.ok) return null;
          const data2 = await res2.json();
          return data2.id;
        }
        console.error("GCal error:", err);
        return null;
      }
      const data = await res.json();
      return data.id;
    } catch(e) {
      console.error("GCal sync error:", e);
      return null;
    }
  };

  // Eliminar evento
  const deleteEvent = async (gcalEventId) => {
    const tk = await getToken();
    if(!tk || !gcalEventId) return;
    try {
      await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+gcalEventId, {
        method:"DELETE",
        headers:{"Authorization":"Bearer "+tk},
      });
    } catch(e) {}
  };

  return {isConnected, loading, error, connect, disconnect, syncEvent, deleteEvent, token};
}

// ── NÓMINA ────────────────────────────────────────────────────────
const DIAS_SEMANA = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const DIAS_KEY    = ["lun","mar","mie","jue","vie","sab","dom"];
const PUESTOS     = ["Técnico","Técnico Senior","Ayudante","Administrativo","Ventas","Supervisor"];
const MODALIDADES = ["Sueldo fijo semanal","Por día trabajado","Por servicio","Mixto"];
let _empId = 1;
let _nomId = 1;

function calcNomina(emp, registro) {
  // registro: {diasTrabajados:{lun:true,...}, horasExtra:{lun:2,...}, anticipos:[]}
  const diasConfig = emp.diasLaborales||{lun:true,mar:true,mie:true,jue:true,vie:true,sab:true,dom:false};
  const diasEsperados = DIAS_KEY.filter(d=>diasConfig[d]).length;
  if(diasEsperados===0) return {bruto:0,descFaltas:0,descImss:0,descIsr:0,anticipos:0,neto:0,diasTrabajados:0,horasExtra:0,costoHE:0};

  const sueldoBase = parseFloat(emp.sueldoSemanal)||0;
  const costoDia   = diasEsperados>0 ? sueldoBase/diasEsperados : 0;
  const costoHora  = costoDia/8; // jornada de 8h
  const tasaHE     = 2; // 2x
  const tasaDE     = parseFloat(emp.tasaDiaExtra)||2; // día extra, default 2x, editable por empleado

  // Días trabajados
  const diasTrabajados = DIAS_KEY.filter(d=>diasConfig[d]&&(registro.diasTrabajados||{})[d]).length;
  const faltas         = diasEsperados - diasTrabajados;
  const descFaltas     = faltas * costoDia;

  // Horas extra
  let totalHE = 0;
  DIAS_KEY.forEach(d=>{ totalHE += parseFloat((registro.horasExtra||{})[d]||0); });
  const costoHE = totalHE * costoHora * tasaHE;

  // Bonos activos esta semana — solo los que SÍ cuestan al negocio
  const bonosActivos = (registro.bonosActivos||{});
  const totalBonos = (emp.bonos||[]).reduce((s,b,i)=>{
    if(b.intangible) return s; // bonos intangibles no afectan el neto del negocio
    return s + (bonosActivos[i]!==false ? parseFloat(b.monto||0) : 0);
  },0);
  const totalBonosIntangibles = (emp.bonos||[]).reduce((s,b,i)=>{
    if(!b.intangible) return s;
    return s + (bonosActivos[i]!==false ? parseFloat(b.monto||0) : 0);
  },0);

  // Días extra: días trabajados fuera de los días laborales configurados
  const diasExtra = DIAS_KEY.filter(d=>!diasConfig[d]&&(registro.diasTrabajados||{})[d]).length;
  const costoDE   = diasExtra * costoDia * tasaDE;

  // Deducciones legales (si aplica)
  const brutoAntesDeducciones = sueldoBase - descFaltas + costoHE + totalBonos + costoDE;
  const descImss = emp.imss ? brutoAntesDeducciones * 0.0275 : 0;
  const descIsr  = emp.isr  ? Math.max(0, brutoAntesDeducciones * 0.02) : 0;

  // Anticipos de esa semana
  const anticipos = (registro.anticipos||[]).reduce((s,a)=>s+parseFloat(a.monto||0),0);

  const neto = brutoAntesDeducciones - descImss - descIsr - anticipos;

  return {
    bruto: brutoAntesDeducciones,
    sueldoBase,
    descFaltas,
    costoHE,
    totalHE,
    totalBonos,
    totalBonosIntangibles,
    diasExtra,
    costoDE,
    descImss,
    descIsr,
    anticipos,
    neto: Math.max(0, neto),
    diasTrabajados,
    diasEsperados,
    faltas,
  };
}

function getISOWeek(date) {
  const d = new Date(date+"T12:00:00");
  const day = d.getDay()===0?7:d.getDay(); // 1=Lun, 7=Dom
  d.setDate(d.getDate()-day+1); // Lunes de esa semana
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function getLunesSemana(weekStr) {
  return new Date(weekStr+"T12:00:00");
}

function semanaLabel(weekStr) {
  if(!weekStr) return "";
  const lun = new Date(weekStr+"T12:00:00");
  const dom = new Date(lun); dom.setDate(lun.getDate()+6);
  return lun.toLocaleDateString("es-MX",{day:"numeric",month:"short"})+" – "+dom.toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"});
}

function NominaTab({empleados, setEmpleados, nominas, setNominas, svcs, addTxn, tod2}) {

  const [modalPago,  setModalPago]  = useState(null); // {emp, registro, calc}
  const [modalAntic, setModalAntic] = useState(null); // {emp}
  const [confirmPago,setConfirmPago]= useState(null);

  // Inicializar _empId y _nomId
  useEffect(()=>{
    if(empleados.length>0) _empId=Math.max(_empId,...empleados.map(e=>e.id||0))+1;
    if(nominas.length>0)   _nomId=Math.max(_nomId,...nominas.map(n=>n.id||0))+1;
  },[]);

  // Obtener registro de nómina de un empleado en una semana
  const getRegistro = (empId, weekStr) => {
    return nominas.find(n=>n.empId===empId&&n.semana===weekStr) || {
      empId, semana:weekStr, diasTrabajados:{}, horasExtra:{}, anticipos:[], pagado:false
    };
  };

  const saveRegistro = (reg) => {
    setNominas(p=>{
      const exists = p.find(n=>n.empId===reg.empId&&n.semana===reg.semana);
      if(exists) return p.map(n=>n.empId===reg.empId&&n.semana===reg.semana?{...reg}:n);
      return [...p,{...reg,id:_nomId++}];
    });
  };

  const pagarNomina = (emp, registro, calc, fecha, metodo) => {
    const fechaPago = fecha || tod2;
    const metodoPago = metodo || emp.metodoPago || "efectivo";
    saveRegistro({...registro, pagado:true, fechaPago:fechaPago, netoPagado:calc.neto});

      date: fechaPago,
      concept: "Nómina "+semanaLabel(registro.semana)+" — "+emp.nombre,

      classification: "Fijo",
      type: "egreso",
      amount: calc.neto,
      method: metodoPago,
      status: "realizado",
      auto: false,
      empId: emp.id,

    setConfirmPago(null);
  };

  const empActivos = empleados.filter(e=>e.activo!==false);

  // Total semana
  const totalSemana = empActivos.reduce((s,emp)=>{
    const reg = getRegistro(emp.id, semana);
    const calc = calcNomina(emp, reg);
    return s + (reg.pagado?0:calc.neto);
  },0);

  return (

          <Btn ch="+ Empleado" v="primary" sm onClick={()=>setModalEmp("nuevo")}/>

        ))}
      </div>

      {/* ── VISTA SEMANA ── */}
      {vista==="semana"&&(
        <div>

            <button onClick={()=>{const d=new Date(semana+"T12:00:00");d.setDate(d.getDate()-7);setSemana(getISOWeek(d.toISOString().slice(0,10)));}} style={{background:C.surfaceAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 14px",cursor:"pointer",fontWeight:700}}>‹</button>
            <div style={{fontWeight:800,fontSize:15,flex:1,textAlign:"center"}}>{semanaLabel(semana)}</div>
            <button onClick={()=>{const d=new Date(semana+"T12:00:00");d.setDate(d.getDate()+7);setSemana(getISOWeek(d.toISOString().slice(0,10)));}} style={{background:C.surfaceAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 14px",cursor:"pointer",fontWeight:700}}>›</button>
            <button onClick={()=>setSemana(getISOWeek(tod2))} style={{background:C.accentBg,color:C.accentD,border:"none",borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>Hoy</button>
          </div>

          {empActivos.length===0&&(
            <div style={{textAlign:"center",padding:40,color:C.muted}}>
              <div style={{fontSize:40,marginBottom:8}}>👷</div>
              <div style={{fontWeight:700,marginBottom:8}}>Sin empleados registrados</div>
              <Btn ch="+ Agregar primer empleado" v="primary" onClick={()=>setModalEmp("nuevo")}/>
            </div>
          )}

          {empActivos.map(emp=>{
            const reg  = getRegistro(emp.id, semana);
            const calc = calcNomina(emp, reg);
            const diasConfig = emp.diasLaborales||{lun:true,mar:true,mie:true,jue:true,vie:true,sab:true,dom:false};
            return (
              <Card key={emp.id} style={{marginBottom:16,borderLeft:`4px solid ${reg.pagado?C.green:C.accent}`}}>
                {/* Header empleado */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:8}}>
                  <div>
                    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                      <span style={{background:reg.pagado?C.greenBg:C.accentBg,color:reg.pagado?C.green:C.accentD,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>{emp.numero}</span>
                      <span style={{fontWeight:800,fontSize:16}}>{emp.nombre}</span>
                      <span style={{color:C.muted,fontSize:12}}>{emp.puesto}</span>
                      {reg.pagado&&<span style={{background:C.greenBg,color:C.green,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>✅ Pagado {fmtD(reg.fechaPago)}</span>}
                    </div>
                    <div style={{fontSize:12,color:C.muted,marginTop:2}}>Sueldo base: {cur(emp.sueldoSemanal)} · {calc.diasEsperados}d/semana · HE a 2x</div>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    {!reg.pagado&&<Btn ch="💸 Anticipo" v="orange" sm onClick={()=>setModalAntic({emp,registro:reg})}/>}
                    {!reg.pagado&&<Btn ch="💰 Pagar" v="green" sm onClick={()=>setConfirmPago({emp,registro:reg,calc})}/>}
                  </div>
                </div>

                {/* Días de la semana */}
                <div style={{marginBottom:12}}>
                  <Lbl t="Asistencia y horas extra"/>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
                    {DIAS_KEY.map((dk,i)=>{
                      const activo = diasConfig[dk];
                      const trabajo = !!(reg.diasTrabajados||{})[dk];
                      const esExtra = !activo && trabajo; // día no configurado pero trabajado
                      const he = parseFloat((reg.horasExtra||{})[dk]||0);
                      return (
                        <div key={dk} style={{textAlign:"center",opacity:activo||esExtra?1:0.35}}>
                          <div style={{fontSize:10,fontWeight:700,color:esExtra?C.orange:activo?C.muted:"#CBD5E0",marginBottom:4}}>{DIAS_SEMANA[i]}{esExtra&&<span style={{fontSize:8,color:C.orange}}> +</span>}</div>
                          <button
                            disabled={reg.pagado}
                            onClick={()=>{
                              const newDias={...(reg.diasTrabajados||{}),[dk]:!trabajo};
                              saveRegistro({...reg,diasTrabajados:newDias});
                            }}
                            style={{
                              width:"100%",height:36,borderRadius:8,border:esExtra?`2px solid ${C.orange}`:"none",
                              cursor:!reg.pagado?"pointer":"default",
                              background:esExtra?C.orangeBg:!activo?"#F0F4F8":trabajo?C.green:"#F0F4F8",
                              color:esExtra?C.orange:trabajo?"#fff":C.muted,
                              fontWeight:700,fontSize:12,transition:"all .15s",
                            }}
                          >
                            {trabajo?(esExtra?"★":"✓"):"—"}
                          </button>
                          {trabajo&&!reg.pagado&&(
                            <input type="number" min="0" max="8" step="0.5" value={he||""} onChange={e=>{
                              const newHE={...(reg.horasExtra||{}),[dk]:e.target.value};
                              saveRegistro({...reg,horasExtra:newHE});
                            }} placeholder="HE" style={{width:"100%",marginTop:4,padding:"4px 4px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:10,textAlign:"center",fontFamily:"inherit",background:he>0?C.orangeBg:"#fff",color:he>0?C.orange:C.text}}/>
                          )}
                          {reg.pagado&&he>0&&<div style={{fontSize:9,color:C.orange,marginTop:4}}>{he}h</div>}
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Bonos */}
                {(emp.bonos||[]).length>0&&(
                  <div style={{background:"#F5F3FF",border:`1px solid ${C.purple}22`,borderRadius:10,padding:"10px 14px",marginBottom:12}}>
                    <div style={{fontSize:11,fontWeight:700,color:C.purple,marginBottom:8}}>🎁 Bonos configurados</div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      {(emp.bonos||[]).map((b,bi)=>{
                        const activo = (reg.bonosActivos||{})[bi]!==false;
                        return (
                          <button key={bi} disabled={reg.pagado} onClick={()=>{
                            const ba={...(reg.bonosActivos||{}),[bi]:!activo};
                            saveRegistro({...reg,bonosActivos:ba});
                          }} style={{
                            background:activo?C.purpleBg:"#F0F4F8",
                            color:activo?C.purple:C.muted,
                            border:`1.5px solid ${activo?C.purple:C.border}`,
                            borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,
                            cursor:reg.pagado?"default":"pointer",fontFamily:"inherit",
                            display:"flex",alignItems:"center",gap:6,
                          }}>
                            {activo?"✓":"○"} {b.concepto} · {cur(b.monto)}
                          </button>
                        );
                      })}
                    </div>
                    {(emp.bonos||[]).some((_,bi)=>(reg.bonosActivos||{})[bi]!==false)&&(
                      <div style={{fontSize:11,color:C.purple,marginTop:6,fontWeight:700}}>
                        Total bonos: +{cur((emp.bonos||[]).reduce((s,b,bi)=>s+((reg.bonosActivos||{})[bi]!==false?parseFloat(b.monto||0):0),0))}
                      </div>
                    )}
                  </div>
                )}

                {/* Anticipos */}
                {(reg.anticipos||[]).length>0&&(
                  <div style={{background:C.orangeBg,borderRadius:8,padding:"8px 12px",marginBottom:10}}>
                    <div style={{fontSize:11,fontWeight:700,color:C.orange,marginBottom:4}}>💸 Anticipos esta semana</div>
                    {(reg.anticipos||[]).map((a,i)=>(
                      <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.orange}}>
                        <span>{fmtD(a.fecha)} — {a.concepto||"Anticipo"}</span>
                        <strong>{cur(a.monto)}</strong>
                      </div>
                    ))}
                  </div>
                )}

                {/* Resumen */}
                <div style={{background:"#1A202C",borderRadius:10,padding:"12px 16px",display:"flex",gap:16,flexWrap:"wrap",justifyContent:"space-between"}}>
                  {[
                    {l:"Sueldo base",v:cur(calc.sueldoBase),c:"#A0AEC0"},
                    {l:"Faltas ("+calc.faltas+"d)",v:calc.descFaltas>0?"-"+cur(calc.descFaltas):"—",c:"#FC8181"},
                    {l:"HE ("+calc.totalHE+"h)",v:calc.costoHE>0?"+"+cur(calc.costoHE):"—",c:"#68D391"},
                    {l:"Días extra ("+calc.diasExtra+"d × "+((emp&&emp.tasaDiaExtra)||2)+"x)",v:calc.costoDE>0?"+"+cur(calc.costoDE):"—",c:"#F6AD55"},
                    {l:"Bonos",v:calc.totalBonos>0?"+"+cur(calc.totalBonos):"—",c:"#B794F4"},
                    {l:"IMSS",v:calc.descImss>0?"-"+cur(calc.descImss):"—",c:"#FC8181"},
                    {l:"Anticipos",v:calc.anticipos>0?"-"+cur(calc.anticipos):"—",c:"#FBD38D"},
                    {l:"NETO",v:cur(calc.neto),c:"#fff",big:true},
                  ].map((it,i)=>(
                    <div key={i} style={{textAlign:"center"}}>
                      <div style={{fontSize:10,color:"#718096",fontWeight:600}}>{it.l}</div>
                      <div style={{fontSize:it.big?18:13,fontWeight:it.big?900:700,color:it.c,marginTop:2}}>{it.v}</div>
                    </div>
                  ))}
                </div>
                {calc.totalBonosIntangibles>0&&(
                  <div style={{background:"#F5F3FF",borderRadius:8,padding:"6px 12px",marginTop:6,fontSize:11,color:C.purple,fontWeight:600}}>
                    🎁 Bonos intangibles activos esta semana: {cur(calc.totalBonosIntangibles)} — no afectan el pago en efectivo
                  </div>
                )}
              </Card>
            );
          })}

          {empActivos.length>0&&(
            <div style={{background:C.accentBg,borderRadius:12,padding:"12px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontWeight:700,color:C.accentD}}>💰 Total a pagar esta semana</div>
              <div style={{fontWeight:900,fontSize:20,color:C.accentD}}>{cur(totalSemana)}</div>
            </div>
          )}
        </div>
      )}

      {/* ── VISTA EMPLEADOS ── */}
      {vista==="empleados"&&(
        <div>
          {empleados.length===0&&(
            <div style={{textAlign:"center",padding:40,color:C.muted}}>
              <div style={{fontSize:40,marginBottom:8}}>👥</div>
              <div style={{fontWeight:700,marginBottom:8}}>Sin empleados registrados</div>
              <Btn ch="+ Agregar empleado" v="primary" onClick={()=>setModalEmp("nuevo")}/>
            </div>
          )}
          {empleados.map(emp=>(
            <Card key={emp.id} style={{marginBottom:10,borderLeft:`4px solid ${emp.activo!==false?C.green:C.muted}`,cursor:"pointer"}} onClick={()=>setModalEmp(emp)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                <div>
                  <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                    <span style={{background:C.surfaceAlt,color:C.sub,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>{emp.numero}</span>
                    <span style={{fontWeight:800,fontSize:16}}>{emp.nombre}</span>
                    {emp.activo===false&&<span style={{background:C.redBg,color:C.red,borderRadius:6,padding:"1px 7px",fontSize:10,fontWeight:700}}>BAJA</span>}
                  </div>
                  <div style={{fontSize:12,color:C.muted,marginTop:2}}>{emp.puesto} · {emp.modalidad} · {cur(emp.sueldoSemanal)}/semana</div>
                  <div style={{fontSize:11,color:C.muted,marginTop:1}}>
                    Días: {DIAS_KEY.filter(d=>(emp.diasLaborales||{})[d]).map((_,i)=>DIAS_SEMANA[DIAS_KEY.indexOf(_)]).join(", ")||"Sin configurar"}
                  </div>
                </div>
                <div style={{display:"flex",gap:6}}>
                  <Btn ch="✏ Editar" v="ghost" sm onClick={e=>{e.stopPropagation();setModalEmp(emp);}}/>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}

      {/* ── VISTA HISTORIAL ── */}
      {vista==="historial"&&(
        <div>
          <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>📋 Historial de pagos de nómina</div>
          {nominas.filter(n=>n.pagado).length===0&&<div style={{color:C.muted,textAlign:"center",padding:30}}>Sin pagos registrados aún</div>}
          {[...nominas].filter(n=>n.pagado).sort((a,b)=>b.semana.localeCompare(a.semana)).map(n=>{
            const emp = empleados.find(e=>e.id===n.empId);
            if(!emp) return null;
            return (
              <Card key={n.id||n.empId+n.semana} style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:14}}>{emp.nombre} <span style={{color:C.muted,fontSize:11}}>({emp.numero})</span></div>
                    <div style={{fontSize:12,color:C.muted}}>{semanaLabel(n.semana)} · Pagado: {fmtD(n.fechaPago)}</div>
                  </div>
                  <div style={{fontWeight:900,fontSize:16,color:C.green}}>{cur(n.netoPagado)}</div>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {/* Modales */}
      {modalEmp&&<EmpModal emp={modalEmp==="nuevo"?null:modalEmp} onClose={()=>setModalEmp(null)} onSave={emp=>{
        if(emp.id&&empleados.find(e=>e.id===emp.id)) {
          setEmpleados(p=>p.map(e=>e.id===emp.id?emp:e));
          fireToast("✅ Empleado actualizado");
        } else {
          const id=_empId++;
          const num="EMP-"+String(id).padStart(3,"0");
          setEmpleados(p=>[...p,{...emp,id,numero:num,activo:true}]);
          fireToast("✅ Empleado "+num+" registrado");
        }
        setModalEmp(null);
      }} onBaja={id=>{setEmpleados(p=>p.map(e=>e.id===id?{...e,activo:false}:e));setModalEmp(null);fireToast("Empleado dado de baja");}} onAlta={id=>{setEmpleados(p=>p.map(e=>e.id===id?{...e,activo:true}:e));setModalEmp(null);fireToast("Empleado reactivado");}}/>}

      {modalAntic&&<AnticipModal emp={modalAntic.emp} registro={modalAntic.registro} onClose={()=>setModalAntic(null)} onSave={(antic)=>{
        const reg={...modalAntic.registro,anticipos:[...(modalAntic.registro.anticipos||[]),antic]};
        saveRegistro(reg);
        addTxn({date:antic.fecha,concept:"Anticipo "+modalAntic.emp.nombre,category:"Nómina/Técnico",classification:"Variable",type:"egreso",amount:parseFloat(antic.monto),method:"efectivo",status:"realizado",auto:false});
        fireToast("💸 Anticipo de "+cur(antic.monto)+" registrado en Finanzas");
        setModalAntic(null);
      }}/>}

      {confirmPago&&<ConfirmPagoModal emp={confirmPago.emp} calc={confirmPago.calc} semana={semana} onClose={()=>setConfirmPago(null)} onConfirm={(fecha,metodo)=>pagarNomina(confirmPago.emp,confirmPago.registro,confirmPago.calc,fecha,metodo)}/>}
    </div>
  );
}

// ── Modal empleado ──
function EmpModal({emp, onClose, onSave, onBaja, onAlta}) {
  const isEdit = !!emp;
  const defDias = {lun:true,mar:true,mie:true,jue:true,vie:true,sab:true,dom:false};
  const [f,setF] = useState(emp||{nombre:"",puesto:"Técnico",modalidad:"Sueldo fijo semanal",sueldoSemanal:"",diasLaborales:defDias,metodoPago:"efectivo",banco:"",clabe:"",imss:false,isr:false,infonavit:false,notas:""});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  return (
    <Modal title={isEdit?`✏ ${emp.nombre}`:"➕ Nuevo Empleado"} onClose={onClose} wide>
      <div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
          <div style={{gridColumn:"1/-1"}}><Inp label="Nombre completo *" value={f.nombre} onChange={e=>set("nombre",e.target.value)} placeholder="Ej: Carlos López Martínez"/></div>
          <Sel label="Puesto" opts={PUESTOS} value={f.puesto} onChange={e=>set("puesto",e.target.value)}/>
          <Sel label="Modalidad de pago" opts={MODALIDADES} value={f.modalidad} onChange={e=>set("modalidad",e.target.value)}/>
          <Inp label="Sueldo semanal $" type="number" value={f.sueldoSemanal} onChange={e=>set("sueldoSemanal",e.target.value)} placeholder="Ej: 1500"/>
          <div>
            <Inp label="Tasa día extra (x)" type="number" value={f.tasaDiaExtra||"2"} onChange={e=>set("tasaDiaExtra",e.target.value)} placeholder="2"/>
            <div style={{fontSize:10,color:C.muted,marginTop:-8,marginBottom:8}}>Multiplicador del costo diario. Ej: 2 = doble, 1.5 = día y medio</div>
          </div>
          <Sel label="Método de pago" opts={[{v:"efectivo",l:"💵 Efectivo"},{v:"transferencia",l:"🏦 SPEI / Transferencia"},{v:"tdd",l:"🏦 Depósito a cuenta"}]} value={f.metodoPago||"efectivo"} onChange={e=>set("metodoPago",e.target.value)}/>
          {f.metodoPago!=="efectivo"&&<div style={{gridColumn:"1/-1"}}><Inp label="CLABE / Cuenta" value={f.clabe||""} onChange={e=>set("clabe",e.target.value)} placeholder="18 dígitos CLABE"/></div>}
          {f.metodoPago!=="efectivo"&&<Inp label="Banco" value={f.banco||""} onChange={e=>set("banco",e.target.value)} placeholder="Ej: Banamex"/>}
        </div>

        {/* Días laborales */}
        <div style={{marginBottom:14}}>
          <Lbl t="Días laborales"/>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {DIAS_KEY.map((dk,i)=>(
              <button key={dk} onClick={()=>set("diasLaborales",{...(f.diasLaborales||defDias),[dk]:!(f.diasLaborales||defDias)[dk]})} style={{background:(f.diasLaborales||defDias)[dk]?C.accent:"transparent",color:(f.diasLaborales||defDias)[dk]?"#fff":C.muted,border:`1.5px solid ${(f.diasLaborales||defDias)[dk]?C.accent:C.border}`,borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                {DIAS_SEMANA[i]}
              </button>
            ))}
          </div>
          <div style={{fontSize:11,color:C.muted,marginTop:6}}>
            {DIAS_KEY.filter(d=>(f.diasLaborales||defDias)[d]).length} días · Sueldo diario: {cur((parseFloat(f.sueldoSemanal)||0)/Math.max(1,DIAS_KEY.filter(d=>(f.diasLaborales||defDias)[d]).length))}
          </div>
        </div>

        {/* Deducciones legales */}
        <div style={{background:C.surfaceAlt,borderRadius:12,padding:"12px 14px",marginBottom:14}}>
          <Lbl t="Deducciones legales (para cuando migres a formal)"/>
          <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
            {[{k:"imss",l:"IMSS (~2.75%)"},{k:"isr",l:"ISR (~2%)"},{k:"infonavit",l:"Infonavit (5%)"}].map(it=>(
              <label key={it.k} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:C.sub}}>
                <input type="checkbox" checked={!!(f[it.k])} onChange={e=>set(it.k,e.target.checked)} style={{accentColor:C.accent,width:15,height:15}}/>
                {it.l}
              </label>
            ))}
          </div>
        </div>

        {/* Bonos predefinidos */}
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <Lbl t="🎁 Bonos predefinidos"/>
            <button onClick={()=>set("bonos",[...(f.bonos||[]),{concepto:"",monto:""}])} style={{background:C.purpleBg,color:C.purple,border:"none",borderRadius:7,padding:"4px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ Agregar bono</button>
          </div>
          {(f.bonos||[]).length===0&&<div style={{fontSize:12,color:C.muted,fontStyle:"italic"}}>Sin bonos configurados — agrégalos para activarlos/desactivarlos en cada semana con un click</div>}
          {(f.bonos||[]).map((b,i)=>(
            <div key={i} style={{display:"flex",gap:8,alignItems:"flex-end",marginBottom:6,flexWrap:"wrap"}}>
              <div style={{flex:2,minWidth:140}}><Inp label={i===0?"Concepto del bono":""} value={b.concepto} onChange={e=>{const nb=[...(f.bonos||[])];nb[i]={...nb[i],concepto:e.target.value};set("bonos",nb);}} placeholder="Ej: Bono puntualidad..."/></div>
              <div style={{width:90}}><Inp label={i===0?"Monto $":""} type="number" value={b.monto} onChange={e=>{const nb=[...(f.bonos||[])];nb[i]={...nb[i],monto:e.target.value};set("bonos",nb);}} placeholder="0.00"/></div>
              <label style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:C.purple,fontWeight:700,cursor:"pointer",marginBottom:12,flexShrink:0}}>
                <input type="checkbox" checked={!!b.intangible} onChange={e=>{const nb=[...(f.bonos||[])];nb[i]={...nb[i],intangible:e.target.checked};set("bonos",nb);}} style={{accentColor:C.purple}}/>
                Intangible
              </label>
              <button onClick={()=>set("bonos",(f.bonos||[]).filter((_,j)=>j!==i))} style={{background:C.redBg,color:C.red,border:"none",borderRadius:7,padding:"7px 10px",cursor:"pointer",marginBottom:12,fontSize:14,flexShrink:0}}>×</button>
            </div>
          ))}
          {(f.bonos||[]).length>0&&<div style={{fontSize:11,color:C.muted}}>Total bonos si todos activos: {cur((f.bonos||[]).reduce((s,b)=>s+parseFloat(b.monto||0),0))}/semana</div>}
        </div>

        <Txta label="Notas internas" value={f.notas||""} onChange={e=>set("notas",e.target.value)} placeholder="Observaciones, acuerdos especiales..." xStyle={{minHeight:50}}/>

        <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
          <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
          {isEdit&&emp.activo!==false&&<Btn ch="🚫 Dar de baja" v="danger" onClick={()=>onBaja(emp.id)}/>}
          {isEdit&&emp.activo===false&&<Btn ch="✅ Reactivar" v="green" onClick={()=>onAlta(emp.id)}/>}
          <Btn ch={isEdit?"💾 Guardar cambios":"✅ Registrar empleado"} v="primary" onClick={()=>{
            if(!f.nombre) return fireToast("⚠ Ingresa el nombre");
            if(!f.sueldoSemanal) return fireToast("⚠ Ingresa el sueldo");
            onSave(f);
          }} style={{flex:1}}/>
        </div>
      </div>
    </Modal>
  );
}

// ── Modal anticipo ──
function AnticipModal({emp, registro, onClose, onSave}) {
  const [monto,    setMonto]    = useState("");

function CancelModal({svc, onClose, onCancelar, onReagendar}) {

  const [motivo,  setMotivo]  = useState("");
  const [fase,    setFase]    = useState("motivo"); // "motivo"|"reagenda_opciones"

          {tieneF===true&&(

              <div style={{fontSize:12,fontWeight:700,color:"#64748B",marginBottom:6}}>NUEVA FECHA</div>

          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>

        </div>

        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button onClick={onClose} style={{background:"#F0F4F8",border:"none",borderRadius:10,padding:"10px 16px",fontSize:13,fontWeight:700,cursor:"pointer",color:"#4A5568",fontFamily:"inherit"}}>Cancelar</button>

              ❌ Confirmar cancelación
            </button>
          )}
        </div>
      </div>
    </div>
  );

function App({currentUser=null, onLogout=null, allowedTabs=null, onShowUsuarios=null, onShowDispositivos=null}) {
  const [svcs,   setSvcs,   svcR]    = useStored("comins:svcs",   S_SVC);
  const [txns,   setTxns,   txnR]    = useStored("comins:txns",   S_TXN);
  const [leads,  setLeads,  leadR]   = useStored("comins:leads",  S_LEADS);
  const [quotes, setQuotes, quoteR]  = useStored("comins:quotes", S_QUOTES);
  const [cat,      setCat,    catR]    = useStored("comins:cat",    S_CAT);
  const [clausulas, setClausulas]       = useStored("comins:clausulas", [
    {titulo:"Garantía estándar", texto:"Los trabajos realizados cuentan con garantía de 30 días en mano de obra. Las refacciones y equipos se sujetan a la garantía del fabricante."},
    {titulo:"Condiciones de pago", texto:"50% de anticipo al confirmar el servicio, 50% restante al término. Precios sujetos a cambio sin previo aviso."},
    {titulo:"Política de cancelación", texto:"Cancelaciones con menos de 24 hrs de anticipación generan cargo del 20% del servicio cotizado."},
    {titulo:"Vigencia de cotización", texto:"Esta cotización tiene una vigencia de 15 días a partir de la fecha de emisión."},
  ]);
  const [inv,    setInv,    invR]    = useStored("comins:inv",    []);
  const [provs,  setProvs,  provR]   = useStored("comins:provs",  []);
  const [ocs,    setOcs,    ocR]     = useStored("comins:ocs",    []);
  const [tdc,    setTdc,    tdcR]    = useStored("comins:tdc",    {limite:0,pagoDia:0,pagos:[]});
  const [incCats, setIncCats] = useStored("comins:incCats", S_INC_CATS);
  const [expCats, setExpCats] = useStored("comins:expCats", S_EXP_CATS);
  const [empleados, setEmpleados] = useStored("comins:empleados", []);
  const [nominas,   setNominas]   = useStored("comins:nominas",   []);
  const allReady = svcR && txnR && leadR && quoteR && catR && invR && provR && ocR && tdcR;

  useEffect(()=>{
    if(!allReady) return;
    _sid = Math.max(_sid, ...svcs.map(s=>s.id||0))+1;
    _tid = Math.max(_tid, ...txns.map(t=>t.id||0))+1;
    _lid = Math.max(_lid, ...leads.map(l=>l.id||0))+1;
    _qid = Math.max(_qid, ...quotes.map(q=>q.id||0))+1;
    markInitialized();

    // Limpiar vínculos huérfanos: cotizaciones que apuntan a servicios borrados
    const svcIds = new Set(svcs.map(s=>s.id));
    const orphans = quotes.filter(q=>q.servicioId&&!svcIds.has(q.servicioId));
    if(orphans.length>0) {
      setQuotes(p=>p.map(q=>orphans.find(o=>o.id===q.id)?{...q,servicioId:null,servicioFolio:""}:q));
    }

    // Reparar vínculos de un solo lado: servicio tiene cotizacionId pero cotización no tiene servicioId
    const fixedQuotes = {};
    svcs.forEach(s=>{
      if(s.cotizacionId && s.folio) {
        const q = quotes.find(qq=>qq.id===s.cotizacionId);
        if(q && (!q.servicioId || q.servicioId!==s.id)) {
          fixedQuotes[q.id] = {...q, servicioId:s.id, servicioFolio:s.folio};
        }
      }
    });
    if(Object.keys(fixedQuotes).length>0) {
      setQuotes(p=>p.map(q=>fixedQuotes[q.id]?fixedQuotes[q.id]:q));
    }

    // Migración: corregir movimientos con método inválido
    // El bug de paréntesis en useState guardó métodos como undefined/object
    const metodosValidos = ["efectivo","transferencia","tdd","cargo_auto","tarjeta","tdc"];
    const txnsMalos = txns.filter(t=>!metodosValidos.includes(t.method));
    if(txnsMalos.length>0) {
      setTxns(p=>p.map(t=>{
        if(metodosValidos.includes(t.method)) return t;
        // Inferir método correcto: si el servicio vinculado tiene payMethod, usarlo
        var inferido = "efectivo"; // default seguro
        if(t.auto && t.type==="ingreso") {
          // Buscar el servicio por folio en el concepto
          var folioMatch = (t.concept||"").match(/SV-(\d+)/);
          if(folioMatch) {
            var svcRef = svcs.find(s=>s.folio==="SV-"+folioMatch[1]);
            if(svcRef && svcRef.payMethod && metodosValidos.includes(svcRef.payMethod)) {
              inferido = svcRef.payMethod;
            }
          }
        }
        return {...t, method:inferido};
      }));
      fireToast("✅ "+txnsMalos.length+" movimiento(s) con método corregido");
    }
  },[allReady]);

  const [tab,        setTab]        = useState("dashboard");
  const [modal,      setModal]      = useState(null);
  const [selSvc,     setSelSvc]     = useState(null);
  const [selQuote,   setSelQuote]   = useState(null);
  const [pendingAgendarCot, setPendingAgendarCot] = useState(null);
  const [cobrarTarget, setCobrarTarget] = useState(null);
  const [editQuote,  setEditQuote]  = useState(null);
  const [editTxn,    setEditTxn]    = useState(null);
  const [svcFilter,  setSvcFilter]  = useState("todos");
  const [vistaServ,  setVistaServ]  = useState("lista"); // "lista"|"semana"|"mes"
  const [calWeekStart, setCalWeekStart] = useState(()=>{
    const d=new Date(); const dow=d.getDay()===0?6:d.getDay()-1;
    d.setDate(d.getDate()-dow); return new Date(d);
  });
  const [calMonth, setCalMonth] = useState(()=>({y:new Date().getFullYear(),m:new Date().getMonth()}));
  const [svcSearch,  setSvcSearch]  = useState("");
  const [txnFilter,  setTxnFilter]  = useState("todos");
  const [txnCls,     setTxnCls]     = useState("todos");
  const [txnSearch,  setTxnSearch]  = useState("");
  const [leadFilter, setLeadFilter] = useState("todos");
  const [qFilter,    setQFilter]    = useState("todos");
  const [qPeriod,    setQPeriod]    = useState("anio");
  const [qAnio,      setQAnio]      = useState(new Date().getFullYear());
  const [finPeriod,  setFinPeriod]  = useState("anio");
  const [finMes,     setFinMes]     = useState(new Date().getMonth());

    const base = s.fechaCobro || s.date;
    if(!base) return false;
    const d = new Date(base+"T12:00:00");
    d.setDate(d.getDate() + parseInt(s.seguimientoDias));
    const seguDate = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    return seguDate <= tod2;
  });

      const b = to   ? new Date(to+"T23:59:59")   : new Date("2099-12-31");
      return dt>=a && dt<=b;

    if(p==="semana") { const s=new Date(now2);s.setDate(now2.getDate()-7);return dt>=s; }

        const newAmount = parseFloat(data.amount)||0;

        </div>}
        {/* Tabs */}
        {NAV_VISIBLE.map(n=>(
          <button key={n.id} onClick={()=>setTab(n.id)} style={{
            background:"none",
            border:"none",
            borderBottom:`2px solid ${tab===n.id?C.accent:"transparent"}`,
            color:tab===n.id?C.accent:C.muted,
            padding:"0 12px",
            fontSize:12,
            fontWeight:tab===n.id?600:500,
            cursor:"pointer",

            position:"relative",
            transition:"color .15s",

            <span>{n.label}</span>

          </button>
        ))}

// ── Session wrapper ─────────────────────────────────────────────
function SJRApp() {
  const [currentUser, setCurrentUser] = React.useState(null);
  const [usuarios,     setUsuariosRaw] = React.useState(SJR_USUARIOS_DEFAULT);
  const [dispositivos, setDispositivosRaw] = React.useState([]);
  const [dispReady,    setDispReady]   = React.useState(false);
  const [showUsuarios, setShowUsuarios] = React.useState(false);
  const [showDisp,     setShowDisp]    = React.useState(false);

  // Persist usuarios + dispositivos to Firebase
  var setUsuarios = function(updater) {
    setUsuariosRaw(function(prev) {
      var next = typeof updater === "function" ? updater(prev) : updater;
      try { if(window._db) window._db.collection("sjr_data").doc("sjr:usuarios").set({v:next}).catch(function(){}); } catch(e){}
      return next;
    });
  };
  var setDispositivos = function(updater) {
    setDispositivosRaw(function(prev) {
      var next = typeof updater === "function" ? updater(prev) : updater;
      try { if(window._db) window._db.collection("sjr_data").doc("sjr:dispositivos").set({v:next}).catch(function(){}); } catch(e){}
      return next;
    });
  };

  // Load from Firebase on mount + listen dispositivos in real time
  React.useEffect(function() {
    if(!window._db) { setDispReady(true); return; }
    // Usuarios
    window._db.collection("sjr_data").doc("sjr:usuarios").get().then(function(doc) {
      if(doc.exists && doc.data().v && doc.data().v.length > 0) setUsuariosRaw(doc.data().v);
    }).catch(function(){});
    // Dispositivos — realtime so director sees new requests immediately
    var unsub = window._db.collection("sjr_data").doc("sjr:dispositivos").onSnapshot(function(doc) {
      var disps = (doc.exists && doc.data().v) ? doc.data().v : [];
      setDispositivosRaw(disps);
      setDispReady(true);
    }, function() { setDispReady(true); });
    return function(){ unsub(); };
  }, []);

  // Device check
  React.useEffect(function() {
    if(!dispReady) return;
    var thisDevice = dispositivos.find(function(d){ return d.id===SJR_DEVICE_ID; });
    if(!thisDevice) {
      // Register this device as pending
      var isFirst = dispositivos.length === 0;
      var newDisp = {
        id: SJR_DEVICE_ID, autorizado: isFirst,
        solicitado: new Date().toISOString().slice(0,10),
        autorizadoFecha: isFirst ? new Date().toISOString().slice(0,10) : null,
        nombre: "", info: navigator.userAgent.slice(0,80)
      };
      setDispositivos(function(p){ return [...p, newDisp]; });
    }
  }, [dispReady]);

  // Show states based on device
  var thisDevice = dispositivos.find(function(d){ return d.id===SJR_DEVICE_ID; });
  var isPendiente = thisDevice && !thisDevice.autorizado;
  var isAutorizado = thisDevice && thisDevice.autorizado;

  if(!dispReady) return React.createElement(SJRDeviceCheckScreen);
  if(!isAutorizado) return React.createElement(SJRDeviceLockScreen, {pendiente: isPendiente});

  if(!currentUser) {
    return React.createElement(SJRLoginScreen, {
      onLogin: function(u) { setCurrentUser(u); },
      usuarios: usuarios
    });
  }

  return (
    <div>
      <App
        currentUser={currentUser}
        onLogout={function(){ setCurrentUser(null); }}
        allowedTabs={SJR_TABS_POR_ROL[currentUser.rol] || SJR_TABS_POR_ROL.operativo}
        onShowUsuarios={currentUser.rol==="director" ? function(){ setShowUsuarios(true); } : null}
        onShowDispositivos={currentUser.rol==="director" ? function(){ setShowDisp(true); } : null}
      />
      {showUsuarios&&<SJRUsuariosModal usuarios={usuarios} setUsuarios={setUsuarios} usuarioActual={currentUser} onClose={function(){setShowUsuarios(false);}}/>}
      {showDisp&&<SJRDispositivosModal dispositivos={dispositivos} setDispositivos={setDispositivos} onClose={function(){setShowDisp(false);}}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(SJRApp));
</script>
  <script>
    (function() {
      var src = document.getElementById("app-source").textContent;
      var result = Babel.transform(src, { presets: ["react"] }).code;
      var script = document.createElement("script");
      script.text = result;
      document.body.appendChild(script);
    })();
  </script>
  <script>
    if("serviceWorker" in navigator) {
      window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
    }
  </script>
