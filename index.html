          <div style={{textAlign:"right"}}><div style={{fontSize:13,color:C.muted}}>Subtotal: {cur(preview.subtotal)}</div><div style={{fontSize:13,color:C.muted}}>IVA (16%): {cur(preview.iva)}</div><div style={{fontSize:20,fontWeight:900,color:C.accent,marginTop:6}}>TOTAL: {cur(preview.total)}</div></div>
          {preview.notes&&<div style={{marginTop:14,padding:"10px 16px",background:"#fffbeb",borderRadius:8,fontSize:12,color:"#78350f"}}><strong>Notas:</strong> {preview.notes}</div>}
        </div>
        <div style={{background:C.greenBg,borderRadius:8,padding:"10px 14px",marginTop:12,fontSize:12,color:C.green,fontWeight:600}}>✅ {preview.folio} guardada en seguimiento</div>
        <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
          <Btn ch="← Editar" v="ghost" onClick={()=>setPreview(null)}/>
          <Btn ch="🖨 Imprimir / PDF" v="soft" onClick={()=>firePrintQuote(preview)}/>
          <Btn ch="📋 Copiar para WA" v="green" onClick={()=>{navigator.clipboard.writeText(waText);fireToast("✅ Copiado al portapapeles");}}/>
          {preview.phone&&<Btn ch="📲 Abrir WhatsApp" v="green" onClick={()=>window.open(`https://wa.me/52${preview.phone.replace(/\D/g,"")}?text=${encodeURIComponent(waText)}`,"_blank")}/>}
          <Btn ch="✓ Listo" v="primary" onClick={onClose}/>
        </div>
      </div>
    </Modal>
  );
  return (
    <Modal title={editQuote ? `✏ Editar cotización — ${editQuote.folio}` : `📋 Nueva Cotización — ${nextFolio}`} onClose={onClose} wide>
      <div>
        {svcOrigen&&(
          <div style={{background:"#F0FDF4",border:"1.5px solid #10B98144",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:13,color:"#065F46"}}>
            🔗 Cotización para servicio <strong>{svcOrigen.folio}</strong> — {svcOrigen.client} · {svcOrigen.type} · {fmtD(svcOrigen.date)}
          </div>
        )}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"0 14px"}}>
          <div style={{gridColumn:"1/3"}}><Inp label="Cliente *" value={cl.name} onChange={e=>setCl(p=>({...p,name:e.target.value}))} placeholder="Nombre del cliente"/></div>
          <div>
            <Inp label="Teléfono" value={cl.phone} onChange={e=>setCl(p=>({...p,phone:e.target.value}))} placeholder="5551234567"/>
            {cl.phone&&cl.phone.length>=8&&(()=>{
              const phone=cl.phone.replace(/[^0-9]/g,"");
              const prev=quotes.filter(q=>q.phone&&q.phone.replace(/[^0-9]/g,"").includes(phone));
              return prev.length>0?(<div style={{background:C.accentBg,borderRadius:8,padding:"6px 12px",marginTop:4,fontSize:12,color:C.accentD,fontWeight:600}}>📋 Cliente conocido · {prev.length} cotización{prev.length>1?"es":""} anterior{prev.length>1?"es":""} — {prev[0].client}</div>):null;
            })()}
          </div>
        </div>
        <div style={{display:"flex",gap:14,marginBottom:12,alignItems:"flex-end"}}>
          <div style={{width:130}}><Inp label="Fecha cotización" type="date" value={quoteDate} onChange={e=>setQuoteDate(e.target.value)}/></div>
          <div style={{width:150}}><Inp label="Vigencia (días)" type="number" value={validity} onChange={e=>setValidity(e.target.value)}/></div>
          <div style={{width:150}}><Inp label="Seguimiento el" type="date" value={followUpDate} onChange={e=>setFollowUpDate(e.target.value)} placeholder="Opcional"/></div>
          <div style={{width:110}}>
            <Lbl t="Moneda"/>
            <select value={moneda} onChange={e=>setMoneda(e.target.value)} style={{width:"100%",background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"9px 10px",fontSize:13,fontFamily:"inherit",color:C.text}}>
              <option value="MXN">MXN</option>
              <option value="USD">USD</option>
            </select>
          </div>
          <div style={{width:130}}>
            <Lbl t="IVA %"/>
            <div style={{display:"flex",gap:4}}>
              {[0,8,16].map(r=>(
                <button key={r} onClick={()=>setIvaRate(r)} style={{flex:1,background:ivaRate===r?"#1A202C":"transparent",color:ivaRate===r?"#fff":C.sub,border:`1.5px solid ${ivaRate===r?"#1A202C":C.border}`,borderRadius:8,padding:"8px 4px",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                  {r===0?"Sin IVA":`${r}%`}
                </button>
              ))}
            </div>
          </div>
          <div>
            <Lbl t="Mostrar totales en PDF"/>
            <button onClick={()=>setShowTotales(p=>!p)} style={{display:"flex",alignItems:"center",gap:8,background:showTotales?C.greenBg:"#F0F4F8",border:`1.5px solid ${showTotales?C.green:C.border}`,borderRadius:8,padding:"8px 12px",cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:700,color:showTotales?C.green:C.muted}}>
              <span style={{width:18,height:18,borderRadius:4,background:showTotales?C.green:"#CBD5E0",display:"inline-flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:11,flexShrink:0}}>{showTotales?"✓":""}</span>
              {showTotales?"Subtotal y total visibles":"Solo precios por ítem"}
            </button>
          </div>
          <div style={{flex:1,paddingBottom:12,fontSize:12,color:C.muted}}>Folio: <strong style={{color:C.accentD}}>{nextFolio}</strong></div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <Lbl t="Conceptos"/>
          <button onClick={()=>setShowCat(true)} style={{background:"none",border:"none",color:C.accent,fontSize:12,fontWeight:700,cursor:"pointer"}}>⚙ Editar catálogo</button>
        </div>
        {/* Panel catálogo interactivo */}
        {showPanel&&(
          <div style={{background:C.surface,border:`2px solid ${C.accent}`,borderRadius:14,padding:16,marginBottom:16,boxShadow:"0 8px 24px #00000014"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div style={{fontWeight:800,fontSize:14}}>📦 Seleccionar del catálogo</div>
              <button onClick={()=>setShowPanel(false)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:C.muted}}>×</button>
            </div>
            {/* Buscador */}
            <input value={catBusqueda} onChange={e=>setCatBusqueda(e.target.value)} placeholder="🔍 Buscar..." style={{width:"100%",background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"8px 12px",fontSize:13,fontFamily:"inherit",marginBottom:10,boxSizing:"border-box"}}/>
            {/* Tabs de sección */}
            <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
              {CAT_SECCIONES.map(s=>(
                <button key={s.id} onClick={()=>{setCatSeccion(s.id);setCatBusqueda("");}} style={{background:catSeccion===s.id?s.color:"transparent",color:catSeccion===s.id?"#fff":C.sub,border:`1.5px solid ${catSeccion===s.id?s.color:C.border}`,borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",transition:"all .15s"}}>{s.label}</button>
              ))}
            </div>
            {/* Items — agrupados por categoría si es materiales */}
            <div style={{maxHeight:280,overflowY:"auto"}}>
              {filteredCat.length===0&&<div style={{textAlign:"center",color:C.muted,padding:20,fontSize:13}}>Sin items en esta sección</div>}
              {catSeccion==="materiales" ? (
                // Agrupar por categoría de inventario
                (()=>{
                  const cats = [...new Set(filteredCat.map(it=>it.cat||"Otro"))];
                  return cats.map(cat=>(
                    <div key={cat} style={{marginBottom:10}}>
                      <div style={{fontSize:10,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:.8,padding:"4px 0",marginBottom:6,borderBottom:`1px solid ${C.border}`}}>{cat}</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                        {filteredCat.filter(it=>(it.cat||"Otro")===cat).map((item,i)=>{
                          const tieneStock = item.stock > 0;
                          return (
                            <button key={i} onClick={()=>addFromCatalog(item)} style={{
                              background:tieneStock?"#F0FDF4":"#FFF7F7",
                              border:`1.5px solid ${tieneStock?"#10B98133":"#EF444433"}`,
                              borderRadius:10,padding:"9px 11px",cursor:"pointer",fontFamily:"inherit",
                              textAlign:"left",display:"flex",flexDirection:"column",gap:4,transition:"all .15s"
                            }}>
                              <div style={{fontWeight:700,fontSize:12,color:C.text,lineHeight:1.3}}>{item.name}</div>
                              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:4}}>
                                {item.price>0&&<span style={{fontSize:11,fontWeight:800,color:C.accentD}}>{cur(item.price)}</span>}
                                <span style={{fontSize:10,fontWeight:700,
                                  background:tieneStock?"#D1FAE5":"#FEE2E2",
                                  color:tieneStock?"#10B981":"#EF4444",
                                  borderRadius:6,padding:"1px 6px",flexShrink:0}}>
                                  {tieneStock?`✅ ${item.stock} ${item.unit}`:"🛒 Sin stock"}
                                </span>
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ));
                })()
              ) : (
                // Agrupar por subcat para servicios y equipos
                (()=>{
                  const subcats = [...new Set(filteredCat.map(it=>it.subcat||"Otros"))];
                  const sec = CAT_SECCIONES.find(s=>s.id===catSeccion)||CAT_SECCIONES[0];
                  return subcats.map(subcat=>{
                    const secItems = filteredCat.filter(it=>(it.subcat||"Otros")===subcat);
                    if(!secItems.length) return null;
                    return (
                      <div key={subcat} style={{marginBottom:10}}>
                        <div style={{fontSize:10,fontWeight:800,color:sec.color,textTransform:"uppercase",letterSpacing:.8,padding:"4px 0",marginBottom:6,borderBottom:`1.5px solid ${sec.color}22`}}>{subcat}</div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                          {secItems.map((item,i)=>(
                            <button key={i} onClick={()=>addFromCatalog(item)} style={{background:sec.bg,border:`1.5px solid ${sec.color}33`,borderRadius:10,padding:"9px 11px",cursor:"pointer",fontFamily:"inherit",textAlign:"left",display:"flex",flexDirection:"column",gap:3,transition:"all .15s"}}>
                              <div style={{fontWeight:700,fontSize:12,color:sec.color,lineHeight:1.3}}>{item.name}</div>
                              {item.price>0&&<span style={{fontSize:11,fontWeight:800,color:C.accentD}}>{cur(item.price)}</span>}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  });
                })()
              )}
            {/* Botón agregar material para compra (sin stock) */}
            {catSeccion==="materiales"&&(
              <div style={{marginTop:12,borderTop:`1px solid ${C.border}`,paddingTop:10}}>
                <div style={{fontSize:11,color:C.muted,marginBottom:8,fontWeight:600}}>¿No está en inventario? Agrégalo como compra:</div>
                <div style={{display:"flex",gap:8}}>
                  <input id="matCompraInput" placeholder="Ej: Filtro deshidratador..." style={{flex:1,background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"7px 10px",fontSize:12,fontFamily:"inherit",color:C.text}}/>
                  <input id="matCompraPrice" type="number" placeholder="$0.00" style={{width:80,background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"7px 8px",fontSize:12,fontFamily:"inherit",color:C.text,textAlign:"right"}}/>
                  <button onClick={()=>{
                    const inp = document.getElementById("matCompraInput");
                    const prc = document.getElementById("matCompraPrice");
                    const name = (inp&&inp.value&&inp.value.trim())||"";
                    if(!name) return;
                    addFromCatalog({name, seccion:"materiales", price:parseFloat((prc&&prc.value))||0, stock:0, fromInv:false, sinStock:true});
                    if(inp) inp.value="";
                    if(prc) prc.value="";
                  }} style={{background:"#EF4444",color:"#fff",border:"none",borderRadius:8,padding:"7px 14px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>🛒 + Compra</button>
                </div>
              </div>
            )}
            </div>
          </div>
        )}

        {/* ── Numeración automática de partidas ── */}
        {(()=>{
          var grupoNum = 0;
          var conceptoNum = 0;
          return items.map((it,i)=>{
            if(it.type==="grupo") {
              grupoNum++;
              conceptoNum=0;
              var gNum = grupoNum;
              return (
                <div key={i}>
                  <div style={{background:"#E8EDF2",borderRadius:10,padding:"10px 14px",marginBottom:4,display:"flex",alignItems:"center",gap:8,borderLeft:"3px solid #8B1A1A"}}>
                    <span style={{color:"#6B7280",fontSize:12,fontWeight:700,flexShrink:0,minWidth:28}}>{grupoNum}.</span>
                    <input
                      value={it.titulo||""}
                      onChange={e=>updItem(i,"titulo",e.target.value)}
                      placeholder="Nombre del grupo (ej: Albañilería, Instalación...)"
                      style={{flex:1,background:"transparent",border:"none",color:"#1E293B",fontSize:13,fontWeight:700,fontFamily:"inherit",outline:"none"}}
                    />
                    <button onClick={()=>{
                      // Insertar concepto justo después de este grupo (antes del siguiente grupo o al final)
                      var insertAt = i+1;
                      while(insertAt < items.length && items[insertAt].type!=="grupo") insertAt++;
                      var newItems = [...items];
                      newItems.splice(insertAt, 0, {desc:"",qty:1,price:""});
                      setItems(newItems);
                    }} style={{background:"#8B1A1A",color:"#fff",border:"none",borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:700,cursor:"pointer",flexShrink:0}}>+ concepto</button>
                    <button onClick={()=>remItem(i)} style={{background:"none",border:"none",color:"#9CA3AF",cursor:"pointer",fontSize:18,flexShrink:0}}>×</button>
                  </div>
                </div>
              );
            } else {
              conceptoNum++;
              var partida = grupoNum>0?(grupoNum+"."+conceptoNum):String(conceptoNum);
              return (
                <div key={i} style={{background:C.surfaceAlt,borderRadius:10,padding:12,marginBottom:6,marginLeft:grupoNum>0?16:0,borderLeft:grupoNum>0?`3px solid #E2E8F0`:"none"}}>
                  <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                    <div style={{color:C.muted,fontSize:11,fontWeight:700,minWidth:32,paddingTop:10,flexShrink:0}}>{partida}</div>
                    <div style={{flex:1}}>
                      <button onClick={()=>setShowPanel(true)} style={{width:"100%",background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"6px 12px",color:C.sub,fontSize:11,fontFamily:"inherit",marginBottom:5,cursor:"pointer",textAlign:"left"}}>📦 Catálogo...</button>
                      <textarea value={it.desc||""} onChange={e=>updItem(i,"desc",e.target.value)} placeholder="✏ Descripción del concepto..." rows={2} style={{width:"100%",background:C.surface,border:`1.5px solid ${it.sinStock?"#EF444466":C.accent+"44"}`,borderRadius:8,padding:"8px 12px",color:C.text,fontSize:13,fontFamily:"inherit",boxSizing:"border-box",resize:"vertical",minHeight:38}}/>
                      {it.notaInterna&&<div style={{background:"#FEF3C7",border:"1px solid #F59E0B33",borderRadius:6,padding:"4px 10px",fontSize:11,color:"#92400E",marginTop:4,fontWeight:600}}>🔒 Nota interna: {it.notaInterna}</div>}
                    </div>
                    <div style={{flexShrink:0,width:65}}>
                      <Lbl t="Unidad"/>
                      <input value={it.unidad||""} onChange={e=>updItem(i,"unidad",e.target.value)} placeholder="pza" style={{width:"100%",background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"7px 5px",color:C.text,fontSize:12,fontFamily:"inherit",textAlign:"center"}}/>
                    </div>
                    <div style={{flexShrink:0}}>
                      <Lbl t="Cant."/>
                      <input type="number" min="1" value={it.qty||1} onChange={e=>updItem(i,"qty",e.target.value)} style={{width:52,background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"7px 5px",color:C.text,fontSize:13,fontFamily:"inherit",textAlign:"center"}}/>
                    </div>
                    <div style={{flexShrink:0}}>
                      <Lbl t="P/U $"/>
                      <input type="number" value={it.price||""} onChange={e=>updItem(i,"price",e.target.value)} placeholder="0" style={{width:84,background:C.surface,border:`1.5px solid ${C.accent}66`,borderRadius:8,padding:"7px 8px",color:C.accentD,fontSize:13,fontFamily:"inherit",fontWeight:800}}/>
                    </div>
                    <button onClick={()=>remItem(i)} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:20,marginTop:16,flexShrink:0}}>×</button>
                  </div>
                  <div style={{textAlign:"right",fontSize:11,color:C.muted,marginTop:5}}>Subtotal: <strong style={{color:C.accentD}}>{cur((+it.price||0)*(+it.qty||1))}</strong></div>
                </div>
              );
            }
          });
        })()}
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <Btn ch="+ Concepto" v="ghost" sm onClick={addItem}/>
          <Btn ch="+ Grupo / Título" v="soft" sm onClick={()=>setItems(p=>[...p,{type:"grupo",titulo:""}])}/>
        </div>
        <div style={{background:C.surfaceAlt,borderRadius:10,padding:"14px 18px",marginBottom:14}}>
          <Row label="Subtotal" value={curQ(sub)}/>{ivaRate>0&&<Row label={"IVA "+ivaRate+"%"} value={curQ(iva)}/>}{ivaRate===0&&<div style={{fontSize:11,color:C.muted,padding:"4px 0"}}>Sin IVA</div>}
          <div style={{display:"flex",justifyContent:"space-between",paddingTop:10}}><span style={{fontWeight:800}}>TOTAL</span><span style={{fontWeight:900,fontSize:20,color:C.accent}}>{curQ(total)}{moneda==="USD"&&<span style={{fontSize:12,fontWeight:700,color:C.muted,marginLeft:4}}>USD</span>}</span></div>
        </div>

        {/* ── BLOQUE 1: CLÁUSULAS ── */}
        <div style={{border:`1.5px solid ${C.border}`,borderRadius:12,marginBottom:12,overflow:"hidden"}}>
          <div style={{background:C.surfaceAlt,padding:"10px 14px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontWeight:700,fontSize:13,color:C.text}}>📋 Cláusulas</div>
              <div style={{fontSize:11,color:C.muted,marginTop:2}}>Selecciona las que aplican a esta cotización</div>
            </div>
            {clausulasSelec.length>0&&<span style={{background:C.accentBg,color:C.accentD,borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700}}>{clausulasSelec.length} seleccionada{clausulasSelec.length>1?"s":""}</span>}
          </div>
          <div style={{padding:"10px 14px",display:"flex",flexDirection:"column",gap:6}}>
            {clausulas.length===0&&<div style={{fontSize:12,color:C.muted,textAlign:"center",padding:"10px 0"}}>No hay cláusulas en el catálogo. Agrega una abajo.</div>}
            {clausulas.map((cl,idx)=>{
              const selKey = String(cl.id)+"_"+idx;
              const yaSelec = clausulasSelec.some(c=>c._selKey===selKey||(c._selKey===undefined&&String(c.id)===String(cl.id)&&!clausulas.slice(0,idx).some(x=>String(x.id)===String(cl.id))));
              const isEditing = editingClausula===selKey;
              return (
                <div key={selKey}>
                  {isEditing ? (
                    <div style={{background:C.accentBg,border:`1.5px solid ${C.accent}`,borderRadius:8,padding:"10px 12px"}}>
                      <input
                        value={editClausulaData.titulo}
                        onChange={e=>setEditClausulaData(p=>({...p,titulo:e.target.value}))}
                        style={{width:"100%",background:"#fff",border:`1.5px solid ${C.border}`,borderRadius:7,padding:"6px 10px",fontSize:12,fontFamily:"inherit",color:C.text,boxSizing:"border-box",marginBottom:6}}
                      />
                      <textarea
                        value={editClausulaData.texto}
                        onChange={e=>setEditClausulaData(p=>({...p,texto:e.target.value}))}
                        rows={3}
                        style={{width:"100%",background:"#fff",border:`1.5px solid ${C.border}`,borderRadius:7,padding:"6px 10px",fontSize:12,fontFamily:"inherit",color:C.text,resize:"vertical",boxSizing:"border-box",marginBottom:8}}
                      />
                      <div style={{display:"flex",gap:6}}>
                        <Btn ch="💾 Guardar" v="primary" sm onClick={()=>{
                          if(!editClausulaData.titulo||!editClausulaData.texto) return fireToast("⚠ Completa título y texto");
                          // Actualizar catálogo
                          setClausulas(p=>p.map((c,i)=>i===idx?{...c,titulo:editClausulaData.titulo,texto:editClausulaData.texto}:c));
                          // Actualizar si estaba seleccionada
                          setClausulasSelec(p=>p.map(c=>c._selKey===selKey?{...c,titulo:editClausulaData.titulo,texto:editClausulaData.texto}:c));
                          setEditingClausula(null);
                          fireToast("✅ Cláusula actualizada");
                        }}/>
                        <Btn ch="Cancelar" v="ghost" sm onClick={()=>setEditingClausula(null)}/>
                      </div>
                    </div>
                  ) : (
                    <div style={{background:yaSelec?C.accentBg:C.surface,border:`1.5px solid ${yaSelec?C.accent:C.border}`,borderRadius:8,padding:"10px 12px",display:"flex",alignItems:"flex-start",gap:10,transition:"all .15s"}}>
                      {/* Checkbox area */}
                      <div onClick={()=>{
                        if(yaSelec) {
                          setClausulasSelec(p=>p.filter(c=>c._selKey!==selKey));
                        } else {
                          setClausulasSelec(p=>[...p,{id:cl.id,_selKey:selKey,titulo:cl.titulo,texto:cl.texto}]);
                        }
                      }} style={{width:18,height:18,borderRadius:4,border:`2px solid ${yaSelec?C.accent:C.muted}`,background:yaSelec?C.accent:"transparent",flexShrink:0,marginTop:1,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                        {yaSelec&&<span style={{color:"#fff",fontSize:11,fontWeight:900}}>✓</span>}
                      </div>
                      {/* Content — clickable for select */}
                      <div style={{flex:1,cursor:"pointer"}} onClick={()=>{
                        if(yaSelec) setClausulasSelec(p=>p.filter(c=>c._selKey!==selKey));
                        else setClausulasSelec(p=>[...p,{id:cl.id,_selKey:selKey,titulo:cl.titulo,texto:cl.texto}]);
                      }}>
                        <div style={{fontWeight:700,fontSize:12,color:yaSelec?C.accentD:C.text}}>{cl.titulo}</div>
                        <div style={{fontSize:11,color:C.muted,marginTop:3,lineHeight:1.5}}>{cl.texto.length>120?cl.texto.slice(0,120)+"...":cl.texto}</div>
                      </div>
                      {/* Edit/Delete buttons */}
                      <div style={{display:"flex",gap:4,flexShrink:0}}>
                        <button onClick={e=>{e.stopPropagation();setEditingClausula(selKey);setEditClausulaData({titulo:cl.titulo,texto:cl.texto});}} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:6,padding:"3px 8px",fontSize:11,cursor:"pointer",color:C.muted,fontFamily:"inherit"}}>✏</button>

                setNewClausula({titulo:"",texto:""});

          </div>
        </div>

        {/* ── BLOQUE 2: NOTAS ADICIONALES ── */}

          </div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:8}}>

        </div>
      </div>
    </Modal>
  );
}

// Infiere tipo de servicio desde los conceptos de la cotización
function inferirTipoServicio(items) {
  const textos = (items||[]).map(i=>(i.desc||"").toLowerCase()).join(" ");
  if(textos.includes("instalac")) return "Instalación";
  if(textos.includes("manten")) return "Mantenimiento";
  if(textos.includes("repar") || textos.includes("cambio") || textos.includes("capacitor")) return "Reparación";
  if(textos.includes("revision") || textos.includes("diagn")) return "Revisión";
  if(textos.includes("garantia")) return "Garantía";
  return "Instalación";
}

  const eSub   = eItems.reduce((s,it)=>s+(+it.price||0)*(+it.qty||0),0);
  const eIvaAmt= eSub*(eIva/100);

function LeadParser({onClose, onCreateService, onCreateLead}) {
  const [text,setText]=useState("");
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [edit,setEdit]=useState(null);
  const [error,setError]=useState("");
  const parse=async()=>{
    if(!text.trim())return;
    setLoading(true);setError("");setResult(null);
    try {
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:`Extrae datos de este lead de WhatsApp para negocio de A/C. SOLO JSON sin backticks:\n{"name":"","phone":"","address":"","serviceType":"Mantenimiento","notes":"","priority":"normal","preferredDate":"","interest":"resumen"}\nTipos: Mantenimiento,Instalación,Reparación,Revisión,Garantía. Priority: normal,alta,urgente.\n\nConversación:\n${text}`}]})});
      const data=await res.json();
      const raw=(data.content||[]).map(function(b){return b.text||"";}).join("");
      const parsed=JSON.parse(raw.split("```json").join("").split("```").join("").trim());
      setResult(parsed);setEdit({...parsed});
    } catch(e) { setError("No pude procesar. Intenta de nuevo."); }
    setLoading(false);
  };
  const r=edit||result;
  const se=(k,v)=>setEdit(p=>({...p,[k]:v}));
  return(
    <Modal title="🤖 Procesar Lead de WhatsApp" onClose={onClose} wide>
      {!result?(
        <div>
          <div style={{background:C.accentBg,borderRadius:10,padding:"12px 16px",marginBottom:16,fontSize:13,color:C.accentD}}>💡 Pega la conversación de WhatsApp — la IA extrae todos los datos.</div>
          <Txta label="Conversación" value={text} onChange={e=>setText(e.target.value)} placeholder="Cliente: Hola buenas tardes...\nYo: Claro, con gusto..." xStyle={{minHeight:180}}/>
          {error&&<div style={{color:C.red,fontSize:13,marginBottom:12}}>⚠ {error}</div>}
          <div style={{display:"flex",gap:10}}>
            <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
            <Btn ch={loading?"⏳ Procesando...":"✨ Extraer con IA"} v="primary" onClick={parse} style={{opacity:loading?0.7:1}}/>
          </div>
        </div>
      ):(
        <div>
          <div style={{background:C.greenBg,borderRadius:10,padding:"10px 16px",marginBottom:16,fontSize:13,color:C.green,fontWeight:600}}>✅ Datos extraídos — revisa y confirma</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 16px"}}>
            <Inp label="Nombre" value={(r&&r.name)||""} onChange={e=>se("name",e.target.value)}/>
            <Inp label="Teléfono" value={(r&&r.phone)||""} onChange={e=>se("phone",e.target.value)}/>
          </div>
          <Inp label="Dirección" value={(r&&r.address)||""} onChange={e=>se("address",e.target.value)}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 16px"}}>
            <Sel label="Tipo" opts={SVC_TYPES} value={(r&&r.serviceType)||"Mantenimiento"} onChange={e=>se("serviceType",e.target.value)}/>
            <Sel label="Prioridad" opts={[{v:"normal",l:"Normal"},{v:"alta",l:"Alta"},{v:"urgente",l:"Urgente"}]} value={(r&&r.priority)||"normal"} onChange={e=>se("priority",e.target.value)}/>
          </div>
          <Txta label="Notas" value={(r&&r.notes)||""} onChange={e=>se("notes",e.target.value)}/>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <Btn ch="← Volver" v="ghost" onClick={()=>{setResult(null);setEdit(null);}}/>
            <Btn ch="💾 Guardar como Lead" v="orange" onClick={()=>{onCreateLead(r);onClose();}}/>
            <Btn ch="🚀 Crear Servicio" v="green" onClick={()=>{onCreateService(r);onClose();}}/>
          </div>
        </div>
      )}
    </Modal>
  );
}

const INV_CATS = ["Gas Refrigerante","Refacción","Equipo Completo","Herramienta","Consumible","Otro"];
const INV_UNITS = ["pieza","kg","libra","litro","metro","caja","juego"];
let _iid = 1;

function InvTab({inv, setInv, addTxn, tod2, provs=[], setProvs, ocs=[], setOcs}) {
  const [modal,      setModal]     = useState(null);
  const [sel,        setSel]       = useState(null);
  const [catF,       setCatF]      = useState("todos");
  const [search,     setSearch]    = useState("");
  const [vista,      setVista]     = useState("lista"); // "lista" | "utilidad" | "proveedores"
  const [confirmDel, setConfirmDel]= useState(false);

  useEffect(()=>{
    if(inv.length>0) _iid = Math.max(_iid,...inv.map(i=>i.id||0))+1;
  },[]);

  const filtered = inv
    .filter(i=>catF==="todos"||i.cat===catF)
    .filter(i=>!search||i.name.toLowerCase().includes(search.toLowerCase()))
    .sort((a,b)=>a.name.localeCompare(b.name));

  // ── Cálculos globales ──
  const totalInvertido    = inv.reduce((s,i)=>s+(i.stock*(i.costUnit||0)),0);
  const totalVentaPotencial = inv.filter(i=>i.salePrice>0).reduce((s,i)=>s+(i.stock*(i.salePrice||0)),0);
  const totalUtilidadPot  = totalVentaPotencial - totalInvertido;
  const bajoStock         = inv.filter(i=>i.stock<=i.minStock&&i.minStock>0);

  const saveItem = (item) => {
    if(item.id && inv.find(x=>x.id===item.id)) setInv(p=>p.map(x=>x.id===item.id?item:x));
    else setInv(p=>[{...item,id:_iid++,created:tod2,movs:[]},...p]);
    setModal(null); setSel(null);
  };
  const deleteItem = (id) => { setInv(p=>p.filter(x=>x.id!==id)); setModal(null); setSel(null); setConfirmDel(false); };

  const usarItem = (item, qty, cobrar, precioVenta, concepto) => {
    const newStock = Math.max(0,(item.stock||0)-qty);
    const mov = {fecha:tod2,tipo:"salida",qty,concepto:concepto||(cobrar?"Venta":"Uso interno"),precio:cobrar?precioVenta:0};
    setInv(p=>p.map(x=>x.id===item.id?{...x,stock:newStock,movs:[mov,...(x.movs||[])]}:x));
    if(cobrar&&precioVenta>0)
      addTxn({date:tod2,concept:concepto||`Venta ${item.name}`,category:"Servicio A/C",classification:"Variable",type:"ingreso",amount:precioVenta*qty,method:"efectivo",status:"realizado",auto:true});
    setModal(null); setSel(null);
    fireToast(`✅ ${qty} ${item.unit} de ${item.name} usados. Stock: ${newStock}`);
  };

  const recibirCompra = (item, qty, costo, registrarGasto) => {
    const newStock = (item.stock||0)+qty;
    const mov = {fecha:tod2,tipo:"entrada",qty,concepto:"Compra / reabasto",precio:costo};
    setInv(p=>p.map(x=>x.id===item.id?{...x,stock:newStock,costUnit:costo||x.costUnit,movs:[mov,...(x.movs||[])]}:x));
    if(registrarGasto&&costo>0)
      addTxn({date:tod2,concept:`Compra ${item.name} (${qty} ${item.unit})`,category:"Materiales",classification:"Variable",type:"egreso",amount:costo*qty,method:"efectivo",status:"realizado",auto:false});
    setModal(null); setSel(null);
    fireToast(`✅ +${qty} ${item.unit} recibidos. Stock: ${newStock}`);
  };

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,gap:10,flexWrap:"wrap"}}>
        <div style={{fontWeight:900,fontSize:20}}>📦 Inventario</div>
        <div style={{display:"flex",gap:8}}>
          <Btn ch="+ Agregar" v="primary" sm onClick={()=>{setSel(null);setModal("add");}}/>
        </div>
      </div>

      {/* Stats globales */}
      <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        <StatCard label="Productos" value={inv.length} icon="📦" color={C.accent}/>
        <StatCard label="Invertido en stock" value={cur(totalInvertido)} icon="💸" color={C.orange} sub="a precio de costo"/>
        <StatCard label="Venta potencial" value={cur(totalVentaPotencial)} icon="📈" color={C.accent} sub="si vendes todo"/>
        <StatCard label="Utilidad potencial" value={cur(totalUtilidadPot)} icon="💰" color={totalUtilidadPot>=0?C.green:C.red} sub={totalVentaPotencial>0?`${Math.round((totalUtilidadPot/totalVentaPotencial)*100)}% margen`:"sin precios de venta"}/>
        <StatCard label="Stock bajo" value={bajoStock.length} icon="⚠" color={bajoStock.length>0?C.red:C.green} sub={bajoStock.length>0?"Requiere reabasto":"Todo OK"}/>
      </div>

      {/* Toggle vista */}
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[{v:"lista",l:"📦 Lista"},{v:"utilidad",l:"📊 Análisis de utilidad"},{v:"proveedores",l:"🏢 Proveedores"},{v:"ocs",l:"📋 Órdenes de compra"}].map(t=>(
          <button key={t.v} onClick={()=>setVista(t.v)} style={{background:vista===t.v?C.accentBg:"transparent",border:`1.5px solid ${vista===t.v?C.accent:C.border}`,color:vista===t.v?C.accentD:C.sub,borderRadius:8,padding:"7px 18px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{t.l}</button>
        ))}
      </div>

      {/* VISTA UTILIDAD */}
      {vista==="utilidad"&&(
        <div>
          <Card style={{marginBottom:16,background:"linear-gradient(135deg,#0EA5E920,#8B5CF610)"}}>
            <div style={{fontWeight:800,fontSize:15,marginBottom:14}}>💡 ¿Cómo leer esto?</div>
            <div style={{fontSize:13,color:C.sub,lineHeight:1.8}}>
              <strong>Invertido</strong> = lo que pagaste para tener ese producto en bodega.<br/>
              <strong>Venta potencial</strong> = lo que recibirías si vendes todo el stock al precio de venta.<br/>
              <strong>Utilidad potencial</strong> = la ganancia que tendrías si vendes todo.<br/>

          }).map(item=>{

            const utilUnit   = (item.salePrice||0)-(item.costUnit||0);
            return (
              <Card key={item.id} style={{marginBottom:10,borderLeft:`3px solid ${utilPot>0?C.green:utilPot<0?C.red:C.muted}`}}>

                        <div style={{fontSize:10,color:C.orange,fontWeight:700,textTransform:"uppercase"}}>Invertido</div>
                        <div style={{fontWeight:800,fontSize:14,color:C.orange}}>{cur(invertido)}</div>

                      </div>
                      <div style={{background:C.accentBg,borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
                        <div style={{fontSize:10,color:C.accentD,fontWeight:700,textTransform:"uppercase"}}>Venta potencial</div>
                        <div style={{fontWeight:800,fontSize:14,color:C.accentD}}>{cur(ventaPot)}</div>
                        <div style={{fontSize:10,color:C.muted}}>{cur(item.salePrice)}/u</div>
                      </div>
                      <div style={{background:utilPot>=0?C.greenBg:C.redBg,borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
                        <div style={{fontSize:10,color:utilPot>=0?C.green:C.red,fontWeight:700,textTransform:"uppercase"}}>Utilidad potencial</div>

                        <div style={{fontSize:10,color:C.muted}}>{cur(utilUnit)}/u · {margen}% margen</div>

                    </div>
                    {/* Barra de margen */}
                    {ventaPot>0&&<div style={{marginTop:10}}>

                      </div>
                    </div>}
                  </div>
                </div>
              </Card>
            );
          })}
          {inv.filter(i=>!i.salePrice&&!i.costUnit).length>0&&(
            <div style={{color:C.muted,fontSize:13,textAlign:"center",padding:16}}>
              {inv.filter(i=>!i.salePrice&&!i.costUnit).length} producto(s) sin precios — edítalos para verlos aquí

        </div>

                const folio = `OC-${String((ocs.length||0)+1).padStart(3,"0")}`;
                const items = bajoStock.map(i=>({
                  invId:i.id, name:i.name, unit:i.unit,
                  stockActual:i.stock, minStock:i.minStock,
                  cantSugerida:Math.max(1,(i.minStock*2)-i.stock),
                  provId:i.provId||"", provName:(provs.find(p=>p.id===i.provId)||{name:"Sin proveedor"}).name
                }));
                const oc = {id:_ocid++,folio,fecha:tod2,status:"pendiente",items};
                setOcs(p=>[oc,...p]);
                setVista("ocs");
                fireToast(`✅ ${folio} generada con ${items.length} productos`);
              }}/>
            </div>
            {bajoStock.map(i=>{
              const prov = provs.find(p=>p.id===i.provId);
              return (
                <div key={i.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:`1px solid ${C.red}22`,fontSize:13,flexWrap:"wrap",gap:6}}>
                  <div>
                    <strong>{i.name}</strong>
                    <span style={{color:C.red,marginLeft:8}}>{i.stock} {i.unit} (mín. {i.minStock})</span>
                    {prov&&<span style={{color:C.muted,marginLeft:8,fontSize:12}}>🏢 {prov.name}</span>}
                  </div>
                  <Btn ch="+ Recibir" v="danger" sm onClick={()=>{setSel(i);setModal("recibir");}}/>
                </div>
              );
            })}
          </div>
        )}
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar producto..." style={{width:"100%",background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:10,padding:"10px 16px",color:C.text,fontSize:14,fontFamily:"inherit",marginBottom:10,boxSizing:"border-box"}}/>
        <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
          {["todos",...INV_CATS].map(c=>(
            <button key={c} onClick={()=>setCatF(c)} style={{background:catF===c?C.accentBg:"transparent",border:`1.5px solid ${catF===c?C.accent:C.border}`,color:catF===c?C.accentD:C.sub,borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
              {c==="todos"?"Todos":c}
            </button>
          ))}
        </div>
        {filtered.length===0&&<div style={{color:C.muted,textAlign:"center",padding:40}}>No hay productos. Agrega tu primer artículo.</div>}
        {filtered.map(item=>{
          const bajo    = item.minStock>0&&item.stock<=item.minStock;
          const utilUnit= (item.salePrice||0)-(item.costUnit||0);
          const margen  = item.salePrice>0?Math.round((utilUnit/item.salePrice)*100):null;
          return (
            <Card key={item.id} style={{marginBottom:10,borderLeft:`3px solid ${bajo?C.red:item.stock===0?C.muted:C.green}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4,flexWrap:"wrap"}}>
                    <span style={{background:C.accentBg,color:C.accentD,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>{item.cat}</span>
                    {bajo&&<span style={{background:C.redBg,color:C.red,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>⚠ Stock bajo</span>}
                    {item.stock===0&&<span style={{background:"#f1f5f9",color:C.muted,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>Sin stock</span>}
                    {margen!==null&&<span style={{background:margen>=30?C.greenBg:margen>=10?C.orangeBg:C.redBg,color:margen>=30?C.green:margen>=10?C.orange:C.red,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>{margen}% margen</span>}
                  </div>
                  <div style={{fontWeight:800,fontSize:16}}>{item.name}</div>
                  <div style={{display:"flex",gap:16,marginTop:4,flexWrap:"wrap"}}>
                    <span style={{fontSize:13,color:C.sub}}>📦 <strong style={{color:bajo?C.red:C.green}}>{item.stock} {item.unit}</strong></span>
                    {item.costUnit>0&&<span style={{fontSize:13,color:C.muted}}>Costo: {cur(item.costUnit)}</span>}
                    {item.salePrice>0&&<span style={{fontSize:13,color:C.purple}}>Venta: {cur(item.salePrice)}</span>}
                    {item.costUnit>0&&item.salePrice>0&&<span style={{fontSize:13,color:C.green}}>Ganancia/u: {cur(utilUnit)}</span>}
                  </div>
                  {item.notes&&<div style={{fontSize:12,color:C.muted,marginTop:4,fontStyle:"italic"}}>{item.notes}</div>}
                  {/* Mini historial */}
                  {(item.movs||[]).length>0&&(
                    <div style={{marginTop:8,borderTop:`1px solid ${C.border}`,paddingTop:8}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                        <span style={{fontSize:11,color:C.muted,fontWeight:700}}>ÚLTIMOS MOVIMIENTOS</span>
                        <span style={{fontSize:10,color:C.muted}}>{(item.movs||[]).length} total</span>
                      </div>
                      {(item.movs||[]).slice(0,5).map((m,i)=>(
                        <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:12,color:C.sub,marginBottom:4,gap:6}}>
                          <span style={{flex:1}}>{m.tipo==="entrada"?"📥":"📤"} {m.concepto} — {m.qty} {item.unit}</span>
                          <span style={{color:C.muted,flexShrink:0}}>{fmtD(m.fecha)}</span>
                          <button onClick={e=>{e.stopPropagation();if(window._confirmDelete){window._confirmDelete(()=>setInv(p=>p.map(x=>x.id===item.id?{...x,movs:(x.movs||[]).filter((_,j)=>j!==i)}:x)));}else{setInv(p=>p.map(x=>x.id===item.id?{...x,movs:(x.movs||[]).filter((_,j)=>j!==i)}:x));}}} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:14,padding:"0 2px",flexShrink:0}}>🗑</button>
                        </div>
                      ))}
                      {(item.movs||[]).length>5&&<div style={{fontSize:11,color:C.muted,textAlign:"center",marginTop:4}}>+{(item.movs||[]).length-5} más — edita el producto para ver todos</div>}
                    </div>
                  )}
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",flexShrink:0}}>
                  <Btn ch="🔧 Usar" v="soft" sm onClick={()=>{setSel(item);setModal("usar");}}/>
                  <Btn ch="📥 Recibir" v="green" sm onClick={()=>{setSel(item);setModal("recibir");}}/>
                  <Btn ch="✏" v="ghost" sm onClick={()=>{setSel(item);setModal("add");}}/>
                </div>
              </div>
            </Card>
          );
        })}
      </>)}

      {vista==="proveedores"&&<ProveedoresView provs={provs} setProvs={setProvs}/>}
      {vista==="ocs"&&<OCsView ocs={ocs} setOcs={setOcs} inv={inv} setInv={setInv} provs={provs} tod2={tod2}/>}
      {(modal==="add"||modal==="edit")&&<InvFormModal item={sel} onClose={()=>{setModal(null);setSel(null);}} onSave={saveItem} onDelete={()=>setConfirmDel(true)} provs={provs}/>}
      {modal==="usar"&&sel&&<UsarItemModal item={sel} onClose={()=>{setModal(null);setSel(null);}} onConfirm={usarItem}/>}
      {modal==="recibir"&&sel&&<RecibirModal item={sel} onClose={()=>{setModal(null);setSel(null);}} onConfirm={recibirCompra}/>}
      {confirmDel&&sel&&<ConfirmModal msg={`¿Eliminar ${sel.name} del inventario?`} onOk={()=>deleteItem(sel.id)} onCancel={()=>setConfirmDel(false)}/>}
    </div>
  );
}

const OC_STATUS = {
  pendiente:  {label:"Pendiente",  color:C.orange, bg:C.orangeBg},
  enviada:    {label:"Enviada",    color:C.accent, bg:C.accentBg},
  recibida:   {label:"Recibida",   color:C.green,  bg:C.greenBg},
  cancelada:  {label:"Cancelada",  color:C.red,    bg:C.redBg},
};

function OCsView({ocs, setOcs, inv, setInv, provs, tod2}) {
  const [selOC,      setSelOC]     = useState(null);
  const [confirmDel, setConfirmDel]= useState(false);

  const updateStatus = (oc, status) => {
    setOcs(p=>p.map(x=>x.id===oc.id?{...x,status}:x));
    if(status==="recibida") {
      // Auto-recibir stock para cada item
      oc.items.forEach(it=>{
        setInv(p=>p.map(x=>x.id===it.invId?{...x,
          stock:(x.stock||0)+it.cantSugerida,
          movs:[{fecha:tod2,tipo:"entrada",qty:it.cantSugerida,concepto:`OC ${oc.folio}`},...(x.movs||[])]
        }:x));
      });
      fireToast(`✅ Stock actualizado desde ${oc.folio}`);
    }
  };

  const copyOC = (oc) => {
    const porsProveedor = {};
    oc.items.forEach(it=>{
      const key = it.provName||"Sin proveedor";
      if(!porsProveedor[key]) porsProveedor[key]=[];
      porsProveedor[key].push(it);
    });
    let txt = `*ORDEN DE COMPRA ${oc.folio}*\nFecha: ${oc.fecha}\n\n`;
    Object.entries(porsProveedor).forEach(([prov,items])=>{
      txt += `*Proveedor: ${prov}*\n`;
      items.forEach(i=>{ txt += `• ${i.name}: ${i.cantSugerida} ${i.unit}\n`; });
      txt += "\n";
    });
    txt += "_Generada desde MULTISERVICIOS SJR_";
    navigator.clipboard.writeText(txt).then(()=>fireToast("✅ OC copiada al portapapeles"));
  };

  if(ocs.length===0) return (
    <div style={{textAlign:"center",padding:40,color:C.muted}}>
      <div style={{fontSize:40,marginBottom:12}}>📋</div>
      <div style={{fontWeight:700,marginBottom:8}}>Sin órdenes de compra</div>
      <div style={{fontSize:13}}>Cuando haya stock bajo, usa el botón "📋 Generar OC" en las alertas</div>
    </div>
  );

  return (
    <div>
      <div style={{fontWeight:800,fontSize:16,marginBottom:16}}>📋 Órdenes de Compra</div>
      {ocs.map(oc=>{
        const st = OC_STATUS[oc.status]||OC_STATUS.pendiente;
        // Agrupar por proveedor
        const porProv = {};
        oc.items.forEach(it=>{
          const k = it.provName||"Sin proveedor";
          if(!porProv[k]) porProv[k]=[];
          porProv[k].push(it);
        });
        return (
          <Card key={oc.id} style={{marginBottom:12,borderLeft:`3px solid ${st.color}`}}>
            {/* Header OC */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap",marginBottom:12}}>
              <div>
                <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4}}>
                  <span style={{fontWeight:900,fontSize:16}}>{oc.folio}</span>
                  <span style={{background:st.bg,color:st.color,borderRadius:6,padding:"2px 10px",fontSize:11,fontWeight:700}}>{st.label}</span>
                </div>
                <div style={{fontSize:12,color:C.muted}}>📅 {oc.fecha} · {oc.items.length} productos · {Object.keys(porProv).length} proveedor(es)</div>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {oc.status==="pendiente"&&<Btn ch="📲 Copiar WA" v="soft" sm onClick={()=>copyOC(oc)}/>}
                {oc.status!=="recibida"&&oc.status!=="cancelada"&&(
                  <select value={oc.status} onChange={e=>updateStatus(oc,e.target.value)}
                    style={{background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"5px 10px",fontSize:12,fontFamily:"inherit",color:C.text}}>
                    {Object.entries(OC_STATUS).map(([v,c])=><option key={v} value={v}>{c.label}</option>)}
                  </select>
                )}
                <Btn ch="🗑" v="danger" sm onClick={()=>{setSelOC(oc);setConfirmDel(true);}}/>
              </div>
            </div>

            {/* Tabla por proveedor */}
            {Object.entries(porProv).map(([prov,items])=>{
              const provData = provs.find(p=>p.name===prov);
              return (
                <div key={prov} style={{marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.surfaceAlt,borderRadius:8,padding:"6px 12px",marginBottom:6}}>
                    <span style={{fontWeight:700,fontSize:13}}>🏢 {prov}</span>
                    {(provData&&provData.phone)&&(
                      <Btn ch={`📲 ${provData.phone}`} v="ghost" sm onClick={()=>window.open(`https://wa.me/52${provData.phone.replace(/[^0-9]/g,"")}`, "_blank")}/>
                    )}
                  </div>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                    <thead>
                      <tr style={{background:C.accent,color:"#fff"}}>
                        <th style={{padding:"7px 10px",textAlign:"left"}}>Producto</th>
                        <th style={{padding:"7px 10px",textAlign:"center",width:80}}>Stock actual</th>
                        <th style={{padding:"7px 10px",textAlign:"center",width:80}}>Mínimo</th>
                        <th style={{padding:"7px 10px",textAlign:"center",width:100}}>Cant. sugerida</th>
                      </tr>
                    </thead>
                    <tbody>
                      {items.map((it,i)=>(
                        <tr key={i} style={{borderBottom:`1px solid ${C.border}`,background:i%2===1?C.surfaceAlt:"#fff"}}>
                          <td style={{padding:"7px 10px"}}>{it.name}</td>
                          <td style={{padding:"7px 10px",textAlign:"center",color:C.red,fontWeight:700}}>{it.stockActual} {it.unit}</td>
                          <td style={{padding:"7px 10px",textAlign:"center",color:C.muted}}>{it.minStock} {it.unit}</td>
                          <td style={{padding:"7px 10px",textAlign:"center"}}>
                            <input type="number" defaultValue={it.cantSugerida} min="1"
                              onChange={e=>setOcs(p=>p.map(o=>o.id===oc.id?{...o,items:o.items.map((x,j)=>j===i&&items===porProv[prov]?{...x,cantSugerida:parseFloat(e.target.value)||1}:x)}:o))}
                              style={{width:60,background:C.accentBg,border:`1.5px solid ${C.accent}`,borderRadius:6,padding:"4px 6px",textAlign:"center",fontSize:13,fontFamily:"inherit",color:C.accentD,fontWeight:700}}/>
                            <span style={{marginLeft:4,fontSize:11,color:C.muted}}>{it.unit}</span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              );
            })}
          </Card>
        );
      })}
      {confirmDel&&selOC&&<ConfirmModal msg={`¿Eliminar ${selOC.folio}?`} onOk={()=>{setOcs(p=>p.filter(x=>x.id!==selOC.id));setConfirmDel(false);setSelOC(null);}} onCancel={()=>{setConfirmDel(false);setSelOC(null);}}/>}
    </div>
  );
}

let _pid = 1;
let _ocid = 1;

function ProveedoresView({provs, setProvs}) {
  const [modal,      setModal]     = useState(null); // "add"|"edit"
  const [sel,        setSel]       = useState(null);
  const [search,     setSearch]    = useState("");
  const [confirmDel, setConfirmDel]= useState(false);

  useEffect(()=>{
    if(provs.length>0) _pid = Math.max(_pid,...provs.map(p=>p.id||0))+1;
  },[]);

  const filtered = provs
    .filter(p=>!search||p.name.toLowerCase().includes(search.toLowerCase())||
               (p.contact||"").toLowerCase().includes(search.toLowerCase()))
    .sort((a,b)=>a.name.localeCompare(b.name));

  const saveProv = (prov) => {
    if(prov.id && provs.find(x=>x.id===prov.id)) setProvs(p=>p.map(x=>x.id===prov.id?prov:x));
    else setProvs(p=>[{...prov,id:_pid++},...p]);
    setModal(null); setSel(null);
  };
  const deleteProv = (id) => { setProvs(p=>p.filter(x=>x.id!==id)); setModal(null); setSel(null); setConfirmDel(false); };

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,gap:10}}>
        <div style={{fontWeight:800,fontSize:16,color:C.text}}>🏢 Directorio de Proveedores</div>
        <Btn ch="+ Nuevo proveedor" v="primary" sm onClick={()=>{setSel(null);setModal("add");}}/>
      </div>

      {provs.length===0&&(
        <div style={{background:C.accentBg,borderRadius:12,padding:24,textAlign:"center",marginBottom:16}}>
          <div style={{fontSize:32,marginBottom:8}}>🏢</div>
          <div style={{fontWeight:700,color:C.accentD,marginBottom:4}}>Sin proveedores registrados</div>
          <div style={{fontSize:13,color:C.muted}}>Agrega tus proveedores para asignarlos a tus productos</div>
        </div>
      )}

      {provs.length>0&&(
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar proveedor..." style={{width:"100%",background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:10,padding:"10px 16px",color:C.text,fontSize:14,fontFamily:"inherit",marginBottom:14,boxSizing:"border-box"}}/>
      )}

      {filtered.map(prov=>(
        <Card key={prov.id} style={{marginBottom:10,borderLeft:`3px solid ${C.accent}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:800,fontSize:16,marginBottom:4}}>{prov.name}</div>
              <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
                {prov.contact&&<span style={{fontSize:13,color:C.sub}}>👤 {prov.contact}</span>}
                {prov.phone&&<span style={{fontSize:13,color:C.sub}}>📞 {prov.phone}</span>}
                {prov.email&&<span style={{fontSize:13,color:C.sub}}>✉ {prov.email}</span>}
              </div>
              {prov.address&&<div style={{fontSize:12,color:C.muted,marginTop:4}}>📍 {prov.address}</div>}
              {prov.notes&&<div style={{fontSize:12,color:C.muted,marginTop:4,fontStyle:"italic"}}>{prov.notes}</div>}
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0}}>
              {prov.phone&&(
                <Btn ch="📲 WA" v="soft" sm onClick={()=>window.open(`https://wa.me/52${prov.phone.replace(/[^0-9]/g,"")}`, "_blank")}/>
              )}
              <Btn ch="✏" v="ghost" sm onClick={()=>{setSel(prov);setModal("edit");}}/>
            </div>
          </div>
        </Card>
      ))}

      {modal&&(
        <ProvFormModal
          prov={sel}
          onClose={()=>{setModal(null);setSel(null);}}
          onSave={saveProv}
          onDelete={()=>setConfirmDel(true)}
        />
      )}
      {confirmDel&&sel&&<ConfirmModal msg={`¿Eliminar proveedor ${sel.name}?`} onOk={()=>deleteProv(sel.id)} onCancel={()=>setConfirmDel(false)}/>}
    </div>
  );
}

function ProvFormModal({prov, onClose, onSave, onDelete}) {
  const editing = !!prov;
  const [f,setF] = useState(prov||{name:"",contact:"",phone:"",email:"",address:"",notes:""});
  const set = (k,v)=>setF(p=>({...p,[k]:v}));
  const [confirmDel,setConfirmDel] = useState(false);
  return (
    <>
    <Modal title={editing?"✏ Editar proveedor":"➕ Nuevo proveedor"} onClose={onClose}>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
          <div style={{gridColumn:"1/-1"}}><Inp label="Nombre del negocio *" value={f.name} onChange={e=>set("name",e.target.value)} placeholder="Ej: Refricentro, Climatización del Norte..."/></div>
          <Inp label="Contacto / Vendedor" value={f.contact||""} onChange={e=>set("contact",e.target.value)} placeholder="Nombre de la persona"/>
          <Inp label="Teléfono / WhatsApp" value={f.phone||""} onChange={e=>set("phone",e.target.value)} placeholder="5551234567"/>
          <Inp label="Email" value={f.email||""} onChange={e=>set("email",e.target.value)} placeholder="ventas@proveedor.com"/>
          <Inp label="Ciudad / Dirección" value={f.address||""} onChange={e=>set("address",e.target.value)} placeholder="Ciudad, Estado"/>
          <div style={{gridColumn:"1/-1"}}><Txta label="Notas" value={f.notes||""} onChange={e=>set("notes",e.target.value)} placeholder="Días de entrega, condiciones de pago, productos que maneja..."/></div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:8,flexWrap:"wrap"}}>
          <Btn ch="Cancelar" v="ghost" onClick={onClose}/>

    {confirmDel&&<ConfirmModal msg={`¿Eliminar a ${f.name}?`} onOk={()=>{onDelete(f.id);onClose();}} onCancel={()=>setConfirmDel(false)}/>}
    </>
  );
}

          <Inp label="Precio de venta $" type="number" value={f.salePrice} onChange={e=>set("salePrice",parseFloat(e.target.value)||0)}/>
          <div style={{gridColumn:"1/-1"}}>
            <Lbl t="Proveedor"/>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>

        </div>
        {/* Historial completo de movimientos */}
        {editing&&(f.movs||[]).length>0&&(
          <div style={{marginTop:12,borderTop:`1px solid ${C.border}`,paddingTop:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <Lbl t="📋 Historial de movimientos"/>
              <button onClick={()=>setF(p=>({...p,movs:[]}))} style={{background:C.redBg,border:"none",borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:700,cursor:"pointer",color:C.red}}>🗑 Borrar todos</button>
            </div>
            <div style={{maxHeight:200,overflowY:"auto",background:C.surfaceAlt,borderRadius:8}}>
              {(f.movs||[]).map((m,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderBottom:`1px solid ${C.border}`,fontSize:12,gap:8}}>
                  <span style={{color:m.tipo==="entrada"?C.green:C.red,fontWeight:700,minWidth:60}}>{m.tipo==="entrada"?"📥 Entrada":"📤 Salida"}</span>
                  <span style={{flex:1,color:C.text}}>{m.concepto}</span>
                  <span style={{color:C.sub,fontWeight:700}}>{m.qty} {f.unit}</span>
                  <span style={{color:C.muted,flexShrink:0}}>{fmtD(m.fecha)}</span>
                  <button onClick={()=>setF(p=>({...p,movs:(p.movs||[]).filter((_,j)=>j!==i)}))} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:14,padding:0,flexShrink:0}}>🗑</button>
                </div>
              ))}
            </div>
          </div>
        )}
        <div style={{display:"flex",gap:10,marginTop:12,flexWrap:"wrap"}}>
          <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
          {editing&&<Btn ch="🗑 Eliminar producto" v="danger" onClick={()=>setConfirmDel(true)}/>}
          <Btn ch="💾 Guardar" v="primary" onClick={()=>{if(!f.name)return fireToast("⚠ Ingresa el nombre");onSave(f);}}/>
        </div>
      </div>
    </Modal>
    {confirmDel&&<ConfirmModal msg={`¿Eliminar ${f.name}?`} onOk={()=>{onDelete(f.id);onClose();}} onCancel={()=>setConfirmDel(false)}/>}
    </>
  );
}

function CajaView({txns, tod2, inPeriod, finPeriod, finFrom, finTo, medio, onSave}) {
  const MEDIOS_INFO = {
    efectivo:     {icon:"💵", label:"Efectivo",     color:"#10B981", bg:"#D1FAE5", sub:"Caja física", saldo:"debería haber en caja"},
    transferencia:{icon:"🏦", label:"Banco / SPEI", color:"#0EA5E9", bg:"#E0F2FE", sub:"Banamex",     saldo:"saldo en banco — incluye depósitos de terminal"},
  };
  const m = MEDIOS_INFO[medio]||MEDIOS_INFO.efectivo;

  // Banco agrupa: transferencia + tdd + cargo_auto
  const bancMetodos = ["transferencia","tdd","cargo_auto"];
  const medioTxns = txns
    .filter(t=>{
      const match = medio==="transferencia"
        ? bancMetodos.includes(t.method)
        : t.method===medio;
      return match && t.status==="realizado" && inPeriod(t.date,finPeriod,finFrom,finTo);
    })
    .sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);

  const porDia = {};
  medioTxns.forEach(t=>{
    if(!porDia[t.date]) porDia[t.date]=[];
    porDia[t.date].push(t);
  });

  const totalEnt = medioTxns.filter(t=>t.type==="ingreso").reduce((s,t)=>s+t.amount,0);
  const totalSal = medioTxns.filter(t=>t.type==="egreso").reduce((s,t)=>s+t.amount,0);
  const saldo    = totalEnt - totalSal;

  // Quick entry sin preguntar medio
  const [qTipo,    setQTipo]    = useState("ingreso");
  const [qMonto,   setQMonto]   = useState("");
  const [qConcepto,setQConcepto]= useState("");

  const qGuardar = () => {
    if(!qMonto||parseFloat(qMonto)<=0) return fireToast("⚠ Ingresa el monto");
    if(!qConcepto.trim()) return fireToast("⚠ Ingresa el concepto");
    onSave({date:tod2, concept:qConcepto.trim(), category:qTipo==="ingreso"?"Servicio A/C":"Otros",
      classification:"Variable", type:qTipo, amount:parseFloat(qMonto),
      method:medio, status:"realizado", auto:false});
    setQMonto(""); setQConcepto("");
    fireToast(`✅ ${qTipo==="ingreso"?"+":"−"}$${qMonto} · ${m.label}`);
  };

  return (
    <div>
      {/* Header con color del medio */}
      <div style={{background:m.bg,borderRadius:12,padding:"14px 18px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={{fontWeight:900,fontSize:16,color:m.color}}>{m.icon} Corte — {m.label}</div>
        <div style={{fontSize:12,color:"#64748b"}}>{m.sub}</div>
      </div>

      {/* Quick entry — registrar movimiento sin salir */}
      <div style={{background:C.surface,border:`1.5px solid ${m.color}44`,borderRadius:12,padding:14,marginBottom:16}}>
        <Lbl t={m.id==="transferencia" ? "+ Agregar movimiento de Banco / Terminal" : "+ Agregar movimiento de Efectivo"}/>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
          <div style={{display:"flex",gap:4}}>
            <button onClick={()=>setQTipo("ingreso")} style={{background:qTipo==="ingreso"?C.greenBg:"transparent",border:`1.5px solid ${qTipo==="ingreso"?C.green:C.border}`,color:qTipo==="ingreso"?C.green:C.muted,borderRadius:8,padding:"8px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>💚 Entrada</button>
            <button onClick={()=>setQTipo("egreso")}  style={{background:qTipo==="egreso"?C.redBg:"transparent",border:`1.5px solid ${qTipo==="egreso"?C.red:C.border}`,color:qTipo==="egreso"?C.red:C.muted,borderRadius:8,padding:"8px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>🔴 Salida</button>
          </div>
          <input value={qConcepto} onChange={e=>setQConcepto(e.target.value)} placeholder="Concepto..." style={{flex:2,minWidth:120,background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"8px 12px",fontSize:13,fontFamily:"inherit",color:C.text}}/>
          <input type="number" value={qMonto} onChange={e=>setQMonto(e.target.value)} onKeyDown={e=>e.key==="Enter"&&qGuardar()} placeholder="$0.00" style={{width:100,background:C.surfaceAlt,border:`1.5px solid ${m.color}`,borderRadius:8,padding:"8px 12px",fontSize:14,fontFamily:"inherit",color:m.color,fontWeight:700,textAlign:"right"}}/>
          <button onClick={qGuardar} style={{background:m.color,color:"#fff",border:"none",borderRadius:8,padding:"8px 18px",fontSize:13,fontWeight:700,cursor:"pointer"}}>✅ Agregar</button>
        </div>
      </div>

      {/* Resumen */}
      <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        <StatCard label="Total entradas" value={cur(totalEnt)} icon="💚" color={C.green} sub={m.sub}/>
        <StatCard label="Total salidas"  value={cur(totalSal)} icon="🔴" color={C.red}   sub={m.sub}/>
        <StatCard label={medio==="efectivo"?"Saldo en caja":"Saldo neto"} value={cur(saldo)} icon={m.icon} color={saldo>=0?m.color:C.red} sub={m.saldo}/>
      </div>

      {/* Por día */}
      {Object.keys(porDia).sort((a,b)=>b.localeCompare(a)).map(fecha=>{
        const movs = porDia[fecha];
        const entDia = movs.filter(t=>t.type==="ingreso").reduce((s,t)=>s+t.amount,0);
        const salDia = movs.filter(t=>t.type==="egreso").reduce((s,t)=>s+t.amount,0);
        const saldoDia = entDia - salDia;
        return (
          <div key={fecha} style={{marginBottom:16}}>
            {/* Header día */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#1A202C",borderRadius:"10px 10px 0 0",padding:"10px 16px"}}>
              <div style={{fontWeight:800,fontSize:14,color:"#fff"}}>
                📅 {new Date(fecha+"T12:00:00").toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"})}
              </div>
              <div style={{display:"flex",gap:16,fontSize:12}}>
                <span style={{color:"#68D391"}}>+{cur(entDia)}</span>
                <span style={{color:"#FC8181"}}>−{cur(salDia)}</span>
                <span style={{color:saldoDia>=0?"#68D391":"#FC8181",fontWeight:900}}> = {cur(saldoDia)}</span>
              </div>
            </div>
            {/* Movimientos del día */}
            <div style={{border:`1px solid ${C.border}`,borderTop:"none",borderRadius:"0 0 10px 10px",overflow:"hidden"}}>
              {movs.map((t,i)=>(
                <div key={t.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 16px",borderBottom:i<movs.length-1?`1px solid ${C.border}`:"none",background:i%2===1?C.surfaceAlt:"#fff"}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,color:C.text}}>{t.concept}</div>
                    <div style={{fontSize:11,color:C.muted,marginTop:2,display:"flex",gap:8}}>
                      <span>{t.category}</span>
                      {t.auto&&<span style={{background:C.accentBg,color:C.accentD,borderRadius:4,padding:"0 5px",fontSize:10,fontWeight:700}}>AUTO</span>}
                    </div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{textAlign:"right",minWidth:80}}>
                      {t.category==="Capital / Apertura de caja"&&<div style={{fontSize:9,fontWeight:700,color:"#6366F1",background:"#EEF2FF",borderRadius:4,padding:"1px 5px",marginBottom:2}}>🏦 Capital</div>}
                      {t.category==="Retiro de socio / Utilidades"&&<div style={{fontSize:9,fontWeight:700,color:"#6366F1",background:"#EEF2FF",borderRadius:4,padding:"1px 5px",marginBottom:2}}>👤 Retiro de socio</div>}
                      <div style={{fontWeight:800,fontSize:15,color:t.category==="Capital / Apertura de caja"?"#6366F1":t.type==="ingreso"?C.green:C.red}}>
                        {t.type==="ingreso"?"+":"−"}{cur(t.amount)}
                      </div>
                    </div>
                    <button onClick={()=>onSave({...t,cotejado:!t.cotejado})} title={t.cotejado?"Quitar verificación":"Marcar como cotejado"} style={{background:t.cotejado?"#D1FAE5":"transparent",border:`1.5px solid ${t.cotejado?"#10B981":C.border}`,borderRadius:8,padding:"4px 8px",cursor:"pointer",fontSize:13,flexShrink:0,color:t.cotejado?"#10B981":C.muted}}>
                      {t.cotejado?"✓":"○"}
                    </button>
                  </div>
                </div>
              ))}
              {/* Subtotal día */}
              <div style={{display:"flex",justifyContent:"flex-end",padding:"8px 16px",background:C.surfaceAlt,borderTop:`1px solid ${C.border}`}}>
                <span style={{fontSize:12,color:C.muted,marginRight:16}}>Neto del día:</span>
                <span style={{fontWeight:900,fontSize:14,color:saldoDia>=0?C.green:C.red}}>{cur(saldoDia)}</span>
              </div>
            </div>
          </div>
        );
      })}

      {medioTxns.length===0&&(
        <div style={{textAlign:"center",padding:40,color:C.muted}}>
          <div style={{fontSize:32,marginBottom:8}}>💵</div>
          <div>Sin movimientos de efectivo en este período</div>
        </div>
      )}
    </div>
  );
}
