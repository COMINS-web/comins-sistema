function fbSet(key, val) {
  try { if(window._db) window._db.collection("sjr_data").doc(key).set({v: val}); } catch(e){ console.warn("fbSet error:",e); }
}
function fbGet(key, cb) {
  try { 
    if(window._db) window._db.collection("sjr_data").doc(key).get()
      .then(function(d){ if(d.exists) cb(d.data().v); })
      .catch(function(e){ console.warn("fbGet error:",e); });
  } catch(e){ console.warn("fbGet error:",e); }
}

// ── Device ID ─────────────────────────────────────────────────────
function getSJRDeviceId() {
  try {
    var id = localStorage.getItem("sjr_device_id");
    if(!id) {
      id = Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2);
      localStorage.setItem("sjr_device_id", id);
    }
    return id;
  } catch(e) { return "sin-storage-" + Date.now().toString(36); }
}
var SJR_DEVICE_ID = getSJRDeviceId();
var codigoDispSJR = function(id) { return String(id||"").slice(-6).toUpperCase(); };

// ── Device lock screens ───────────────────────────────────────────
function SJRDeviceCheckScreen() {
  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#E8F4F1,#EAF2F8)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}>

      <div style={{fontWeight:800,fontSize:14,color:"#7A92A8"}}>Verificando dispositivo...</div>
    </div>
  );
}

        {pendiente

              ⏳ Solicitud enviada — se desbloqueará cuando el Director autorice
            </div>
          : <div style={{background:"#F2F6F9",borderRadius:11,padding:"11px 14px",fontSize:12,color:"#7A92A8"}}>
              Registrando solicitud...
            </div>}
        <div style={{marginTop:18,fontSize:11,color:"#7A92A8"}}>SJR Multiservicios · Ciudad Madero, Tamaulipas</div>
      </div>
    </div>
  );
}

// ── Dispositivos Modal ────────────────────────────────────────────
function SJRDispositivosModal({dispositivos, setDispositivos, onClose}) {
  var pendientes  = dispositivos.filter(function(d){return !d.autorizado;});
  var autorizados = dispositivos.filter(function(d){return  d.autorizado;});

  var autorizar = function(d) {
    setDispositivos(function(p){return p.map(function(x){return x.id===d.id?Object.assign({},x,{autorizado:true,autorizadoFecha:new Date().toISOString().slice(0,10)}):x;});});
    fireToast("✅ Dispositivo "+codigoDispSJR(d.id)+" autorizado");
  };
  var revocar = function(d) {
    if(d.id===SJR_DEVICE_ID) return fireToast("⚠ No puedes revocar el dispositivo que estás usando");
    if(window.confirm("¿Revocar acceso al dispositivo "+codigoDispSJR(d.id)+(d.nombre?" ("+d.nombre+")":"")+"?")) {
      setDispositivos(function(p){return p.map(function(x){return x.id===d.id?Object.assign({},x,{autorizado:false}):x;});});
      fireToast("🔒 Acceso revocado");
    }
  };
  var eliminar = function(d) {
    if(d.id===SJR_DEVICE_ID) return fireToast("⚠ No puedes eliminar el dispositivo que estás usando");
    if(window.confirm("¿Eliminar el registro del dispositivo "+codigoDispSJR(d.id)+"?")) {
      setDispositivos(function(p){return p.filter(function(x){return x.id!==d.id;});});
      fireToast("🗑 Dispositivo eliminado");
    }
  };
  var renombrar = function(d, nombre) {
    setDispositivos(function(p){return p.map(function(x){return x.id===d.id?Object.assign({},x,{nombre:nombre}):x;});});
  };

  return (
    <Modal title="📱 Dispositivos autorizados" onClose={onClose} wide>
      <div style={{fontSize:13,color:C.muted,lineHeight:1.6,marginBottom:16}}>
        Solo los dispositivos autorizados pueden entrar al sistema. Cuando alguien intente acceder desde uno nuevo, aparecerá aquí como pendiente con su código.
      </div>
      {pendientes.length>0&&<>
        <div style={{fontSize:12,fontWeight:700,color:C.muted,marginBottom:8}}>⏳ SOLICITUDES PENDIENTES ({pendientes.length})</div>
        {pendientes.map(function(d){return (
          <div key={d.id} style={{border:"1.5px solid #F59E0B66",background:"#FFF7ED",borderRadius:12,padding:"12px 14px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:8}}>
              <div style={{fontFamily:"monospace",fontWeight:900,fontSize:18,letterSpacing:3,color:C.text}}>{codigoDispSJR(d.id)}</div>
              <Btn ch="✅ Autorizar" v="green" sm onClick={function(){autorizar(d);}}/>
            </div>
            <input value={d.nombre||""} onChange={function(e){renombrar(d,e.target.value);}} placeholder="Nombre del dispositivo..."
              style={{width:"100%",background:C.surfaceAlt,border:"1.5px solid "+C.border,borderRadius:8,padding:"7px 11px",fontSize:12,fontFamily:"inherit",color:C.text,boxSizing:"border-box"}}/>
            <div style={{fontSize:11,color:C.muted,marginTop:4}}>Solicitado: {d.solicitado||"—"}</div>
          </div>
        );})}
      </>}
      <div style={{fontSize:12,fontWeight:700,color:C.muted,marginBottom:8}}>✅ AUTORIZADOS ({autorizados.length})</div>
      {autorizados.length===0&&<div style={{fontSize:13,color:C.muted,textAlign:"center",padding:16}}>Sin dispositivos autorizados</div>}
      {autorizados.map(function(d){return (
        <div key={d.id} style={{border:"1.5px solid "+C.border,background:C.surface,borderRadius:12,padding:"12px 14px",marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:8}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontFamily:"monospace",fontWeight:900,fontSize:16,letterSpacing:2,color:C.text}}>{codigoDispSJR(d.id)}</span>
              {d.id===SJR_DEVICE_ID&&<span style={{fontSize:10,fontWeight:700,color:C.green,background:C.greenBg,padding:"2px 8px",borderRadius:20}}>Este dispositivo</span>}
            </div>
            <div style={{display:"flex",gap:6}}>
              {d.id!==SJR_DEVICE_ID&&<Btn ch="🔒 Revocar" v="ghost" sm onClick={function(){revocar(d);}}/>}
              {d.id!==SJR_DEVICE_ID&&<Btn ch="🗑" v="ghost" sm style={{color:C.red}} onClick={function(){eliminar(d);}}/>}
            </div>
          </div>
          <input value={d.nombre||""} onChange={function(e){renombrar(d,e.target.value);}} placeholder="Nombre del dispositivo (ej: Celular Chevo, Tablet oficina)"
            style={{width:"100%",background:C.surfaceAlt,border:"1.5px solid "+C.border,borderRadius:8,padding:"7px 11px",fontSize:12,fontFamily:"inherit",color:C.text,boxSizing:"border-box"}}/>
          <div style={{fontSize:11,color:C.muted,marginTop:4}}>Autorizado: {d.autorizadoFecha||"—"}</div>
        </div>
      );})}
    </Modal>
  );
}

// ── Usuarios Modal ────────────────────────────────────────────────
function SJRUsuariosModal({usuarios, setUsuarios, usuarioActual, onClose}) {
  const [editando, setEditando] = useState(null);
  const [form, setForm]         = useState({nombre:"",usuario:"",pin:"",rol:"operativo"});
  var setF = function(k,v){ setForm(function(p){return Object.assign({},p,{[k]:v});}); };

  var empezarEdicion = function(u){ setEditando(u.id); setForm({nombre:u.nombre,usuario:u.usuario,pin:u.pin,rol:u.rol}); };
  var empezarNuevo   = function(){ setEditando("nuevo"); setForm({nombre:"",usuario:"",pin:"",rol:"operativo"}); };

  var guardar = function(){
    if(!form.nombre.trim()||!form.usuario.trim()||!String(form.pin).trim()) return fireToast("⚠ Todos los campos son obligatorios");
    var uLimpio = form.usuario.toLowerCase().trim().replace(/\s+/g,"");
    var dup = usuarios.some(function(u){return u.usuario.toLowerCase()===uLimpio&&u.id!==editando;});
    if(dup) return fireToast("⚠ Ese usuario ya existe");
    if(editando==="nuevo") {
      setUsuarios(function(p){return [...p,{id:"u"+Date.now(),nombre:form.nombre.trim(),usuario:uLimpio,pin:String(form.pin).trim(),rol:form.rol}];});
      fireToast("✅ Usuario creado");
    } else {
      setUsuarios(function(p){return p.map(function(u){return u.id===editando?Object.assign({},u,{nombre:form.nombre.trim(),usuario:uLimpio,pin:String(form.pin).trim(),rol:form.rol}):u;});});
      fireToast("✅ Usuario actualizado");
    }
    setEditando(null);
  };

  var eliminar = function(u){
    if(u.id===usuarioActual?.id) return fireToast("⚠ No puedes eliminar tu propio usuario");
    if(usuarios.filter(function(x){return x.rol==="director";}).length===1&&u.rol==="director") return fireToast("⚠ Debe existir al menos un director");
    if(window.confirm("¿Eliminar el usuario "+u.nombre+"?")) {
      setUsuarios(function(p){return p.filter(function(x){return x.id!==u.id;});});
      fireToast("🗑 Usuario eliminado");
    }
  };

  return (
    <Modal title="👥 Usuarios y PINs" onClose={onClose} wide>
      <div style={{fontSize:13,color:C.muted,marginBottom:14}}>
        Administra quién puede entrar al sistema y con qué rol. Los cambios se guardan en la nube y aplican de inmediato.
      </div>
      {usuarios.map(function(u){return (
        <div key={u.id} style={{border:"1.5px solid "+(editando===u.id?C.accent:C.border),borderRadius:12,padding:"12px 14px",marginBottom:10,background:editando===u.id?C.accentBg:C.surface}}>
          {editando===u.id ? (
            <>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
                <Inp label="Nombre" value={form.nombre} onChange={function(e){setF("nombre",e.target.value);}}/>
                <Inp label="Usuario" value={form.usuario} onChange={function(e){setF("usuario",e.target.value);}}/>
                <Inp label="PIN" value={form.pin} onChange={function(e){setF("pin",e.target.value);}} maxLength={8}/>
                <div>
                  <Lbl t="Rol"/>
                  <select value={form.rol} onChange={function(e){setF("rol",e.target.value);}}
                    style={{width:"100%",background:C.surfaceAlt,border:"1.5px solid "+C.border,borderRadius:9,padding:"9px 12px",fontSize:13,fontFamily:"inherit",color:C.text}}>
                    {Object.entries(SJR_ROLES).map(function([v,r]){return <option key={v} value={v}>{r.icon} {r.label}</option>;})}
                  </select>
                </div>
              </div>
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <Btn ch="Cancelar" v="ghost" sm onClick={function(){setEditando(null);}}/>
                <Btn ch="✅ Guardar" v="primary" sm style={{flex:1}} onClick={guardar}/>
              </div>
            </>
          ) : (
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
              <div>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <span style={{fontWeight:800,fontSize:14}}>{u.nombre}</span>
                  <span style={{fontSize:11,fontWeight:700,background:u.rol==="director"?C.accentBg:C.surfaceAlt,color:u.rol==="director"?C.accentD:C.muted,padding:"2px 8px",borderRadius:20}}>
                    {SJR_ROLES[u.rol]?.icon} {SJR_ROLES[u.rol]?.label||u.rol}
                  </span>
                  {u.id===usuarioActual?.id&&<span style={{fontSize:10,fontWeight:700,color:C.green,background:C.greenBg,padding:"2px 8px",borderRadius:20}}>Tú</span>}
                </div>
                <div style={{fontSize:12,color:C.muted,marginTop:3}}>Usuario: <b>{u.usuario}</b> · PIN: <b>{"•".repeat(String(u.pin).length)}</b></div>
              </div>
              <div style={{display:"flex",gap:6}}>
                <Btn ch="✏ Editar" v="ghost" sm onClick={function(){empezarEdicion(u);}}/>
                {u.id!==usuarioActual?.id&&<Btn ch="🗑" v="ghost" sm style={{color:C.red}} onClick={function(){eliminar(u);}}/>}
              </div>
            </div>
          )}
        </div>
      );})}
      {editando==="nuevo" ? (
        <div style={{border:"1.5px solid "+C.green,borderRadius:12,padding:"12px 14px",marginBottom:10,background:C.greenBg}}>
          <div style={{fontWeight:800,fontSize:13,color:C.green,marginBottom:10}}>➕ Nuevo usuario</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
            <Inp label="Nombre" value={form.nombre} onChange={function(e){setF("nombre",e.target.value);}} placeholder="Nombre completo"/>
            <Inp label="Usuario" value={form.usuario} onChange={function(e){setF("usuario",e.target.value);}} placeholder="sin espacios"/>
            <Inp label="PIN" value={form.pin} onChange={function(e){setF("pin",e.target.value);}} placeholder="4-8 dígitos" maxLength={8}/>
            <div>
              <Lbl t="Rol"/>
              <select value={form.rol} onChange={function(e){setF("rol",e.target.value);}}
                style={{width:"100%",background:C.surfaceAlt,border:"1.5px solid "+C.border,borderRadius:9,padding:"9px 12px",fontSize:13,fontFamily:"inherit",color:C.text}}>
                {Object.entries(SJR_ROLES).map(function([v,r]){return <option key={v} value={v}>{r.icon} {r.label}</option>;})}
              </select>
            </div>
          </div>
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <Btn ch="Cancelar" v="ghost" sm onClick={function(){setEditando(null);}}/>
            <Btn ch="✅ Crear usuario" v="green" sm style={{flex:1}} onClick={guardar}/>
          </div>
        </div>
      ) : (
        <Btn ch="+ Agregar usuario" v="dark" style={{width:"100%"}} onClick={empezarNuevo}/>
      )}
    </Modal>
  );
}

function SJRLoginScreen({onLogin, usuarios}) {
  const [usuario, setUsuario] = React.useState("");
  const [pin,     setPin]     = React.useState("");
  const [error,   setError]   = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const pinRef = React.useRef();

  const entrar = () => {
    if(!usuario || !pin) return;
    setError(""); setLoading(true);
    setTimeout(() => {
      const lista = (usuarios&&usuarios.length) ? usuarios : SJR_USUARIOS_DEFAULT;
      const u = lista.find(x => x.usuario.toLowerCase()===usuario.toLowerCase() && String(x.pin)===String(pin));
      if(u) { onLogin(u); }
      else  { setError("Usuario o PIN incorrecto"); setPin(""); }
      setLoading(false);
    }, 400);
  };

  return (
    <div style={{
      minHeight:"100vh", background:"linear-gradient(135deg, #E8F4F1 0%, #EAF2F8 100%)",
      display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
      padding:24, fontFamily:"-apple-system,'Segoe UI',sans-serif", position:"relative", overflow:"hidden"
    }}>
      {/* Decoración fondo */}
      <div style={{position:"absolute",top:-120,right:-120,width:360,height:360,borderRadius:"50%",
        background:"radial-gradient(circle, #4ABFA520 0%, transparent 65%)",pointerEvents:"none"}}/>
      <div style={{position:"absolute",bottom:-80,left:-80,width:280,height:280,borderRadius:"50%",
        background:"radial-gradient(circle, #2E7DBF15 0%, transparent 65%)",pointerEvents:"none"}}/>

      {/* Logo */}
      <div style={{marginBottom:32,textAlign:"center"}}>
        <img src={SJR_LOGO} alt="SJR" style={{height:110,width:"auto",objectFit:"contain",marginBottom:8}}/>
        <div style={{color:"#7A92A8",fontSize:11,fontWeight:700,letterSpacing:3}}>SISTEMA OPERATIVO</div>
      </div>

      {/* Card */}
      <div style={{
        background:"#fff", border:"1px solid #D8E4ED", borderRadius:22,
        padding:"30px 28px 26px", width:"100%", maxWidth:370,
        boxShadow:"0 20px 60px rgba(46,125,191,0.12)"
      }}>
        <div style={{fontWeight:800,fontSize:19,color:"#1A2635",marginBottom:3}}>Iniciar sesión</div>
        <div style={{color:"#7A92A8",fontSize:13,marginBottom:22}}>Multiservicios SJR · Cd. Madero, Tamps.</div>

        <div style={{fontSize:12,fontWeight:700,color:"#7A92A8",marginBottom:6}}>USUARIO</div>
        <input
          value={usuario} onChange={e=>setUsuario(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&pinRef.current&&pinRef.current.focus()}
          placeholder="tu usuario" autoCapitalize="none"
          style={{width:"100%",background:"#F2F6F9",border:`1.5px solid ${error?"#4ABFA5":"#D8E4ED"}`,
            borderRadius:11,padding:"12px 14px",fontSize:14,color:"#1A2635",
            boxSizing:"border-box",outline:"none",marginBottom:14,fontFamily:"inherit"}}
        />

        <div style={{fontSize:12,fontWeight:700,color:"#7A92A8",marginBottom:6}}>PIN</div>
        <input
          ref={pinRef} type="password" value={pin}
          onChange={e=>setPin(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&entrar()}
          placeholder="••••" maxLength={8} inputMode="numeric"
          style={{width:"100%",background:"#F2F6F9",border:`1.5px solid ${error?"#4ABFA5":"#D8E4ED"}`,
            borderRadius:11,padding:"11px 14px",fontSize:22,letterSpacing:8,
            boxSizing:"border-box",outline:"none",marginBottom:18,fontFamily:"inherit",color:"#1A2635"}}
        />

        {error&&(
          <div style={{background:"#EBF7F4",borderRadius:10,padding:"10px 13px",
            marginBottom:14,color:"#2E9A83",fontSize:13,fontWeight:700}}>
            ⚠ {error}
          </div>
        )}

        <button onClick={entrar} disabled={loading||!usuario||!pin}
          style={{width:"100%",background:"linear-gradient(135deg, #4ABFA5, #2E7DBF)",
            color:"#fff",border:"none",borderRadius:12,padding:"14px",
            fontSize:15,fontWeight:800,fontFamily:"inherit",
            cursor:loading||!usuario||!pin?"not-allowed":"pointer",
            opacity:loading||!usuario||!pin?.5:1,transition:"all .15s",
            boxShadow:"0 6px 20px rgba(74,191,165,0.3)"}}>
          {loading ? "Verificando..." : "Entrar →"}
        </button>

        <div style={{textAlign:"center",marginTop:18,color:"#7A92A8",fontSize:11}}>
          SJR Multiservicios · Ciudad Madero, Tamaulipas
        </div>
      </div>
    </div>
  );
}

// useStored: usa localStorage para persistencia real entre recargas.
function useStored(key, seed) {
  // Firebase es siempre la fuente de verdad.
  // localStorage solo se usa para mostrar algo mientras carga Firebase.
  const [val, setVal] = useState(() => {
    try {
      const stored = localStorage.getItem(key);
      if (stored !== null) return JSON.parse(stored);
    } catch(e){}
    return seed;
  });
  const [ready, setReady] = useState(false);
  const pendingRef = useRef(false);
  const valRef = useRef(val);
  useEffect(function() { valRef.current = val; }, [val]);

  useEffect(function() {
    var unsub;
    var readyTimer = setTimeout(function(){ setReady(true); }, 5000);
    try {
      if(window._db) {
        // onSnapshot: Firebase siempre gana al cargar y en updates remotos
        unsub = window._db.collection("sjr_data").doc(key).onSnapshot(function(doc) {
          clearTimeout(readyTimer);
          if(!pendingRef.current) {
            // Firebase manda — actualiza siempre (ignora localStorage)
            var fbVal = (doc.exists && doc.data().v !== undefined) ? doc.data().v : seed;
            setVal(fbVal);
            valRef.current = fbVal;
            try { localStorage.setItem(key, JSON.stringify(fbVal)); } catch(e){}
          }
          setReady(true);
        }, function(err) {
          clearTimeout(readyTimer);
          console.warn("Firebase onSnapshot error:", err);
          setReady(true);
        });
      } else {
        clearTimeout(readyTimer);
        setReady(true);
      }
    } catch(e) {
      clearTimeout(readyTimer);
      setReady(true);
    }
    return function() { clearTimeout(readyTimer); if(unsub) unsub(); };
  }, [key]);

  const save = useCallback(function(updater) {
    // Aplicar cambio sobre la versión más reciente en memoria
    var next = typeof updater === "function" ? updater(valRef.current) : updater;
    // Actualizar estado local inmediatamente (UX responsivo)
    setVal(next);
    valRef.current = next;
    try { localStorage.setItem(key, JSON.stringify(next)); } catch(e){}
    // Subir a Firebase — marcar pending para que el snapshot no revierta
    pendingRef.current = true;
    try {
      if(window._db) {
        // Respaldo silencioso antes de sobreescribir
        window._db.collection("sjr_backups").doc(key).get().then(function(bdoc){
          var hist = (bdoc.exists && bdoc.data().h) ? bdoc.data().h : [];
          hist.push({t: Date.now(), v: valRef.current});
          if(hist.length > 20) hist = hist.slice(hist.length - 20);
          window._db.collection("sjr_backups").doc(key).set({h: hist}).catch(function(){});
        }).catch(function(){});

        window._db.collection("sjr_data").doc(key).set({v: next})
          .then(function(){
            pendingRef.current = false;
          })
          .catch(function(e){
            console.warn("Firebase save error:", e);
            pendingRef.current = false;
          });
      } else {
        pendingRef.current = false;
      }
    } catch(e) {
      pendingRef.current = false;
    }
  }, [key]);

  return [val, save, ready];
}

function SemanasChart({data}) {
  const maxVal = Math.max(...data.map(d=>Math.max(d.ing||0,d.eg||0)),1);
  const BAR_H = 140;
  const [hov, setHov] = useState(null);

  return (
    <div>
      {/* Barras */}
      <div style={{display:"flex",alignItems:"flex-end",gap:6,height:BAR_H,marginBottom:8}}>
        {data.map((d,i)=>{
          const util = d.ing-d.eg;
          const ingH = Math.round((d.ing/maxVal)*(BAR_H-4));
          const egH  = Math.round((d.eg/maxVal)*(BAR_H-4));
          const isHov = hov===i;
          return (
            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer",position:"relative"}}
              onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}>
              {/* Tooltip */}
              {isHov&&(
                <div style={{position:"absolute",bottom:"100%",left:"50%",transform:"translateX(-50%)",background:"#1A202C",color:"#fff",borderRadius:8,padding:"8px 12px",fontSize:11,whiteSpace:"nowrap",zIndex:10,marginBottom:4,boxShadow:"0 4px 12px #00000033"}}>
                  <div style={{fontWeight:700,marginBottom:4,color:"#A0AEC0"}}>{d.label}</div>
                  <div style={{color:"#68D391"}}>💚 Ingresos: {cur(d.ing)}</div>
                  <div style={{color:"#FC8181"}}>🔴 Egresos: {cur(d.eg)}</div>
                  <div style={{borderTop:"1px solid #2D3748",marginTop:4,paddingTop:4,color:util>=0?"#68D391":"#FC8181",fontWeight:700}}>
                    {util>=0?"✅":"⚠"} Utilidad: {cur(util)}
                  </div>
                </div>
              )}
              {/* Barras stacked */}
              <div style={{width:"100%",display:"flex",gap:2,alignItems:"flex-end",height:BAR_H-4}}>
                <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
                  <div style={{background:isHov?"#0EA5E9":C.green,borderRadius:"4px 4px 0 0",height:ingH,minHeight:d.ing>0?3:0,transition:"height .3s, background .15s",position:"relative"}}>
                    {ingH>20&&<div style={{position:"absolute",top:4,left:0,right:0,textAlign:"center",fontSize:8,color:"#fff",fontWeight:700}}>{cur(d.ing)}</div>}
                  </div>
                </div>
                <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
                  <div style={{background:isHov?"#F87171":C.red,borderRadius:"4px 4px 0 0",height:egH,minHeight:d.eg>0?3:0,transition:"height .3s, background .15s",position:"relative"}}>
                    {egH>20&&<div style={{position:"absolute",top:4,left:0,right:0,textAlign:"center",fontSize:8,color:"#fff",fontWeight:700}}>{cur(d.eg)}</div>}
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Labels y utilidad por semana */}
      <div style={{display:"flex",gap:6}}>
        {data.map((d,i)=>{
          const util = d.ing-d.eg;
          return (
            <div key={i} style={{flex:1,textAlign:"center"}}>
              <div style={{fontSize:9,color:C.muted,fontWeight:700}}>{d.label}</div>
              {(d.ing>0||d.eg>0)&&(
                <div style={{fontSize:8,fontWeight:700,color:util>=0?C.green:C.red,marginTop:1}}>
                  {util>=0?"+":""}{cur(util)}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Totales */}
      <div style={{display:"flex",justifyContent:"space-between",marginTop:10,padding:"8px 12px",background:C.surfaceAlt,borderRadius:8,fontSize:11}}>
        <span style={{color:C.green,fontWeight:700}}>💚 Total ing: {cur(data.reduce((s,d)=>s+d.ing,0))}</span>
        <span style={{color:C.red,fontWeight:700}}>🔴 Total eg: {cur(data.reduce((s,d)=>s+d.eg,0))}</span>
        <span style={{color:(data.reduce((s,d)=>s+d.ing-d.eg,0))>=0?C.green:C.red,fontWeight:700}}>
          💰 Utilidad: {cur(data.reduce((s,d)=>s+d.ing-d.eg,0))}
        </span>
      </div>
    </div>
  );
}

function makeCalLink(s) {
  const d = (s.date||today).replace(/-/g,"");
  const t = (s.time||"09:00").replace(":","").padEnd(6,"0");
  const title = `CX. ${s.client||""} ${s.phone?"+52 "+s.phone:""} - ${s.type||""} ${s.quotePrice?cur(s.quotePrice):""}`.trim();
  const body  = `Folio: ${s.folio||""}\nTel: ${s.phone||""}\nDirección: ${s.address||""}\nTécnico: ${s.tech||""}${s.helper?" / Ayudante: "+s.helper:""}\n${s.notes||""}\n\nMULTISERVICIOS SJR`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${d}T${t}/${d}T${t}&details=${encodeURIComponent(body)}&location=${encodeURIComponent(s.address||"")}`;
}

function PrintQuoteModal({q, onClose}) {
  const dateStr = new Date().toLocaleDateString("es-MX",{day:"2-digit",month:"long",year:"numeric"});
  const ivaLabel = q.ivaRate===0?"Sin IVA":q.ivaRate===8?"IVA 8%":"IVA 16%";

  const buildHTML = function() {
    // Generar filas con numeración de partidas y grupos
    var grupoNum = 0;
    var concNum = 0;
    var concIdx = 0; // para color alternado solo en conceptos
    var rowsHTML = (q.items||[]).map(function(it){
      if(it.type==="grupo") {
        grupoNum++;
        concNum=0;
        return "<tr><td colspan='6' style='background:#E8EDF2;color:#374151;padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:.3px;border-left:3px solid #8B1A1A'>"+grupoNum+". "+(it.titulo||"")+"</td></tr>";
      }
      if(!it.desc) return "";
      concNum++;
      concIdx++;
      var partida = grupoNum>0?(grupoNum+"."+concNum):String(concNum);
      var bg = concIdx%2===1?"#FFFFFF":"#F8FAFC";
      var total = (+it.price||0)*(+it.qty||1);
      return "<tr style='background:"+bg+"'>"

            <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,marginBottom:12}}>

function CotizarTab({svc, quotes, onVincular, onDesvincular, onNuevaCotizacion, onAddTxn, onSave, onClose}) {
  const cotVinculada = svc.cotizacionId ? quotes.find(q=>q.id===svc.cotizacionId) : null;
  const [montoDiag, setMontoDiag] = useState("");
  const [metodoDiag, setMetodoDiag] = useState("efectivo");
  const [showDiag, setShowDiag] = useState(false);
  const [busqueda, setBusqueda] = useState("");

  const cotsFiltradas = quotes.filter(q=>{
    if(q.id===svc.cotizacionId) return false; // ya vinculada
    if(!busqueda) return q.client===svc.client||(svc.phone&&q.phone&&q.phone.replace(/\D/g,"")===svc.phone.replace(/\D/g,""));
    return q.client.toLowerCase().includes(busqueda.toLowerCase())||q.folio.toLowerCase().includes(busqueda.toLowerCase());
  });

  const cobrarDiagnostico = () => {
    const monto = parseFloat(montoDiag);
    if(!monto||monto<=0) return fireToast("⚠ Ingresa el monto del diagnóstico");
    onAddTxn({
      date: today,
      concept: (svc.folio||"")+" — Diagnóstico "+svc.client,
      category: "Servicio A/C",
      classification: "Variable",
      type: "ingreso",
      amount: monto,
      method: metodoDiag,
      status: "realizado",
      auto: false,
    });
    fireToast("✅ Diagnóstico cobrado: "+cur(monto)+" — registrado en Finanzas");
    setShowDiag(false);
    setMontoDiag("");
  };

  return (
    <div>
      {/* Si ya tiene cotización vinculada */}
      {cotVinculada ? (
        <div>
          <div style={{background:"#F0FDF4",border:"1.5px solid #10B98144",borderRadius:12,padding:"14px 16px",marginBottom:14}}>
            <div style={{fontSize:11,color:C.green,fontWeight:700,marginBottom:6}}>🔗 COTIZACIÓN VINCULADA</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
              <div>
                <div style={{fontWeight:800,fontSize:16}}>{cotVinculada.folio} — {cotVinculada.client}</div>
                <div style={{fontSize:13,color:C.muted,marginTop:2}}>{fmtD(cotVinculada.date)} · {cur(cotVinculada.total)}</div>
                <div style={{marginTop:6,display:"flex",gap:6,flexWrap:"wrap"}}>
                  {(cotVinculada.items||[]).filter(i=>i.desc).slice(0,3).map((it,i)=>(
                    <span key={i} style={{background:C.accentBg,color:C.accentD,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:600}}>{it.desc}</span>
                  ))}
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end"}}>
                <span style={{background:(QUOTE_ST[cotVinculada.status]&&QUOTE_ST[cotVinculada.status].bg)||C.surfaceAlt,color:(QUOTE_ST[cotVinculada.status]&&QUOTE_ST[cotVinculada.status].color)||C.muted,borderRadius:8,padding:"4px 12px",fontSize:12,fontWeight:700}}>{(QUOTE_ST[cotVinculada.status]&&QUOTE_ST[cotVinculada.status].icon)||""} {(QUOTE_ST[cotVinculada.status]&&QUOTE_ST[cotVinculada.status].label)||""}</span>
                <button onClick={onDesvincular} style={{background:C.redBg,color:C.red,border:"none",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>✕ Desvincular</button>
              </div>
            </div>
          </div>

          {/* Acciones según estado de la cotización */}
          {cotVinculada.status==="autorizada"&&(
            <div style={{background:C.greenBg,border:`1px solid ${C.green}33`,borderRadius:12,padding:"12px 14px",marginBottom:14}}>
              <div style={{fontWeight:700,color:C.green,marginBottom:8}}>✅ Cotización autorizada — ¿qué sigue?</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <button onClick={()=>{ onSave({...svc,status:"en_taller"}); fireToast("🏪 Servicio movido a Taller"); onClose(); }} style={{background:"#CCFBF1",color:"#0D9488",border:"1px solid #0D948844",borderRadius:8,padding:"8px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>🏪 Pasar a Taller</button>
                <button onClick={()=>{ onSave({...svc,status:"en_servicio"}); fireToast("🔧 Servicio en ejecución"); onClose(); }} style={{background:C.purpleBg,color:C.purple,border:`1px solid ${C.purple}44`,borderRadius:8,padding:"8px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>🔧 Ejecutar servicio</button>
              </div>
            </div>
          )}
          {cotVinculada.status==="seguimiento"&&(
            <div style={{background:C.orangeBg,border:`1px solid ${C.orange}33`,borderRadius:12,padding:"12px 14px",marginBottom:14,fontSize:13,color:C.orange}}>
              ⏳ En espera de autorización del cliente. Puedes enviarle seguimiento desde la cotización.
            </div>
          )}
        </div>
      ) : (
        <div>
          <div style={{background:C.accentBg,borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:13,color:C.accentD,lineHeight:1.6}}>
            💡 Desde aquí puedes crear una cotización nueva para este servicio o vincular una existente. Todo quedará relacionado automáticamente.
          </div>

          {/* Botón crear nueva cotización */}
          <button onClick={()=>onNuevaCotizacion&&onNuevaCotizacion(svc)} style={{width:"100%",background:C.accent,color:"#fff",border:"none",borderRadius:12,padding:"14px",fontSize:14,fontWeight:800,cursor:"pointer",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            📋 Crear nueva cotización para este servicio
          </button>

          {/* Vincular existente */}
          <div style={{marginBottom:10}}>
            <div style={{fontWeight:700,fontSize:13,color:C.sub,marginBottom:8}}>O vincular cotización existente:</div>
            <input value={busqueda} onChange={e=>setBusqueda(e.target.value)} placeholder="Buscar por cliente o folio..." style={{width:"100%",background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"8px 12px",fontSize:13,fontFamily:"inherit",boxSizing:"border-box",marginBottom:8}}/>
            {cotsFiltradas.length===0&&<div style={{fontSize:12,color:C.muted,textAlign:"center",padding:"10px 0"}}>No hay cotizaciones {busqueda?"con esa búsqueda":"del mismo cliente"}</div>}
            {cotsFiltradas.slice(0,5).map(q=>(
              <div key={q.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",marginBottom:6}}>
                <div>
                  <div style={{fontWeight:700,fontSize:13}}>{q.folio} · {q.client}</div>
                  <div style={{fontSize:11,color:C.muted}}>{fmtD(q.date)} · {cur(q.total)} · {(QUOTE_ST[q.status]&&QUOTE_ST[q.status].label)||q.status}</div>
                </div>
                <button onClick={()=>onVincular(q)} style={{background:C.greenBg,color:C.green,border:"none",borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>🔗 Vincular</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Cobrar diagnóstico — siempre disponible */}
      <div style={{borderTop:`1px solid ${C.border}`,paddingTop:14,marginTop:4}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:showDiag?10:0}}>
          <div style={{fontWeight:700,fontSize:13}}>💵 Cobrar diagnóstico por separado</div>
          <button onClick={()=>setShowDiag(p=>!p)} style={{background:showDiag?C.redBg:C.accentBg,color:showDiag?C.red:C.accentD,border:"none",borderRadius:8,padding:"5px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>{showDiag?"✕ Cancelar":"+ Registrar"}</button>
        </div>
        {showDiag&&(
          <div style={{background:C.surfaceAlt,borderRadius:10,padding:"12px 14px",marginTop:8}}>
            <div style={{fontSize:12,color:C.muted,marginBottom:10}}>Se registrará en Finanzas como ingreso independiente del servicio principal.</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
              <Inp label="Monto diagnóstico $" type="number" value={montoDiag} onChange={e=>setMontoDiag(e.target.value)} placeholder="0.00"/>
              <Sel label="Forma de pago" opts={[{v:"efectivo",l:"💵 Efectivo"},{v:"transferencia",l:"🏦 SPEI"},{v:"tdd",l:"🏦 TDD"},{v:"tarjeta",l:"💳 Terminal"}]} value={metodoDiag} onChange={e=>setMetodoDiag(e.target.value)}/>
            </div>
            <Btn ch="✅ Registrar cobro de diagnóstico" v="green" onClick={cobrarDiagnostico} style={{width:"100%"}}/>
          </div>
        )}
      </div>
    </div>
  );
}

function SvcModal({svc, onClose, onSave, onDelete, onAddTxn, inv=[], setInv, txns=[], svcsAll=[], quotes=[], onSaveQuote, onNuevaCotizacion, gcalConnected=false, onSyncGcal, empleados=[]}) {
  const editing = !!svc;
  const [f, setF] = useState(svc || {client:"",phone:"",address:"",type:"Mantenimiento",date:today,time:"09:00",timeFin:"13:00",priority:"normal",notes:"",tech:"Carlos",helper:"",quotePrice:"",checks:DEF_CHECKS,checked:{},tallerStatus:"",tallerIngreso:"",tallerEquipo:"",tallerDiag:"",tallerFechaEntrega:"",tallerHoraEntrega:"09:00",source:""});
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const [tab, setTab] = useState("info");
  const [newChk, setNewChk] = useState("");
  const [amount, setAmount] = useState((svc&&svc.amount)||"");
  const [method, setMethod] = useState((svc&&svc.payMethod)||"efectivo");
  const [fechaCobro, setFechaCobro] = useState(today);
  const [showFechaCobro, setShowFechaCobro] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const [modalCancel, setModalCancel] = useState(false);
  // Materiales usados en el servicio
  const [matsInv,   setMatsInv]   = useState([]); // [{item, qty, cobrar, precio}]
  const [matsComp,  setMatsComp]  = useState([]); // [{desc, costo}] compras nuevas
  const checks = f.checks || DEF_CHECKS;
  const checked = f.checked || {};
  const done = checks.filter(k=>checked[k]).length;
  const calLink = makeCalLink({...f, folio: (svc&&svc.folio)||""});
  const save = () => {
    if(!f.client) return fireToast("⚠ Ingresa el nombre del cliente");
    const prev = svc;
    // Usar el monto del estado f.amount o del campo amount del tab cobro
    const montoFinal = parseFloat(f.amount||amount||0);
    const metodoPago = f.payMethod||method||"efectivo";
    // Si cambia a completado y tiene monto, registrar en Finanzas automático
    if(f.status==="completado" && montoFinal>0 && (prev&&prev.status)!=="completado") {
      // Verificar que no exista ya una txn para este folio
      const yaExiste = f.folio && txns.some(t=>t.auto && t.type==="ingreso" && t.concept.includes(f.folio));
      const fConMonto = {...f, amount:montoFinal, payMethod:metodoPago};
      onSave(fConMonto);
      if(!yaExiste) onAddTxn({
        date: today,
        concept: `${f.folio||""} - ${f.type} ${f.client}`,
        category: f.type==="Instalación"?"Instalación":"Servicio A/C",
        classification: "Variable",
        type: "ingreso",
        amount: montoFinal,
        method: metodoPago,
        status: "realizado",
        auto: true,
      });
      fireToast(yaExiste ? "✅ Guardado (ya estaba en Finanzas)" : "✅ Guardado y registrado en Finanzas: " + cur(montoFinal));
    } else if(f.status==="completado" && montoFinal===0) {
      onSave(f);
      fireToast("⚠ Guardado sin monto — ve al tab 💰 Cobrar para registrar el pago");
    } else {
      onSave(f);
    }
    onClose();
  };
  const complete = () => {
    if(!amount) return fireToast("⚠ Ingresa el monto cobrado");
    const amtNum = parseFloat(amount);
    // Construir registro de materiales para guardar en el servicio
    const matsRegistro = [
      ...matsInv.filter(m=>m.item).map(m=>({tipo:"inventario",nombre:m.item.name,qty:m.qty,unit:m.item.unit,costo:m.item.costUnit||0,precio:m.cobrar?m.precio:0,cobrado:m.cobrar,fecha:today})),
      ...matsComp.filter(m=>m.desc).map(m=>({tipo:"compra",nombre:m.desc,qty:1,unit:"pza",costo:parseFloat(m.costo)||0,precio:0,cobrado:false,fecha:today}))
    ];
    const updated = {...f, status:"completado", amount:amtNum, payMethod:method, fechaCobro:fechaCobro||today, materiales:matsRegistro};
    onSave(updated);
    // Ingreso principal del servicio
    onAddTxn({date:fechaCobro||today,concept:`${f.folio||""} - ${f.type} ${f.client}`,category:f.type==="Instalación"?"Instalación":"Servicio A/C",classification:"Variable",type:"ingreso",amount:amtNum,method,status:"realizado",auto:true});
    // Materiales del inventario — descontar stock
    matsInv.forEach(({item,qty,cobrar,precio})=>{
      const newStock = Math.max(0,(item.stock||0)-qty);
      const mov = {fecha:today,tipo:"salida",qty,concepto:`Servicio ${f.folio||f.client}`,precio:cobrar?precio:0};
      if(setInv) setInv(p=>p.map(x=>x.id===item.id?{...x,stock:newStock,movs:[mov,...(x.movs||[])]}:x));
    });
    // Compras nuevas — registrar como egreso en finanzas
    matsComp.forEach(({desc,costo})=>{
      if(costo>0) onAddTxn({date:today,concept:desc||`Materiales ${f.folio||f.client}`,category:"Materiales",classification:"Variable",type:"egreso",amount:parseFloat(costo),method:"efectivo",status:"realizado",auto:false});
    });
    onClose();
  };
  const del = () => setConfirmDel(true);
  const tabBtn = (id,label) => (
    <button onClick={()=>setTab(id)} style={{background:tab===id?C.accentBg:"transparent",border:`1.5px solid ${tab===id?C.accent:C.border}`,color:tab===id?C.accentD:C.sub,borderRadius:8,padding:"6px 16px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{label}</button>

        {editing && !["completado","cancelado"].includes(f.status) && tabBtn("cotizar", f.cotizacionFolio ? "📋 Cotización vinculada" : "📋 Cotizar")}
        {editing && f.status!=="completado" && f.status!=="por_cobrar" && tabBtn("cobro","💰 Cobrar")}
        {editing && f.status==="por_cobrar" && tabBtn("cobro","💸 Cobrar pendiente")}
        {editing && f.status==="completado" && tabBtn("materiales","📦 Materiales")}
      </div>
      {tab==="info" && (
        <>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>

          <div>
            <Inp label="Teléfono" value={f.phone||""} onChange={e=>set("phone",e.target.value)} placeholder="5551234567"/>

          <div>

              {(empleados||[]).filter(e=>e.activo!==false).map(e=><option key={e.id} value={e.nombre}>{e.numero} · {e.nombre} ({e.puesto})</option>)}

          {editing && <div style={{gridColumn:"1/-1"}}>

                  if(existe) return fireToast("⚠ Este servicio ya está en Finanzas");
                  onAddTxn({
                    date: f.fechaCobro||f.date||today,

                    category: f.type==="Instalación"?"Instalación":"Servicio A/C",

                    amount: monto,
                    method: f.payMethod||"efectivo",

                    <button onClick={()=>{
                      // Forzar re-registro eliminando el txn fantasma y creando uno nuevo
                      if(f.folio) setTxns(p=>p.filter(t=>!(t.auto&&t.type==="ingreso"&&t.concept.includes(f.folio))));
                      setTimeout(()=>registrarEnFinanzas(),50);
                    }} style={{background:"none",border:"none",color:C.muted,fontSize:10,cursor:"pointer",textDecoration:"underline",marginTop:4,fontFamily:"inherit"}}>
                      ¿No aparece en Finanzas? Dar clic aquí
                    </button>
                  </div>
                ) : (
                  <>
                    <button onClick={registrarEnFinanzas} style={{width:"100%",background:"#1A202C",color:"#68D391",border:"1px solid #68D39144",borderRadius:8,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                      🔄 Registrar cobro en Finanzas
                    </button>
                    <div style={{fontSize:11,color:C.muted,textAlign:"center",marginTop:4}}>Usa esto si el servicio ya está completado pero no aparece en Finanzas</div>
                  </>
                );
              })()}
            </div>
            </>
          )}
          <div style={{gridColumn:"1/-1"}}><Txta label="Notas / Descripción" value={f.notes||""} onChange={e=>set("notes",e.target.value)} placeholder="Detalles, materiales, observaciones..."/></div>

          {/* Vínculo cotización */}
          {editing&&(
            <div style={{gridColumn:"1/-1"}}>
              {f.cotizacionFolio ? (
                <div style={{background:"#F0FDF4",border:"1.5px solid #10B98144",borderRadius:12,padding:"12px 14px",marginBottom:4}}>
                  <div style={{fontSize:11,color:C.green,fontWeight:700,marginBottom:4}}>🔗 COTIZACIÓN VINCULADA</div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                    <div>
                      <div style={{fontWeight:800,fontSize:14}}>{f.cotizacionFolio}</div>
                      <div style={{fontSize:12,color:C.muted}}>Precio cotizado: {cur(f.quotePrice||0)}</div>
                    </div>
                    <button onClick={()=>{
                      // Limpiar en cotización también
                      const cotAnterior = quotes.find(q=>q.id===f.cotizacionId);
                      if(cotAnterior&&onSaveQuote) onSaveQuote({...cotAnterior,servicioId:null,servicioFolio:""});
                      set("cotizacionId","");
                      set("cotizacionFolio","");
                    }} style={{background:C.redBg,color:C.red,border:"none",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>✕ Desvincular</button>
                  </div>
                </div>
              ) : (
                <div style={{background:C.surfaceAlt,border:`1.5px dashed ${C.border}`,borderRadius:12,padding:"12px 14px",marginBottom:4}}>
                  <div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:8}}>🔗 VINCULAR COTIZACIÓN</div>
                  <select onChange={e=>{
                    if(!e.target.value) return;
                    const q = quotes.find(qq=>String(qq.id)===e.target.value);
                    if(q) {
                      set("cotizacionId",q.id);
                      set("cotizacionFolio",q.folio);
                      set("quotePrice",q.total);
                      // Actualizar cotización con folio del servicio (bidireccional)
                      if(onSaveQuote && svc && svc.folio) {
                        onSaveQuote({...q, servicioId:svc.id, servicioFolio:svc.folio});
                        fireToast("🔗 "+q.folio+" vinculada a "+svc.folio);
                      }
                    }
                  }} defaultValue="" style={{width:"100%",background:"#fff",border:`1.5px solid ${C.border}`,borderRadius:8,padding:"8px 12px",fontSize:13,fontFamily:"inherit",boxSizing:"border-box"}}>
                    <option value="">— Seleccionar cotización del cliente —</option>
                    {quotes.filter(q=>!q.servicioId||q.servicioId===f.id).filter(q=>!f.phone||!q.phone||(q.phone.replace(/\D/g,""))===f.phone.replace(/\D/g,"")).map(q=>(
                      <option key={q.id} value={q.id}>{q.folio} · {q.client} · {cur(q.total)} · {q.status}</option>
                    ))}
                    {quotes.filter(q=>!q.servicioId||q.servicioId===f.id).filter(q=>f.phone&&q.phone&&(q.phone.replace(/\D/g,""))!==f.phone.replace(/\D/g,"")).length>0&&<option disabled>── Otras cotizaciones ──</option>}
                    {quotes.filter(q=>!q.servicioId||q.servicioId===f.id).filter(q=>f.phone&&q.phone&&(q.phone.replace(/\D/g,""))!==f.phone.replace(/\D/g,"")).map(q=>(
                      <option key={q.id+"_x"} value={q.id}>{q.folio} · {q.client} · {cur(q.total)}</option>
                    ))}

                </div>
              )}

                  <div style={{flex:2,minWidth:120}}>
                    <Lbl t="Producto"/>
                    <select value={(m.item&&m.item.id)||""} onChange={e=>{const it=inv.find(x=>x.id===parseInt(e.target.value));setMatsInv(p=>p.map((x,j)=>j===i?{...x,item:it,precio:(it&&it.salePrice)||0}:x));}} style={{width:"100%",background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"8px 10px",fontSize:13,fontFamily:"inherit"}}>

                  <div style={{width:90}}><Inp label="Precio venta $" type="number" value={m.precio} onChange={e=>setMatsInv(p=>p.map((x,j)=>j===i?{...x,precio:parseFloat(e.target.value)||0}:x))}/></div>
                  <button onClick={()=>setMatsInv(p=>p.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:20,marginTop:18}}>×</button>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginTop:4}}>
                  <input type="checkbox" checked={m.cobrar} onChange={e=>setMatsInv(p=>p.map((x,j)=>j===i?{...x,cobrar:e.target.checked}:x))} style={{accentColor:C.green,width:14,height:14}}/>

              <button onClick={()=>setMatsComp(p=>[...p,{desc:"",costo:""}])} style={{background:C.orange,color:"#fff",border:"none",borderRadius:6,padding:"4px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ Agregar</button>

                const utilidad  = ingreso-totalCost;

                return (
                  <div>
                    <div style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #2D3748",fontSize:13,color:"#A0AEC0"}}><span>💚 Cobro al cliente</span><span style={{color:"#68D391",fontWeight:700}}>+{cur(ingreso)}</span></div>

                    {costComp>0&&<div style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #2D3748",fontSize:13,color:"#A0AEC0"}}><span>🛒 Compras nuevas</span><span style={{color:"#FC8181"}}>-{cur(costComp)}</span></div>}
                    <div style={{display:"flex",justifyContent:"space-between",paddingTop:10,marginTop:4}}>
                      <span style={{fontWeight:900,color:"#fff",fontSize:15}}>✅ Utilidad neta</span>
                      <div style={{textAlign:"right"}}>
                        <span style={{fontWeight:900,fontSize:20,color:utilidad>=0?"#68D391":"#FC8181"}}>{cur(utilidad)}</span>
                        <div style={{fontSize:11,color:"#718096"}}>{margen}% de margen</div>
                      </div>

            </div>

              if(!amount) return fireToast("⚠ Ingresa el monto acordado");

              onSave(updated);
              onClose();
              fireToast("💸 Servicio marcado como Por cobrar");
            }} style={{flex:1,textAlign:"center"}}/>
            <Btn ch="✅ Ya cobré — registrar" v="green" onClick={complete} style={{flex:1,textAlign:"center"}}/>
          </div>
          <div style={{fontSize:11,color:C.muted,marginTop:8,textAlign:"center"}}>
            💸 <strong>Por cobrar</strong> = servicio listo, el técnico aún no trae el dinero &nbsp;·&nbsp; ✅ <strong>Ya cobré</strong> = el dinero ya está en tu caja
          </div>
        </div>

      {tab==="materiales" && (
        <div>
          <div style={{background:C.accentBg,borderRadius:10,padding:"12px 16px",marginBottom:14,fontSize:13,color:C.accentD,lineHeight:1.6}}>

          </div>

          {/* Materiales del inventario */}
          <div style={{background:C.surfaceAlt,borderRadius:12,padding:14,marginBottom:12}}>

            </div>
            {matsInv.length===0&&<div style={{fontSize:12,color:C.muted,textAlign:"center",padding:"6px 0"}}>Sin materiales del inventario</div>}

                    <Lbl t="Producto"/>

                      <option value="">Seleccionar...</option>
                      {inv.map(it=><option key={it.id} value={it.id}>{it.name} (stock: {it.stock} {it.unit})</option>)}
                    </select>
                  </div>
                  <div style={{width:70}}><Inp label="Cantidad" type="number" value={m.qty} onChange={e=>setMatsInv(p=>p.map((x,j)=>j===i?{...x,qty:parseFloat(e.target.value)||1}:x))}/></div>
                  <div style={{width:90}}><Inp label="Precio venta $" type="number" value={m.precio} onChange={e=>setMatsInv(p=>p.map((x,j)=>j===i?{...x,precio:parseFloat(e.target.value)||0}:x))}/></div>
                  <button onClick={()=>setMatsInv(p=>p.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:20,marginTop:18}}>×</button>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginTop:4}}>
                  <input type="checkbox" checked={m.cobrar} onChange={e=>setMatsInv(p=>p.map((x,j)=>j===i?{...x,cobrar:e.target.checked}:x))} style={{accentColor:C.green,width:14,height:14}}/>
                  <span style={{fontSize:12,color:C.sub}}>Generar ingreso en Finanzas {m.cobrar&&m.precio>0?<strong style={{color:C.green}}>→ +{cur(m.precio*m.qty)}</strong>:""}</span>
                </div>
              </div>
            ))}
          </div>

          {/* Compras adicionales */}
          <div style={{background:C.orangeBg,borderRadius:12,padding:14,marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontWeight:700,fontSize:13}}>🛒 Compras adicionales</div>
              <button onClick={()=>setMatsComp(p=>[...p,{desc:"",costo:""}])} style={{background:C.orange,color:"#fff",border:"none",borderRadius:6,padding:"4px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ Agregar</button>
            </div>
            {matsComp.length===0&&<div style={{fontSize:12,color:C.muted,textAlign:"center",padding:"6px 0"}}>Sin compras adicionales</div>}
            {matsComp.map((m,i)=>(
              <div key={i} style={{background:"#fff",borderRadius:8,padding:10,marginBottom:8,display:"flex",gap:8,alignItems:"flex-start"}}>
                <div style={{flex:2}}><Inp label="Descripción" value={m.desc} onChange={e=>setMatsComp(p=>p.map((x,j)=>j===i?{...x,desc:e.target.value}:x))} placeholder="Ej: Gas R-410A lata..."/></div>
                <div style={{width:100}}><Inp label="Costo $" type="number" value={m.costo} onChange={e=>setMatsComp(p=>p.map((x,j)=>j===i?{...x,costo:e.target.value}:x))}/></div>
                <button onClick={()=>setMatsComp(p=>p.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:20,marginTop:18}}>×</button>
              </div>
            ))}
          </div>

          {(matsInv.length>0||matsComp.length>0)&&(
            <Btn ch="✅ Registrar materiales" v="primary" style={{width:"100%"}} onClick={()=>{
              // Descontar inventario
              // Construir nuevos registros de materiales
              const nuevosMats = [
                ...matsInv.filter(m=>m.item).map(m=>({tipo:"inventario",nombre:m.item.name,qty:m.qty,unit:m.item.unit,costo:m.item.costUnit||0,precio:m.cobrar?m.precio:0,cobrado:m.cobrar,fecha:today})),
                ...matsComp.filter(m=>m.desc).map(m=>({tipo:"compra",nombre:m.desc,qty:1,unit:"pza",costo:parseFloat(m.costo)||0,precio:0,cobrado:false,fecha:today}))
              ];
              // Guardar en el servicio acumulando los anteriores
              const svcActualizado = {...f, materiales:[...(f.materiales||[]),...nuevosMats]};
              onSave(svcActualizado);
              // Descontar inventario
              matsInv.forEach(({item,qty,cobrar,precio})=>{
                if(!item) return;
                const newStock = Math.max(0,(item.stock||0)-qty);
                const mov = {fecha:today,tipo:"salida",qty,concepto:`Servicio ${f.folio||f.client} (post-cobro)`,precio:cobrar?precio:0};
                if(setInv) setInv(p=>p.map(x=>x.id===item.id?{...x,stock:newStock,movs:[mov,...(x.movs||[])]}:x));
                if(cobrar&&precio>0) onAddTxn({date:today,concept:`Venta ${item.name} — ${f.folio||f.client}`,category:"Servicio A/C",classification:"Variable",type:"ingreso",amount:precio*qty,method:f.payMethod||"efectivo",status:"realizado",auto:true});
              });
              matsComp.forEach(({desc,costo})=>{
                if(costo>0) onAddTxn({date:today,concept:desc||`Materiales ${f.folio||f.client}`,category:"Materiales",classification:"Variable",type:"egreso",amount:parseFloat(costo),method:"efectivo",status:"realizado",auto:false});
              });
              setMatsInv([]);
              setMatsComp([]);
              fireToast("✅ Materiales registrados y guardados en el servicio");
              onClose();
            }}/>
          )}
        </div>
      )}

      {tab==="cotizar" && (
        <CotizarTab
          svc={f}
          quotes={quotes}
          onVincular={(q)=>{
            // Actualizar servicio (local state)
            set("cotizacionId",q.id);
            set("cotizacionFolio",q.folio);
            set("quotePrice",q.total);
            // Actualizar cotización con el folio del servicio (bidireccional)
            if(onSaveQuote && svc && svc.folio) {
              onSaveQuote({...q, servicioId:svc.id, servicioFolio:svc.folio});
            }
            fireToast("🔗 "+q.folio+" vinculada a "+(svc&&svc.folio||"este servicio"));
          }}
          onDesvincular={()=>{
            // Limpiar en cotización también
            const cotAnterior = quotes.find(q=>q.id===f.cotizacionId);
            if(cotAnterior&&onSaveQuote) onSaveQuote({...cotAnterior,servicioId:null,servicioFolio:""});
            set("cotizacionId","");
            set("cotizacionFolio","");
          }}
          onNuevaCotizacion={onNuevaCotizacion}
          onAddTxn={onAddTxn}
          onSave={onSave}
          onClose={onClose}
        />
      )}

      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:18}}>
        <Btn ch="Cerrar" v="ghost" sm onClick={onClose}/>
        {editing && <Btn ch="🗑 Eliminar" v="danger" sm onClick={del}/>}
        {gcalConnected && editing && (
          f.gcalEventId ? (
            <button onClick={()=>onSyncGcal&&onSyncGcal(f)} style={{background:"#E8F0FE",color:"#1A73E8",border:"1px solid #1A73E844",borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
              📅 Actualizar GCal
            </button>
          ) : (
            <button onClick={()=>onSyncGcal&&onSyncGcal(f)} style={{background:"#E8F0FE",color:"#1A73E8",border:"1px solid #1A73E844",borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
              📅 Añadir a GCal
            </button>
          )
        )}
        {!gcalConnected && <Btn ch="📅 Agendar en Calendar" v="soft" sm onClick={()=>window.open(calLink,"_blank")}/>}
        <Btn ch={editing?"💾 Guardar cambios":"✅ Crear servicio"} v="primary" onClick={save}/>
      </div>
    </Modal>
    {confirmDel&&<ConfirmModal msg={`¿Eliminar servicio de ${f.client}?`} onOk={()=>{onDelete(f.id);onClose();}} onCancel={()=>setConfirmDel(false)}/>}
    {modalCancel&&<CancelModal svc={f} onClose={()=>setModalCancel(false)} onCancelar={(motivo,tipo)=>{
      set("status","cancelado");
      set("cancelMotivo",motivo);
      set("cancelTipo",tipo);
      setModalCancel(false);
      fireToast(tipo==="reagenda"?"📅 Marcado como reagenda — crea el nuevo servicio":"❌ Servicio cancelado");
    }} onReagendar={(motivo,fecha,tieneF)=>{
      // 1. Guardar servicio cancelado
      const updated={...f,status:"cancelado",cancelMotivo:motivo,cancelTipo:"reagenda"};
      onSave(updated);
      // 2. Crear nuevo servicio — IMPORTANTE: quitar id, folio y campos del servicio anterior
      const nuevoSvc={
        client:f.client, phone:f.phone, address:f.address,
        type:f.type, priority:f.priority, source:f.source,
        tech:f.tech, helper:f.helper,
        notes:(!tieneF&&motivo)?(f.notes||"")+"\n[Reagenda: "+motivo+"]":(f.notes||""),
        quotePrice:f.quotePrice,
        checks:f.checks, checked:{},
        date:tieneF&&fecha?fecha:"",
        time:f.time||"09:00", timeFin:f.timeFin||"",
        id:undefined, folio:undefined,
        status:"pendiente", amount:0, payMethod:"", cancelMotivo:"", cancelTipo:"", gcalEventId:""
      };
      if(onNuevaCotizacion) onNuevaCotizacion(nuevoSvc);
      onClose();
      if(tieneF&&fecha) {
        fireToast("📆 Reagendado para el "+new Date(fecha+"T12:00:00").toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"}));
      } else {
        fireToast("🕐 Pendiente sin fecha — aparece en el panel");
      }
    }}/>}
    </>
  );
}

function TxnModal({existing, onClose, onSave, incCats, expCats}) {
  const iCats = incCats||S_INC_CATS;
  const eCatsBase = expCats||S_EXP_CATS;
  // Garantizar que categorías especiales siempre estén presentes
  const eCats = eCatsBase.includes("Retiro de socio / Utilidades")
    ? eCatsBase
    : [...eCatsBase, "Retiro de socio / Utilidades"];
  const [f, setF] = useState(existing || {date:today,concept:"",category:"Materiales",classification:"Variable",type:"egreso",amount:"",method:"efectivo",status:"realizado"});
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const submit = () => {
    if(!f.concept||!f.amount) return fireToast("⚠ Completa concepto y monto");
    onSave({...f, amount:parseFloat(f.amount), id:existing?existing.id:_tid++, auto:false});
    onClose();
  };
  return (
    <Modal title={existing?"✏ Editar Movimiento":"➕ Nuevo Movimiento"} onClose={onClose}>
      <div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
          <Sel label="Tipo" opts={[{v:"ingreso",l:"💚 Ingreso"},{v:"egreso",l:"🔴 Egreso"}]} value={f.type} onChange={e=>{set("type",e.target.value);set("category",e.target.value==="ingreso"?iCats[0]||"Servicio A/C":eCats[0]||"Materiales");}}/>
          <Inp label="Fecha" type="date" value={f.date} onChange={e=>set("date",e.target.value)}/>
          <div style={{gridColumn:"1/-1"}}><Inp label="Concepto *" value={f.concept} onChange={e=>set("concept",e.target.value)} placeholder="Descripción del movimiento"/></div>
          <Sel label="Categoría" opts={f.type==="ingreso"?iCats:eCats} value={f.category} onChange={e=>set("category",e.target.value)}/>
          <Sel label="Clasificación" opts={CLASSIFY} value={f.classification||"Variable"} onChange={e=>set("classification",e.target.value)}/>
          <Inp label="Monto $" type="number" value={f.amount} onChange={e=>set("amount",e.target.value)} placeholder="0.00"/>
          <Sel label="Método" opts={[{v:"efectivo",l:"💵 Efectivo"},{v:"transferencia",l:"🏦 SPEI / Depósito"},{v:"tdd",l:"🏦 TDD Banamex"},{v:"cargo_auto",l:"🏦 Cargo automático"},{v:"tarjeta",l:"💳 Terminal"},{v:"tdc",l:"💳 TDC Negocio"}]} value={f.method} onChange={e=>set("method",e.target.value)}/>
          <div style={{gridColumn:"1/-1"}}><Sel label="Estado" opts={[{v:"realizado",l:"✅ Realizado"},{v:"pendiente",l:"⏳ Pendiente"}]} value={f.status} onChange={e=>set("status",e.target.value)}/></div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:8}}>
          <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
          <Btn ch={existing?"💾 Actualizar":"💾 Guardar"} v="primary" onClick={submit}/>
        </div>
      </div>
    </Modal>
  );
}

            </div>
          );
        })}
        <Btn ch="✓ Listo" v="primary" onClick={()=>setShowCat(false)} style={{marginTop:16}}/>
      </div>
    </Modal>
  );
  if(preview) return (
    <Modal title={`Vista previa — ${preview.folio}`} onClose={()=>setPreview(null)} wide>
      <div>
        <div style={{background:C.surface,borderRadius:12,padding:24,border:`1px solid ${C.border}`}}>

            <div><div style={{fontSize:20,fontWeight:900,color:C.accent}}>❄ COMINS</div><div style={{fontSize:11,color:"#64748b",marginTop:3,lineHeight:1.7}}>Comercial Industrial y de Servicios<br/>Chiapas 211, Col. Unidad Nacional<br/>Cd. Madero, Tamaulipas</div></div>
            <div style={{textAlign:"right"}}><div style={{fontSize:16,fontWeight:800}}>COTIZACIÓN</div><div style={{color:C.accent,fontWeight:800,fontSize:14,marginTop:2}}>{preview.folio}</div><div style={{fontSize:12,color:"#64748b",marginTop:2}}>{dateStr}</div><div style={{fontSize:12,color:"#64748b"}}>Vigencia: {validity} días</div></div>
          </div>
          <div style={{background:"#f0f9ff",borderRadius:8,padding:"10px 16px",marginBottom:16}}><strong>{preview.client}</strong>{preview.phone&&<span style={{marginLeft:14,color:"#64748b",fontSize:13}}>{preview.phone}</span>}</div>

            <tbody>{preview.items.filter(i=>i.desc).map((it,i)=><tr key={i} style={{borderBottom:`1px solid ${C.border}`}}><td style={{padding:"8px 12px"}}>{it.desc}</td><td style={{padding:"8px 12px",textAlign:"center"}}>{it.qty}</td><td style={{padding:"8px 12px",textAlign:"right"}}>{cur(it.price)}</td><td style={{padding:"8px 12px",textAlign:"right",fontWeight:700}}>{cur((+it.price||0)*(+it.qty||0))}</td></tr>)}</tbody>
